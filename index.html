能把摘要没写的内容当作缺失。","人文对照：某解释把作品中的沉默理解为压迫，后续研究可能把同样沉默解释为抵抗。最接近工作包括相反解释，因为它直接挑战你的推理。引用网络用于找到争论结构，而非只找支持自己的一侧。"]},{"id":"repair","title":"错误策略与修订","paragraphs":["容易踩的坑：“我只与五年前的简单方法比较，所以新方法领先。”若领域已有更强且相关方法，比较可能不公平。修改：“先核对当前最接近方法与强基线；若因资源无法复现，明确原因并缩小结论。”","容易踩的坑：“原论文没有在摘要里提到某分析，所以它没有做。”修改：“检查方法、结果、补充材料和后续版本；若仍未找到，写‘在已查范围未见报告’。”"]},{"id":"tips","title":"提高效率的技巧与边界","paragraphs":["用有限轮次控制追踪范围：每轮记录新增概念、核心文献和是否改变问题。连续几轮没有新增直接相关路径，可以暂时转入精读，但不能把这个实用停止规则写成绝对无遗漏保证。重要贡献声明前再做定向更新。","对陌生领域，优先找到争论双方和共同引用的基础工作。这样既能避免只跟随一个学派，也能更快理解分歧究竟来自数据、定义还是价值前提。"]}],"exercise":{"materials":"教学网络：A提出方法；B引用A并改进；C引用A指出边界；D引用A作背景但研究另一任务。","task":"安排阅读优先级，并说明哪篇最可能改变创新判断。","template":"种子：\n前向关系：\n引用作用：\n优先级：\n贡献可能改变处：","answer":"答案：B与C优先，因为直接改进与边界分析最可能影响方法贡献；A需作为原始基础阅读；D可作背景，除非其任务提供迁移线索。不能因C批评A就忽视，反而应检查其证据。","rubric":["前向后向方向正确","引用角色不等同支持","最接近工作按实质重合判断","查新包含可能否定创新的证据"]},"quiz":{"question":"哪篇最应进入贡献对照表？","options":["名气最大但任务无关的论文","标题不同却回答同一问题的方法论文","引用最多的领域新闻"],"correct":1,"explanation":"问题与方法的实质重合比名气、标题或新闻传播更能决定贡献边界。"},"references":[{"id":"scholarly-articles","locator":"通过参考文献与后续研究理解文章。"},{"id":"read-paper","locator":"将论文放回相关研究和争论中阅读。"}],"next":"把检索式、筛选理由和核心文献放进阅读与比较矩阵，讨论研究空白时回来看。 若需要进一步区分期刊论文、学位论文、综述与预印本，可查阅 a01-3；它不是继续主修的必需先修。","core":true,"chapterId":"c04","stageId":"s2","chineseCount":1651},{"id":"a04-4","title":"搜索无结果、文献过多与访问受限时怎么办","goal":"你会诊断零结果、过多结果和访问困难的不同原因，采取有记录的合法补救。","scope":"适用于文献发现与选题查新；系统综述还需符合其方案与报告要求。","prerequisites":["a01-3","a03-1"],"minutes":60,"tags":["通用","证据综合"],"terms":[{"zh":"检索敏感性","en":"search sensitivity","definition":"检索发现相关材料的能力，通常与结果精确性存在取舍。"},{"zh":"检索精确性","en":"search precision","definition":"检索结果中真正相关材料所占程度。"},{"zh":"访问状态","en":"access status","definition":"是否能合法获得全文，与材料本身的相关性和质量分开。"}],"sections":[{"id":"concepts","title":"理解检索中的关键概念","paragraphs":["零结果不是空白证明，几千条结果也不是领域已经被完整掌握。零结果可能来自词语错误、概念块过多、日期或字段限制、数据库不覆盖该材料，甚至平台语法不支持。结果过多则可能因为词太泛、缩写歧义或没有限定任务。先诊断原因，再决定扩大或缩小。","访问困难是另一个维度。摘要可见而全文不可得时，你仍能记录身份和初步相关性，但不能声称核对过方法。可以用图书馆订阅、开放仓储、作者接受稿、合法馆际服务或作者公开页面寻找版本；版本不同则记录差异。遇到权限限制，不通过绕过访问控制获取资料。","检索中的“不知道”应保留为可管理状态。例如“可能相关，等待全文”“题名相似，尚未确认对象”“数据库未覆盖这一时期”。这些状态比过早排除更诚实，也能指导下一步时间分配。"]},{"id":"reasoning","title":"为什么这个策略有效","paragraphs":["检索有广度与精度的取舍。入门阶段需要较宽搜索来学习术语，专题查新需要多个相互补充策略，最终写作需要一组经过精读的核心材料。没有一种检索式同时适合全部阶段。不断加词直到只剩支持观点的文章，会制造选择偏差。","合法获取全文也需要成本判断。一篇对主要贡献有决定作用的文献值得投入获取；只作为远背景的材料可以暂缓。把访问任务与内容任务分开，能避免因为某文易下载就过度依赖它。"]},{"id":"workflow","title":"逐步执行检索","paragraphs":["使用你有权访问的数据库或公开检索平台，记录实际日期与结果。"],"steps":[{"title":"保存失败检索","body":"记录原式、平台、限制与现象。零命中也值得保存，因为后续修订可以说明哪些词或限制过强。不要只记录最后成功的一次。"},{"title":"逐项松开限制","body":"先去掉最不确定的结果词，再检查短语引号、字段、年份、语言和缩写。每次只改一类条件，观察变化，避免不知道哪个修改起作用。"},{"title":"检查已知相关文献","body":"用完整题名或标识搜索一篇已知文章。若连它都找不到，可能是覆盖或语法问题，应换适合的渠道而非继续给题目加词。"},{"title":"对过多结果做抽样诊断","body":"阅读一小批命中，记录最常见的无关原因。用明确任务词、主题词或字段改进；不要仅按引用量截断全部文献。"},{"title":"按合法路径获取全文","body":"查图书馆、开放版本与作者页面，核对版本身份。若仍不可得，写明只读摘要，暂不据此判断方法或贡献细节。"}]},{"id":"worked","title":"完整检索过程示范","paragraphs":["举个例子：初式包含“机器人、实验室、在线质量、异常恢复、首次”五块，零命中。诊断发现“首次”不是必要概念，异常恢复可能在其他术语下报告。先删除首次，再把在线质量展开为mass measurement与weighing，分开检索计量与恢复，结果可能出现不同路径。这里不虚构实际命中数，只示范诊断顺序。","结果过多示范：搜索“engagement”会同时出现工作投入、学生参与和社交媒体互动。抽看标题后，将对象和任务加入检索，并记录为何排除其他语境。若研究本来就是比较概念在不同领域的使用，则这些结果不应排除，说明策略必须服从问题。","访问示范：你找到期刊摘要和作者仓储稿。记录“仓储接受稿”，核对题名、作者、内容与正式版本关系；具体页码引用依据实际使用版本。若只有摘要，就把方法字段留为未核实，不用AI补出不存在的全文细节。"]},{"id":"repair","title":"错误策略与修订","paragraphs":["容易踩的坑：“搜不到就把题目叫作首次研究。”修改：“当前检索未发现直接相同工作，但覆盖和术语仍有限；继续检查相近任务与引文网络。”","容易踩的坑：“为了节省时间，只用能免费下载的论文作为结论依据。”开放材料便于学习，但访问便利可能造成证据偏差。修改：“记录无法获取的潜在关键文献，评估它是否影响判断，并通过合法途径补查。”"]},{"id":"tips","title":"提高效率的技巧与边界","paragraphs":["给一次检索设一个明确目标和时间盒，例如三十分钟寻找两个核心术语或一篇方法原文。时间到后记录发现与未解决点，再决定是否值得继续。时间盒是工作安排，不是宣称文献已经穷尽的证据。","搜索引擎的结果排序会变化，个性化和平台覆盖也可能影响发现。保存关键记录与检索日期，重要论断尽量由多种互补路径核查，而不是只依赖某次首页结果。"]}],"exercise":{"materials":"检索“AI education engagement intervention randomized global”得到零结果；只搜“AI”得到大量结果；一篇相关论文只有摘要。","task":"分别给出下一步动作，并写不能据此得出的结论。","template":"零结果诊断：\n过多结果诊断：\n全文获取路径：\n可报告状态：\n不能声称：","answer":"答案：零结果先拆概念并减少过强限制，核对术语与覆盖；过多结果抽样看无关原因后加入对象和任务；全文通过图书馆或合法仓储查找。三种情况都不能证明无人研究，也不能在只读摘要时声称方法已核实。","rubric":["三种问题分开处理","每次修改有可解释理由","访问遵守授权","结论与实际阅读范围一致"]},"quiz":{"question":"只读到摘要时，应怎样填写方法细节？","options":["用常识或AI补全","标记尚未核实并寻找全文","直接判定该研究方法不可靠"],"correct":1,"explanation":"缺少全文是信息不足，不能靠推测补事实，也不能自动判定质量。"},"references":[{"id":"scholarly-articles","locator":"获取和评估学术文章的阅读入口。"},{"id":"cochrane-search","locator":"Chapter 4：4.4 Designing search strategies、4.5 Managing references and documenting the search process、4.6 Selecting studies；按这篇课需要阅读检索式、记录和选择部分。"}],"next":"把检索式、筛选理由和核心文献放进阅读与比较矩阵，讨论研究空白时回来看。","core":false,"chapterId":"c04","stageId":"s2","chineseCount":1695},{"id":"a05-1","title":"不同类型论文的结构地图","goal":"你会按论文的论证功能画结构地图，识别不同文体的证据组织方式。","scope":"覆盖不同研究论文；阅读结构是导航，不是要求所有学科采用相同写法。","prerequisites":["a01-2","a04-2"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"IMRaD","en":"Introduction Methods Results and Discussion","definition":"引言、方法、结果、讨论的常见实证报告结构，并非所有学科的统一格式。"},{"zh":"论证地图","en":"argument map","definition":"显示问题、依据、推理与结论如何在文章各部分分布。"},{"zh":"报告规范","en":"reporting guideline","definition":"帮助完整报告某类研究的信息清单，不能替代良好研究设计。"}],"sections":[{"id":"concepts","title":"先认出论文在做什么","paragraphs":["读论文首先要知道它属于哪种工作。实证定量论文常见引言、方法、结果、讨论结构：引言说明问题与必要性，方法解释证据怎样产生，结果呈现观察，讨论解释发现及边界。有些期刊把结果与讨论合并，有些把方法放在后部，名称和位置可以变，功能仍需找到。","定性报告可能按主题组织发现，穿插材料引文与解释，并说明研究者位置和分析过程。人文论证型论文可能围绕几个相互推进的论点展开，材料与分析交织。理论论文通常先定义对象和假设，再给命题、证明与意义；计算或系统论文还需描述实现、基准和评价。综述的对象是既有研究，其检索、选择与综合方式需要被检查。","标题、摘要、参考文献、附录和声明也有作用。摘要是压缩后的研究概述，不是完整证据；参考文献展示对话对象，不保证每条引用正确；附录和补充材料可能包含关键方法和失败分析；伦理、资助、利益冲突和数据可用性声明帮助判断研究条件。"]},{"id":"reasoning","title":"阅读顺序背后的理由","paragraphs":["结构地图能降低陌生感，也能暴露缺口。如果你找不到样本来源，不能因为文章有“方法”标题就认为信息齐全；如果人文文章没有“结果”标题，也不能据此判定没有发现。你要问的是“作者在哪里回答这一功能问题”。","报告规范如PRISMA、STROBE、CONSORT或SRQR针对不同研究类型。它们可帮助检查报告完整性，但按清单写全并不保证设计没有偏差。不要把一套医学实验规范当作文学论文的普遍要求，也不要把规范名称当质量认证。"]},{"id":"workflow","title":"带着任务逐步阅读","paragraphs":["准备一篇可合法获得的全文，保留版本、页码或段落位置。"],"steps":[{"title":"辨认研究类型","body":"先读题名、摘要和小标题，判断作者主要在比较数据、解释经验、论证文本、证明命题还是综合文献。混合文章可标多个任务。"},{"title":"给段落标功能","body":"在目录旁标背景、问题、方法、证据、解释、局限和结论。即使标题不对应，也寻找完成这些功能的段落。"},{"title":"找主张的证据路线","body":"选文章最重要的一句结论，逆向追到图表、材料或证明，再追到资料来源与方法。将路线画成箭头，不只抄标题。"},{"title":"检查配套材料","body":"打开附录、补充、代码或数据说明，确认它们是否改变主文理解。打不开时记录访问限制，不假装已经核查。"},{"title":"写一段结构评价","body":"说明文章怎样组织论证、哪里清楚、哪里缺信息。评价基于功能是否完成，不以是否符合自己熟悉的标题顺序为唯一标准。"}]},{"id":"worked","title":"一份完整的阅读示范","paragraphs":["教学示范实证结构卡：“问题：流程B是否改变误差；方法：对同一组教学模拟对象计算A/B绝对误差差值；结果：报告差值分布和汇总；讨论：解释模拟用途、配对结构与不可推广边界；补充：原始表和计算说明。”这是一份教学文章的结构，不表示真实实验。","人文结构卡：“开头提出某文本中空间边界与信息控制的关系；第一部分细读门与窗口的描述；第二部分比较另一场景，回应单纯环境描写的解释；结尾限定到所分析文本。”证据和解释在段落中交织，不能硬拆成方法表与结果表。","理论结构卡：“定义对象与允许操作；提出命题；分情况证明；给出去掉某条件后的反例；讨论可推广方向。”读者若跳过定义，只看结论，可能把定理应用到根本不符合条件的对象。","真实文章拆解：Carey、Steiner与Petri于2020年发表的《Ten simple rules for reading a scientific paper》是一篇阅读策略建议文章。引言说明目标和建议来源，主体按Rule 1到Rule 10组织，结尾讨论实践与学习习惯，并列致谢、资助和参考文献。它自身不是以新实验结果为中心的IMRaD原始研究，不能为凑格式给它编出实验组。Rule 5及Table 2讨论的是原始研究文章各部分的功能；因此“这篇文章谈IMRaD”与“这篇文章自身就是IMRaD实验报告”是两件事。实际阅读时，先辨文章类型，再使用它提供的结构导航。"]},{"id":"repair","title":"误读怎样修正","paragraphs":["容易踩的坑：“所有论文都应该先写实验方法再写结果。”修改：“先辨认研究类型与目标渠道，再检查各功能是否被充分完成。”","容易踩的坑：“摘要已经完整概括，所以无需读方法。”摘要常省略样本、排除、模型假设和局限。修改：“摘要用于导航，关键主张需回正文与补充材料核查。”"]},{"id":"tips","title":"阅读技巧与理解边界","paragraphs":["建立一张个人结构问题表，比背固定标题更稳：问题在哪里、为何重要、材料从哪来、怎么分析、主要发现是什么、哪些解释尚未排除。不同学科可调整措辞，但不要省掉依据与边界。","阅读初期可以选结构清楚、长度适中的文章练习；不必把最复杂顶刊长文当唯一标准。真正需要精读的文章由研究问题决定，而不是由难度或刊名决定。"]}],"exercise":{"materials":"两篇教学稿：A含实验与图表；B围绕一段文学文本提出三步解释，没有方法标题。","task":"分别画结构地图，并指出应在哪里检查证据。","template":"类型：\n问题位置：\n材料来源：\n分析方式：\n证据到结论路线：\n缺失信息：","answer":"答案：A沿方法到结果图再到讨论检查，关注对象与比较；B沿核心论点到文本位置、语境和竞争解释检查。B没有方法标题不自动不合格，但分析选择仍需可理解。","rubric":["按功能而非标题机械判断","结论能追到证据","补充材料被检查或注明未读","报告规范适用范围明确"]},"quiz":{"question":"一篇人文论文没有单独“结果”节，应该怎样判断？","options":["直接认为结构错误","检查其论证中是否充分展示材料、解释与结论","改写成随机实验格式"],"correct":1,"explanation":"研究文体不同，评价应看论证功能和学科标准，而不是单一标题模板。"},"references":[{"id":"read-paper","locator":"Introduction、Rule 5与Table 2：核对建议文章自身结构和其中解释的原始研究结构。"},{"id":"equator","locator":"按研究类型查找适用报告规范。"}],"next":"把今天的阅读记成文献卡，慢慢从读懂一篇走到看懂一个领域。 若需要进一步区分期刊论文、学位论文、综述与预印本，可查阅 a01-3；它不是继续主修的必需先修。","core":true,"chapterId":"c05","stageId":"s2","chineseCount":1820},{"id":"a05-2","title":"三遍阅读与阅读目的选择","goal":"你会根据阅读目的分配深度，用三遍阅读完成从地图到关键细节的理解。","scope":"覆盖不同研究论文；阅读结构是导航，不是要求所有学科采用相同写法。","prerequisites":["a01-2","a04-2"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"筛读","en":"screening read","definition":"快速判断材料是否值得进一步投入。"},{"zh":"精读","en":"close reading","definition":"围绕关键主张详细检查方法、材料、推理和限制。"},{"zh":"主动回忆","en":"active recall","definition":"合上原文后用自己的话重建理解，暴露真正不懂的部分。"}],"sections":[{"id":"concepts","title":"先认出论文在做什么","paragraphs":["三遍阅读是一种可调整策略，不是每篇文章必须重复三次的仪式。第一遍建立地图：文章问什么、做什么、得到什么、是否相关。第二遍理解证据：方法与结果怎样支持结论，哪些概念需要补。第三遍处理对自己研究有决定作用的细节：公式、实现、编码、材料选择或推理缺口。","阅读目的决定深度。为选题建立背景，可以广读后挑核心文献；准备复现，需要逐步核对方法和材料；写相关工作，需要准确比较贡献；评估某个具体结论，则集中检查支持它的证据链。没有目的地逐字翻译，容易花很久却说不出文章的核心。","“看不懂”也要拆开：术语陌生、数学先修不足、作者省略步骤、写法不清、资料无法取得是不同问题。只把所有困难归为英语差，会错过更有效的补救。先定位障碍，再选词典、教材、代码或导师讨论。"]},{"id":"reasoning","title":"阅读顺序背后的理由","paragraphs":["分层阅读降低了过早陷入细节的成本。第一遍就被一个公式困住，可能在尚不确定相关性时消耗数小时；完全跳过细节又会导致错误复述。三遍策略通过先决定哪里重要，再投入深入检查，使时间分配更合理。","第二遍之后要合上原文写摘要。若只能照抄原句，说明还没有把信息组织成自己的理解。主动回忆不是凭记忆编造细节；写不出来的地方标为不懂，再回原文核对。"]},{"id":"workflow","title":"带着任务逐步阅读","paragraphs":["准备一篇可合法获得的全文，保留版本、页码或段落位置。"],"steps":[{"title":"先写阅读目的","body":"在笔记顶端写今天要解决的一个问题，如“它是否提供适合我的基线”。给本轮设时间上限，并说明达到什么信息就可以停止。"},{"title":"第一遍画地图","body":"读标题、摘要、引言末段、小标题、图表标题与结论。写五句：问题、材料、方法、发现、局限。此时把未核实内容标为作者声称。"},{"title":"第二遍追证据","body":"阅读支撑主要结论的方法和结果，检查对象、比较、指标与条件。列最多三个关键障碍，优先补对理解主张必要的概念。"},{"title":"第三遍拆关键环节","body":"仅对核心文章或关键主张执行。手推一个公式、重做一张小表、检查一段编码或比较两种解释。把复现不出的环节写清输入和卡住的位置。"},{"title":"合上文章复述并校正","body":"用自己的话重建证据链，再对照原文逐项校正。最后写这篇文章怎样影响自己的问题，以及还需读哪一篇来源。"}]},{"id":"worked","title":"一份完整的阅读示范","paragraphs":["教学示范阅读目标是“判断一个异常检测方法能否作为基线”。第一遍发现文章评估的是单变量序列；自己的候选任务可能有多传感器，因此先记录范围差异。第二遍检查阈值如何确定、测试数据是否独立、异常标签如何获得。第三遍用一个很小的序列重做阈值判断，确认参数单位。","完成笔记为：“该方法适合作为单变量阈值基线，但不能直接代表多传感器时序模型；这篇文章的参数由训练资料决定，不能用测试结果调优；我仍需核对缺失读数处理。”这比写“论文提出先进方法，效果很好”更能帮助后续研究。","人文阅读目标若是理解一个解释，则第三遍可以逐句分析作者怎样从文本细节走到主题判断，寻找被忽略的段落。理论文章第三遍可能只精读一个关键引理。分层策略保留共同逻辑，具体动作随文体改变。"]},{"id":"repair","title":"误读怎样修正","paragraphs":["容易踩的坑：“不认识的词全部查完再继续。”修改：“先标记影响核心理解的术语，普通表达可以结合上下文；第一遍只解决决定相关性的障碍。”","容易踩的坑：“三遍都读完了，所以理解正确。”修改：“用独立复述、重做关键步骤和回答反驳来检验理解。遍数只是投入方式，不是验收标准。”"]},{"id":"tips","title":"阅读技巧与理解边界","paragraphs":["给论文设阅读状态：仅摘要、已筛读、已核主要证据、已复现关键步骤。这样在写作时能准确判断哪些细节可以引用，避免把熟悉标题当成理解全文。","每次只保留少量高质量问题，例如“图三的n指对象还是重复读数”“某引理是否需要独立性”。具体疑问更容易获得帮助，也能形成下一次学习任务。","本教程的三遍安排是整合后的教学工作法，不将其归为Carey等人的原文规则。该真实文章Rule 1要求先明确阅读目标，Rule 3提出围绕研究内容提问，Rule 4要求拆解图表；这些建议支持主动阅读，但不等于作者规定了本教程的固定三遍步骤。学习方法也需要准确归属。"]}],"exercise":{"materials":"你有一篇30页论文，只需判断其中一个方法是否适合自己的数据。","task":"安排三遍阅读，各写目标、重点与停止条件。","template":"目的：\n第一遍：\n第二遍：\n第三遍：\n障碍：\n独立复述：","answer":"答案：第一遍确认问题、数据类型和方法入口；第二遍核方法假设与评价设计，发现不匹配则停止或改用途；第三遍只拆关键算法和参数，用小样例验证。停止条件是能解释适用性与缺口，不是把所有30页逐字翻译。","rubric":["阅读目的明确","深度随重要性调整","理解障碍被具体分类","独立复述经过原文校正"]},"quiz":{"question":"为判断文章是否与你的选题相关，第一步最合理的是？","options":["逐字翻译全部附录","先建立问题、材料、方法和结论地图","直接引用摘要最后一句"],"correct":1,"explanation":"地图阅读帮助分配注意；附录精读应在相关性与关键问题明确后进行。"},"references":[{"id":"read-paper","locator":"分层阅读、主动提问和理解检查的策略。"},{"id":"scholarly-articles","locator":"学术文章阅读顺序与目的。"}],"next":"把今天的阅读记成文献卡，慢慢从读懂一篇走到看懂一个领域。 若需要进一步区分期刊论文、学位论文、综述与预印本，可查阅 a01-3；它不是继续主修的必需先修。","core":true,"chapterId":"c05","stageId":"s2","chineseCount":1725},{"id":"a05-3","title":"方法、图表、论证和补充材料精读","goal":"你会从主要图表或论证倒查材料与方法，识别数据单位、分析选择和缺失信息。","scope":"覆盖不同研究论文；阅读结构是导航，不是要求所有学科采用相同写法。","prerequisites":["a01-2","a04-2"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"分析单位","en":"unit of analysis","definition":"分析中的基本对象，不能自动等同表格行或观测次数。"},{"zh":"误差条","en":"error bar","definition":"图中表示变异或不确定性的符号，含义需由图注说明。"},{"zh":"补充材料","en":"supplementary material","definition":"承载额外方法、数据、推导或结果的信息，不应默认可忽略。"}],"sections":[{"id":"concepts","title":"先认出论文在做什么","paragraphs":["图表常是论文证据最集中的地方，但“看见趋势”不等于读懂结果。先看轴、单位、分母、样本来源、颜色含义和误差条，再判断变化。百分比必须知道分母；平均值必须知道对象；误差条可能是标准差、标准误或置信区间，不能仅凭形状猜测。","方法精读要重建材料如何变成结果：谁或什么被纳入，条件怎样分配，怎样测量，哪些记录被排除，分析怎样处理依赖与缺失。表格有一百行，可能来自十个对象各十次读数，不能直接当一百独立样本。图看起来很平滑，也可能来自大量相关重复。","理论和人文文章的精读对象不是只有数字。理论要核定义、假设、推导与边界；文本分析要核引文上下文、译本、语境与替代读法。共同要求是从结论回到形成它的每个必要环节。"]},{"id":"reasoning","title":"阅读顺序背后的理由","paragraphs":["作者可能为了主文简洁把关键内容放在补充材料。你若准备采用某方法，漏掉参数选择、排除规则或失败结果，可能无法复现或会高估效果。补充内容不一定都同样重要，但与主要主张直接相关的部分必须检查。","图表也可能在视觉上强调差异：截断纵轴、不同尺度、只报均值而隐藏分布。视觉设计不自动意味着有意误导，但读者应重建实际差值及变异，避免凭面积和颜色形成过强印象。"]},{"id":"workflow","title":"带着任务逐步阅读","paragraphs":["准备一篇可合法获得的全文，保留版本、页码或段落位置。"],"steps":[{"title":"选一项主结论","body":"从摘要或讨论选一句最重要的判断，写出它需要哪些证据。只处理一条链，比同时泛读所有图更容易发现缺口。"},{"title":"完整解码对应图表","body":"逐项记轴、单位、分组、样本量、误差条和统计标记。缺失说明写成问题，不自行补全。尝试用一句没有形容词的话描述图中事实。"},{"title":"倒查对象与处理","body":"回到方法寻找样本来源、独立单位、排除、缺失、条件分配和参数选择。检查结果里的对象数是否与方法对得上。"},{"title":"重做一个局部计算或推理","body":"从可用数字计算比例、差值或单位转换；理论则检查一个中间步骤，人文则对照原文上下句。局部核验能暴露分母和逻辑错误。"},{"title":"打开相关补充并写结论等级","body":"确认补充是否改变主文判断，最后区分作者报告、自己核实和仍未验证内容。无法取得材料就说明限制，不能将其视为通过。"}]},{"id":"worked","title":"一份完整的阅读示范","paragraphs":["教学模拟图报告“20次观测，平均误差下降”。精读方法后发现20次读数来自同一对象。合格笔记为：“观测次数为20，但独立对象数为1；图可描述该对象的重复表现，不能据此估计对象间普遍效果。”这里不是否定重复测量价值，而是纠正它支持的推断层级。","另一个教学表：正常记录80条，异常20条，报警25条，其中15条是真异常。异常中检出比例为15/20，报警中真实异常比例为15/25。两个比例回答不同问题，不能都叫“准确率”后随意互换。完整图注需要说明分类定义、分母和数据来源。","文本精读示范：作者引用“门终于关闭”解释人物被排除。你检查前后句发现人物主动关门隔绝噪声，原解释可能遗漏行动主体。必须重新评估，不能只把被选中的一句当作独立证据。","可核对的真实阅读建议：Carey等人2020年文章Rule 4明确要求理解每幅图的横纵轴、配色、统计方法与绘图选择，并回到方法部分确认数据怎样获得。你可以打开该节，把这些检查项逐一应用到手头论文。该文提供的是阅读指导，不提供本教程模拟分类表的实验数据；不要把教学算例数字引为该文的研究结果。"]},{"id":"repair","title":"误读怎样修正","paragraphs":["容易踩的坑：“误差条重叠，所以一定没有差异。”重叠与否取决于误差条类型、设计和比较方式，不能直接替代分析。修改：“先核对误差条定义与配对关系，再看合适的差值估计与区间。”","容易踩的坑：“主文没有报告失败，说明没有失败。”修改：“查方法、补充和排除记录；若未说明，写报告不足，不把沉默当零事件。”"]},{"id":"tips","title":"阅读技巧与理解边界","paragraphs":["读图时先做“去修辞描述”：只写对象、数量、方向、单位和不确定性，不用显著改善、优越、突破等词。随后再讨论统计与实际意义，这能减少视觉和作者措辞对判断的影响。","遇到无法理解的方法，画输入—处理—输出图，再标每个节点的假设。具体流程常比一长串技术名词更容易求助，也更容易发现你缺的是概念还是实现细节。"]}],"exercise":{"materials":"模拟表：20异常中15报警，80正常中10报警；总报警25。","task":"计算异常检出比例和报警中真实异常比例，并说明差异。","template":"指标一及分母：\n指标二及分母：\n实际数值：\n不能混用的原因：","answer":"答案：异常检出比例15/20=75%；报警中真实异常比例15/25=60%。前者以异常为条件，后者以报警为条件；样本组成和异常发生率会影响后者，不能把两者都当同一准确性指标。","rubric":["图轴单位与分母明确","观测数和独立单位分开","误差条含义有来源","至少核对一个计算或推理环节"]},"quiz":{"question":"图中n=100，是否一定代表100个独立对象？","options":["一定","不一定，需要检查重复、配对和聚类来源","只要图画得清楚就不必检查"],"correct":1,"explanation":"n可能表示读数、对象、批次或其他单位，必须回到方法定义。"},"references":[{"id":"read-paper","locator":"细读图表、方法和证据。"},{"id":"nist-statistics","locator":"探索性数据分析与图形解释。"}],"next":"把今天的阅读记成文献卡，慢慢从读懂一篇走到看懂一个领域。 若需要进一步区分期刊论文、学位论文、综述与预印本，可查阅 a01-3；它不是继续主修的必需先修。","core":true,"chapterId":"c05","stageId":"s2","chineseCount":1706},{"id":"a05-4","title":"原文批注、复述与批判性阅读报告","goal":"制作区分原文、复述和个人判断的批注，并写一份可核查的阅读报告。","scope":"覆盖不同研究论文；阅读结构是导航，不是要求所有学科采用相同写法。","prerequisites":["a01-3","a04-2"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"复述","en":"paraphrase","definition":"在保留原意和范围的前提下用自己的表达重新说明。"},{"zh":"批判性阅读","en":"critical reading","definition":"检查主张、证据、推理和局限，不等于一味挑错。"},{"zh":"阅读范围","en":"reading scope","definition":"明确实际读过哪些部分，避免将部分阅读冒充全文理解。"}],"sections":[{"id":"concepts","title":"先认出论文在做什么","paragraphs":["批注不是把整页涂满颜色。有效批注应帮助未来的你找回三个东西：作者具体说了什么，依据在哪里，你如何理解或质疑。把这三层混在同一条笔记里，之后写作时容易将自己的推测误记成原文结论。","建议使用三种标记：原文短引，准确保留文字并记位置；复述，用自己的话表达作者意思；评论，写自己的问题、比较和判断。短引应必要且有限，复述仍需引用，评论需要标明是自己的分析。翻译也可能改变强度，尤其是may、suggest、associated with和cause等词。","批判性阅读既找弱点，也辨认优点。一个设计可能对狭窄问题非常扎实，不能因为没有回答所有问题就贬低它。评价应先理解作者实际目标，再检查其主张是否超出证据，而不是要求每篇文章完成你想做的项目。"]},{"id":"reasoning","title":"阅读顺序背后的理由","paragraphs":["合格复述需要理解结构，不是替换同义词。若原文说“在模拟环境中观察到关联，现场效果尚未测试”，复述必须保留模拟、关联和未测试三项边界。删掉限制使句子更顺，不代表更准确。","阅读报告应能被别人核查。每个重要评价至少对应一处原文位置或材料说明。写“方法不好”无法讨论；写“未说明同一对象重复记录如何处理，可能影响独立性假设”就指出了可检查问题。"]},{"id":"workflow","title":"带着任务逐步阅读","paragraphs":["准备一篇可合法获得的全文，保留版本、页码或段落位置。"],"steps":[{"title":"设置批注规则","body":"选少量标签，如问题、方法、证据、限定、疑问。每个标签承担明确功能，避免为每种情绪创建颜色。"},{"title":"做一条三层笔记","body":"选择关键句，先保存必要短引和位置，再合上原文复述，最后写个人评价。重新对照确保对象、方向、条件与强度没有改变。"},{"title":"建立疑问清单","body":"区分不懂术语、作者未报告、方法存在问题和自己想进一步研究。不同疑问需要不同动作，不能全部写成论文缺点。"},{"title":"写一页阅读报告","body":"包含材料身份、阅读范围、研究问题、方法、主要证据、贡献、优势、限制和对自己工作的影响。每项尽量使用具体位置或例子。"},{"title":"回原文核验报告","body":"逐项检查引用与数字，删除无法支持的概括。将仍未读的补充或尚未理解的推导写明，保留下一次阅读任务。"}]},{"id":"worked","title":"一份完整的阅读示范","paragraphs":["教学原句：“A checklist reduced omitted steps in a simulated task; field performance was not evaluated.”合格复述为：“在该模拟任务中，使用清单时遗漏步骤较少；研究没有评估真实现场表现。”评论可写：“需检查组别分配、任务可比性及遗漏定义，才能判断差异解释。”原文、复述和评论分别标记，不合成一句“清单已经证明有效”。","一页阅读报告成品片段：“阅读范围为全文主体，补充材料未获得。作者比较两种模拟流程，主要证据来自遗漏计数；优势是规则定义清楚，限制是不能推断现场效果。对本人的用途是参考计数口径，而不是引用为真实场景效力证据。”没有假装完成未做的核查。","人文报告可写：“作者将重复出现的窗口意象解释为观察权力；文本分析覆盖三处场景，尚需检查未讨论场景是否支持竞争解释。”这既概括贡献，也提出具体可查的疑问。"]},{"id":"repair","title":"误读怎样修正","paragraphs":["容易踩的坑：“这篇很水，样本少。”修改：“研究目标若是探索经验，小样本本身不能定论；需检查选择理由、材料丰富度和解释范围。若目标是精确估计总体比例，则当前样本可能不足。”","容易踩的坑：“把英文句子换几个中文近义词就不需要引用。”修改：“保留原意的转述仍来自作者，应准确引用；逐字文字用引号或适用格式标明。”"]},{"id":"tips","title":"阅读技巧与理解边界","paragraphs":["写报告时先不用原文，尝试讲给一个聪明但未读该文的人听；讲不清的位置通常是理解缺口。之后再核查，避免仅凭记忆把细节补得过于确定。","阅读报告无需每篇都很长。背景文献可以简卡，核心文献值得完整报告；重要的是阅读等级和用途匹配。把报告链接到文献管理条目，后续写作就能找到准确依据。"]}],"exercise":{"materials":"教学原句：在单机构样本中观察到相关性，不能排除未测混杂。","task":"写一条复述、一条评论和一条后续核查任务。","template":"原意要素：\n复述：\n个人评论：\n原文位置：\n后续任务：","answer":"答案：复述为“该单机构资料显示两变量相关，但未测因素可能影响解释”；评论为“结论应保持关联层级”；任务为检查作者控制了哪些混杂与如何测量。不能复述成全国范围的因果效果。","rubric":["三种笔记层次分开","复述保留限制与强度","评价有具体材料位置","未读范围如实标记"]},"quiz":{"question":"作者写“提示关联”，你的复述写“证明原因”，问题是什么？","options":["只是语言风格不同","改变了结论强度和推断类型","中文必须更直接"],"correct":1,"explanation":"复述必须保留作者实际支持的推断层级，不能把关联改成因果。"},"references":[{"id":"paraphrasing","locator":"转述、引用与避免拼贴。"},{"id":"read-paper","locator":"主动批判与阅读范围管理。"}],"next":"把今天的阅读记成文献卡，慢慢从读懂一篇走到看懂一个领域。","core":false,"chapterId":"c05","stageId":"s2","chineseCount":1566},{"id":"a06-1","title":"文献管理、引用核验与 Zotero 操作","goal":"用Zotero建立可核验文献库，并在写作中正确插入、更新和检查引用。","scope":"通用文献管理与综合训练；教学虚构材料只用作比较练习。","prerequisites":["a05-1","a05-2"],"minutes":60,"tags":["通用","证据综合","写作"],"terms":[{"zh":"书目元数据","en":"bibliographic metadata","definition":"作者、题名、年份、渠道、卷期页码与标识等材料身份字段。"},{"zh":"集合","en":"collection","definition":"文献管理工具中用于组织条目的逻辑分组，不必复制同一条目。"},{"zh":"引文样式","en":"citation style","definition":"规定正文引文和参考文献呈现方式的格式规则。"}],"sections":[{"id":"concepts","title":"从单篇走向知识关系","paragraphs":["文献管理软件解决的是识别、组织和引用流程，不替你保证内容正确。网页自动抓取可能把作者机构当作者，把访问年份当发表年份，或把新闻当论文。导入后必须核对元数据，尤其是你准备正式引用的条目。PDF文件名也不能替代出版页面的信息。","在Zotero中，一个条目可以附PDF、网页快照和笔记，也可以属于多个集合。集合适合项目或主题，标签适合阅读状态或方法类别。把同一论文复制成多个独立条目会增加引用混乱；应在合适时合并重复，并保留必要版本关系。","写作插件可以插入引文、自动生成参考文献并切换样式，但句子是否被来源支持仍由作者判断。把文献加入库与读过文献是两个状态。可以使用“待读、已筛读、已核证据”等标签，帮助避免引用时误以为所有条目都已精读。"]},{"id":"reasoning","title":"为什么需要比较与综合","paragraphs":["准确书目是可追溯的基础。题名、作者与标识一致，读者才容易找到同一材料；版本不清会使页码与内容不一致。软件自动化减少机械错误，却也可能把错误高效传播到整篇文稿。","引用格式与引用内容必须分别检查。格式正确但不支持论点的引文仍是问题；内容支持但书目写错也妨碍核查。不要把最后一次参考文献格式检查当成全部文献工作。"]},{"id":"workflow","title":"具体整理步骤","paragraphs":["准备已经读过的文献与身份信息，不把未核实细节填成事实。"],"steps":[{"title":"建立项目集合","body":"在Zotero新建一个学习项目集合，先放少量真正使用的文献。设少量阅读状态标签，避免用几十种颜色制造维护负担。"},{"title":"导入并核对身份","body":"通过浏览器连接器、标识或手动方式导入。对照原始页面检查作者顺序、年份、题名、期刊或书籍信息、DOI与材料类型。"},{"title":"关联附件与笔记","body":"附上合法取得的全文，并在笔记顶端记录所读版本和范围。将阅读报告放在条目下，保留原文位置与个人评论的区别。"},{"title":"处理重复与版本","body":"按题名和标识检查重复。真正重复条目可合并；预印本与正式稿若内容或引用需要不同，保留关联说明，避免无意合并掉版本信息。"},{"title":"在短文中试用引用","body":"用写作插件插入两条引文和参考文献，切换所需样式后检查。提交前更新字段、核对每条正文引用与文末条目，再确认句子确由该来源支持。"}]},{"id":"worked","title":"完成的材料与论述示范","paragraphs":["举个例子：导入一篇论文后，软件把页面发布日期记录为2026，而正文标明研究发表于2020。你回出版页面核对正式年份，修正条目，并在笔记注明所读版本。不能仅因软件显示2026就把它称为最新研究。","一条完成笔记可以写：“阅读状态：已核主要方法与图表；版本：正式开放全文；用途：解释阅读策略；不能支持：本人的模拟数据结果。重要位置：Rule 4图表检查建议。”这样写作时能准确知道何处可用。","引用演练：写一句关于阅读目的影响阅读顺序的说明，插入已经核对的Carey等人条目；再写一句你自己的教学安排，不把它误归为原作者结论。软件负责引用样式，作者负责归属边界。"]},{"id":"repair","title":"常见错误与改写","paragraphs":["容易踩的坑：“从别人的参考文献表复制一条，即可当作自己读过。”修改：“先取得并核对原材料；若只能引用转引，按适用格式透明说明，避免伪装原文阅读。”","容易踩的坑：“为了改格式，直接在自动生成的文末列表里手改每条。”后续更新可能覆盖手改。修改：“先修正文献条目与样式设置，再更新；特殊处理遵循工具流程并保留可编辑版本。”"]},{"id":"tips","title":"持续积累的技巧","paragraphs":["每周花十分钟整理刚导入的核心条目，比最后一次修几百条更可靠。优先核对真正引用的材料，而不是试图把整个收藏库一次清空。对书籍章节和网页，作者、编辑、出版者与访问日期要按类型区分。","同步可让文献库跨设备使用，但附件容量、备份和敏感文件政策需要另行考虑。软件版本界面可能更新，遇到按钮位置变化时查官方Quick Start Guide，不依赖过时截图。"]}],"exercise":{"materials":"一个导入条目缺作者、年份不确定，另有同题名预印本和期刊稿。","task":"列出修正顺序，并说明如何标记阅读状态与版本。","template":"元数据待核：\n原始来源：\n版本关系：\n阅读状态：\n可引用内容：\n格式检查：","answer":"答案：先核出版页面与正文作者年份，再确认预印本与期刊稿是否同一工作及内容差异；重复条目处理与版本保留分开。阅读状态注明实际读到哪里；只引用已核实内容，最后由样式生成后再检查。","rubric":["核心字段对照原始材料","条目与附件版本相符","阅读状态与收藏状态分开","正文引用与文末列表双向一致"]},"quiz":{"question":"自动导入的引用格式很整齐，下一步应做什么？","options":["直接使用，不需核对","核对元数据和来源是否支持具体句子","删除所有自动字段重打"],"correct":1,"explanation":"自动格式不能保证书目与内容正确；核查应针对身份与证据两方面。"},"references":[{"id":"zotero","locator":"Quick Start Guide：收集、组织、引用与同步。"},{"id":"paraphrasing","locator":"转述和引文归属。"}],"next":"把比较出的共识、矛盾和缺口带进问题形成，别只盯着一篇论文的未来工作。","core":true,"chapterId":"c06","stageId":"s2","chineseCount":1624},{"id":"a06-2","title":"文献卡和比较矩阵怎样填写","goal":"把不同文章放进同一比较框架，发现可比与不可比之处。","scope":"通用文献管理与综合训练；教学虚构材料只用作比较练习。","prerequisites":["a05-1","a05-2"],"minutes":60,"tags":["通用","证据综合","写作"],"terms":[{"zh":"文献卡","en":"literature note","definition":"对单篇材料的身份、问题、方法、证据和局限进行结构化记录。"},{"zh":"比较矩阵","en":"comparison matrix","definition":"以统一维度横向比较多项研究的表格。"},{"zh":"可比性","en":"comparability","definition":"不同研究的对象、定义、方法和评价是否允许有意义比较。"}],"sections":[{"id":"concepts","title":"从单篇走向知识关系","paragraphs":["文献卡回答“这一篇做了什么”，比较矩阵回答“这些工作之间是什么关系”。如果只把摘要依次贴进笔记，你可能知道很多文章，却仍不知道领域的争论和空白。矩阵将相同问题放在同一列，迫使你检查表面相似背后的条件差异。","基本列可以包括研究问题、对象与语境、资料来源、设计、核心方法、结果口径、主要发现、限制、与自己问题的关系。人文研究可把指标列改为核心概念、材料范围和解释路径；理论研究可比较假设、命题强度、证明技术和反例。列名应服务问题，不机械照抄定量表。","“没有找到报告”不是“没有做”。矩阵中至少区分已明确报告、未报告、未核实和不适用。例如尚未读补充材料时，代码列应写未核实，不能直接填无代码。这些小区别会直接影响你的贡献判断。"]},{"id":"reasoning","title":"为什么需要比较与综合","paragraphs":["比较需要先统一口径。两篇文章都报准确率，分母可能不同；两项访谈都讨论自主性，概念定义可能不同；两个定理结论相似，假设强弱可能不同。先把这些条件写清，才能判断谁支持谁、哪里真正冲突。","矩阵不是越大越好。开始用五到十篇直接相关工作即可，先检查列是否有用。若一列几乎每篇都填同样空话，就删除或细化；若重要差异只能写在备注里，就把它提升为正式比较维度。"]},{"id":"workflow","title":"具体整理步骤","paragraphs":["准备已经读过的文献与身份信息，不把未核实细节填成事实。"],"steps":[{"title":"确定比较问题","body":"写清想用矩阵回答什么，例如哪些方法适合小样本、哪些解释依赖特定语境。没有比较目的，表格容易成为信息堆积。"},{"title":"为一篇做完整卡","body":"记录身份、阅读范围、问题、方法、关键证据位置、作者贡献与自己的评价。先把来源准确性做好，再复制结构到其他文章。"},{"title":"选少量共同比较列","body":"优先选择影响判断的维度，如对象、主要条件、结果定义和基线。每列写填写规则，避免同一列有时放方法、有时放结论。"},{"title":"核对口径与缺失状态","body":"把单位、分母、材料范围或假设逐项比对。不能直接比较的单元格标原因；未核实项形成后续阅读任务。"},{"title":"写三条综合发现","body":"从矩阵提炼一个共识、一个分歧、一个缺口或边界。每条指向具体行与证据，不只写“研究很多但仍不足”。"}]},{"id":"worked","title":"完成的材料与论述示范","paragraphs":["教学虚构矩阵：研究A在固定光照下比较识别误差，B在变化光照下报告漏检，C研究同一任务但只报告处理时间。这三篇都与识别有关，却不能把A的误差、B的漏检、C的速度排成一个“效果最好”排行榜。","完成的综合发现为：“现有教学材料覆盖精度与速度两类评价，但条件和口径不同；尚不能直接判断哪一方案综合更优。若当前问题关注变化光照下的漏检，B最接近，A可作为稳定条件参照，C提示需要记录运行代价。”没有把表格空白自动当真实研究空白。","理论对照：定理A要求连续且可微，定理B只要求连续但结论较弱。比较应写假设与结论的交换关系，不能仅因B标题更新就称其全面优于A。矩阵帮助表达这种细微取舍。"]},{"id":"repair","title":"常见错误与改写","paragraphs":["容易踩的坑：“每篇都写作者说方法先进，然后比较年份。”修改：“记录作者如何评价、使用什么基线、在哪些条件成立，以及自己核实了哪些证据。”","容易踩的坑：“矩阵里没填的列就是创新机会。”修改：“先判断空格来自未读、未报告、不适用还是确实未研究；再判断填补它是否重要。”"]},{"id":"tips","title":"持续积累的技巧","paragraphs":["为每个重要单元格保留证据位置，哪怕只是图号或章节名。这样矩阵不只是摘要，而是可返回原文的索引。写作时可以按列组织段落，而不是按作者逐篇介绍。","当矩阵越来越大，分成核心工作与背景工作；核心表只保留直接影响研究问题和贡献的材料。不要因为已经花时间填表，就强迫所有文献进入论文。"]}],"exercise":{"materials":"教学文献A报告平均误差，B报告超阈值比例，C只讨论使用体验。","task":"建立比较列，并写为什么不能直接排名。","template":"共同问题：\n对象条件：\n结果定义：\n证据类型：\n可比较部分：\n不可比较原因：\n综合发现：","answer":"答案：三者可共同讨论某流程表现，但误差大小、失败比例与体验是不同结果；先核对象与条件，再分别评价。综合发现应指出评价维度互补与缺失，而不是把不同数字统一排成性能榜。","rubric":["每列含义一致","证据位置可回查","未核实与不存在分开","综合句超越单篇摘要但不超证据"]},"quiz":{"question":"矩阵中某论文“代码”一栏为空，最合理做法是？","options":["立即认定未开源","核对正文、补充与仓储后标明实际状态","删除该论文"],"correct":1,"explanation":"空格可能只是未核查，不能直接转成事实或质量判断。"},"references":[{"id":"read-paper","locator":"理解相关研究和积累阅读判断。"},{"id":"scholarly-articles","locator":"记录文章问题、方法与结果。"}],"next":"把比较出的共识、矛盾和缺口带进问题形成，别只盯着一篇论文的未来工作。","core":true,"chapterId":"c06","stageId":"s2","chineseCount":1555},{"id":"a06-3","title":"如何处理相互矛盾的研究结果","goal":"面对看似矛盾的研究，能分解差异来源并提出可检验的解释。","scope":"通用文献管理与综合训练；教学虚构材料只用作比较练习。","prerequisites":["a05-1","a05-2"],"minutes":60,"tags":["通用","证据综合","写作"],"terms":[{"zh":"异质性","en":"heterogeneity","definition":"不同研究在对象、设计、效果或解释上的差异。"},{"zh":"调节条件","en":"moderator","definition":"可能改变某种关系或效果的条件。"},{"zh":"证据综合","en":"evidence synthesis","definition":"有理由地整合多项研究，而不是简单数支持与反对票数。"}],"sections":[{"id":"concepts","title":"从单篇走向知识关系","paragraphs":["一篇文章说有效，另一篇说无效，不一定意味着其中一篇错误。它们可能研究不同对象、采用不同指标、比较不同基线、具有不同精度，或对“有效”的定义不同。首先要把结论还原为具体问题、条件、估计与不确定性，再决定是否真的冲突。","“显著”与“不显著”也不是两种相反效果。两项研究的点估计可能相近，只是样本量或变异不同，导致一个区间较窄、另一个较宽。不能用是否跨过某个p值阈值进行投票。更重要的是效果方向、大小、区间、设计与偏倚。","解释性研究可能对同一文本或实践给出不同读法。这种分歧应检查概念、材料选择、语境、研究者立场和解释能力，而不是强行要求一个数值判定赢家。理论结果若看似矛盾，则先核定义与假设，很多矛盾来自讨论的对象其实不同。"]},{"id":"reasoning","title":"为什么需要比较与综合","paragraphs":["处理分歧的目标是增加理解，不是选出最喜欢的一篇。可以提出对象差异、任务条件、测量工具、分析策略或发表选择等解释，但每个解释都只是候选。看到两个研究不同后临时编一个故事，并不能自动证明该故事是调节机制。","真正有价值的下一步是设计能够区分解释的比较。例如怀疑光照改变算法效果，就在相同对象和评价口径下系统改变光照，而不是再收一批与旧研究处处不同的数据。"]},{"id":"workflow","title":"具体整理步骤","paragraphs":["准备已经读过的文献与身份信息，不把未核实细节填成事实。"],"steps":[{"title":"还原两项主张","body":"分别写对象、条件、方法、结果定义、效果大小与结论强度。把“有效”翻译成具体量或解释，不让标签替代信息。"},{"title":"检查是否真正矛盾","body":"比较区间、样本与单位；核对一项是否因果、一项只是关联。人文与理论工作先核概念和命题范围。"},{"title":"列差异来源表","body":"按对象、场景、工具、设计、分析和报告选择逐项列不同点。只写原文支持的差异，未知处标未核实。"},{"title":"提出竞争性解释","body":"至少给两种解释，并写每种解释若成立会观察到什么。避免只留下对自己选题最有利的一种。"},{"title":"写综合段与后续检验","body":"在段落中说明共识、分歧、可能原因和当前不能决定之处，再提出针对性研究，而不是用一句“未来需更多研究”结束。"}]},{"id":"worked","title":"完成的材料与论述示范","paragraphs":["教学模拟：研究A估计平均差为−2，区间−3到−1；研究B估计平均差为−1.5，区间−4到1。若A标显著、B标不显著，不能立即说方向相反，因为点估计均为负，区间有很大重叠。较合理的解释是B估计较不精确；仍需检查设计与样本是否可比。这些数字仅为教学说明，不是实测结果。","另一组虚构文献在低温与高温条件得到相反方向。你可以提出温度调节，也可以提出设备批次差异，因为两者同时变化。完成的下一步说明为：“需要在同一批设备中比较温度，或跨批次平衡温度，才能区分两种解释。”","人文对照：两位研究者对同一人物沉默的解释分别为顺从和抵抗。比较他们引用了哪些场景、如何理解行动选择以及是否处理不利片段，再判断哪种解释对全部材料更充分。"]},{"id":"repair","title":"常见错误与改写","paragraphs":["容易踩的坑：“三篇支持、两篇反对，所以结论已定。”各研究规模、质量、相关性与独立性不同，简单投票可能误导。修改：“按问题和设计比较证据，必要时采用适当综合方法，并检查重复数据与偏倚。”","容易踩的坑：“旧研究结果不好一定是样本太小。”小样本可能增加不确定性，但不能解释所有方向差异。修改：“把精度与系统差异分开，检查测量、对象和分析选择。”"]},{"id":"tips","title":"持续积累的技巧","paragraphs":["遇到矛盾先感到好奇，而不是立刻给文章贴高低质量标签。分歧有时正是研究问题的来源，但需要把它从“结果不同”推进到“哪种条件导致不同、如何检验”。","保存不能解决的分歧同样重要。写“现有证据不足以区分两个解释”是明确结论，不是学习失败。它可以指导后续方案，但不能自动变成已证实的创新。"]}],"exercise":{"materials":"模拟研究A差值−2，区间−3至−1；B差值−1.5，区间−4至1。","task":"判断是否可称结果相反，并写一个合格综合句。","template":"方向：\n区间：\n可比条件：\n当前解释：\n尚缺证据：","answer":"答案：“两项模拟估计方向一致，但B不确定性较大；显著标签不同不足以证明效果矛盾。需要继续核对对象、设计和口径，才能判断是否存在真实异质性。”","rubric":["结论被还原为具体估计","不按显著性标签投票","至少列两个差异解释","后续检验能区分解释"]},"quiz":{"question":"一篇显著、另一篇不显著，能否直接认定它们互相否定？","options":["能","不能，要比较效果量、区间和设计","只看期刊等级决定"],"correct":1,"explanation":"阈值标签不同并不等于效果差异本身有证据。"},"references":[{"id":"asa-p","locator":"p值解释、阈值与科学判断原则。"},{"id":"cochrane","locator":"异质性与证据综合相关章节。"}],"next":"把比较出的共识、矛盾和缺口带进问题形成，别只盯着一篇论文的未来工作。","core":true,"chapterId":"c06","stageId":"s2","chineseCount":1538},{"id":"a06-4","title":"如何把多篇论文写成一段综合论述","goal":"围绕一个判断组织多篇文献，写出有比较、解释和边界的综合段。","scope":"通用文献管理与综合训练；教学虚构材料只用作比较练习。","prerequisites":["a05-1","a05-2"],"minutes":60,"tags":["通用","证据综合","写作"],"terms":[{"zh":"综合写作","en":"synthesis","definition":"围绕问题连接不同来源的关系，形成有证据的整体判断。"},{"zh":"逐篇罗列","en":"source-by-source summary","definition":"按作者依次概括但不解释彼此关系的写法。"},{"zh":"主题句","en":"topic sentence","definition":"提出段落要推进的核心判断。"}],"sections":[{"id":"concepts","title":"从单篇走向知识关系","paragraphs":["文献综述最常见的初稿是“A做了什么，B做了什么，C做了什么”。这种写法可以作为笔记，却未必帮助读者理解领域。综合段落应先提出一个与问题有关的判断，再用多篇文献说明共识、差异、演变或限制。作者是证据来源，问题与论证才是段落主线。","综合并不是把不同结论混成平均意见。你需要保留条件差异和不确定性。例如某方法在受控环境表现较好，在复杂环境下降，就应说明条件变化，而不是写“总体效果不错”。如果材料不能比较，也应把不可比性当作需要解释的发现。","引用必须就近支持具体句子。一句话同时包含三种不同主张，末尾放一串文献会让读者不知道哪篇支持哪项。必要时拆句，分别标明证据。自己的归纳也应让读者能追到来源，不能伪装成所有作者共同说过的原话。"]},{"id":"reasoning","title":"为什么需要比较与综合","paragraphs":["综合段是从阅读走向研究问题的桥梁。它让你看清已有知识覆盖了什么、分歧在哪里、下一步需要什么。但“仍有不足”不能成为任何段落的万能结尾；不足必须由前面的比较自然推出，并说明为何重要。","写作时经常需要回到原文补信息。这不是效率低，而是综合暴露了此前阅读的空洞。若某篇只读过摘要，不能为了让段落完整而猜测其方法；先补读或降低主张范围。"]},{"id":"workflow","title":"具体整理步骤","paragraphs":["准备已经读过的文献与身份信息，不把未核实细节填成事实。"],"steps":[{"title":"先写段落问题","body":"例如“现有方法是否在变化环境中保持可靠”。这比“介绍某领域”更容易组织。明确段落要让读者更新哪一点理解。"},{"title":"按关系分组","body":"把文献分为支持同一判断、条件不同、结果分歧和提供方法基础等组。不要按年份机械分组，除非要讨论历史演变。"},{"title":"写主题句与证据句","body":"主题句概括一个可支持判断；证据句给具体条件、方法或结果。每句保留来源位置，避免只用“许多研究表明”。"},{"title":"补比较与解释","body":"用“在相同点上”“差别在于”“因此尚不能”等连接实际逻辑。连接词不能替代比较内容，必须说清差在哪和为什么影响结论。"},{"title":"写边界与下一步","body":"结束时指出本段支持什么、不支持什么，或导向哪个研究问题。最后核查每篇来源是否被准确概括，是否遗漏明显反例。"}]},{"id":"worked","title":"完成的材料与论述示范","paragraphs":["教学虚构材料：A在固定光照下比较误差；B在变化光照下发现误检增加；C提出更复杂方法但只报固定条件。罗列式初稿是三句作者介绍。综合稿可写：“这组教学材料说明，方法评价对环境条件的覆盖并不一致。A与C主要报告固定光照下表现，B则提示变化条件可能增加误检；所以，仅凭固定条件结果不能判断复杂方法在变化环境下是否更稳健。下一步应在统一对象与指标下比较环境变化带来的影响。”","这段没有声称真实领域一定如此，也没有把C未报告的条件当作C做过但失败。它从具体比较推出有限结论，并提出能够补证据的任务。","人文综合示例：“一种读法重视人物的言语，另一种读法重视沉默与场景安排；两者分歧来自证据选择和主体性概念。这里比较同一组场景，以判断哪种解释更能处理人物主动退出的片段。”这种综合不需要伪造统计平均。"]},{"id":"repair","title":"常见错误与改写","paragraphs":["容易踩的坑：“国内外学者研究很多，但仍不够深入。”这既没有具体比较，也没有可验证缺口。修改：“已读工作主要覆盖某条件，尚未说明在另一有理由的条件下是否成立；该限制由哪些文献和材料支持。”","容易踩的坑：“A和B分别说了不同内容，所以我把它们合成一个更强结论。”不同证据可能无法共同支撑新结论。修改：“解释二者关系，保留条件，并标明综合判断是自己的推理。”"]},{"id":"tips","title":"持续积累的技巧","paragraphs":["写段落之前先口头说一句“这几篇合起来告诉我什么”。若只能说出每篇题目，说明还需要比较。写完后删除作者名字再读，检查段落是否仍有清楚逻辑；如果没有，可能仍是书目串联。","综合段可以很短，但不能没有证据。对于争论复杂的主题，宁可拆成两个清楚段落，也不要把多个条件和立场塞进一句长句。"]}],"exercise":{"materials":"教学材料A只测平均耗时，B只测错误率，C同时报告两者但对象不同。","task":"写一个综合段，说明已知与尚不能比较之处。","template":"主题判断：\n证据组：\n具体差异：\n解释：\n边界与下一步：","answer":"答案：“现有教学材料从效率和准确性两个维度评价流程，但指标与对象并不一致。A和B分别覆盖一项结果，C虽同时报告两者，却使用不同对象；因此尚不能直接比较综合取舍。需要在共同对象和评价口径下记录两项结果。”","rubric":["段落围绕问题组织","至少连接两篇来源的关系","比较涉及具体条件","缺口从证据推出而非套话"]},"quiz":{"question":"哪种句子更适合作为综合段主题句？","options":["A写了一篇论文，B也写了一篇","现有比较对环境变化的覆盖有限，导致稳健性结论仍不确定","这个领域非常重要而且热门"],"correct":1,"explanation":"第二句提出可由文献比较支持的判断，其余是罗列或空泛背景。"},"references":[{"id":"paraphrasing","locator":"综合、转述与引文准确性。"},{"id":"harvard-paragraph","locator":"Anatomy of a Body Paragraph：Topic sentence、Evidence、Analysis三项与示范段落；这里把它用于组织主张与材料，不将其当作细读或史料研究的完整方法。"}],"next":"把比较出的共识、矛盾和缺口带进问题形成，别只盯着一篇论文的未来工作。","core":false,"chapterId":"c06","stageId":"s2","chineseCount":1678},{"id":"a07-1","title":"从兴趣、现象和实际困难缩小范围","goal":"把兴趣、异常现象或工作困难收缩为对象、条件与回答方式明确的问题。","scope":"各学科选题与问题形成；问题的价值需结合领域文献与指导反馈。","prerequisites":["a06-2"],"minutes":60,"tags":["通用"],"terms":[{"zh":"兴趣领域","en":"area of interest","definition":"愿意投入的广泛主题，尚未等同一个可研究问题。"},{"zh":"研究范围","en":"scope","definition":"限定对象、时间、语境、材料与主要判断的边界。"},{"zh":"可行性","en":"feasibility","definition":"在实际资源、权限、能力和时间下完成工作的可能性。"}],"sections":[{"id":"concepts","title":"把兴趣转成问题","paragraphs":["兴趣通常以名词出现，例如人工智能、城市、机器人或文学。研究问题则需要明确想知道什么以及怎样判断答案。兴趣可以很大，单项研究必须有边界。你不必一开始确定终身方向，但需要为当前工作选择一个能够得到证据的切口。","问题可以来自文献矛盾、异常现象、实践困难、理论不一致或新资料。实践困难本身不自动是科研问题：“设备经常出错”可能需要维修，也可能暴露一个未解决的检测机制。先区分已有方法能解决的工程任务与仍需形成知识的疑问，避免为了论文把普通故障包装成创新。","收缩不是把价值缩没，而是让问题能够被严密回答。一个对象、一类条件和一个主要结果常比同时覆盖多个系统更可行。人文研究可以限定一组文本或一个时期，理论研究可以限定一类对象或一组假设，定性研究可以聚焦一种经验过程。"]},{"id":"reasoning","title":"选择问题的推理","paragraphs":["好的选题处于兴趣、知识价值和可行性的交集。只因热门而选，可能很快失去动力；只因容易拿到数据而选，可能分析完也没有问题；只因宏大而选，可能在有限时间内无法形成可信证据。三者需要一起检查。","缩小范围时，要保持研究问题与证据之间的对应。把“改善教育”改成“统计学生点赞数”虽然更容易做，却可能测不到原来关心的学习过程。范围变小的同时，概念和主张也应同步调整。"]},{"id":"workflow","title":"一步步收缩与检验","paragraphs":["准备兴趣清单、已有文献矩阵与可用资源说明，缺失条件如实标记。"],"steps":[{"title":"写三个真实起点","body":"分别写一个兴趣、一个观察到的困难和一个文献疑问。注明来源是个人经历、公开材料还是猜想，不把想象写成事实。"},{"title":"追问哪里不清楚","body":"对每个起点连续问两次“具体不知道什么”。例如不知道错误出现条件、现有解释冲突原因或某指标是否有效，而不只写缺少先进工具。"},{"title":"锁定对象与条件","body":"选择目前能取得的对象、材料、时期或场景。把尚未确认的设备、数据和合作标成条件，不列为已具备资源。"},{"title":"选择一个主要回答","body":"决定是描述、比较、解释、预测或论证。写出需要的证据类型与可能否定自己的结果，避免一个项目同时承担所有任务。"},{"title":"写三种范围版本","body":"分别写最小版、标准版和扩展版。先评估最小版是否仍有知识意义，再决定是否扩大；扩展内容不应成为完成基本研究的前提。"}]},{"id":"worked","title":"从宽泛想法到具体成品","paragraphs":["举个例子：兴趣为“智能实验室”，实践愿望为“减少人工记录”。第一次收缩到“自动记录是否可靠”，仍然过大。再限定为“在给定类型的教学模拟输入中，两种检查规则能否识别预设异常，并记录误报”。这个版本适合方法练习，但不证明真实工作效率。","如果后来获得真实平台与授权，可形成另一个研究问题：“在明确的操作条件下，逐次记录流程是否改善漏记率或异常发现时间，相比何种现有流程。”它需要真实对象、比较设计、测量与安全安排；不能把前一个模拟练习的结果直接搬过来。","人文示范：兴趣“现代城市与孤独”可收缩为“两部指定作品怎样通过公共空间中的视线安排表现疏离”。对象、材料与解释任务变得明确，接下来需要查既有读法并处理不支持该解释的场景。"]},{"id":"repair","title":"常见选题错误与修订","paragraphs":["容易踩的坑：“我想研究所有机器人在所有实验中的自主能力。”修改：“先选一个明确任务、故障类型与评价口径，说明结果只能覆盖这些条件。”","容易踩的坑：“数据里有什么变量就把所有变量都跑一遍。”修改：“先提出可解释问题，再判断现有资料能否回答；探索分析可以做，但需标明探索性质和后续验证需求。”"]},{"id":"tips","title":"实用判断与边界","paragraphs":["选题会议前准备三个不同范围的版本，能让导师具体讨论取舍。不要只问“这个方向好不好”，而应问“这个最小问题是否值得回答，现有证据是否足够，哪个条件最可能阻塞”。","一次收缩不必永久固定。文献、资源和先导结果都会改变判断；关键是记录修改理由，避免在结果出来后悄悄重写最初目标。"]}],"exercise":{"materials":"兴趣为“AI改善医疗”，目前只有公开教学资料，没有医院数据权限。","task":"写最小、标准和扩展三个问题版本，并标明各自新增条件。","template":"兴趣：\n最小问题：\n标准问题：\n扩展问题：\n证据与权限：\n停止条件：","answer":"答案：最小版可研究公开教学资料上的算法复现与误差分析，明确不作临床效果声明；标准版需合适授权数据与外部验证；临床流程效果研究还需机构合作、伦理与部署条件。范围升级不能只改题名。","rubric":["兴趣与问题分开","对象和条件具体","最小版仍有可回答判断","未确认资源标为条件"]},"quiz":{"question":"把大题目缩小最重要的标准是什么？","options":["标题字数变少","证据能够回答一个有价值且边界明确的问题","使用的工具越来越简单"],"correct":1,"explanation":"范围收缩服务于知识与证据匹配，不是文字或工具数量的变化。"},"references":[{"id":"oxford-proposal","locator":"研究问题、背景与可行性说明。"},{"id":"openstax-research","locator":"研究过程与问题形成。"}],"next":"拿问题草稿去做贡献对照和可行性检查；有新证据就改，不急着给它套大标题。","core":true,"chapterId":"c07","stageId":"s3","chineseCount":1648},{"id":"a07-2","title":"描述、解释、预测、评价与规范性问题","goal":"辨别描述、解释、预测、评价与规范问题，并防止在不同问题之间偷换结论。","scope":"各学科选题与问题形成；问题的价值需结合领域文献与指导反馈。","prerequisites":["a06-2"],"minutes":60,"tags":["通用"],"terms":[{"zh":"描述","en":"description","definition":"说明现象的分布、特征或发生方式。"},{"zh":"预测","en":"prediction","definition":"利用已有信息对尚未观察的结果作估计。"},{"zh":"评价","en":"evaluation","definition":"依据明确标准判断方案、过程或结果。"}],"sections":[{"id":"concepts","title":"把兴趣转成问题","paragraphs":["问题动词决定证据要求。描述问有多少、怎样分布、发生了什么；解释问为什么或通过什么过程发生；预测问已知信息能否推测未知结果；评价问某方案在指定标准下表现如何；规范问题问应当怎样做以及理由是什么。这些任务可以相关，却不能用同一个结果自动完成。","高预测准确率不代表找到原因。模型可能利用与结果相关但不具有因果作用的信号；即使模型能预测疾病风险，也不意味着改变某个输入就能改善健康。描述出群体差异，也不自动解释差异原因。评价“效果好”则需要说明标准：误差、成本、公平、可解释性或使用体验可能相互冲突。","规范性判断必须展开价值前提。例如一个系统提高平均效率但使少数人承担额外负担，是否应采用取决于如何权衡公平、权利与责任。事实证据能约束判断，却不能把价值取舍隐藏成纯技术结论。"]},{"id":"reasoning","title":"选择问题的推理","paragraphs":["把问题类型写清，能避免研究设计过度承诺。若只有横断面观察资料，可能适合描述和关联分析；若想估计干预影响，需要更强的识别设计。若目标是理解参与者如何解释经历，访谈可以有价值，但不应转而宣称总体发生率。","研究中可以设置主问题与辅助问题。例如先描述错误类型，再比较两流程的错误率，最后讨论应用取舍。每个子问题应对应自己的资料与分析，不能因为它们出现在同一论文就共享所有结论权限。"]},{"id":"workflow","title":"一步步收缩与检验","paragraphs":["准备兴趣清单、已有文献矩阵与可用资源说明，缺失条件如实标记。"],"steps":[{"title":"圈出提问动词","body":"把问题中的“多少、为何、预测、比较、应当”标出，判断主要任务。若动词过多，明确哪一个是主问题，其他是否只是辅助。"},{"title":"写出合格答案形式","body":"描述可能是比例或类型图，解释可能是机制或过程证据，预测需要独立评价，规范论证需要原则和反例。答案形式帮助反推资料需求。"},{"title":"检查现有证据能承担什么","body":"列已有资料与设计，判断它支持描述、关联、预测还是因果。不要因为想要更强结论就把同一资料改名。"},{"title":"区分评价标准","body":"写清谁关心什么结果，以及标准是否预先确定。若效率和公平冲突，分别报告并解释取舍，不用未经论证的总分掩盖。"},{"title":"写禁止跨越的推断","body":"为问题附一句“本研究不能据此推出……”。这不是削弱研究，而是防止后续写作从一个任务滑到另一个任务。"}]},{"id":"worked","title":"从宽泛想法到具体成品","paragraphs":["教学示范主题为“学生使用学习工具”。描述问题：“在这一授权样本中，使用频率如何分布？”解释问题：“哪些过程可能导致持续使用？”预测问题：“前两周行为能否预测后续使用？”评价问题：“工具相对现有流程是否改善指定学习结果？”规范问题：“学校是否应要求所有学生使用？”","如果只有一次自愿问卷，能描述答卷者报告的情况，可能探索关联；不能直接证明工具造成学习改善，也不能无条件代表全部学生。若做预测，必须划分评价数据并检查泄漏；若讨论强制使用，需要考虑隐私与选择权。五类问题共享主题，却需要不同设计。","理论对照：证明算法在给定条件下收敛，回答形式性质；比较实际运行时间，回答经验评价；建议在某系统部署，还需要资源与风险判断。一个收敛证明不能自动推出所有现实场景都值得部署。"]},{"id":"repair","title":"常见选题错误与修订","paragraphs":["容易踩的坑：“变量重要性高，所以它是结果的原因。”修改：“该变量对当前预测有用，因果作用需要额外设计与假设。”","容易踩的坑：“多数受访者喜欢，所以应当强制推广。”修改：“偏好是相关信息，但强制政策还涉及权利、少数影响和替代方案；这些前提需独立讨论。”"]},{"id":"tips","title":"实用判断与边界","paragraphs":["在研究问题旁加一个标签，可以帮助团队保持一致，但标签不是方法自动选择器。两个解释问题可能分别需要实验、过程追踪或文本分析；同一方法也可能服务多个问题。关键仍是证据与推断之间的对应。","当导师追问“你究竟想知道什么”，先回答问题类型与主要判断，再介绍工具。这样更容易发现研究是否被方法名称牵着走。"]}],"exercise":{"materials":"材料显示某变量能预测设备故障，但没有干预该变量。","task":"分别写一个允许的结论和一个不允许直接得出的结论。","template":"问题类型：\n现有证据：\n允许结论：\n不能推出：\n下一步设计：","answer":"答案：当前可说该变量在指定评价条件下具有预测信息；不能直接说改变该变量就会减少故障。下一步可结合领域机制、混杂分析或有条件的干预设计，检验因果解释。","rubric":["主要问题类型清楚","答案形式与任务匹配","预测不冒充因果","规范判断说明价值前提"]},"quiz":{"question":"预测模型效果很好，能否据此决定改变哪个变量会改善结果？","options":["能，重要性最高的变量就是原因","不能直接决定，需要因果证据与干预可行性","模型因此没有价值"],"correct":1,"explanation":"预测与干预是不同问题；预测有用，但不能自动给出因果行动建议。"},"references":[{"id":"openstax-research","locator":"研究设计、描述与解释。"},{"id":"philosophy-writing","locator":"Brief Guides to Writing in the Disciplines目录入口：可选择Philosophy/History/English对应指南继续阅读。本次仅核对该目录及链接，未将所链接PDF当作已核读的全文；这篇课论证示范为原创教学整理。"}],"next":"拿问题草稿去做贡献对照和可行性检查；有新证据就改，不急着给它套大标题。","core":true,"chapterId":"c07","stageId":"s3","chineseCount":1646},{"id":"a07-3","title":"判断研究空白是否真实、重要且可研究","goal":"区分检索空白、报告缺失、真实知识缺口与有价值的问题，并建立证据链。","scope":"各学科选题与问题形成；问题的价值需结合领域文献与指导反馈。","prerequisites":["a06-2"],"minutes":60,"tags":["通用"],"terms":[{"zh":"研究空白","en":"research gap","definition":"已有知识对某一有意义问题尚未提供充分回答的具体不足。"},{"zh":"报告缺失","en":"reporting gap","definition":"文章未充分说明某项信息，不必然等于从未研究。"},{"zh":"重要性","en":"significance","definition":"回答问题会改变理解、方法、决策或实践的理由。"}],"sections":[{"id":"concepts","title":"把兴趣转成问题","paragraphs":["“没有人做过”只是空白的一种可能说法，而且通常很难证明。更可靠的表达是指出现有证据在哪个对象、条件、机制或解释上不足，并说明你的检索与阅读覆盖。研究空白不是搜索框的零结果，而是经过比较后形成的知识判断。","至少区分四种情况：你还没找到材料；文章没有报告某信息；领域确实缺少充分证据；问题虽少有人研究但价值有限。第一种需要继续检索，第二种需要核补充或联系原资料，第三种可能形成选题，第四种需要重新论证重要性。空白的存在与填补空白的价值是两道不同门槛。","空白也可以是矛盾、边界不清、测量不可靠、概念混淆或理论解释不足，不一定是某个新对象从未被研究。复现重要结果、澄清负结果和改进测量都可能有价值，但必须说明为什么这些工作会改变知识。"]},{"id":"reasoning","title":"选择问题的推理","paragraphs":["初学者很容易把文章末尾的“未来工作”直接当题目。作者提出未来方向并不保证它适合你的资源，也不保证几年后仍未解决。你需要更新检索、找到最近工作并核对重要性。某个缺口被反复提到却未解决，可能意味着困难大、资料不可得或概念本身有问题。","价值论证应回答“如果得到了答案，谁会怎样改变理解或行动”。答案若只是“多了一篇论文”，说明研究意义尚未形成。反过来，实际困难很迫切也不自动意味着学术空白；已有知识可能足够，只差实施条件。"]},{"id":"workflow","title":"一步步收缩与检验","paragraphs":["准备兴趣清单、已有文献矩阵与可用资源说明，缺失条件如实标记。"],"steps":[{"title":"写一个具体缺口句","body":"采用“已有工作在什么条件下回答了什么，但对哪个具体判断仍不足”。避免“研究不够深入”“缺少全面分析”等无法验证表述。"},{"title":"列支持缺口的文献","body":"为句子找最接近的多条来源，核正文与补充。记录它们实际做过什么，不能仅根据摘要省略内容判断。"},{"title":"进行反向检索","body":"用相反结论、替代术语、其他学科和后续引用寻找已解决证据。主动尝试推翻缺口，而不是只积累支持句。"},{"title":"说明回答的价值","body":"写清新增答案会影响哪种理论判断、测量方法或实践决策。用具体情境说明，不只写国家战略或技术热门。"},{"title":"检查证据可得与范围","body":"列完成回答需要的材料、方法和资源。若关键证据无法获得，调整到能回答的子问题，并保持价值理由。"}]},{"id":"worked","title":"从宽泛想法到具体成品","paragraphs":["教学虚构例：三篇文章分别比较正常条件下的准确率、速度和成本，都没有清楚报告异常条件下恢复过程。初步缺口是“异常恢复证据不足”，但还不能说无人研究。接下来检查补充、后续文献和另一领域的恢复术语，可能发现已有工作。","若发现已有恢复方案，缺口可修订为：“已有方法能恢复某类异常，但对另一种有实际意义的异常是否产生误恢复尚不清楚。”这需要证明新异常确实重要，并设计公平比较。若只是给异常换个名称，缺口不成立。","人文例：既有研究讨论某时期官方叙述，却很少纳入新开放的地方材料。价值不只是资料新，而在于新材料是否挑战、细化或支持既有解释；若内容完全重复，贡献可能是资料补证而非理论重构，应准确定位。"]},{"id":"repair","title":"常见选题错误与修订","paragraphs":["容易踩的坑：“数据库没有命中，所以这是世界首次。”修改：“在所查渠道与术语范围内尚未发现直接对应研究；继续核对相近问题，贡献暂作为待验证判断。”","容易踩的坑：“别人没研究这种颜色的设备，所以必有创新。”修改：“说明颜色是否影响机制、测量或使用，并设计证据；若只是无关外观变化，不构成有意义知识缺口。”"]},{"id":"tips","title":"实用判断与边界","paragraphs":["给缺口设置信心等级：初步线索、已读关键文献支持、完成定向查新后仍成立。等级只描述证据状态，不是数学概率。这样可以在与导师讨论时诚实表达成熟度，也避免过早锁死题目。","空白表应不断更新。发现反例后保留原主张与修订理由，这能展示科研判断如何成长；删除不利来源只会让后续论证更脆弱。"]}],"exercise":{"materials":"一篇旧综述写“未来可研究高温条件”，你尚未查后续文献。","task":"写一个合格的初步缺口说明和三项核查任务。","template":"初步线索：\n尚不能声称：\n后续检索：\n重要性理由：\n所需证据：","answer":"答案：“旧综述提出高温条件的研究方向，目前仅作为线索；需查后续引用与相关术语，核高温对机制或应用的实际影响，并确认可获得的测试条件。尚不能宣称该问题至今无人解决。”","rubric":["缺口有具体对象与条件","反向检索能够挑战判断","重要性与新颖性分开","可行性有实际证据需求"]},"quiz":{"question":"哪一项最能支持有价值的研究空白？","options":["题目标题未出现过","现有证据无法区分两个会影响决策的解释，且可设计检验","换了一个不影响机制的对象名字"],"correct":1,"explanation":"有价值缺口需要知识不足、重要性与可研究性共同成立。"},"references":[{"id":"read-paper","locator":"把阅读所得与自己的研究问题连接。"},{"id":"oxford-proposal","locator":"研究问题与已有研究的关系。"}],"next":"拿问题草稿去做贡献对照和可行性检查；有新证据就改，不急着给它套大标题。","core":true,"chapterId":"c07","stageId":"s3","chineseCount":1642},{"id":"a07-4","title":"把问题写成研究目标、假设或论证命题","goal":"把研究疑问转换成目标、假设或论证命题，并预先说明支持和反驳条件。","scope":"各学科选题与问题形成；问题的价值需结合领域文献与指导反馈。","prerequisites":["a06-2"],"minutes":60,"tags":["通用"],"terms":[{"zh":"研究目标","en":"objective","definition":"研究准备完成的知识任务，不等同实施活动清单。"},{"zh":"假设","en":"hypothesis","definition":"可以用证据检查的暂定预期或解释。"},{"zh":"命题","en":"proposition","definition":"需要论证或证明的明确陈述，其形式依研究传统而异。"}],"sections":[{"id":"concepts","title":"把兴趣转成问题","paragraphs":["问题以疑问形式表达，目标说明准备回答哪项知识任务，假设提出可能答案，方法说明怎样获得证据。这四个位置常被混写。“使用Python分析数据”是活动，不是知识目标；“证明B一定优于A”把预期当作必须获得的结果，也不合适。","不是每项研究都必须提出方向性假设。探索性访谈可以以开放问题开始，人文论文可以提出待论证解释，数学研究可以围绕猜想或命题，描述研究可以估计分布。强行给所有工作配零假设和p值，会扭曲研究任务。","对确认性实证研究，假设应明确对象、比较、结果、条件与预期方向，或说明不预设方向。对理论命题，定义与量词必须清楚；对解释性论证，说明材料和竞争解释。所有形式都要允许证据改变判断。"]},{"id":"reasoning","title":"选择问题的推理","paragraphs":["预先写出支持和反驳条件，可以减少结果出来后随意改故事。若结果与预期不同，你仍可以探索原因，但应标明这是后续探索。研究目标不能随着最漂亮结果悄悄移动，否则读者无法判断证据的确认程度。","目标数量也影响可行性。一个主要目标配少量辅助目标更易形成完整论证。把采集、清理、训练、画图都列成四个研究目标，会让任务表看起来丰富，却没有增加知识问题。"]},{"id":"workflow","title":"一步步收缩与检验","paragraphs":["准备兴趣清单、已有文献矩阵与可用资源说明，缺失条件如实标记。"],"steps":[{"title":"保留原始问题","body":"先写一条不含答案的疑问，确认它不是已经确定的事实或纯工作任务。将对象和范围写进问题，避免后续目标无限扩大。"},{"title":"把问题转成知识目标","body":"用描述、估计、比较、解释、评估或证明等动词说明要完成什么判断。工具和操作放到方法栏。"},{"title":"选择合适的预期形式","body":"确认性比较可写假设；探索研究写开放问题；理论研究写命题；人文研究写待论证中心主张。选择理由与研究目的对应。"},{"title":"写支持与反驳条件","body":"列哪类数据、材料或逻辑结果会支持，哪类会挑战。不要把所有结果都解释为理论正确；必要时限定假设的适用范围。"},{"title":"建立目标—证据表","body":"每个目标对应材料、分析、交付物和边界。找不到证据路径的目标删除或缩小；结果后新增分析另作探索记录。"}]},{"id":"worked","title":"从宽泛想法到具体成品","paragraphs":["教学示范问题：“在20个教学模拟对象上，流程B与A的绝对误差差值如何分布？”目标是描述对象内差值及不确定性；预期可写“教学构造条件下B的平均绝对误差较小”，但必须说明数据是模拟，不把该预期当真实效力假设。方法是计算每对象的绝对误差与配对差，不能把40个流程读数当40个独立对象。","若在真实授权研究中采用确认性假设，则需在看结果前确定主要结果和比较规则；不支持预期时仍报告结果，不通过改阈值或排除不利对象维持结论。","理论示范：“所有满足条件C的对象都有性质P”应明确C和P，并写出反例标准；人文示范：“文本中的空间边界组织了信息不对称”则需要多个场景、语境与对竞争读法的回应，而非要求统计显著。"]},{"id":"repair","title":"常见选题错误与修订","paragraphs":["容易踩的坑：“目标一收数据，目标二跑模型，目标三写论文。”修改：“目标一描述某现象，目标二比较两种解释或方法，目标三检查边界；收集和写作属于完成这些目标的步骤。”","容易踩的坑：“实验没有支持假设，所以把假设改成结果方向。”修改：“保留原假设并报告未获支持；新解释标为探索，后续使用独立材料检验。”"]},{"id":"tips","title":"实用判断与边界","paragraphs":["写研究计划时，把目标、假设与方法放在同一页对照，常能快速发现不一致。例如目标说解释原因，方法却只有预测验证；或者目标是经验理解，却只记录点击次数。先修对应关系，比增加技术名词更有用。","假设应帮助设计，而不是成为保护自尊的承诺。能够根据证据修改观点，是研究能力的一部分；申请面试中清楚解释修改过程，往往比假装从未走弯路更可信。"]}],"exercise":{"materials":"原句：“用深度学习证明所有异常都可以自动检测。”","task":"改写为问题、目标、可检验预期和边界。","template":"问题：\n目标：\n预期或开放问题：\n证据：\n反驳条件：\n边界：","answer":"参考成品：“问题：在预先界定的传感器资料与异常标注规则下，候选方法相对固定基线能否在控制误报的同时降低漏检？目标：比较相同独立测试对象上的漏检率和误报率。新增教学设定：应用方允许的误报率上限为5%，这是本题假定而非通用标准；两种方法的阈值只在训练与验证资料上确定，然后冻结。可检验预期：候选方法在未参与调参的测试资料上，异常对象漏检率低于基线，且正常对象误报率不高于5%。证据：同一测试集、同一标注及完整混淆矩阵，同时报告两类错误率和适合对象依赖结构的不确定性。若漏检率不低或误报率超过上限，观察结果不支持该预期；若估计区间过宽，则结论是证据不足，而非强行接受或否定。边界：结论不覆盖未纳入的异常类型和新环境。”这一预期应在评价前记录，不能看到结果后才选择5%的上限或最佳指标。","rubric":["问题目标方法分别表达","预期与研究类型相符","存在真正反驳条件","新增探索不冒充原计划"]},"quiz":{"question":"哪一句是知识目标而不是活动？","options":["安装分析软件","估计指定对象上两流程误差差值并评价不确定性","整理文件夹"],"correct":1,"explanation":"知识目标说明要回答的判断；安装与整理是支持活动。"},"references":[{"id":"osf-preregistration","locator":"事前计划、研究问题与分析安排。"},{"id":"oxford-proposal","locator":"目标、方法与可行性的连接。"}],"next":"拿问题草稿去做贡献对照和可行性检查；有新证据就改，不急着给它套大标题。","core":false,"chapterId":"c07","stageId":"s3","chineseCount":1786},{"id":"a08-1","title":"新颖性、重要性、可信度和贡献的区别","goal":"分别判断想法是否新、是否重要、证据是否可信，并写出有限且可核查的贡献陈述。","scope":"通用贡献形成训练；具体原创性标准还需结合学科与目标渠道。","prerequisites":["a07-3"],"minutes":70,"tags":["通用"],"terms":[{"zh":"新颖性","en":"novelty","definition":"相对已知工作存在实质性的新内容，不等于名称新。"},{"zh":"可信度","en":"credibility","definition":"研究设计、材料和推理足以支持主张的程度。"},{"zh":"贡献","en":"contribution","definition":"研究为共同体增加的有价值知识、方法、材料或理解。"}],"sections":[{"id":"concepts","title":"贡献由什么构成","paragraphs":["一个想法可能很新却没有意义，也可能很重要但证据不可信，还可能不是首次却通过严格复现明显提高理解。新颖性、重要性和可信度是三个不同问题。讨论贡献时需要把它们放在一起，而不是只追求“首次”两个字。","新颖性依赖已有工作比较。你以前没见过，不等于领域没做过；名称不同、换一个数据集或加一个模型组件，也不必然构成实质新内容。重要性则问答案为什么值得知道：它能改变解释、测量、方法选择或实际决策吗？可信度问证据是否真的支持这些变化。","贡献可以是更可靠的证据、边界澄清、反例、资料整理、方法改进或理论修正。不同学科与渠道对贡献形式要求不同。教材不把“必须提出全新算法”当普遍标准，也不把任何小修改都称为创新。"]},{"id":"reasoning","title":"判断贡献的理由与取舍","paragraphs":["强贡献陈述通常包含四部分：已有工作达到哪里，当前工作增加什么，增加为何有用，证据怎样支持。若只能写“首次使用某工具”，缺少后面三项，贡献尚不成熟。复杂度也不等于贡献；更简单但同样可靠的方法可能减少成本并帮助理解。","复现与负结果的价值需要具体论证。重复一个结论若改进测量、扩大关键条件或揭示不可复现原因，可能很有意义；随意重复一次且记录不清，则不能仅凭“复现也重要”获得贡献。负结果也需要足够精度与设计，才能区分真实无效和信息不足。"]},{"id":"workflow","title":"把想法变成可核查主张","paragraphs":["准备最接近工作表和自己的问题说明；当前贡献先作为待检验判断。"],"steps":[{"title":"把想法写成知识变化","body":"不用首次、突破和先进等词，写“研究后读者将更清楚什么”。若写不出来，先回到问题与证据。"},{"title":"建立新颖性参照","body":"找最接近工作并逐项比较问题、材料、方法、条件与结论。差别必须实质且可核实，未读内容不能自动作为对方缺失。"},{"title":"说明重要性机制","body":"写该差别会怎样影响理论判断、工具选择或实践。用一个具体使用场景解释，不只列宏观背景和热门趋势。"},{"title":"设计支持证据","body":"为每个贡献句指定实验、分析、材料比较、证明或反例。证据要能够否定主张，否则更像演示而非检验。"},{"title":"给主张定强度","body":"区分已经完成并有证据、方案预期、待查新判断。申请材料中按实际状态表达，不能将计划的贡献写成已获得成果。"}]},{"id":"worked","title":"完整贡献分析示范","paragraphs":["教学虚构例：方案在既有模型上增加一个组件，平均指标略有上升。新颖性检查发现该组件已有先例，因此不能声称全新架构；重要性检查发现提升小于应用容差，且计算成本翻倍；可信度检查发现测试集曾用于调参。三个问题分别指向比较、价值与设计，不能只补一句“创新性显著”。","修订路径可以是重新划分独立评价、比较简单强基线，并研究该组件在哪种条件下有用。若最终发现复杂组件没有稳定收益，而简单基线在目标条件下足够好，可能形成一项边界或方法选择证据；但仍需说明为何该问题对领域重要。","人文例：新发现的档案可能并未推翻既有解释，却为其补充细节。合格贡献写“补充某类主体的经验并细化既有叙述”，而不是为了显得重大就写“彻底颠覆”。"]},{"id":"repair","title":"创新包装的错误与修订","paragraphs":["容易踩的坑：“准确率多了0.1个百分点，所以一定有创新。”修改：“先检查估计不确定性、基线公平性、评价数据和实际意义；若差异不能稳定重现，不能据此主张方法优势。”","容易踩的坑：“这是首次用于本校，所以是学术创新。”地域或场景更换是否重要，需要机制或知识理由。修改：“说明新场景改变哪些假设，并检验这些变化是否影响既有结论。”"]},{"id":"tips","title":"研究经验与适用边界","paragraphs":["贡献句可以先写朴素版本，再让证据决定是否增强措辞。一个清楚、范围有限的陈述，比充满超级形容词更容易被导师检查。遇到“有什么新”，先回答相对谁的新；遇到“有什么用”，回答改变什么判断。","对于申请准备，能准确定位自己的真实贡献非常重要。学习项目可以展示方法理解与执行能力，但不要把教学模拟结果写成原创发现。诚实的状态说明不会抹去训练价值。"]}],"exercise":{"materials":"教学项目换了一个模型名称，使用同样数据与算法，报告略高指标但未独立测试。","task":"分别评价新颖性、重要性与可信度，并改写贡献陈述。","template":"实质差异：\n重要性：\n证据问题：\n当前可说：\n下一步：","answer":"答案：名称变化不提供实质新颖性，略高指标的重要性未论证，缺独立评价影响可信度。当前只能说完成实现与初步探索；下一步核最接近工作、设置公平基线与独立测试，再决定是否存在可支持贡献。","rubric":["三项判断没有混为一谈","参照工作具体","每条贡献对应证据","计划与完成状态分开"]},"quiz":{"question":"哪一项最接近有根据的贡献？","options":["使用最新工具所以先进","在明确条件下揭示既有方法失效边界，并用可复核证据解释其影响","把旧方法换一个名字"],"correct":1,"explanation":"边界澄清可以形成贡献，但需要已有工作比较、重要性与可信证据共同支持。"},"references":[{"id":"read-paper","locator":"理解作者目标、贡献与证据。"},{"id":"oxford-proposal","locator":"说明研究的原创性、意义与可行性。"}],"next":"拿贡献判断去对照资源和最小方案，只有证据和条件都撑得住的部分才写进正式计划。","core":true,"chapterId":"c08","stageId":"s3","chineseCount":1681},{"id":"a08-2","title":"八条贡献路径及其成立条件","goal":"学会八类贡献形成路径，能为每条路径给出成立条件、反例和验证方式。","scope":"通用贡献形成训练；具体原创性标准还需结合学科与目标渠道。","prerequisites":["a07-3"],"minutes":70,"tags":["通用"],"terms":[{"zh":"贡献路径","en":"contribution pathway","definition":"把知识不足转成可验证增量的一种工作方式。"},{"zh":"跨领域迁移","en":"cross-domain transfer","definition":"将某领域的方法或解释应用到另一领域，并检验改变的假设。"},{"zh":"边界条件","en":"boundary condition","definition":"决定某个结论、方法或理论何时成立的条件。"}],"sections":[{"id":"concepts","title":"贡献由什么构成","paragraphs":["创新没有保证成功的公式，但可以系统寻找候选路径。这篇课的八条路径是教学整理，用来检查问题，不是所有学科共同规定的分类。它们可以组合，但一个小项目不应同时承诺八种贡献。先选主要知识增量，再决定其他部分是否只是支撑。","第一条是新问题：提出以往未被充分意识到但值得回答的疑问。成立条件是说明为何现有框架遗漏它；反例是给旧问题换名称；验证需要文献比较与可行问题定义。第二条是新资料或新证据：获得此前缺少的观察、档案或数据；价值在于它改变或增强什么判断，而不只在于数量大。资料必须来源清楚、权限合适、质量可检查。","第三条是机制或解释：说明现象怎样产生，或哪种解释更能处理材料。不能仅用相关性包装机制，需要区分竞争解释的证据。第四条是适用边界与失败条件：检验已有结论在何种条件失效。不能随便制造极端条件让方法失败，而应说明边界对理论或应用的重要性。","第五条是方法改进：改变算法、实验、分析或操作过程，使某种目标更可靠、有效或易用。需公平基线、资源代价和稳健评价；增加复杂度本身不算改进。第六条是测量与评价改进：修正构念、指标、标注或基准的缺陷。需要证明新测量更符合任务，而不是只选择让自己方法分数更高的指标。","第七条是理论构建或修正：提出概念关系、命题或证明，解释已有理论不能解释的情况。需明确假设、逻辑、反例与可检验含义，不能只把几个名词画成框。第八条是知识综合与有理由的迁移：通过系统比较得到新的关系，或把方法迁入改变了关键假设的场景。简单拼接综述或换场景不够，需要说明综合推理或迁移障碍。"],"table":{"headers":["贡献路径","成立条件","看起来像创新的反例","怎样验证"],"rows":[["新问题","指出重要但现有框架未充分处理的疑问，且问题能被合理研究。","把已有问题改名，或只说自己第一次想到。","核对最接近工作与概念边界，说明新问题改变的理论或实践判断。"],["新资料或新证据","资料来源和权限清楚，质量可检查，能够填补有意义的证据缺口。","重复采集已有资料，只以规模增大声称重大贡献。","核验来源、采集和误差，比较新增覆盖及其对原判断的影响。"],["机制或解释","解释不仅贴合现象，还能区分至少一种合理竞争解释。","看到相关就断言因果，或只挑支持自己叙述的片段。","设计能区分解释的观察、比较或论证，主动检查反例与替代机制。"],["适用边界与失败条件","条件变化与理论假设或实际使用有关，能够说明何时原结论不再成立。","任意制造与任务无关的极端输入，再宣称所有方法失败。","有理由地改变条件，保留公平比较，解释失败与假设的联系并复核。"],["方法改进","改动提高与问题有关的能力，代价透明，并有公平可信的比较。","组件更多或训练数据更多，就把所有收益归为算法本身。","使用合理基线、相同评价条件和必要消融，报告稳定性、失败与资源成本。"],["测量与评价改进","新指标或测量更贴合构念、任务或决策，减少已知测量缺陷。","选择最有利于自己的指标，却不说明它衡量什么。","用构念论证、参考标准、测量误差或实际决策比较检验其效度与适用边界。"],["理论构建或修正","概念、假设和推理明确，新增关系不能直接视为旧理论改名。","画出复杂概念框，却没有可检查命题或推理。","核对推导与证明，寻找反例，比较旧理论可处理和不能处理的情况；经验理论还需检验含义。"],["知识综合与有理由的跨领域迁移","综合产生可论证的新关系，或迁移明确处理新场景改变的关键假设。","逐篇摘要的拼接，或只更换数据名称却不改变理解。","检查检索与综合逻辑、矛盾证据及解释；迁移需比较适用条件、改动理由和实际表现。"]]}},{"id":"reasoning","title":"判断贡献的理由与取舍","paragraphs":["选择路径时，先看已有证据缺在哪里，再看你能做什么。若测量本身不可靠，急着提出复杂机制可能没有基础；若已有方法在常规条件接近上限，边界与失败分析可能比再追小幅指标提升更有意义。不同路径对资源和训练要求不同。","验证方式必须与贡献类型一致。理论证明不能只靠几个运行例子，资料贡献不能只报文件数量，解释贡献不能只挑支持片段，方法贡献不能只展示成功案例。把验证方式提前写出，能防止完成很多工作后才发现证据支撑不了标题。"]},{"id":"workflow","title":"把想法变成可核查主张","paragraphs":["准备最接近工作表和自己的问题说明；当前贡献先作为待检验判断。"],"steps":[{"title":"列一个具体知识不足","body":"从文献矩阵写出未回答判断，避免以“我要创新”作为起点。标明缺的是问题定义、证据、解释、方法还是评价。"},{"title":"生成三条候选路径","body":"从八类中选三条，各写一段可能的知识增量。例如同一困难可以用改善测量、解释失败或提出恢复方法处理。"},{"title":"为每条写反例","body":"写什么情况会使该贡献不成立：已有同类工作、指标无实际意义、资料重复、理论可由旧结果直接推出。主动暴露弱点。"},{"title":"配对验证与资源","body":"列需要的比较、材料、证明和权限，估计能否取得。优先选择能形成完整证据链的路径，不因名称新颖就忽略实施成本。"},{"title":"保留一条主路径","body":"写主要贡献和支撑贡献的关系。小项目先完成主路径，其他想法列为有条件扩展，不让范围无限膨胀。"}]},{"id":"worked","title":"完整贡献分析示范","paragraphs":["教学示范围绕“异常记录影响流程可靠性”。路径A是测量改进：现有指标只计平均误差，遗漏异常检出与误报，需论证新评价更符合使用目标。路径B是边界分析：同一方法在某类缺失模式下失效，需说明模式有现实理由并系统检验。路径C是方法改进：加入恢复步骤，需比较恢复收益、误恢复与成本。","选择结果可写：“当前优先做边界分析，因为能够使用有许可资料复核，且无需尚未确认的设备；若边界确实存在，再评估方法改进。”这不是降低要求，而是把证据顺序安排清楚。若查新发现该边界已被充分报告，应调整为复现或寻找另一真实不足。","人文迁移示范：将某理论用于新的文本，必须说明新材料为何挑战或扩展理论概念；若只是把人物名字替换，理论没有受到检验，也没有产生新理解，迁移贡献就很薄。"]},{"id":"repair","title":"创新包装的错误与修订","paragraphs":["容易踩的坑：“我把三种方法组合，所以贡献是三项。”组合可能只是实现方式，需证明组合解决了什么单独方法不能解决的问题。可以改成：“主要贡献是某判断或方法能力，三个组件是实现；用消融和比较检查各组件作用。”","容易踩的坑：“新数据集越大越有价值。”修改：“资料是否覆盖关键缺口、质量是否可靠、许可是否清楚、能否支持新的问题，比单纯规模更重要。”"]},{"id":"tips","title":"研究经验与适用边界","paragraphs":["把八条路径当提问清单，不当选题老虎机。每条都需要领域知识，不能靠随机拼接关键词得到可信研究。新手可以先做严密复现与比较，在理解失败原因后形成更具体贡献。","一项研究可能同时具有数据和方法贡献，但写作时应分开证据。不要用一个漂亮结果反复证明所有贡献，也不要把工程工作量直接折算成学术价值。"]}],"exercise":{"materials":"教学情境：已有模型平均分很高，但评价资料几乎没有遮挡样本。","task":"分别提出边界、测量评价和方法改进三条路径，并选择一条主路径。","template":"缺口：\n路径一及验证：\n路径二及验证：\n路径三及验证：\n反例：\n主路径与理由：","answer":"答案：边界路径系统检查遮挡条件下失效；评价路径建立有理由且标注可靠的遮挡评价；方法路径提出改进并与公平基线比较。若尚不了解失效，先选边界分析；若遮挡在目标使用中无意义，三条路径的重要性都需重审。","rubric":["八条路径有不同知识目标","至少三候选含反例","验证对应贡献类型","主路径有资源和价值理由"]},"quiz":{"question":"跨领域迁移何时较可能形成贡献？","options":["只改应用名称","新场景改变关键假设，并通过证据说明方法或理论如何调整","把热门词放进标题"],"correct":1,"explanation":"迁移需要解释实质障碍和新增理解，单纯换标签并不足够。"},"references":[{"id":"read-paper","locator":"从已有工作出发形成后续问题。"},{"id":"oxford-proposal","locator":"原创性与研究意义的论证。"}],"next":"拿贡献判断去对照资源和最小方案，只有证据和条件都撑得住的部分才写进正式计划。","core":true,"chapterId":"c08","stageId":"s3","chineseCount":2702},{"id":"a08-3","title":"查找最接近工作并制作贡献对照表","goal":"做出一套能挑战自己想法的贡献对照表，并写出有证据支持的差异。","scope":"通用贡献形成训练；具体原创性标准还需结合学科与目标渠道。","prerequisites":["a07-3"],"minutes":70,"tags":["通用"],"terms":[{"zh":"强基线","en":"strong baseline","definition":"在当前任务下有充分理由且实现公平的比较方案。"},{"zh":"贡献对照表","en":"contribution comparison","definition":"比较已有工作与候选研究的知识目标、条件、方法和证据。"},{"zh":"消融","en":"ablation","definition":"移除或改变组件以检查其作用的比较，设计需控制其他变化。"}],"sections":[{"id":"concepts","title":"贡献由什么构成","paragraphs":["贡献对照表不是营销表。若每一列都按自己的优势设置，别人全部填否，你可能只是选择了有利标准。好的表既展示差异，也记录已有工作的强项和自己的不足。它应让读者理解实质取舍，而不是制造全面领先的视觉效果。","最接近工作需要包含直接回答同类问题的研究、重要替代方法和可能使你的主张不成立的工作。基线可以很简单，但必须适合任务并合理调参；不能故意削弱对照。理论比较应考虑假设强弱与结论范围，人文比较应考虑解释力和材料覆盖，而不把所有贡献变成指标竞赛。","未核实信息应保留状态。别人没有在摘要里写某项功能，不等于没有实现；代码暂时找不到，不等于不存在；无法复现也可能来自环境或理解问题。表格中的否定判断尤其需要原文依据。"]},{"id":"reasoning","title":"判断贡献的理由与取舍","paragraphs":["比较的目的包括判断是否值得继续。若一篇已有工作已经在相同条件下完成同样目标，合理反应是承认重合并寻找真正未解决部分，而不是换术语遮住它。贡献表也能帮助控制范围：只保留会改变主张的维度，不必展示所有工程细节。","公平比较需要资源与条件一致。模型运行时间、人工标注、调参预算和数据使用范围可能影响结果。比较时说明这些代价，避免只挑一个有利数字。"]},{"id":"workflow","title":"把想法变成可核查主张","paragraphs":["准备最接近工作表和自己的问题说明；当前贡献先作为待检验判断。"],"steps":[{"title":"确定比较对象集合","body":"实证方法评价可优先检查最直接先例、简单而合理的基线及不同思路的替代方案；这是比较覆盖的教学建议，不要求机械凑齐三个。人文解释应定位最接近读法与有依据的竞争解释，理论研究应比较最接近命题、假设和结论强度；它们不必设置算法式基线。"},{"title":"选择判断维度","body":"列问题、对象、条件、方法核心、评价、资源、证据和局限。每列说明为什么影响贡献，不用只为自己量身定做的功能清单。"},{"title":"逐格填证据位置","body":"填入已核实内容并附章节或图表位置。未知写未核实，不用空白代替否。若比较版本不同，记录版本日期。"},{"title":"写差异的知识意义","body":"对每个差别回答“这会改变什么判断”。数据名称不同但机制相同，未必重要；条件改变导致旧假设失效，则可能值得研究。"},{"title":"设计公平检验","body":"实证方法评价写可比数据、参数选择、资源预算和失败分析；人文解释比较各读法对关键细节与反例的覆盖，理论研究核对假设、推导与结论的包含关系。无法直接比较时说明差异并缩小主张，不硬写全面优于。"}]},{"id":"worked","title":"完整贡献分析示范","paragraphs":["教学虚构对照：工作A用固定阈值，工作B用学习模型，候选C加入状态信息。表中要同时记录A易解释且成本低、B需要训练资料、C需要额外传感或记录。若C效果较好但新增信息很多，不能把全部收益归为算法本身，需要检查信息增量和方法增量。","一个完成的贡献句为：“本研究拟检验状态信息在异常判别中的额外价值；比较时分别控制输入信息与分类方法，并报告误报、漏报及资源代价。”这是可检验计划，不是已获得结果。若去掉状态信息后效果不变，主要贡献就未获支持，应如实报告。","理论对照：已有定理在强假设下给出强结论，你的命题放宽假设但结论变弱。贡献可以是明确这种交换，而不是声称全面超越。人文对照则可比较同一材料上两种解释如何处理反例。"]},{"id":"repair","title":"创新包装的错误与修订","paragraphs":["容易踩的坑：“把别人未提到的功能都填否，再把自己的全填是。”修改：“核全文和补充，区分未报告与不具备；比较维度需与研究问题有关。”","容易踩的坑：“复杂方法一定要和最简单默认参数比较。”修改：“简单方法可作必要基线，但需要合理实现和调参；还应说明为何选这些基线以及遗漏限制。”"]},{"id":"tips","title":"研究经验与适用边界","paragraphs":["把对照表给一位不了解你项目的人看，问他能否复述真正差别和代价。若只能记住你的方法有更多勾，表格还没完成论证任务。把表转成一段文字，常能暴露虚假的全面领先。","对照表应该随查新更新。重要新文献出现时，先检查贡献句是否仍成立，再决定补实验或调整范围。不要因为已经写了摘要，就拒绝修改不再成立的主张。"]}],"exercise":{"materials":"候选方法比基线多使用一个传感器，性能更好。","task":"设计比较，区分额外信息与算法本身的贡献。","template":"基线输入：\n候选输入：\n控制比较：\n资源代价：\n可能结果：\n可支持主张：","answer":"答案：比较相同信息下不同算法，再比较相同算法下有无额外信息；记录传感器成本与故障条件。若优势主要来自新信息，应如实主张信息价值，不把它全部归于算法创新。","rubric":["包括最接近与合理基线","表格否定项有依据","差别有知识意义","比较控制信息与资源差异"]},"quiz":{"question":"新方法使用更多数据且分数更高，最应先检查什么？","options":["立即宣布算法更先进","收益来自算法、信息增加还是评价条件差异","只把数据量差异放附录隐藏"],"correct":1,"explanation":"资源和信息变化会影响归因，需要公平比较与透明说明。"},"references":[{"id":"sklearn-leakage","locator":"防止训练评价信息混用。"},{"id":"read-paper","locator":"检查方法比较与贡献证据。"}],"next":"拿贡献判断去对照资源和最小方案，只有证据和条件都撑得住的部分才写进正式计划。","core":true,"chapterId":"c08","stageId":"s3","chineseCount":1718},{"id":"a08-4","title":"创新不成立时怎样调整、转向或停止","goal":"当查新或结果不支持原创新判断时，能依据证据选择修订、转向、复现或停止。","scope":"通用贡献形成训练；具体原创性标准还需结合学科与目标渠道。","prerequisites":["a07-3"],"minutes":70,"tags":["通用"],"terms":[{"zh":"沉没成本","en":"sunk cost","definition":"已经付出且无法收回的投入，不应单独决定后续是否继续。"},{"zh":"转向","en":"pivot","definition":"保留可用积累并改变问题或路径，需要明确新的理由。"},{"zh":"停止标准","en":"stopping criterion","definition":"预先定义何时停止投入或改变路线的条件。"}],"sections":[{"id":"concepts","title":"贡献由什么构成","paragraphs":["发现别人已经做过、效果不稳定或资源无法取得，是研究的常见阶段。它说明原判断需要更新，不等于此前学习毫无价值。文献理解、数据整理、实现和失败记录都可能成为下一步基础，但不能因为已经投入很多，就继续维护不成立的创新故事。","可选行动包括缩小贡献范围、研究已发现的边界、转为严格复现、改进测量、换可用材料、暂停或停止。每种行动都需新的问题与证据理由。简单换标题、换术语或只保留有利结果不属于有效调整。","复现可以是合理成果，但要说明复现目标、与原工作的关系和新增价值。若仅照做教学案例，适合作为学习证据；若严格检验重要结论并解释差异，可能形成研究贡献。两者状态不应混写。"]},{"id":"reasoning","title":"判断贡献的理由与取舍","paragraphs":["继续与停止应比较未来成本和预期知识收益，而不是仅看过去投入。一个关键权限长期不明，可能比某段代码写得慢更致命；一个核心假设已被反例否定，可能需要改问题而非继续调参数。把阻塞项分为可修复技术问题、根本证据问题和外部条件，才能选择行动。","不支持预期的结果也需要质量检查。先确认数据、实现和设计没有错误，再讨论理论含义；不能把程序bug包装成负结果，也不能因为结果不喜欢就断言一定是bug。"]},{"id":"workflow","title":"把想法变成可核查主张","paragraphs":["准备最接近工作表和自己的问题说明；当前贡献先作为待检验判断。"],"steps":[{"title":"写明触发事实","body":"用可核查语言说明发生了什么：找到直接先例、独立测试无稳定收益、权限未获确认或关键材料缺失。避免只写“感觉题目不好”。"},{"title":"区分事实与解释","body":"事实是已有文献完成同类目标；解释可能是你的贡献重合。逐项比较范围，防止因为标题相似就过早放弃，也防止明显重合仍强行否认。"},{"title":"列四种行动","body":"至少比较继续修正、缩小问题、转为复现或边界研究、停止。每种写新增工作、可获得证据和预计时间，不只比较情绪吸引力。"},{"title":"设短期验证门槛","body":"给可修复问题一个具体检查任务和期限，例如完成独立测试或确认数据许可。门槛应判断可行性，不是要求结果必须显著。"},{"title":"记录决定并更新材料","body":"保存原主张、触发证据、决定和剩余价值。同步改研究计划、摘要和申请叙述，避免旧版本继续冒称已失效创新。"}]},{"id":"worked","title":"完整贡献分析示范","paragraphs":["举个例子：你实现了一个异常恢复规则，查新发现已有工作使用同样规则。比较后发现对方还评估更多条件，因此不能只靠换场景主张新方法。可选路线一是复现其结果并检查实现；路线二是研究一个有实际意义且未充分覆盖的失效条件；路线三是停止方法创新方向，把实现作为训练成果。","决定记录可以写：“原主张为新恢复规则；直接先例使新颖性不成立；现阶段保留实现用于学习，先检查是否存在有价值边界；若两周内无法找到有证据支持的问题，则转入另一已具备资料的题目。”这不是承诺两周出创新，而是控制无效投入。","人文例：新档案与既有材料内容重复，原‘颠覆性发现’不成立，可以转为版本比较或资料来源研究，但前提是这些新问题本身值得回答，不能为了保留题名硬造意义。"]},{"id":"repair","title":"创新包装的错误与修订","paragraphs":["容易踩的坑：“已经做了三个月，必须发成论文。”过去投入不能保证剩余路径合理。修改：“评估未来还需什么证据，若关键条件不可得，及时调整交付目标。”","容易踩的坑：“不显著就不断换指标直到成功。”修改：“报告主要分析，探索改动透明记录；新的有利线索需要独立验证，不能冒充预设成功。”"]},{"id":"tips","title":"研究经验与适用边界","paragraphs":["准备一个“可保留资产清单”：核实文献、可复用代码、资料字典、失败案例、方法理解。这样转向时能看见真实积累，也更容易向导师解释决定。它不应变成把所有失败都美化为贡献的借口。","申请叙述中可以坦诚说明如何发现问题并调整。重点是你的判断、证据和实际承担的工作，而不是声称一路顺利。好的研究潜力包括知道何时改变方向。"]}],"exercise":{"materials":"独立测试未显示稳定提升，旧训练集上提升明显；最接近文献已有相同核心方法。","task":"写一个调整决定，包含可保留成果和下一步门槛。","template":"触发事实：\n原主张变化：\n可能原因：\n行动选择：\n门槛：\n保留资产：","answer":"答案：撤回新方法和稳定优势的主张，检查训练评价差异与泄漏；保留实现和复现记录。若公平独立评价仍无收益，转为边界或复现报告，前提是问题有价值；不通过反复选测试集维持优势。","rubric":["决定基于具体证据","区分实现错误与真实负结果","停止条件不要求显著","申请表述同步实际状态"]},"quiz":{"question":"哪种做法属于合理转向？","options":["更换术语隐藏先例","依据新证据修订问题，并说明保留与新增工作","删除不利结果再写摘要"],"correct":1,"explanation":"合理转向需要知识与证据理由，而不是包装或选择性报告。"},"references":[{"id":"osf-preregistration","locator":"记录计划与偏离，区分确认与探索。"},{"id":"ori-misconduct","locator":"如实报告与避免篡改。"}],"next":"拿贡献判断去对照资源和最小方案，只有证据和条件都撑得住的部分才写进正式计划。","core":false,"chapterId":"c08","stageId":"s3","chineseCount":1654},{"id":"a09-1","title":"时间、资料、设备、能力与指导资源盘点","goal":"把资源愿望变成有证据的可行性清单，找到决定研究能否启动的依赖条件。","scope":"适用于有限时间的小研究；具体准入、伦理、设备和指导安排须向实际所属机构核实。","prerequisites":["a07-1","a08-1"],"minutes":70,"tags":["通用","实证定量","申请"],"terms":[{"zh":"资源约束","en":"resource constraint","definition":"限制可完成研究范围的时间、材料、技能、权限或协作条件。"},{"zh":"关键依赖","en":"critical dependency","definition":"若不能满足，就无法完成核心证据链的前提。"},{"zh":"可行性","en":"feasibility","definition":"在给定条件内能够按适当标准执行的程度，不等于结果必然有利。"}],"sections":[{"id":"concepts","title":"先区分可用资源和想象中的资源","paragraphs":["研究计划里的资源包括时间、材料、工具、设备、能力、权限和指导。学校有一台设备，不等于你能预约；网上能下载资料，不等于允许二次使用；认识一位老师，不等于对方已经答应持续指导。只有可核查的使用条件，才应当写进基本方案。","资源可以标为已确认、有条件、未确认三种状态。已确认需要证据，例如许可文本、预约信息、自己的成功运行记录或对方明确答复。有条件需要列出尚待满足的条件；未确认不表示永远没有，只表示现在不能依赖它作承诺。","能力也应落实到动作：能否导入一张表、解释一张图、复核一次计算。读过一门课与能够独立执行任务不是一回事。资源盘点不是给自己打低分，而是提前决定哪些环节需要学习、帮助或替代。"]},{"id":"reasoning","title":"可行性取决于最弱的关键环节","paragraphs":["一个题目可能文献充分、方法有趣，却因为核心数据不可取得而无法实施。此时多学几种模型不能解决真正阻塞。应按证据链倒推资源：我要回答什么，必须观察或证明什么，获得这些证据需要哪些条件，哪个条件最不确定。","时间不能只计算真正操作的小时数，还包括等待反馈、材料审批、预约、返工和学习。对于每周投入八到十二小时的路线，把所有时段排满会让一次延期拖垮整个项目。先保留缓冲，再安排必须完成的工作；申请截止日期需另行核实，不由教材周数自动决定。"]},{"id":"workflow","title":"做一张可以讨论的资源表","paragraphs":["准备问题说明、贡献对照表、日程和已知资料链接。每一行只写一项可以核实的资源。"],"steps":[{"title":"拆出证据链","body":"从核心结论反推材料、收集或处理、分析、复核和写作五类工作，列出它们的输入与产出。凡是只能写“到时再想”的环节，暂标未知。"},{"title":"为资源写状态与依据","body":"将时间、资料、设备、软件、方法能力和指导逐行登记。写谁确认、何时确认、许可范围和有效条件；不要把口头设想记成已获支持。"},{"title":"做最小可用性检查","body":"实际打开少量资料、运行一个基本计算、确认设备预约和数据导出方式。输出是可复核记录，不是只打“应该能用”的勾。"},{"title":"排依赖和等待","body":"标出先后关系，例如先获许可再收集、先核对测量再做统计。把最难替代又等待最长的条件优先核实，并为自己的任务估计保守时长。"},{"title":"缩范围并保留替代","body":"对未确认关键资源写替代方案或取消条件。形成能在已确认条件下启动的一版方案，再把额外设备和协作列为可选扩展。"}]},{"id":"worked","title":"完整示范：把设备依赖改成可启动方案","paragraphs":["教学示例中，学生拟“比较三种实体系统在多场景下的表现”，但目前只确认每周十小时、可用表格软件和个人电脑；设备借用、现场权限与指导频次均未确认。原计划的三个关键资源都不是现成条件，因此不能据此承诺真实多场景实验。","完成的资源判断写成：“时间已确认，每周十小时；分析工具已用教学表格试运行；实体设备未确认，需获得可预约时间与安全要求；真实数据未确认，需查许可与字段；指导支持未确认，先准备一页问题和具体反馈请求。”这张表让别人能指出具体缺口。","修订方案为先用教材明确标示的模拟数据走完记录、分析和报告流程，同时寻找有许可的真实材料或确认设备条件。教学练习产出可证明训练过程，不能证明实体系统优越性。若真实材料落实，再另写研究问题与方案；不把换成教学数据的工作继续叫真实实验。","在定性研究中，相同逻辑意味着先核实能否接触参与者、是否需要伦理审批、如何保护信息；在人文研究中意味着先核实史料馆藏、版本与访问条件；理论研究也要核实自己能否理解关键定义和已有证明。"]},{"id":"repair","title":"把含糊承诺改成有证据的条件","paragraphs":["容易踩的坑：“我们学校有实验室，因此实验条件完备。”修改：“设备存在，但我的使用权限、培训、预约时段和可导出数据尚需确认；当前方案只承诺已经可执行的环节。”","容易踩的坑：“我会在一个月内学完统计并完成论文。”这把学习与执行当成确定常数。修改：“先用一周完成数据导入与描述，再以独立复核是否通过判断能否进入推断分析；根据结果缩小方法范围。”"]},{"id":"tips","title":"用短测试减少大承诺","paragraphs":["问别人资源时，提出具体问题：能否使用哪些数据字段、哪段时间可预约、能否请对方对一个设计判断给反馈。泛泛问“可不可以带我做科研”，对方难以估计工作量，也不能直接转化为计划依据。","不要把资源盘点变成永久准备。对低成本、可逆的环节尽早实际试做；对涉及他人、权限与风险的环节先确认必要条件。每次新增重要资源或限制就更新表格，它反映当前条件，不定义你的长期能力。"]}],"exercise":{"materials":"教学设定：每周十小时，有个人电脑；计划做现场访谈与传感器实验，但两种权限均未确认；可合法使用的教材模拟表格已经存在。","task":"列三项关键依赖，写出本周能执行的任务和不能提前承诺的成果。","template":"目标证据：\n资源／状态／依据：\n关键依赖：\n本周任务：\n暂不承诺：\n替代路线：","answer":"参考答案：关键依赖为现场准入、参与者及伦理要求、传感器使用条件。本周可完成资源核查、形成具体请求，并用教学表格练习数据字典与分析。暂不承诺真实现场研究和设备性能结论。若权限未落实，改寻有明确许可且能回答合理问题的材料；教学模拟始终单独标示。","rubric":["资源状态有核实依据","关键依赖与证据链对应","把时间和等待分别考虑","替代方案不冒充原研究成果"]},"quiz":{"question":"哪项最能证明设备资源已经可进入基本方案？","options":["实验室网页展示了设备","已经核实本人使用许可、必要培训和可预约时段","同学说可能可以借"],"correct":1,"explanation":"设备存在和他人推测都不足以证明自己的访问与执行条件；仍应随计划核查预约、数据输出和安全要求。"},"references":[{"id":"oxford-proposal","locator":"研究计划中的可行性、方法和资源说明。"},{"id":"ori-misconduct","locator":"Definition of Research Misconduct：fabrication、falsification、plagiarism及诚实错误的区别；美国PHS定义不等于所有机构的完整记录管理要求。"}],"next":"带着资源表进入 a09-2，确定最小研究范围；方法选择时再用 a10-2 检查证据与条件是否匹配。","core":true,"chapterId":"c09","stageId":"s3","chineseCount":1970},{"id":"a09-2","title":"最小研究范围、交付物和停止标准","goal":"写出能完成且仍有知识意义的最小研究范围、交付物和继续或停止标准。","scope":"适用于有限时间的小研究；具体准入、伦理、设备和指导安排须向实际所属机构核实。","prerequisites":["a09-1"],"minutes":70,"tags":["通用","实证定量","申请"],"terms":[{"zh":"范围","en":"scope","definition":"本项工作纳入和排除的问题、材料、条件及主张。"},{"zh":"交付物","en":"deliverable","definition":"可供别人检查的具体成果，如方案、数据字典、分析记录和报告。"},{"zh":"停止标准","en":"stopping rule","definition":"预先说明何时结束收集、暂停某路线或作出继续决定的条件。"}],"sections":[{"id":"concepts","title":"最小研究仍然需要完整证据链","paragraphs":["最小研究不是把工作削减到只剩一个漂亮演示，而是在有限范围内回答一个清楚问题。它可以只研究一个条件、一组有理由选出的材料或一个命题，但需要说明为什么选择这些边界，怎样获得证据，以及哪些结论尚不能推出。","最小演示只证明“东西能运行”；最小研究还要比较、检查或论证“我们因此知道什么”。做出预测模型并展示一张成功图，无法自动回答模型是否可靠；完成一个文本摘要，也不自动构成解释研究。范围小可以成立，论证链断裂则不行。","交付物是证据与过程的载体。研究报告、原始材料出处、处理记录、可运行分析和限制说明各有用途；只交幻灯片可能让别人看不到结果如何得到。学习完成、研究产物完成和录取结果应分别记录，不能互相替代。"]},{"id":"reasoning","title":"停止标准控制投入，也保护解释","paragraphs":["如果不设范围，阅读每篇论文都会带来新方法、新数据和新问题，工作就难以收束。先写核心问题与最少证据，再把其他想法放进扩展清单，能保护主要研究的完整性。决定纳入什么时，要以结论需要为理由，而不是以功能多少衡量价值。","停止标准包括执行上的门槛和收集上的规则。数据许可始终无法确认时可以暂停；质量检查持续失败时可以修订测量。不能把“得到显著结果”为结束条件，反复看结果再决定加样本会改变统计解释。若确需序贯设计，应采用适合的预设方法并取得相应指导。"]},{"id":"workflow","title":"把题目压缩成一页范围契约","paragraphs":["准备一条主问题、资源表和最接近工作说明。范围契约是教学用的计划形式，可以随有理由的修订更新版本。"],"steps":[{"title":"写唯一主要问题","body":"用一句话说明对象、比较或解释目标、条件和主要结果。把次要兴趣列在旁边，不能让它们悄悄变成同时必须成功的目标。"},{"title":"定义最少证据","body":"对每个核心主张列必要材料与分析。删除不能改变问题答案的附加功能；保留会影响可信度的基线、检查和不利结果。"},{"title":"列纳入与排除","body":"说明材料范围、评价条件和不研究的内容，并解释排除原因。不要在看到结果后才排除不利对象，预先规则的变更需留记录。"},{"title":"定义可检查交付物","body":"为方案、数据或材料包、分析、图表、报告分别写验收依据。比如分析应从原始表到结果可重新运行，不只要求“完成统计”。"},{"title":"写继续与停止判断","body":"给权限、资料质量、时间和方法障碍设置具体检查点。区分终止不可行路线与结束既定收集；所有判断都避免以结论好坏作为唯一标准。"}]},{"id":"worked","title":"完整示范：从大口号到配对练习","paragraphs":["原始想法为“证明流程B全面优于A”。这一句没有对象、条件、指标或资源边界，“全面”还暗示多个评价维度。教材练习将其缩为：“在二十个教学模拟对象中，比较流程A与B相对于参考值的绝对误差，并解释配对差的不确定性。”差定义为B绝对误差减A绝对误差，负数表示B较小。","完成的范围说明为：“纳入提供的全部二十个模拟对象，以对象作为配对单位；主要量为配对差，保留原始读数与计算字段；不推断真实设备性能，不增加未经说明的模拟对象，不根据结果删行。交付原始表、数据字典、公式或脚本、结果图与一份有局限说明的教学报告。”","验收与停止说明为：“先核对配对、单位、公式和缺失；若这些检查失败，暂停分析并修复记录；检查通过后按既定表完成分析，无论差异方向如何都报告。练习到可复核报告形成时结束。”这里没有使用显著性作为完成标准。","若转为真实项目，不能直接沿用二十个样本作为合理样本量。实际对象、抽样条件、期望精度、可行资源和分析单位需要重新论证。教学数据提供的是流程练习范围，不是研究设计的通用定额。"]},{"id":"repair","title":"删扩展，不删可信度","paragraphs":["容易踩的坑：“时间不够，就取消对照，只展示最好一次。”这样删掉了回答比较问题所需证据。修改：“缩小比较条件或方法数量，保留合理基线、完整记录与失败案例。”","容易踩的坑：“做到结果支持预想就停止。”修改：“提前定义收集范围和结束规则；按方案报告结果，探索性追加另行说明并使用适当方法解释。”"]},{"id":"tips","title":"用主张驱动范围，而非用篇幅驱动研究","paragraphs":["每当想增加一项实验或分析，问它会检验哪个主张；每当想删除一项检查，问删除后结论还能否成立。把这种对应写在计划旁，比单纯追求多做或少做更可靠。","范围可修订，但要留下触发事实、修订内容和影响。早期发现问题不适合现有材料时及时缩范围有价值；已经看到结果后悄悄改变主要指标，则会削弱可信度。不同方法的结束依据也不同，理论证明、史料分析不适用统计样本收集规则。"]}],"exercise":{"materials":"一个月可用四十小时，已有有许可的单一数据来源，想比较六个复杂模型、三个新指标并做访谈；其中主要问题只关心一种评价条件下的误差。","task":"提出最小范围与三项交付物，给出一项继续条件和一项停止条件。","template":"主要问题：\n最少证据：\n纳入与排除：\n交付物及验收：\n继续条件：\n停止或修订条件：","answer":"参考答案：先聚焦既定条件下一个候选方法与合理基线的误差比较；排除缺乏必要资源的访谈及与问题无关指标。交付有出处的数据字典、可复核分析和边界清楚的报告。继续条件是许可、字段与比较条件已核实；若资料无法支持主要比较，修订问题或停止此路线。结果不显著不是删除数据或不断加样本的理由。","rubric":["范围保留核心证据链","交付物有具体验收标准","主要和扩展问题分明","结束规则不依赖想要的结果"]},"quiz":{"question":"时间不足时哪种缩范围更合理？","options":["保留六种方法但取消所有检查","聚焦一个有意义比较，保留必要基线与验证","只保留有利案例"],"correct":1,"explanation":"缩减覆盖面可以保留可信度；删除必要检查或选择性展示会破坏原问题的证据基础。"},"references":[{"id":"osf-preregistration","locator":"预先说明主要问题、分析和偏离计划的处理。"},{"id":"nist-statistics","locator":"实验设计、数据检查与统计分析的条件。"}],"next":"用 a09-3 的先导研究检查这份范围是否真实可行，再进入 a10-1 区分设计、收集与分析。","core":true,"chapterId":"c09","stageId":"s3","chineseCount":1975},{"id":"a09-3","title":"先导研究、风险登记与备选路线","goal":"用短小先导检查暴露实施风险，为关键失败条件准备有理由的替代路线。","scope":"适用于有限时间的小研究；具体准入、伦理、设备和指导安排须向实际所属机构核实。","prerequisites":["a09-1","a09-2"],"minutes":70,"tags":["通用","实证定量","申请"],"terms":[{"zh":"先导研究","en":"pilot study","definition":"正式研究前检查流程、测量、材料和实施条件的小规模工作。"},{"zh":"风险登记","en":"risk register","definition":"把可能阻塞、触发信号、应对和责任写成可更新记录。"},{"zh":"备选路线","en":"contingency plan","definition":"某项条件不成立时仍能有理由继续学习或研究的替代路径。"}],"sections":[{"id":"concepts","title":"先导检查的是能不能做好","paragraphs":["先导研究的主要作用是发现程序哪里不通：字段是否齐全，参与者能否理解题目，仪器是否稳定，代码能否处理真实格式，档案是否足以支持比较。它不必回答最终研究的全部问题，也不能仅因为小样本结果好看就保证正式研究成功。","正式研究关注研究问题的证据；先导工作首先关注产生证据的流程。两者可以有重叠，但应该提前区分。用少量样本估计出的效果通常不稳定，不能无条件当作后续样本量与预期成效的可靠依据。","风险既可能是技术问题，也可能是权限、时间、人员、材料或解释问题。登记风险并非预测一切，而是让明显脆弱点有负责人和触发行动。没有可用替代时应诚实写出可能停止，不能把“到时解决”当作方案。"]},{"id":"reasoning","title":"先验证最容易使项目失败的假设","paragraphs":["把最省事的部分先做完，容易制造进度很多的错觉。若真正风险是资料不可得，先做精美报告模板不会降低风险。先导任务应挑选关键且不确定的依赖，让一次短检查能改变继续、调整或停止的决定。","风险的概率和影响可以用高、中、低作粗评，但这些标签只是讨论工具，不是精确计算。一个低概率但无法补救的权限问题，可能值得优先处理；一个高概率但半小时可修复的格式问题未必最重要。应同时考虑影响、可发现性、替代成本和时间。"]},{"id":"workflow","title":"设计一次能够改变决策的先导","paragraphs":["准备范围说明、资源表和拟用材料；先确认少量测试本身已经具备必要权限与安全条件。"],"steps":[{"title":"列关键假设","body":"写出必须为真的条件，例如参考值可解释、两流程可配对、字段单位一致、访谈问题能得到与研究问题有关的材料。每项对应一个可检查观察。"},{"title":"选最小测试材料","body":"挑能暴露问题的少量不同情况，不只选择最好处理的样本。说明先导选择目的不是代表总体，避免把便利用例当成正式抽样。"},{"title":"预写判断标准","body":"在运行前写什么表现意味着可继续、需修订或停止，例如无法确认许可就不进入收集，关键变量无法对应就改问题。不要只写“效果不错”。"},{"title":"记录偏差与修订","body":"保留原流程、实际遇到的问题、修订理由和版本。修改题目、指标或处理方法后，再做相关检查；不要把先导试出的选择伪装成最初预设。"},{"title":"更新风险与备选路线","body":"给每个关键风险写触发信号、下一动作、负责人和复查点。比较备选路线是否仍回答原问题；如果问题改变，就明确重写方案。"}]},{"id":"worked","title":"完整示范：小表格先暴露单位问题","paragraphs":["教学示范中，一份待分析表包含对象编号、A读数、B读数和参考值。先导抽查几行，发现B字段有一行采用不同单位，另有一个对象编号重复。若直接计算平均误差，程序可能正常运行，却输出没有意义的数字。","先导记录完成稿为：“目标是确认可配对与单位一致；检查发现重复编号和单位混用；暂停统计推断；回到来源核实重复是重复测量还是录入错误，按记录修正单位并保留转换列；无法核实的行不随意删除，按预设缺失或排除规则处理并说明影响。”","风险登记中的一行可以写：“风险：原始单位缺少元数据；影响：误差不可解释；触发：来源无法确认单位；应对：暂停该变量分析并联系资料提供方；备选：只分析有明确单位且仍能回答修订问题的资料；代价：范围与外推能力缩小。”这比“数据有问题则清洗”更可执行。","定性先导可以发现问题带有暗示或一次问了两件事，修订提纲后保留理由。史料先导可检查关键时期是否有资料空缺；理论先导可用边界例子暴露假设不足。这些检查有共同逻辑，但不需要统一成同一种统计试验。"]},{"id":"repair","title":"不要把先导当成挑选有利结果","paragraphs":["容易踩的坑：“先试很多条件，挑有效的那个，正式论文不提先导。”这样掩盖了探索选择。修改：“报告先导怎样帮助确定条件；正式验证使用适当的新证据或明确承认分析的探索性质。”","容易踩的坑：“五个样本效果很好，所以确定大样本也会成功。”修改：“先导说明流程在这些情况可运行；效果估计不稳定，正式研究的精度、设计与样本仍需单独论证。”"]},{"id":"tips","title":"让备选保留知识目的","paragraphs":["好的备选可以改变实现方式，同时保持主要问题，例如在合适条件下使用另一有许可来源；有时必须改问题，就应重新评估贡献和边界。不能把无法获得访谈改成自己编造访谈，也不能把模拟替代真实测量却保持现实结论。","先导时间应有上限和输出。新手容易不断改流程，却从不形成可以执行的版本。设定复查点，交出问题清单和修订方案；若关键条件仍然不可得，停止该路线比无限“准备中”更可取。"]}],"exercise":{"materials":"教学设定：试读三份文本发现版本年份不同，计划做同期比较；另外一项方法运行缓慢，但可以减少无关附加输出。","task":"选择优先风险，写一条登记和一条备选，并说明先导不能证明什么。","template":"风险事实：\n对主要问题的影响：\n触发信号：\n应对：\n备选及代价：\n先导结论边界：","answer":"参考答案：版本不一致直接威胁同期比较，应优先核实文本来源与版本。若无法获得可比版本，改为版本变化问题或换有许可且可比的材料，并重写范围；不能隐去年份差异。运行速度可通过删除无关输出改善。先导只能证明这些资料与流程暴露的问题，不能证明总体文本规律或正式方法效果。","rubric":["先导目的与正式研究区分","风险排序考虑核心问题","触发与应对具体可执行","备选改变的问题和代价透明"]},"quiz":{"question":"先导工作最稳妥的结论是什么？","options":["少量材料表现好就证明总体有效","已经识别并修订流程问题，正式证据仍需按设计收集和评价","可以只保留效果好的条件且不披露"],"correct":1,"explanation":"先导主要提供可行性信息；效果、不确定性和探索选择都需要如实处理。"},"references":[{"id":"osf-preregistration","locator":"探索、正式计划和偏离记录的区分。"},{"id":"nist-statistics","locator":"测量过程与实验设计的检查思路。"}],"next":"把先导发现写入 a09-4 的一页选题说明；正式采集前再检查 a03-2 的权限与伦理要求。","core":false,"chapterId":"c09","stageId":"s3","chineseCount":1961},{"id":"a09-4","title":"写出一页选题说明并接受质询","goal":"写出别人可以质询的一页选题说明，并把反馈转化为可检查的修改。","scope":"适用于有限时间的小研究；具体准入、伦理、设备和指导安排须向实际所属机构核实。","prerequisites":["a09-2","a08-3"],"minutes":70,"tags":["通用","实证定量","申请"],"terms":[{"zh":"选题说明","en":"research concept note","definition":"简洁交代问题、依据、证据路线、可行性和边界的早期方案。"},{"zh":"质询","en":"critical questioning","definition":"通过追问理由、证据与替代解释检查方案，不等于否定研究者。"},{"zh":"预期贡献","en":"anticipated contribution","definition":"若计划与证据成立可能增加的知识，不能当作已实现发现。"}],"sections":[{"id":"concepts","title":"一页纸是压缩后的完整逻辑","paragraphs":["一页选题说明不是把论文标题扩大成一段宏大背景，也不是正式论文缩小字号后的版本。它要帮助别人迅速判断：你想知道什么，为什么值得知道，目前知道到哪里，准备用什么证据回答，在现有条件下能否完成。","“一页”是教学建议，强调短而完整，不是所有学校的申请格式。正式研究计划必须遵守目标项目的官方字数和栏目要求。此处训练的是问题与证据的连接，可在后续扩展为研究方案或申请计划。","方案中的事实、判断和计划需要分开写。已读文献能够支持背景判断，未核实的缺口只能作为待查判断；预期贡献描述可能增加什么，不能提前写成“本研究首次证明”。资源未确认时要写条件，不把愿望装成承诺。"]},{"id":"reasoning","title":"让别人有机会指出真正问题","paragraphs":["选题说明的价值在于可被反驳和修订。只有“研究重要、方法先进、前景广阔”，别人很难提供具体帮助；写清对象、比较、材料与限制，导师才可能指出数据无法回答问题、基线缺失或范围过大。","质询时应区分方案缺陷、信息表达不足和评审偏好。有人问“为什么不做访谈”，可能是因为你的问题需要解释经验，也可能只是对方偏好某方法。先追问需要哪种证据，再决定是否修改，不因每条建议都出现就无限扩大研究。"]},{"id":"workflow","title":"从已有产物压缩成可讨论说明","paragraphs":["准备问题地图、文献矩阵、贡献对照、资源表和范围说明。无需重新发明材料，先检查它们是否一致。"],"steps":[{"title":"开头直接写问题","body":"标题用具体对象与研究动作，第一段写核心疑问和适用条件。删除不能帮助理解问题的泛泛背景，用一句话交代为何值得研究。"},{"title":"用最接近工作定位","body":"用少量已经核实的相关工作说明已知与不足；若尚未完成检索，明确标成查新任务。引用必须能追溯，不能为填满页面编造作者或结论。"},{"title":"写证据路线和判断","body":"说明材料来源、研究单位、比较或解释方法、主要指标与复核。让读者看见证据怎样回答问题，而不是只看到一个方法名称。"},{"title":"写交付与可行条件","body":"说明时间、已确认资源、关键风险、阶段产物和范围限制。预期贡献使用条件式，真实完成状态另列，避免申请叙述提前兑现计划。"},{"title":"提出问题并处理反馈","body":"结尾列两到三个具体求助点。收到反馈后记录意见、判断、修订和理由；保留版本，能解释自己为什么采纳或没有采纳。"}]},{"id":"worked","title":"完整一页说明：教学配对研究","paragraphs":["标题：流程A与B绝对测量误差的配对比较练习。问题与价值：在提供的二十个教学模拟对象中，怎样比较两流程的绝对误差，并准确表达差异和不确定性？本练习用于学习完整证据链，不用于证明真实设备性能。","背景与定位：本练习建立在配对比较和测量误差的基本方法上；背景方法阅读使用教材列出的统计资料。尚未检索某个真实应用领域的最近研究，因此不声称实际学术空白，也不主张方法原创。后续独立项目需要重新确定实际问题、查新和资料许可。","材料与方法：使用明确标为模拟的原始表、参考值与数据字典。对象是配对单位，计算两流程相对参考值的绝对误差，再以B减A定义配对差。先核单位、编号、缺失与计算；用描述、图形和适合条件的区间表达结果，表格与Python交叉复核。分析条件和结论边界在报告中说明。","交付与资源：已有材料与个人电脑可用于教学练习；交付数据字典、公式表、分析脚本、结果图与完整练习报告。按每周八到十二小时的学习安排逐步形成，不把这份练习的周期当作真实课题保证。完成标准是他人可以从材料复核分析，且报告如实标示模拟性质。","限制与求助：本数据不支持现实性能外推，二十个对象也不是任何研究的通用样本量。预期收获是方法理解与可复核表达。希望反馈的具体问题为：配对差定义是否与研究问题一致？区间方法的条件与边界是否说明充分？转向真实项目前最需核实哪种数据条件？"]},{"id":"repair","title":"把空泛选题改成可以核查的问题","paragraphs":["容易踩的坑：“本研究面向智能化发展，使用先进技术解决重大难题，预计达到领先水平。”修改：“说明具体困难、现有证据缺口和能够执行的比较；领先只能在完成公平评价且证据支持后有限陈述。”","容易踩的坑：“导师建议增加一个方法，于是所有建议都加入。”修改：“记录建议要解决的证据问题；若新增方法对核心判断必要则修订范围，若只是扩展兴趣则放入后续清单，并解释取舍。”"]},{"id":"tips","title":"练习回答四种质询","paragraphs":["面对“为什么重要”，说明答案改变什么判断；面对“别人做过吗”，给最接近工作和检索范围；面对“怎么证明”，回到材料和推理；面对“能做完吗”，展示已确认资源和最小范围。不会的问题可以准确说出未知与核实办法。","请反馈者先复述你的问题。若对方复述与本意不同，先改善表达，再讨论方法。将一页说明与实际日志一起保存，后续写研究经历时便能区分最初计划、自己作出的修改和真正完成的贡献。"]}],"exercise":{"materials":"教学设定：已有一份有许可的公开材料，拟研究一个范围明确的问题；尚未检查最接近工作，方法只写“用统计分析”，计划声称首次发现。","task":"改写背景、方法和贡献三句，并列两项可向导师求助的问题。","template":"问题：\n已核实背景与待查项：\n材料和方法：\n预期贡献：\n资源与范围：\n求助点：","answer":"参考成品（为便于写出方法句，新增教学设定：公开材料包含同一对象的A、B读数与可信参考值，许可覆盖拟议分析；这不是已获取真实数据的声明）：“背景：已有可用配对材料，最接近工作与真实缺口尚需检索核实。方法：以对象为单位，核对编号、单位、缺失及参考值来源，分别计算A、B的绝对误差，再形成对象内B减A差值；展示全部差值，估计均值差，并在检查对象间独立性与差值分布后选择相应区间方法，保留异常记录的来源核查及敏感性结果。预期贡献：若材料、比较和文献核查支持，拟澄清该资料覆盖条件下的误差差异，不预称首次。”求助问题一：“参考值生成方式和对象配对是否足以支持这一误差比较？”求助问题二：“已有研究是否已经回答相同问题，是否存在需要调整的指标或条件？”如果原材料不具备上述字段，应重新定题，不能为了套方法虚构数据。","rubric":["一页包含问题到证据的逻辑","已知事实与计划分开","没有虚构引用或预支贡献","反馈问题具体且能影响行动"]},"quiz":{"question":"导师指出缺口可能已被解决，合适回应是什么？","options":["坚持原题以显得自信","核读最接近工作，比较后更新缺口和方案","把创新改称突破但不改内容"],"correct":1,"explanation":"研究判断应随证据更新；准确比较可能确认重合，也可能发现真正差别，不能靠措辞维持主张。"},"references":[{"id":"oxford-proposal","locator":"研究计划的问题、文献定位、方法与可行性。"},{"id":"read-paper","locator":"用问题和证据检查最接近工作。"}],"next":"进入 a10-1 把这份早期说明发展为方法清楚的研究方案；到 a24-1 再按实际申请项目要求改写正式研究计划。","core":false,"chapterId":"c09","stageId":"s3","chineseCount":2264},{"id":"a10-1","title":"区分研究目的、设计、资料收集和分析方法","goal":"把一个研究方案拆成四个相互衔接的层次，避免用软件或算法名称代替研究设计。","scope":"适用于理解各类研究方案；四层地图主要帮助组织经验材料，形式证明和规范论证还须写清前提与推理规则。","prerequisites":["a07-2"],"minutes":55,"tags":["通用"],"terms":[{"zh":"研究目的","en":"research purpose","definition":"希望得到哪一种答案，例如描述现状、解释差异、预测新对象或评价干预。"},{"zh":"研究设计","en":"research design","definition":"安排研究对象、比较关系、时间和证据来源的总体方案。"},{"zh":"分析方法","en":"analytic method","definition":"把收集到的材料转成可检查判断的具体规则，例如回归、主题分析或文本论证。"}],"sections":[{"id":"concepts","title":"先把方法放到正确层次","paragraphs":["看到“定量研究、实验法、问卷法、回归法”并列时，先暂停：它们没有处在同一个分类层级。定量通常描述资料表达和分析取向；实验是研究设计；问卷是资料收集工具；回归是分析方法。同一研究可以同时具备这四个特点。所以，背一张互斥的方法清单，往往会让你以为选择问卷就不能做实验，或者用了回归就已经具备因果设计。","研究方案可以沿四层向下展开：目的回答为什么研究；设计安排如何获得有说服力的比较；收集规定哪些材料进入研究；分析说明如何由材料支持结论。例如，调查学生的阅读习惯，可以是描述性目的、横断面抽样设计、问卷收集与频数分析。研究阅读训练是否改变习惯，则可能需要干预设计、前后重复测量和合适的组间比较。工具相同，证据结构不同。"]},{"id":"reasoning","title":"选择背后的证据逻辑","paragraphs":["四层不是一条只能向下走的流水线。若访谈时发现原先定义不成立，需要回到问题层修订；若只有某个时间点的数据，设计就不能假装拥有长期追踪。关键是记录改变如何影响可回答的问题。人文学者可能围绕一组文本选择比较语境与解释路径，数学研究者则从定义到命题与证明；不能要求他们都填写自变量和因变量才算研究。"]},{"id":"workflow","title":"逐步完成方法判断","paragraphs":["把下面每一步写进同一份研究方案，保留未解决的问题。"],"steps":[{"title":"先写一句目的","body":"把“我想用机器学习”改成“我想预测哪一类新对象的什么结果”；把“我想做访谈”改成“我想理解谁如何理解什么经历”。要求句子先出现要回答的问题，最后再出现工具。若目的仍然只有“提高水平”，先回选题阶段缩小。"},{"title":"画对象和时间图","body":"用方框表示研究单位，用箭头表示同一单位的时间顺序。标出有没有干预、比较组、随机分配、历史材料和不同资料源。图中每条箭头必须代表真实可取得的联系，不得把不同来源的记录仅凭行号配对。"},{"title":"列材料及其生成方式","body":"逐项写数据来自设备记录、现成数据库、访谈、问卷还是档案；写谁产生、何时产生、依据什么规则进入研究。软件输出也有上游来源，例如模型预测值依赖训练材料及预处理，不能只写“数据由Python得到”。"},{"title":"指定分析与输出","body":"针对每个问题写一种主分析及预期输出：比例及区间、配对差分布、主题与支撑片段、论证链或证明。注明分析需要什么条件，例如独立单位、可比较文本或明确定义。先确认输入满足要求，再选择软件菜单。"},{"title":"做上下对应检查","body":"从结论倒着走一遍：这个判断需要什么分析，该分析需要什么资料，资料由什么设计产生，设计能否回答最初目的。凡是跳过一层都加一个疑问标记。最终保留四行对应表，而不是只保留一串专业名词。"}]},{"id":"worked","title":"完整例子","paragraphs":["举个例子：问题是“图书馆新预约界面是否让读者更快找到可用房间”。目的为评价界面改变；设计为在教学模拟中让不同测试对象随机使用旧版或新版，并记录同一任务完成时间；收集材料为界面版本、任务日志、未完成标记和用户反馈；分析先比较时间分布及未完成比例，再分析反馈中的障碍。这里仍未产生真实参与者数据，正式执行前要处理招募、同意和机构要求。","如果无法分配界面，只能比较改版前后两个月的日志，研究就改为观察性前后比较。考试周、读者组成和开放时间可能同时变化，结论须从“新版导致加快”收缩为“改版后日志中的耗时发生变化，因果归属尚受这些因素影响”。四层地图迫使研究者把证据能力与措辞一起调整。"]},{"id":"repair","title":"错误方案与修订","paragraphs":["错误写法：“本研究采用定量法、问卷法和SPSS法，证明界面有效。”这里没有对象、比较或时间，SPSS是软件而不是证据逻辑。修订为：“采用两组随机分配的任务测试；收集完成时间与失败情况；按预先规定的组间比较报告差异及区间，并检查任务未完成是否造成选择偏差。”软件可以另外交代版本和操作，不能承担证明责任。"]},{"id":"tips","title":"经验、取舍与适用边界","paragraphs":["一项方法可以出现在多个学科，名称相同也不保证具体操作相同。比较论文时，不仅记录作者自称用了什么方法，还要读它实际怎样分组、选择材料和推导结论。遇到不熟悉的分类，先用四层地图定位，再查该领域的方法原文。","最有用的小技巧是给方案中每个方法名标色：目的、设计、收集、分析各一色。若一整页只有分析颜色，通常意味着提前迷上了算法；若只有收集颜色，则可能囤积了材料却没有回答问题的路径。"]}],"exercise":{"materials":"教学情境：比较同一批机器更换零件前后的噪声，每台机器各测两次，随后用回归控制机龄。","task":"填写四层表，并指出至少一个因果限制。","template":"目的：\n设计：\n资料收集：\n分析：\n结论边界：","answer":"可接受答案：目的为评价更换零件与噪声变化的关系；设计是同一机器的前后观察，若没有同时期对照则不是随机实验；收集是带机器ID、机龄、环境、时点的声级读数；分析可先看机器内差值，再根据设计考虑调整。更换同时若发生维护或温度变化，回归不自动排除所有混杂。每台两次读数也不能直接当作两台机器。","rubric":["四层各有具体内容且没有把软件当设计","明确研究单位及时间关系","结论强度与实际设计相符"]},"quiz":{"question":"“随机实验＋访谈＋主题分析”是什么关系？","options":["三种互斥方法，只能选一种","分别涉及设计、收集和分析，可以在合理方案中结合","都是同一个统计检验的名称"],"correct":1,"explanation":"随机实验安排条件比较，访谈获取经验材料，主题分析解释文本；能否结合还要说明各自回答什么问题和怎样整合。"},"references":[{"id":"openstax-research","locator":"阅读研究设计与资料收集的介绍，区分研究目的和工具。"},{"id":"mixed-methods","locator":"官方资源页Table of Contents中The Nature and Design of Mixed Methods Research，以及Introduction and Background；本次核对介绍与分节入口，具体设计报告PDF作为延伸阅读。"}],"next":"把今天的判断记进方法选择表，再用后面的具体方法课检查能不能做。","core":true,"chapterId":"c10","stageId":"s4","chineseCount":1910},{"id":"a10-2","title":"按问题、证据需求和条件选择方法","goal":"为自己的问题写出至少两种候选设计，并说明采用哪种、为何舍弃另一种。","scope":"适用于选题后的初步方法选择；具体领域的测量技术和正式审批需要相应专业支持。","prerequisites":["a10-1"],"minutes":55,"tags":["通用"],"terms":[{"zh":"证据需求","en":"evidence requirement","definition":"一个判断成立必须看到的材料和比较，例如因果归属需要处理替代解释。"},{"zh":"可行性","en":"feasibility","definition":"在时间、能力、资料权限和资源范围内真正实施方案的可能性。"},{"zh":"权衡","en":"trade-off","definition":"某个选择改善一种条件，却牺牲另一种条件，需要明确说明。"}],"sections":[{"id":"concepts","title":"先把方法放到正确层次","paragraphs":["选择研究方法可以从一句追问开始：“即使结果符合预期，别人还会怀疑什么？”如果别人会怀疑两组原本就不同，你需要思考分配、匹配或因果识别；如果别人会怀疑你误解了受访者的意思，需要检查语境、提问与解释过程；如果别人会指出一个反例，重点是定义和推导是否严密。方法应当针对研究的薄弱环节，而不只是选择你觉得高级的工具。","问题的动词提供线索，但不能单凭动词选法。“有多少”通常要求界定总体、抽样与测量；“如何体验”需要能够保留情境和意义的材料；“是否导致”要求研究设计处理反事实；“为什么作者这样写”可能需要文本与历史语境；“对所有对象是否成立”可能需要证明或找反例。一个问题包含多个任务时，先把任务拆开，再决定是否值得做多种方法。"]},{"id":"reasoning","title":"选择背后的证据逻辑","paragraphs":["资源条件不是最后才检查的附属项。若需要随机干预却无法实施，不能偷偷把观察数据命名为实验；可以改成较弱但诚实的问题。若想做长期民族志却只有两周访问，短期访谈也许能够回答某些局部问题，却不能替代持续田野参与。最好的初学者设计通常是证据链短、假设透明、能解释失败的设计。复杂度本身不会增加可信度。"]},{"id":"workflow","title":"逐步完成方法判断","paragraphs":["把下面每一步写进同一份研究方案，保留未解决的问题。"],"steps":[{"title":"写下结论草稿","body":"先写你最终希望说的一句话，再把其中的“所有”“导致”“最优”“普遍”圈出来。将它改成可由现有条件支持的范围，例如某个群体、时段或材料集合。这不是提前决定结果，而是明确你准备估计或论证的对象。"},{"title":"列出证据最低要求","body":"为每个关键判断写出必须观察的内容。评价误差要有可信参考；解释经历要有足够情境材料；证明定理要有准确前提。把“已有”与“仍需取得”分列，权限未明确的资料不能算作已具备。"},{"title":"构造两个候选方案","body":"至少写一个直接方案和一个资源较省的备选。每个方案填写单位、材料、比较、分析和限制。不要只比较软件价格，要比较哪种方案最能排除你最担心的替代解释。"},{"title":"用门槛先淘汰","body":"先查是否允许取得材料、是否安全、是否能识别核心对象、是否能在期限内获得最低证据。任何一个硬门槛失败，不能用其他高分补偿。通过门槛后再比较成本、外推性、精度和学习负担。"},{"title":"做最小预演再选择","body":"用很小且合法的教学材料走一遍采集到输出的路径，找出缺字段、难以编码或测量噪声过大的环节。写清预演检验的是流程而不是效果。把最终方案和被放弃方案的理由同时留在研究日志。"}]},{"id":"worked","title":"完整例子","paragraphs":["举个例子：研究“自动提醒是否减少任务遗漏”。方案A是在允许的模拟任务中随机分配提醒条件；记录遗漏数和任务时间，能更清楚比较条件效果，但需要招募、同意和可用平台。方案B分析现有工作日志中提醒启用前后的变化，成本较低，却可能混入人员培训和任务难度变化。若目前只有教学日志，合理决定是先做数据管线和指标定义练习，再向指导者核实能否开展正式比较。","形成的选择记录可以写：“主要问题为提醒条件与遗漏率差异。正式研究优先考虑随机分配任务；现有日志仅用于可行性检查。采用方案A的理由是培训等同期变化较难在观察日志中排除。若招募与权限无法落实，研究问题改为日志中遗漏的描述与预测，不保留因果承诺。”这段已经表达一个可审查的选择，不需要夸大方法。"]},{"id":"repair","title":"错误方案与修订","paragraphs":["错误方案是“因为我会深度学习，所以所有问题都用神经网络”。例如研究者要解释某项制度为何被参与者抵触，只有预测谁抵触的模型不一定能解释意义与过程。修订时先区分预测、解释和规范评价，再选择日志建模、访谈、文本分析或组合方式。另一个常见错误是用多方法掩盖单一方法没做好；两份低质量证据相加，不会自动形成可靠结论。"]},{"id":"tips","title":"经验、取舍与适用边界","paragraphs":["建议使用“如果……则……”写选择理由：如果主要目标是估计可干预因素的效果，而且条件允许随机化，则优先考虑合适的实验设计；如果不能满足条件，说明替代设计及识别假设。这些是思考分支，不是机械决策树。每个分支都要容纳伦理、测量和学科传统。","方法选择结束时，你应当能够解释“为什么这个方法足以回答我的问题”和“为什么它不能回答另一个更大的问题”。如果只能列出优点而无法说限制，通常还没有真正理解设计。把不能支持的结论提前写出，能节省后期为了漂亮结果重写研究目的的冲动。"]}],"exercise":{"materials":"情境：你有一个月时间，能访问公开城市月度交通统计，不能干预交通政策。你想研究新政策的作用。","task":"比较描述性趋势分析与准实验设计的可能性，并写出当前可说的结论。","template":"目标判断：\n最低证据：\n候选A：\n候选B：\n硬门槛：\n最终选择及边界：","answer":"示范答案：可以先描述实施前后趋势，并核对统计口径、季节性与其他政策。若有合适对照城市和足够实施前数据，可探索差分中的差分，但需要论证平行趋势及同期冲击。仅有一个城市两个时点时，不宜宣称政策造成全部变化。当前先完成数据可比性审查，是否采用准实验由这些证据决定。","rubric":["提出至少两个真实可行的候选方案","区分资源门槛与可补偿的权衡","说明选择依赖的证据和不能支持的结论"]},"quiz":{"question":"只能取得政策实施前后各一个统计值，最合理的做法是？","options":["直接称为随机实验","先承认设计只能描述变化，再寻找识别因果所需的额外材料","使用更复杂的软件即可获得因果关系"],"correct":1,"explanation":"统计复杂度不能制造缺失的比较结构。先描述，再检查是否能取得合适的时间序列和对照。"},"references":[{"id":"openstax-research","locator":"阅读研究设计与因果关系部分，练习由问题倒推证据。"},{"id":"strobe","locator":"观察性研究报告条目可帮助检查暴露、结果、偏倚和混杂是否明确；条目不是设计质量评分器。"}],"next":"把今天的判断记进方法选择表，再用后面的具体方法课检查能不能做。","core":true,"chapterId":"c10","stageId":"s4","chineseCount":1959},{"id":"a10-3","title":"定量、定性与混合方法的关系","goal":"区分数字化、解释性分析和混合方法，说明不同路线产生的知识及其评价标准。","scope":"适用于跨学科阅读和选择研究取向；不要求学习者把所有路线都实施一遍。","prerequisites":["a10-1"],"minutes":55,"tags":["通用"],"terms":[{"zh":"定量研究","en":"quantitative research","definition":"以明确测量或形式化变量描述数量关系，并使用与设计相符的数学和统计分析。"},{"zh":"定性研究","en":"qualitative research","definition":"深入研究经验、意义、实践和语境，依据所选传统系统生成和解释材料。"},{"zh":"混合方法","en":"mixed methods","definition":"有计划地在设计、分析或解释中整合定量与定性部分，使二者共同回答研究问题。"}],"sections":[{"id":"concepts","title":"先把方法放到正确层次","paragraphs":["定量与定性并不等于“客观与主观”，也不等于“样本大与样本小”。定量测量依赖研究者选择的定义、工具和模型；定性解释则可以有清楚的取样理由、材料记录、分析过程和反例审查。它们的差别主要在问题、材料表达、推理方式及知识目标，而不是哪一种天然更科学。对不同研究传统采用相同的评分口诀，会错过真正决定质量的条件。","有数字不一定构成定量研究。例如统计一组访谈中某个词出现多少次，可以辅助定性分析，但词频不自动说明重要意义。反过来，问卷中的开放题也不因为提供了文字就变成完整定性研究；研究者仍需说明问题、取样、材料深度与解释路径。混合方法更加要求两部分之间发生实质连接，不能只是文章里同时出现一张统计表和两段引言。"]},{"id":"reasoning","title":"选择背后的证据逻辑","paragraphs":["不同路线对“好证据”的要求既相通又有差别。都需要问题清晰、材料来源可查、论证不过界；但随机化和统计功效不适合直接评价历史文本解释，编码者一致率也不是所有定性范式的必需指标。反思性主题分析强调研究者在意义构建中的作用，某些代码本取向则更注重共同编码规则。评价前先辨认作者采用什么传统以及它承诺了什么。"]},{"id":"workflow","title":"逐步完成方法判断","paragraphs":["把下面每一步写进同一份研究方案，保留未解决的问题。"],"steps":[{"title":"将问题拆成数量与意义","body":"以“学生为何不使用图书馆预约系统”为例，分别写“多少人未使用、哪些特征相关”和“使用者如何理解障碍”。前者可能需要具有明确抽样边界的数据，后者可能需要具体使用经历与语境。两者相关，但答案不可互换。"},{"title":"说明材料能保留什么","body":"记录问卷、日志、访谈或观察分别保留和丢失的信息。日志能记录点击，却通常不知道点击背后的意图；访谈能提供解释，却可能受到回忆和社会期许影响。不要因为材料易获得就忽略它的盲区。"},{"title":"确定取样与分析逻辑","body":"定量路径要说明总体、选择机制、变量和依赖结构；定性路径要说明为什么这些参与者或材料能帮助理解问题，如何形成解释。样本量的理由必须与路径匹配，不能一律套用至少30人或访谈若干人必然饱和。"},{"title":"检查能否互补而非重复","body":"如果数字与文字最终只重复同一结论，问清额外部分是否值得成本。若访谈能解释统计异常或帮助形成量表项目，则整合有明确用途。写出一个如果没有另一部分就无法回答的联合问题。"},{"title":"写出各自的质量要求","body":"为定量部分列测量质量、选择偏差和模型假设；为定性部分列情境厚度、解释过程、反例与反思；为混合部分列连接方式和矛盾处理。清单要服务具体项目，不能作为所有研究的统一打分表。"}]},{"id":"worked","title":"完整例子","paragraphs":["举个例子：某虚构项目记录100次预约，其中30次没有完成。这个比例描述的是所记录会话，不能自动说30%的学生不会操作，因为同一个人可能出现多次。研究者再依据日志类型选择不同经历者访谈，发现“没有房间”与“担心提交后不能取消”是两种不同解释。后者需要通过材料和进一步核验支持，不能凭一句访谈推广到所有人。","一个合格的联合结论可以写：“日志显示未完成集中在确认步骤；访谈材料提示，其中部分经历与取消规则理解有关。这一解释有助于提出界面修改假设，但尚需在新的任务比较中检验。”数字说明模式，解释材料提出机制线索，结论承认二者的证据能力都有限。这里全部是教学构造情境，不是已完成真实调查。"]},{"id":"repair","title":"错误方案与修订","paragraphs":["错误说法：“定性研究没有统计检验，所以不可靠。”可以改成：“应检查其取样理由、材料深度、分析传统、解释与材料的关系以及替代解释。”另一错误是“问卷加一个开放题就是混合方法”。应改写为：只有当开放材料经过有理由的分析，并与定量结果按设计整合、回答联合问题时，才有充分理由采用混合方法标签。"]},{"id":"tips","title":"经验、取舍与适用边界","paragraphs":["阅读陌生学科时，先问作者想提供哪一种知识：总体比例、因果估计、机制理解、意义解释、规范判断还是形式证明。用这一目标选择评价标准，能避免把自己的熟悉方法当作所有人的底线。同时，也不要以范式不同为理由拒绝对来源、推理和结论范围的检查。","对你目前的实证定量主线，学习定性与人文路径的价值是更准确地选择和解释问题，并知道何时该求助，不是强迫自己在同一个小项目中加入访谈。若项目问题本来是设备误差比较，未经论证地添加访谈，可能只会增加招募和伦理负担。"]}],"exercise":{"materials":"三种方案：A统计公开问卷结果；B深入分析八份公开访谈；C先调查再依调查结果选择访谈对象，并制作联合解释表。","task":"分别判断研究取向，并指出不能仅凭材料形式作出的判断。","template":"方案A及依据：\n方案B及依据：\n方案C的整合点：\n还需要核实：","answer":"示范：A可能是定量，但需检查变量和分析；B可能是定性，八份并不自动太少或足够，需看问题和材料深度；C具备解释型顺序混合方法的结构，因为后阶段取样受前阶段结果指导，且解释被联合呈现。三者都要核实公开材料的使用条件和取样边界。","rubric":["没有把定量与定性写成质量等级","你会指出材料形式与研究逻辑的区别","为混合方法找到具体整合位置"]},"quiz":{"question":"下面哪项最能体现混合方法？","options":["统计结果后随意插入一段访谈","根据调查异常选择访谈对象，再综合解释异常","把文本中的字数算出来"],"correct":1,"explanation":"整合体现在有理由的阶段连接和联合解释；单纯同时出现文字与数字不足以支持混合方法标签。"},"references":[{"id":"mixed-methods","locator":"官方资源页Table of Contents中The Nature and Design of Mixed Methods Research，以及Introduction and Background；本次核对介绍与分节入口，具体设计报告PDF作为延伸阅读。"},{"id":"thematic-analysis","locator":"阅读不同主题分析取向的区分，理解质量标准依赖方法传统。"}],"next":"把今天的判断记进方法选择表，再用后面的具体方法课检查能不能做。","core":false,"chapterId":"c10","stageId":"s4","chineseCount":1933},{"id":"a10-4","title":"混合方法怎样整合两类证据","goal":"设计一个有明确连接点的混合方法流程，并用联合展示表处理一致和矛盾结果。","scope":"适合确实需要数量模式与经验解释共同回答的问题；小项目可以选择单一路线，不以混合为默认升级。","prerequisites":["a10-3"],"minutes":55,"tags":["通用"],"terms":[{"zh":"解释型顺序设计","en":"explanatory sequential design","definition":"先取得定量模式，再使用定性材料解释其中的重要结果或异常。"},{"zh":"探索型顺序设计","en":"exploratory sequential design","definition":"先探索概念与经验，再据此形成需要定量检验的工具或关系。"},{"zh":"联合展示","en":"joint display","definition":"把两类结果及其联系放在同一结构中，显式写出共同推断和未解决矛盾。"}],"sections":[{"id":"concepts","title":"先把方法放到正确层次","paragraphs":["混合方法的难点在“混合”本身。你需要回答：两部分为什么都必要，何时连接，哪些单位或概念能够对应，最终联合推断由谁负责。若定量与定性团队各写一半报告，最后只把文件拼起来，读者仍不知道两种材料如何共同回答问题。整合应在设计之初就出现，执行时再依据发现透明调整。","常见安排包括解释型顺序、探索型顺序和并行设计。解释型顺序适合先发现某类结果再深入理解；探索型顺序适合概念尚
