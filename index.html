名和编码，发现部分记录单位不同。附三行匿名示例，想确认应保留原单位并新增转换列是否合适”。","另一个错误是只报告成功、不报告无法复现的结果。应写清失败发生在哪个步骤、影响哪些结论、是否改变进度，以及当前的排查方案。研究沟通的目标是共同判断，不是每周制作没有问题的展示。"]},{"id":"tips","title":"实用技巧与边界","paragraphs":["消息标题可以包含项目、需要动作和日期，例如“测量方案：请确认批次记录方式”。附件名称包含版本，正文不要让导师猜最新文件是哪一份。发出前尝试在一分钟内读完摘要，确认对方无需打开所有附件也能理解主要请求。","会后把口头建议转成具体任务，但不要擅自把模糊讨论记为同意。可写“我理解下一步是……，若理解有误请纠正”，同时准确保留未决定部分。重要伦理、数据权限和投稿安排应按正式制度处理，不能靠一句聊天替代。"]}],"exercise":{"materials":"你已有一份教学分析结果；计划真实试验但尚未确认设备。","task":"写一封短周报，包含产物、阻塞、自己的建议和一个明确请求。","template":"本周目标：\n已完成及证据：\n发现：\n阻塞：\n我的建议：\n需要确认：\n下一步：","answer":"示范：已完成教学配对分析与数据字典，结果可复跑。真实测量仍缺设备量程、分辨率与校准信息；我建议先做设备能力表，再决定误差目标。希望确认由谁提供设备规格和可用时段。确认前先完善记录模板，不把真实试验写成已启动。","rubric":["产物可检查且状态真实","事实与推测分开","请求具体且能回答","未把建议写成他人承诺"]},"quiz":{"question":"导师最容易据此给出具体帮助的是哪种信息？","options":["我最近非常努力但很迷茫","我比较了两种方案，差异与风险如下，请确认某一设计选择","请替我决定全部研究方向"],"correct":1,"explanation":"具体上下文、已有尝试和聚焦判断能够支持有效讨论。"},"references":[{"id":"harvard-writing","locator":"Introductions：Orienting Information、what is at stake、Your thesis；用于检查问题、读者所需背景与中心主张。这篇课对题名、口头表达或计划的应用属于教学迁移。"},{"id":"credit","locator":"借助贡献角色明确协作责任，但具体安排仍由团队协商。"}],"next":"书面周报练清楚后，下一篇会把同一研究转成口头介绍与答问。第九章第四篇可作为一页选题说明的补充练习。","core":true,"chapterId":"c21","stageId":"s7","chineseCount":1938},{"id":"a21-2","title":"三分钟研究介绍、报告与现场答问","goal":"用三分钟讲清问题、做法、证据、贡献与边界，并能处理追问而不背诵整篇论文。","scope":"适用于组会、导师初谈、研究展示和面试；时长与听众背景需要提前确认。","prerequisites":["a18-2","a19-4","a21-1"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"研究叙事","en":"research narrative","definition":"围绕问题、选择、证据和意义组织说明，而非按实际工作日记逐项复述。"},{"zh":"证据图","en":"evidence figure","definition":"直接帮助听众检查关键判断的图，需在短时间内可读。"},{"zh":"追问","en":"follow-up question","definition":"针对假设、方法、证据或贡献的进一步问题，常用于判断作者是否真正理解自己的工作。"}],"sections":[{"id":"concepts","title":"让听众在有限时间内抓住研究逻辑","paragraphs":["三分钟介绍可以围绕五个问题组织：研究什么，为什么值得问，怎样回答，看到了什么，结论能走多远。它与摘要相似，但口头表达需要更短句、更明确的转场和适合听众的术语解释。不要把论文每个小节各说一句，导致听众只听到目录而没有理解问题。","幻灯片不应承载全部讲稿。一个主要问题、一幅关键图和一条结论通常比密集文字更容易理解。显示图时先解释轴、单位和对象，再指出模式，最后给解释边界。听众看图需要时间；手指或指示器标到哪，口头就说明哪，不要同时引入另一项复杂概念。"]},{"id":"reasoning","title":"沟通背后的研究判断","paragraphs":["口头汇报容易因为追求流畅而删除限定。但“教学数据中的结果”和“我在真实实验中发现”是完全不同的研究经历。练习时要让材料身份和本人贡献自然地进入叙述，而不是在最后被问到才补充。承认未知并不削弱一切可信度；错误地装懂通常更危险。","问答不是竞赛式反驳。先识别对方是在确认事实、挑战假设、建议扩展还是质疑结论，再回应对应层次。对于不清楚的问题可复述确认；对于尚未做的分析，说明当前没有答案以及怎样检验，不现场编结果。这样能展示研究判断，而不仅是记忆能力。"]},{"id":"workflow","title":"可执行的操作过程","paragraphs":["准备一页研究地图和一幅主图。用手机计时录音，先不做精美幻灯片；确保内容在三分钟内讲得明白。"],"steps":[{"title":"写二十秒问题开场","body":"用具体对象和困难开始，解释一个必要术语。教学例可说比较平均误差时还要保留同一对象的两次读数关系。"},{"title":"用四十秒解释设计","body":"交代材料身份、独立单位、主要指标和比较方法，不详细念软件菜单或每个参数。"},{"title":"用一分钟展示证据","body":"解释差值图的轴和零线，再说平均差及对象差异。数字只保留听众必须记住的几项，避免快速朗读整张表。"},{"title":"用四十秒说贡献与边界","body":"说明可复核教学流程的价值，同时明确不能证明真实有效性。真实项目则说自己实际完成的部分与待验证事项。"},{"title":"留时间收束并练追问","body":"用一句话重申问题答案，准备三个问题：为什么配对、为什么不删反向对象、下一步真实验证如何设计。"}]},{"id":"worked","title":"完整例子","paragraphs":["三分钟稿的精简核心：“我关注的是如何准确比较两种测量流程，而不让总体均值遮住对象差异。这是教学构造数据：二十个对象各有A、B读数和参考值。我先算每次绝对误差，再在对象内作B减A，负值表示B误差较小。图中平均差为−0.750g，但三个对象反而较大，所以不能说每个对象都改善。我完成的是数据字典、配对分析和可复核报告的练习；它不证明真实流程B有效。下一步若做真实研究，需要先确认测量容差、校准与流程顺序控制。”","面对“为什么不用四十个独立样本”可答：“同一对象提供两种读数，它们有对应关系；把它们当独立单位会丢掉设计结构。这里的比较对象是二十个差值。”面对未知机制则答：“当前设计没有隔离机制，我不能据此断言原因；需要针对具体机制另设比较。”"],"annotations":[{"text":"这是教学构造数据。","role":"身份说明","note":"在介绍设计时明确，不让听众误以为真实研究经历。"},{"text":"三个对象反而较大，所以不能说每个对象都改善。","role":"图形解释","note":"由可见分布限制结论，不仅展示平均数字。"}]},{"id":"repair","title":"常见失误与改写","paragraphs":["错误汇报：“我使用Python、统计、人工智能和数据可视化，取得显著成果。”工具清单没有让人理解问题，也可能添加没有使用的技术。修订为问题、实际操作、关键发现和本人贡献。术语只在帮助听众理解选择时出现。","错误答问：“这个问题以后都会解决，所以现在不重要。”应先承认问题影响哪项结论，再说明当前证据和后续设计。如果质疑确实指出致命缺陷，应调整主张，而不是用研究愿景回避。"]},{"id":"tips","title":"实用技巧与边界","paragraphs":["练习时让一位非同专业的人听完后复述问题和结论，让同专业的人专门质疑方法。两种反馈检查不同能力，不能互相替代。演示稿可准备附加页放详细统计、数据字典和限制，只有被问到时展开。","遇到紧张可以用固定顺序找回路线：问题、材料、做法、证据、边界。不要逐字背稿到一旦中断就无法继续；应熟悉每一段承担的任务。时间被压缩时删次要细节，保留材料身份与关键限定。"]}],"exercise":{"materials":"统一教学案例及差值图；听众只知道基础均值概念。","task":"写九十秒版本，并准备两个方法追问的回答。","template":"问题：\n材料：\n做法：\n发现：\n本人完成：\n边界：\n追问一及回答：\n追问二及回答：","answer":"示范：用二十个构造对象练习比较两流程误差，计算对象内B−A绝对误差差，平均为−0.750g且三对象方向相反。本人完成分析与报告练习，不主张现场有效性。为何配对：同一对象两读数有关联。为何不删三个：它们是结果的一部分，不能因不符预期排除。","rubric":["听众能复述主要问题","只介绍实际做过的工作","图形解释包含单位和方向","未知问题不编造答案"]},"quiz":{"question":"被问到尚未做过的稳健性分析时，怎样回答最合理？","options":["临时编一个通过结果","说明尚未做、它影响什么，以及准备怎样检查","说这与研究无关并跳过"],"correct":1,"explanation":"准确区分已知和待验证，并提出检验路径，能体现研究判断。"},"references":[{"id":"harvard-writing","locator":"Introductions：Orienting Information、what is at stake、Your thesis；用于检查问题、读者所需背景与中心主张。这篇课对题名、口头表达或计划的应用属于教学迁移。"},{"id":"asa-p","locator":"准备有关显著性、效果大小与解释边界的答问。"}],"next":"你会讲清研究之后，还需明确合作中的责任与贡献，避免口头印象替代记录。","core":true,"chapterId":"c21","stageId":"s7","chineseCount":1771},{"id":"a21-3","title":"合作分工、署名、贡献与冲突处理","goal":"建立可追踪的合作分工与贡献记录，理解署名资格和顺序需要按规则协商，并能处理分歧。","scope":"适用于研究团队合作；署名标准、学生权益及争议处理按所属学科、机构和出版渠道的具体制度。","prerequisites":["a03-2","a21-1"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"署名资格","en":"authorship eligibility","definition":"谁应作为作者取决于适用规则与实际贡献和责任，不能仅凭职位或人情确定。"},{"zh":"贡献分类","en":"contributorship","definition":"说明各人在概念、方法、软件、分析、写作等方面做了什么；分类本身不自动决定署名。"},{"zh":"责任可追溯","en":"accountability","definition":"作者能够说明自己负责的工作，并按适用规则承担对整体研究诚信的责任。"}],"sections":[{"id":"concepts","title":"合作开始时就记录责任和贡献","paragraphs":["合作研究涉及任务分工、数据与代码权限、成果归属、署名资格和顺序等不同问题。它们互有关联但不能混为一谈。提供设备或资金可能需要致谢或其他贡献记录，却不必然满足所有渠道的作者标准；负责大量技术执行也应在团队规则下获得准确的贡献承认，不能因为职位低就被忽略。","CRediT提供贡献角色词汇，便于说明概念化、方法、软件、数据管理、分析、验证、可视化、写作、监督和资助等工作。它不是按角色数量计算作者排序的评分表。ICMJE提出的作者标准主要服务医学出版，其他学科可能有不同惯例，需核对机构和目标渠道而非自动套用。"]},{"id":"reasoning","title":"沟通背后的研究判断","paragraphs":["把署名讨论拖到投稿前，容易让早期模糊承诺变成冲突。研究过程中贡献可能变化：有人退出，有人接手关键分析，题目范围改变。更合理的做法是开始时记录预期与原则，在重要里程碑更新实际贡献，投稿前共同确认。记录应帮助协商，而非成为单方宣布排名的工具。","数据和发表权限也需提前明确。企业或合作方允许内部分析，不一定等于允许公开原始数据或发表结果；指导关系存在，也不意味着所有合作者已同意投稿。研究者应将限制写到方案中，避免投入很久后才发现成果无法展示。"]},{"id":"workflow","title":"可执行的操作过程","paragraphs":["建立一个简明合作记录表，字段包括任务、负责人、证据文件、权限、预期交付和确认状态。涉及实际权利时依据正式制度处理。"],"steps":[{"title":"核对适用规则","body":"查学校、课题组和拟投稿渠道的作者与数据政策；记录来源和日期。规则冲突或不清楚时向相应负责部门求助，不靠网络口诀决定。"},{"title":"写预期分工","body":"列谁负责问题、数据、代码、分析、图表和写作，说明权限和可交付成果。把建议、暂定与已确认安排分别标记。"},{"title":"持续记录实际贡献","body":"每次重要版本保存作者、修改内容和证据链接；任务移交时更新责任，避免最终只能凭记忆争论谁做了什么。"},{"title":"定期讨论署名与材料","body":"在方案、分析和投稿节点核对贡献及署名预期。顺序如何确定需团队协商并符合学科规则，不能按字数或工时机械计算。"},{"title":"有争议时保留事实并升级","body":"先围绕记录和规则沟通，无法解决时使用机构提供的导师、项目负责人或研究诚信渠道；不要通过报复性删文件或擅自投稿解决。"}]},{"id":"worked","title":"完整例子","paragraphs":["原创教学合作记录：“成员甲负责数据字典和清理脚本，证据为带版本的脚本与修改记录；成员乙负责研究设计和主要分析，证据为方案及分析备忘录；成员丙参与解释与实质性修改，证据为批注稿。数据提供方只授权去标识汇总结果公开，原始记录暂不公开。作者资格与顺序将在核对机构和目标期刊规则后由团队共同确认。”","这份记录没有按头衔直接指定第一作者，也没有把列入某个CRediT角色等同自动获得署名。若甲后来接手主要分析，应更新实际记录，再讨论相应变化。所有示范人物均为虚构角色，不代表用户已建立的合作安排。"],"annotations":[]},{"id":"repair","title":"常见失误与改写","paragraphs":["错误承诺：“只要帮忙跑代码就一定第二作者。”实际作者标准、贡献程度和责任要求尚未确定，不能随意保证。可修订为“计划由你负责分析实现与验证；我们将记录实际贡献，并按机构及投稿规则在里程碑讨论作者资格和顺序”。","另一错误是把生成式AI列为作者，借此转移错误责任。当前常见出版伦理立场要求人类作者对内容负责，AI工具使用应按渠道规则披露。即使工具完成大量文本，引用、分析和事实核查仍不能无人承担。"]},{"id":"tips","title":"实用技巧与边界","paragraphs":["把“负责某任务”和“有权批准公开”分成不同字段。能修改数据的人未必能授权发表，能指导方法的人也未必代表企业数据所有方。具体权限关系清楚，才能减少最后阶段的误会。","合作中的礼貌与明确并不冲突。可以温和地询问署名原则、退出处理和资料保存方式。不要把提出这些问题视为不信任；它们是让合作可持续的基础。遇到权力不对等时，保留客观记录并使用正式支持渠道。"]}],"exercise":{"materials":"虚构团队：甲清理数据并写脚本，乙设计研究，丙提供设备但未参与解释与写作。","task":"写一份贡献与待确认事项记录，不能直接断定作者排序。","template":"任务与负责人：\n贡献证据：\n数据和发表权限：\n适用规则：\n尚需共同确认：","answer":"示范：记录甲的数据管理、软件和验证，乙的概念与方法贡献，丙的设备资源支持；对应版本和文件保留。核对机构及期刊作者条件，确认各人后续写作、审阅和责任安排，再共同决定署名或致谢及排序。设备提供不自动决定作者资格。","rubric":["实际贡献有证据","作者资格与角色分类分清","数据权限明确或标未确认","没有凭职位或人情直接决定排序"]},"quiz":{"question":"某人被列为CRediT“资源”贡献者，是否自动应列作者？","options":["是，任何角色都自动获得署名","否，仍需满足适用作者资格与责任要求","否，资源贡献永远不能成为作者"],"correct":1,"explanation":"角色说明做了什么，署名资格需要结合规则与全部贡献；不能自动肯定或绝对排除。"},"references":[{"id":"credit","locator":"阅读贡献角色定义和其与署名资格的关系。"},{"id":"icmje-authorship","locator":"Who Is an Author：四项署名条件、共同确定作者与责任；Non-Author Contributors区分致谢。医学出版建议不自动约束全部学科。"},{"id":"cope-ai","locator":"了解AI工具不能承担作者责任的伦理立场。"}],"next":"分工与责任明确后，下一篇会把同行反馈转成可追踪的修改和研究复盘。","core":false,"chapterId":"c21","stageId":"s7","chineseCount":1758},{"id":"a21-4","title":"同行反馈、修改清单与研究复盘","goal":"将模糊反馈拆成具体研究或写作问题，确定修改优先级，并记录接受、部分接受或不接受的理由。","scope":"适用于组会、导师批注、同伴阅读和内部预审；正式审稿回复还需遵循下一章的投稿流程。","prerequisites":["a20-4","a21-1"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"反馈分类","en":"feedback triage","definition":"区分事实错误、方法问题、论证缺口、表达问题和范围建议，以便安排处理顺序。"},{"zh":"修改追踪","en":"revision tracking","definition":"记录意见、判断、行动、证据和状态，使修订不依赖记忆。"},{"zh":"复盘","en":"retrospective","definition":"回看某次工作中的决定与结果，提炼下一轮能改变的做法，而非只评价好坏。"}],"sections":[{"id":"concepts","title":"反馈需要被翻译成可执行任务","paragraphs":["别人说“创新不够”“逻辑不清”“图不好看”，可能指不同问题。创新不够可能是贡献重复，也可能是已有贡献未表达清楚；逻辑不清可能是段落顺序，也可能是证据不能支持结论。先澄清意见指向的具体判断，再决定补实验、改论证还是改文字，能避免把所有反馈都当成润色。","反馈者也可能误读或提出不适合当前范围的建议。认真对待不等于全部照做。作者应先用最佳解释理解意见，核对它是否指出真实风险，再说明接受、部分接受或暂不接受的理由。不同意见相互冲突时，回到研究问题、证据和适用规则，而不是只听最有权威或最符合自己想法的一位。"]},{"id":"reasoning","title":"沟通背后的研究判断","paragraphs":["优先级取决于对结论的影响。一个分母错误可能推翻主要结果，应先于排版；一个因果夸大需要立即修正，即使无法在期限内补新研究。扩展到另一个领域的建议可能有价值，却不一定属于当前稿件必要工作。区分必须修复和未来研究，可以保护项目范围。","复盘应针对可改变过程。写“我不够聪明”不能指导下一轮；写“在看结果后才决定主要指标，导致报告混乱；下一轮先保存分析计划”则可执行。成功也要复盘：某次流程有效是因为预先明确输入和输出，还是只是材料恰好简单，决定它能否迁移。"]},{"id":"workflow","title":"可执行的操作过程","paragraphs":["把所有意见集中到一张表，保留原话和来源，再新增自己的解释、行动与验证列。先完成分类，不边读边随意改稿。"],"steps":[{"title":"保存意见原文","body":"记录来自谁、何时、针对哪个版本和位置。口头意见先复述确认，避免把自己的理解冒充对方原意。"},{"title":"翻译成具体问题","body":"将“结果不清楚”转成可检查项，例如没有说明B−A方向或图中n的含义；不确定时提出聚焦澄清。"},{"title":"按影响排序","body":"先处理事实、权限、方法和主要论证问题，再处理表达和格式；对范围扩展标明成本与必要性。"},{"title":"选择行动并验证","body":"写接受程度、具体修改、对应文件和完成证据。补一段文字后检查是否真正解决意见，而不是只增加字数。"},{"title":"记录复盘与下一轮规则","body":"选一到两项可复用经验，例如每次出图自动附变量定义；下轮实际应用并观察是否减少同类问题。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学反馈为“你只说B更好，没有讲清楚例外”。修改表记录：位置为讨论第一段；问题是平均结论被读成所有对象改善；优先级高，因为影响结论范围；行动是在结果补16较小、1相同、3较大并保留对象点图，在讨论改写为平均与对象差异并存；验证是请同伴复述后不再说所有对象改善。","第二条反馈“应该立刻加深度学习”被部分接受为未来方向讨论，但当前教学问题只需透明比较，新增模型没有明确研究必要性。回复可写：“我们补充了为何采用简单比较的理由；复杂模型将改变问题和评价范围，本稿不加入。”这种处理既认真回应，也保留研究判断。"],"annotations":[]},{"id":"repair","title":"常见失误与改写","paragraphs":["错误处理是收到“创新不够”后在摘要增加“首次”和“突破性”。如果缺的是实质差异，形容词不会解决；如果缺的是表达，应通过最接近工作对照和证据清晰定位。先诊断再行动。","另一个错误是把不喜欢的反馈全部归为评审不懂。即使意见最终不采纳，也应问为什么文本导致这种理解。若多位读者独立误解同一点，通常值得修改说明；作者意图清楚不等于文章已经清楚。"]},{"id":"tips","title":"实用技巧与边界","paragraphs":["修改表中的“已完成”应有可观察标准。例如“图注现已说明n为对象数且单位为g”，比“图改好了”更容易核对。对于复杂意见，可以分成多个子任务，但不要把一个核心问题拆成十个表面动作来制造进展。","复盘只选择少量可执行改进。一次列二十项习惯容易全部遗忘；先把最常犯的一项加入固定流程，再观察效果。保留旧稿可以帮助看见自己的论证如何变得更准确，也能作为申请中解释学习过程的材料。"]}],"exercise":{"materials":"两条反馈：“结论太强”；“再加一个热门算法”。当前项目为教学配对分析。","task":"分别写诊断、行动与验证，说明为何两条意见处理方式不同。","template":"意见：\n真实问题：\n对主结论的影响：\n接受程度：\n具体行动：\n验证证据：","answer":"示范：结论太强影响真实性，接受并加入构造数据限制、删除真实有效性断言，核查摘要和结论一致。热门算法建议暂不加入，因为当前任务是配对分析训练；解释选择简单方法的理由，并将扩展条件列入未来研究。验证看新增内容是否解决误读，而非模型数量。","rubric":["意见被转成具体问题","优先级依据结论影响","不采纳也有理由","完成状态有可检查证据"]},"quiz":{"question":"收到“创新不够”后最应先做什么？","options":["增加首次和突破性等词","确认是实质贡献不足还是定位表达不清","立刻换成最复杂模型"],"correct":1,"explanation":"不同原因需要不同修复，表面强化和复杂化不能替代诊断。"},"references":[{"id":"harvard-counterargument","locator":"Counterargument：How to address counterarguments，说明如何公允呈现异议、承认合理部分并修订论证；这里把这个建议迁移到相应研究表达任务。"},{"id":"read-paper","locator":"用批判性阅读问题反查自己的稿件。"}],"next":"内部修改后，下一章会学如何判断投稿渠道并处理正式评审。","core":false,"chapterId":"c21","stageId":"s7","chineseCount":1656},{"id":"a22-1","title":"期刊、会议、读者、范围与投稿匹配","goal":"依据读者、研究问题、文章类型和实际要求判断投稿匹配，并区分渠道声誉指标与单篇证据质量。","scope":"适用于期刊和学术会议的初步选择；这篇课不提供实时排名、录用概率或保证发表的渠道。","prerequisites":["a19-4"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"范围匹配","en":"scope fit","definition":"稿件的问题、对象、方法和文章类型与渠道面向读者及征稿范围相符。"},{"zh":"编辑初审","en":"editorial screening","definition":"编辑判断范围、基本质量和政策合规等，可能在外审前退稿。"},{"zh":"出版模式","en":"publishing model","definition":"订阅、开放获取或其他传播与收费安排，不直接决定论文真实性或质量。"}],"sections":[{"id":"concepts","title":"先找合适读者，再看渠道指标","paragraphs":["期刊和会议服务不同学术共同体，重要程度依学科而变。在某些计算领域，顶级会议是核心交流渠道；在人文、医学或其他领域，期刊、专著或不同类型成果可能占更大比重。不能用一个固定排序跨所有专业判断发表价值。先看目标读者会问什么，再看自己的研究能提供什么证据。","范围、文章类型、篇幅、材料要求、评审方式、费用和时间安排都影响匹配。影响因子、分区、引用量等指标可能帮助了解传播环境，却不能替代对具体论文或渠道政策的核查。开放获取收费也不自动等于不可靠，免费发表同样不自动代表严格评审。","期刊通常按编辑与评审流程接收稿件，会议可同时承担报告交流或论文出版，具体制度须查官方说明。预印本是公开传播版本，不因上线自动通过同行评审；学位论文由培养机构评审，其身份也不等同于期刊论文。"]},{"id":"reasoning","title":"为什么这样判断","paragraphs":["只追逐指标可能导致稿件被送给不关心其问题的读者，增加不必要轮转。相反，只找最快接收也可能牺牲可信度或进入不透明渠道。合理选择是把研究成熟度、读者需求、资源和时间限制一起比较，并与有经验的导师讨论。评审时间存在不确定性，不能把一个网页平均值当作个人稿件的保证。","判断渠道可靠性应核对真实网站、出版主体、编辑信息、近期文章、同行评审说明、费用和联系方式。可疑的保证录用、异常催促、伪造指标和身份不明需要进一步核实，但也不能凭一封宣传邮件就给整个渠道下结论。避免只通过陌生邀稿链接操作，应自行进入已确认的官方入口。"]},{"id":"workflow","title":"逐步操作","paragraphs":["建立三到五个候选渠道表，但每项都要有实际信息依据。当前教学报告未构成原创研究，不应为了完成练习直接投稿。"],"steps":[{"title":"写稿件定位","body":"用两句说明问题、方法、主要贡献和当前成熟度。教学练习写教学，复现写复现，不能为匹配某刊临时改变成果性质。"},{"title":"阅读范围和文章类型","body":"到官方作者指南核对是否接受目标类型，如原始研究、方法、综述或简报；记录日期和具体要求。"},{"title":"读近期相关论文","body":"选最近实际刊出的相近文章，看问题深度、证据、图表和讨论方式。目的在判断读者与标准，不是模仿包装。"},{"title":"核对政策和成本","body":"检查数据、代码、伦理、署名、预印本、AI、版权、费用与减免信息。未知项标待核实，不用第三方帖子替代官方规则。"},{"title":"比较并制定顺序","body":"按范围、读者、证据成熟度、费用和时间形成候选排序，写理由。投稿前确认作者共识和不可同时投稿等适用规则。"}]},{"id":"worked","title":"完成的教学示范","paragraphs":["虚构教学比较表中，渠道甲面向测量方法并接受原始研究，渠道乙面向教学实践，渠道丙面向综合AI应用。对本教材的构造数据报告，甲需要的真实性能或方法贡献尚未具备，丙也没有匹配的AI研究内容；乙可能在主题上更接近，但仍需教育研究问题、证据和该刊实际类型要求。完成判断为：“当前产物先作为研究训练作品集，不把它包装成原创测量论文；待真实研究形成后重新按问题与证据筛选渠道。”","这份结论不以“找到一个愿意收稿的地方”为成功，而是识别当前成果与出版要求的距离。三个渠道均为虚构比较角色，不能作为真实投稿名单。"],"annotations":[]},{"id":"repair","title":"错误做法怎样修正","paragraphs":["容易踩的坑：“这个期刊分区高，所以只要投它就能提高申请竞争力。”稿件可能根本不符合范围，录用也受质量和评审决定影响。修订为先判断研究价值与匹配，再把渠道作为成果传播的一项选择。申请中也应展示本人贡献和证据，而不只报刊名。","另一错误是收到保证一周录用的邮件就上传未公开稿件。应核对官方主体、评审规则与费用，必要时请导师和图书馆帮助判断。不能因时间压力把可疑承诺当成研究完成捷径。"]},{"id":"tips","title":"实践什么时候有用，什么时候不够","paragraphs":["候选表保留“支持匹配的近期文章”和“可能不匹配的原因”两列。这样能防止只收集有利信息。若被编辑初审退稿，先看理由是范围、类型还是质量，不把所有退稿都解释成研究无价值或编辑不公。","投稿计划需要留出修改和转投时间，但不预设一定按时录用。大半年申请准备可以使用准确标示的研究报告、预印本或筹备稿展示能力，具体是否适合及如何填写应按申请要求处理；不能把未接收稿件列为已发表。"]}],"exercise":{"materials":"一份只完成教学构造分析的报告，以及面向原创测量方法的候选渠道。","task":"写匹配判断并列出投稿前至少三项仍需完成的核查。","template":"稿件性质：\n目标读者：\n当前匹配与缺口：\n政策核查：\n下一步：","answer":"示范：当前为教学分析练习，没有真实性能验证或新方法贡献，与原创测量研究要求不充分匹配。需核实文章类型、证据要求、数据与伦理政策；先推进真实研究和导师反馈，再确定是否投稿。不能仅因分区或快速处理承诺选择。","rubric":["稿件性质描述真实","匹配依据包含读者和内容","政策来自可核实入口","没有把处理时间或录用当保证"]},"quiz":{"question":"选择投稿渠道时哪项最应先判断？","options":["名字听起来是否高级","目标读者、范围与文章类型是否适合","谁承诺最快接收"],"correct":1,"explanation":"范围与读者决定稿件是否有意义地进入该共同体；指标和速度不能替代内容匹配。"},"references":[{"id":"icmje","locator":"General Principles与Manuscript Sections：按研究类型与作者指南组织、检查投稿稿件。重复发表与评审程序须另查目标渠道；这篇课回复模板为教学建议。"},{"id":"read-paper","locator":"通过近期实际论文理解领域的证据和报告方式。"}],"next":"判断匹配后，下一篇学习如何准备投稿材料和记录正式流程。第一章第三篇提供不同学术成果类型的查阅说明。","core":true,"chapterId":"c22","stageId":"s7","chineseCount":1811},{"id":"a22-2","title":"投稿材料、声明、版本与流程","goal":"形成完整且事实一致的投稿材料包，核对声明与版本，理解提交后的状态而不擅自重复投递。","scope":"适用于已有可投稿成果的作者；教学练习不自动需要提交，所有作者和相关权利方应按规则确认。","prerequisites":["a20-3","a21-3","a22-1"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"投稿信","en":"cover letter","definition":"向编辑说明稿件问题、贡献、范围匹配与必要声明的简短信件，不是夸张宣传。"},{"zh":"匿名审稿","en":"anonymized review","definition":"按渠道规则隐藏部分身份信息的评审安排，具体匿名程度和处理方法不同。"},{"zh":"提交版本","en":"submitted version","definition":"实际上传并进入流程的文件集合，应可追溯到正文、图表、附件和声明。"}],"sections":[{"id":"concepts","title":"投稿是一次正式的版本与责任确认","paragraphs":["投稿通常包含正文、图表、补充材料、标题页、作者信息、投稿信和若干声明，具体项目由渠道决定。系统表单与正文中的题名、摘要、作者和资金信息必须一致。作者顺序、通讯方式和贡献声明不是最后一刻随便填的行政项，而是团队责任的正式记录。","匿名审稿可能要求去除作者姓名、机构和某些可识别信息，但不能因此删除理解研究所需的伦理与材料说明。应遵循渠道给出的匿名方法，如暂用匿名仓库或单独标题页。预印本是否允许、怎样引用自己既有工作、数据链接如何处理，都需要按实际规则核查。"]},{"id":"reasoning","title":"为什么这样判断","paragraphs":["提交后编辑和评审依据的是上传版本，不是你电脑上不断更新的最新版。若发现错误，应按系统和编辑流程处理，不能悄悄改变公开材料而让版本对应失效。记录提交日期、稿号、文件哈希或稳定版本名、作者确认和后续通信，有助于避免遗漏和误解。","声明必须真实。没有资金支持就按要求写无相关资助，不能填一个看起来正式的项目；有利益关系不代表研究一定不可靠，但隐瞒会妨碍读者判断。AI使用、伦理、数据授权和先前发表情况同样要准确，不应把表单勾选视为无意义步骤。"]},{"id":"workflow","title":"逐步操作","paragraphs":["建立投稿核对清单，先从官方作者指南逐项提取要求，再准备文件。以下演示仅为材料编排训练，不执行对外投稿。"],"steps":[{"title":"冻结主稿和结果","body":"核对题名、摘要、图表、统计数值、引文及附件都来自同一版分析。保存只读提交副本，不在它上面继续日常编辑。"},{"title":"整理作者确认","body":"按团队和机构规则确认作者名单、顺序、贡献、通讯作者和稿件内容；记录尚未确认事项，不擅自代表他人同意。"},{"title":"填写必要声明","body":"逐条核实利益、资金、伦理、数据、代码、AI及先前传播情况。写事实和适用范围，不能复制别人的批准编号。"},{"title":"准备投稿信与匿名材料","body":"投稿信简述问题、贡献及为何适合读者；匿名处理按渠道要求执行，检查文件属性和附件是否暴露身份。"},{"title":"检查上传预览与保存凭证","body":"上传前后检查系统生成PDF、图清晰度、公式与字符；保存稿号和提交确认。后续状态按系统与编辑通知解释。"}]},{"id":"worked","title":"完成的教学示范","paragraphs":["虚构投稿信教学成稿：“编辑您好：我们提交一项关于测量流程误差评价的原始研究，研究问题是特定条件下两流程的对象内误差差异。稿件提供预设比较、对象级结果和可复核分析材料，与贵刊所述测量评价读者相符。作者已按适用规则审阅稿件并确认提交；有关数据权限、资金与利益关系的实际情况见声明部分。”这段仅示范结构，不能直接用于本书构造数据，也不能在作者未确认时保留确认句。","实际投稿包索引应列主稿版本、图1来源、补充表、数据说明、作者确认日期与系统稿号。若当前只是练习，完成状态写“投稿包演练”，不写“已投稿”。"],"annotations":[]},{"id":"repair","title":"错误做法怎样修正","paragraphs":["容易踩的坑：“尊敬的编辑，这是世界首创且必将改变行业的突破，请尽快接收。”如果没有相应证据，夸张词不仅无助，还可能使编辑怀疑判断力。修订为具体问题、贡献、证据与读者匹配。投稿信无需重复整篇摘要。","另一错误是同一稿件同时投给多个不允许并行投稿的期刊，希望提高速度。必须核对适用规则并遵守；转投前处理撤稿或拒稿状态，保留确认。会议和期刊扩展稿也需要核对重叠发表及先前版本披露要求。"]},{"id":"tips","title":"实践什么时候有用，什么时候不够","paragraphs":["把提交包放在单独目录，名称包含日期与版本；日常工作目录继续编辑时，避免覆盖提交副本。收到修回通知后建立新版本并保留对照，便于逐条回复审稿意见。","状态名称在不同系统中含义不完全相同。with editor不保证送外审，under review也不保证接收。不要根据系统措辞推测评审态度或承诺发表日期；只有正式决定通知才能确认相应结果。"]}],"exercise":{"materials":"一份完成的研究稿件清单，但作者确认和数据公开权限仍未知。","task":"写提交前阻塞清单和一段不虚构确认状态的内部说明。","template":"已准备文件：\n尚未确认：\n负责核实者：\n提交条件：\n版本保存方式：","answer":"示范：主稿、图表和补充材料已准备；作者名单及内容确认、原始数据公开权限尚未完成。由通讯负责人联系团队和数据授权方，得到确认并按政策完善声明后再提交。当前状态为投稿准备，不称已投稿或已获同意。","rubric":["文件属于同一冻结版本","作者与权限状态真实","声明不复制虚构信息","提交状态有凭证依据"]},"quiz":{"question":"电脑中的结果图更新了，但已经提交的稿件仍用旧图，应该怎么做？","options":["悄悄替换公开文件即可","评估影响并按编辑流程说明和更新版本","忽略，因为评审可能看不出来"],"correct":1,"explanation":"版本与结论对应影响审查，重要错误需透明处理，不能让提交稿和材料无记录地漂移。"},"references":[{"id":"icmje","locator":"General Principles与Manuscript Sections：按研究类型与作者指南组织、检查投稿稿件。重复发表与评审程序须另查目标渠道；这篇课回复模板为教学建议。"},{"id":"cope-ai","locator":"按实际使用和渠道政策核对AI披露。"},{"id":"credit","locator":"准确填写贡献角色。"}],"next":"提交后可能收到修改意见，下一篇练习逐条回应与修订证明。","core":false,"chapterId":"c22","stageId":"s7","chineseCount":1668},{"id":"a22-3","title":"审稿意见分类与逐条回复","goal":"把审稿意见转成具体修改，写出礼貌、可检查的逐条回复，并能有依据地解释不采纳的请求。","scope":"适用于正式修回及内部模拟评审；编辑决定和渠道格式优先于通用示范。","prerequisites":["a21-1","a22-1"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"逐条回复","en":"point-by-point response","definition":"保留意见结构，针对每项说明理解、行动、结果和修改位置。"},{"zh":"实质修改","en":"substantive revision","definition":"改变方法、证据、分析或论证内容的修订，与仅调整措辞或格式不同。"},{"zh":"范围协商","en":"scope negotiation","definition":"说明某项请求是否属于当前问题所必需，给理由及可行替代，而非直接拒绝。"}],"sections":[{"id":"concepts","title":"回复信需要让评审看见问题怎样被解决","paragraphs":["回复信的对象是具体意见，不是评审者的人格。每条回复通常包括感谢或确认理解、采取的行动、修改后内容摘要和可定位位置。若补做分析，报告实际结果及它如何影响结论；若结果不支持原解释，就应修订解释，不能只在回复中承认而正文保留强结论。","评审意见可能包含事实澄清、方法质疑、证据不足、表达问题、建议扩展或误读。先分类，再确定优先级和工作量。编辑可能指出哪些是必要修改；不同评审要求冲突时，应透明说明并依据问题和证据提出处理方式。回复不是把所有要求机械堆到稿件中。","先理解流程：投稿后可能经历编辑初审、外部评审和编辑决定；修回是修改请求，不等于已经接收。收到正式意见时保存决定信与稿件版本，把每条意见抄入回复表，再区分必须修复、需要澄清和可讨论的扩展。"]},{"id":"reasoning","title":"为什么这样判断","paragraphs":["“已修改”没有告诉对方改了什么，也无法检查是否解决核心问题。提供页码、段落、图表编号或修订后的短文本，能减少来回沟通。位置要对应最终修回稿；排版变化后页码可能改变，需要最后再核对。","不采纳也可以严谨。若要求增加超出当前范围的大型实验，作者可以解释为什么它改变研究问题、目前证据支持的范围是什么，并相应收窄结论或增加局限。仅说时间不够通常不足以回答科学质疑；如果该实验是主结论成立的必要条件，就必须补证据或放弃该主张。"]},{"id":"workflow","title":"逐步操作","paragraphs":["先把意见原文放入回复表，分配编号与负责人。完成修改后再写最终回复，不提前声称已补分析。"],"steps":[{"title":"逐条理解问题","body":"把长意见拆成独立要求，保留原文和编号。确认它挑战的是数据、方法还是表达，必要时通过允许渠道向编辑澄清。"},{"title":"建立行动矩阵","body":"列意见、影响、行动、负责人、证据和状态。优先处理可能改变主要结论的项目，再处理格式。"},{"title":"实际修改并复核","body":"补分析、改图或重写段落后，检查摘要、结果、讨论和结论是否同步。新结果不能只留在回复信中。"},{"title":"写可检查回复","body":"简述行动与结果，提供准确位置和必要短引文；未采纳时解释依据，并说明采取的替代修订。"},{"title":"做最终一致性检查","body":"逐条对照意见，确认没有遗漏、空承诺或旧页码；保存干净稿、修订稿与回复信的相同版本。"}]},{"id":"worked","title":"完成的教学示范","paragraphs":["教学意见：“作者称B对所有对象更好，但图中似乎有反向对象，请解释。”完成回复：“感谢指出范围表述不准确。我们重新核对二十个构造对象，B绝对误差在十六个对象较小、一个相同、三个较大。结果段现已报告该分布，讨论和结论均将‘所有对象更好’改为‘平均绝对误差较小，同时存在对象差异’；图1保留全部对象。我们也在摘要明确数据为教学构造，不能证明真实流程有效。”","第二条意见：“请增加深度学习模型。”若当前问题只是误差报告练习，可回复：“本稿目标是透明展示配对比较，新增模型不回答当前方法示范问题。我们在方法选择段补充了采用简单分析的理由，并收窄标题与结论，避免暗示算法贡献。”若实际稿件声称算法优越，这一理由则不够，需要重新评估必要基线。"],"annotations":[{"text":"我们重新核对二十个构造对象。","role":"实际行动","note":"先核查事实，不只改一个形容词。"},{"text":"结果段现已报告该分布，讨论和结论均……","role":"修改范围","note":"说明同一问题在全文多个位置同步修正。"},{"text":"新增模型不回答当前方法示范问题。","role":"不采纳理由","note":"理由来自研究目标，且需要通过收窄主张落实。"}]},{"id":"repair","title":"错误做法怎样修正","paragraphs":["错误回复：“评审没有理解我们的意思，我们当然知道不是所有对象。”即使作者心里知道，文本仍可能误导。修订为承认表述问题，给出具体改动与证据。语气专业不意味着无条件同意，而是围绕可检查事实讨论。","另一错误是回复“已补稳健性分析”但实际只在讨论增加一句“结果稳健”。稳健性需要明确替代设定、计算结果和解释；如果没有做，应写未做及原因，并调整结论，不能用文字承诺冒充分析。"]},{"id":"tips","title":"实践什么时候有用，什么时候不够","paragraphs":["把回复信当作第二篇短论证：每条需要问题、行动、证据和结论。对简单错字可以简短回复，对重大方法问题需要足够细节。无论篇幅多少，都应让评审无需猜测你到底改了什么。","修回期限紧张时，先判断必要工作是否能完成，再按渠道规则及时申请延期，而不是到最后一天提交不完整承诺。与合作者分工后由一人统合口径，避免不同回复对同一研究作出矛盾解释。"]}],"exercise":{"materials":"意见：“样本数写成四十，但每对象有两种读数，分析单位不清楚。”","task":"写一条完整回复并列出需要同步修改的正文位置。","template":"对意见的理解：\n核查结果：\n采取行动：\n修订内容：\n位置：\n对结论的影响：","answer":"示范：感谢指出。数据有二十个对象、每对象A/B两读数，主要分析基于二十个配对差。我们将摘要、方法、图注中的四十独立样本改为二十对象，并复核配对t自由度为19。若原分析已按配对执行，数值不变；若原计算也错，必须重算并同步所有结果。","rubric":["回应了原意见全部要点","行动与实际修改一致","提供可定位位置","明确修改是否影响主要结果"]},"quiz":{"question":"无法完成评审要求的实验，而它是主要因果结论成立的必要证据，应该怎么办？","options":["只说时间有限并保留结论","补证据或收窄、撤回该主张","把结论放到补充材料避免注意"],"correct":1,"explanation":"科学必要性不能被时间理由消除，证据不足时必须改变主张。"},"references":[{"id":"harvard-counterargument","locator":"Counterargument：How to address counterarguments，说明如何公允呈现异议、承认合理部分并修订论证；这里把这个建议迁移到相应研究表达任务。"},{"id":"icmje","locator":"General Principles与Manuscript Sections：按研究类型与作者指南组织、检查投稿稿件。重复发表与评审程序须另查目标渠道；这篇课回复模板为教学建议。"}],"next":"下一篇区分拒稿、修回、接收和公开版本，保证成果状态记录准确。第二十一章第四篇与第二十二章第二篇分别提供反馈复盘和正式投稿流程的补充查阅。","core":true,"chapterId":"c22","stageId":"s7","chineseCount":1870},{"id":"a22-4","title":"拒稿、修回、预印本、更正与成果状态","goal":"准确记录稿件和公开版本的状态，理解拒稿、修回、接收与更正，并在申请中如实表达成果。","scope":"适用于研究发表与作品集管理；具体流程由出版渠道和机构规定，不承诺评审时长或结果。","prerequisites":["a01-3","a22-2","a22-3"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"预印本","en":"preprint","definition":"在正式同行评议发表前或过程中公开的稿件版本，其具体政策和学科接受度不同。"},{"zh":"接收","en":"accepted","definition":"出版方正式通知稿件通过接收决定，与投稿、外审和修回状态不同。"},{"zh":"更正","en":"correction","definition":"公开修复已发表材料中的错误；处理方式取决于错误性质、影响和渠道政策。"}],"sections":[{"id":"concepts","title":"成果状态必须有对应证据","paragraphs":["一项工作可以依次处于构思、筹备、分析中、撰写中、已投稿、修回中、已接收和已发表，也可能在任一阶段停止。预印本是传播版本状态，不等同同行评议接收；DOI是标识工具，很多不同类型对象都可以获得，不能仅凭DOI证明研究已经通过评审。","拒稿也有不同原因：范围不合、编辑优先级、证据不足、方法问题或评审判断。读完决定信后应区分哪些建议仍值得修、哪些与该渠道偏好有关。修回邀请表示愿意继续考虑，不是保证接收；即使意见积极，也要完成必要修改和后续评估。"]},{"id":"reasoning","title":"为什么这样判断","paragraphs":["准确状态对合作、申请和简历都很重要。把已投稿写成已发表，会让读者误判外部审查程度；把教学报告写成在研期刊论文，也会混淆成果性质。研究能力可以用可靠的未发表作品展示，不需要虚增状态。透明标注反而便于评审判断本人贡献和成熟度。","发现错误后应先评估它影响哪些数据、结论和版本，再与合作者及编辑按流程处理。小排版错误与改变主结论的分析错误需要不同处理。更正并不自动说明不端，撤稿也有不同成因；判断时应依据正式说明，而不是仅靠标签推断人的动机。"]},{"id":"workflow","title":"逐步操作","paragraphs":["为每项成果建立状态卡，记录题名、作者、版本、材料位置、当前状态和证据日期。每次正式通知后更新，而非凭预期提前改状态。"],"steps":[{"title":"核对当前证据","body":"查看提交确认、修回通知、接收信或正式出版页。只有已有文件支持的状态才能写入；口头乐观评价不是接收。"},{"title":"记录版本关系","body":"将预印本、投稿版、修回版和出版版关联，说明题名或作者是否变化。引用时优先采用与所述内容对应的准确版本。"},{"title":"处理拒稿与转投","body":"分析拒稿理由，完成必要修订，再核对新渠道政策；处理原投稿状态和重复投稿限制，不直接并行上传同稿。"},{"title":"发现错误时评估影响","body":"记录错误位置、原因、影响的结果和建议修复；及时与负责人、合作者和编辑沟通，不静默替换关键结论。"},{"title":"同步作品集与申请材料","body":"按最新真实状态更新CV、研究清单和链接，保留核对日期。申请系统有固定类别时按其说明填写并作必要解释。"}]},{"id":"worked","title":"完成的教学示范","paragraphs":["虚构教学状态卡：“成果：测量误差配对分析教学报告；作者：学习者本人；状态：完成的教学练习，未投稿；材料：构造数据、脚本、报告；贡献：整理变量与执行分析；外部审查：尚未进行正式评审。”若另一项真实稿件已经提交，则另写“已投稿，提交日期与稿号已保存”，不能因为希望年底接收就写即将发表。","收到拒稿后的一条行动记录可为：“编辑指出范围不匹配，评审另发现数据单位说明不足。先修正单位和图注，再寻找读者更合适的渠道；当前状态仍为未接收稿件。”这将渠道选择与科学问题分开处理。"],"annotations":[]},{"id":"repair","title":"错误做法怎样修正","paragraphs":["错误简历：“论文一篇，发表于某期刊”，实际只收到系统投稿确认。修订为“稿件已投稿”并按申请要求放在相应类别，或暂不把它列为发表成果。若只有教学练习，列为研究训练或项目作品，不伪装期刊成果。","错误处理是发现计算错误后只更新代码仓库，不告知已经阅读旧结论的合作方或出版方。应按影响和正式流程处理相关版本，让读者知道哪项结果改变。静默修改会使旧引用和新材料失去对应。"]},{"id":"tips","title":"实践什么时候有用，什么时候不够","paragraphs":["成果清单中同时保存“学术状态”和“本人贡献”两栏。一个已发表大团队成果中本人只做少量工作，与一个未发表但独立完成的严谨项目，展示的是不同能力；两者都应准确说明，不能只靠发表标签代替贡献判断。","处理拒稿时给自己一点时间再回复，避免情绪化邮件。之后把意见拆成可行动项，选择修订、转投或停止。停止一个证据不足或资源不适合的方向也可能是合理研究决定，不必为了保住原题目不断降低标准。"]}],"exercise":{"materials":"三种情况：已有教学报告；真实稿件收到投稿确认；另一稿收到正式接收信但未上线。","task":"为三种情况分别写准确成果状态，并指出可用证据。","template":"成果一状态与证据：\n成果二状态与证据：\n成果三状态与证据：\n不得使用的标签：","answer":"示范：一为完成的教学练习，以报告和材料为证据，未投稿；二为已投稿，以提交确认及稿号为证据，未接收；三为已接收，以正式接收信为证据，尚未正式出版。不得把前两项写已发表，也不因第三项未上线而否认其接收状态。","rubric":["每种状态有对应证据","预印本与同行评议分清","本人贡献与成果状态分别记录","错误与版本变化透明处理"]},"quiz":{"question":"一份带DOI的预印本能否直接列为同行评议发表论文？","options":["可以，DOI代表已审稿","不可以，需按真实版本和评议状态标注","不可以引用任何预印本"],"correct":1,"explanation":"DOI是标识而非质量或评议认证；预印本可以按政策引用，但须准确说明其状态。"},"references":[{"id":"icmje-corrections","locator":"Corrections and Version Control：勘误、存档旧版与引用最新版本。本页不替代各渠道的预印本、投稿和接收政策。"},{"id":"cope-ai","locator":"结合作者责任理解公开内容仍需由人核查与负责。"}],"next":"进入最后阶段，把真实完成的学习和研究产物整理成可展示的作品集。","core":false,"chapterId":"c22","stageId":"s7","chineseCount":1674},{"id":"a23-1","title":"从练习走向自己的实证定量小研究","goal":"把已掌握的配对比较流程迁移到来源清楚、范围可完成的个人实证定量研究，并建立启动与停止标准。","scope":"适合无完整科研经历、每周可投入八至十二小时的学习者；真实资料权限与指导资源须逐项确认。","prerequisites":["a09-2","a16-4","a19-4"],"minutes":75,"tags":["实证定量","申请"],"terms":[{"zh":"可行性先导","en":"feasibility pilot","definition":"用有限投入检查材料、测量和流程能否运转，不把小规模结果直接当最终效果证明。"},{"zh":"研究迁移","en":"transfer of research practice","definition":"将训练中学到的提问、设计和核查方法用于新问题，而不是替换标题后沿用模拟结果。"},{"zh":"项目闸门","en":"project gate","definition":"事先设定继续、缩小或停止项目所需满足的条件。"}],"sections":[{"id":"concepts","title":"什么改变才算从教学练习走向个人研究","paragraphs":["本书的二十对象数据已经人为设定，因此计算正确只能说明你能执行分析，不能说明任何真实测量流程有效。自己的研究必须重新建立问题、材料来源和证据联系。真实研究也可以使用公开二手数据：关键是你亲自核查来源、提出清楚问题、作出分析决定并承担解释责任，而不要求每个人都购买设备或招募参加者。","起点可以是一个范围很小的复核问题。例如某开放数据提供两种测量方案和独立参考值，你检查其误差差异是否随对象范围改变。先确认数据真的含这些字段、使用许可允许分析，以及原论文有没有已经回答这一问题。复核或边界检查可能具有训练价值，能否构成学术贡献还取决于已有工作和证据强度。"]},{"id":"reasoning","title":"小而完整比宽而悬空更可执行","paragraphs":["资源有限时，最有用的缩小方法是减少问题的维度：固定一类对象、一项主要指标和一个主要比较。不能通过删去不利对象、挑选显著指标来缩小。前者减少任务范围，后者改变证据以迎合结论。一个完整的有限研究至少保留问题、设计、材料处理、分析、局限和可复核记录。","数据先行与问题先行各有风险。先看数据有助于发现可做的题，却容易把偶然模式包装成预设假设；先定问题能保持方向，却可能要求拿不到的材料。实际可以循环一轮：用元数据和少量探索检查可行性，明确哪些想法由探索产生，再冻结主要问题。探索不是错误，隐瞒探索才会使结论强度失真。"]},{"id":"workflow","title":"用两周先导决定是否正式启动","paragraphs":["准备你自己的问题地图、资源清单和文献矩阵。以下是教学安排，不是所有学科通用的审批制度。涉及人体、个人信息、受限数据或机构设备时，先完成相应权限与伦理判断。"],"steps":[{"title":"列三个候选问题","body":"每题用一句话写对象、比较和结果，再附预计可取得的资料；将“可能有资源”与“已经确认可以使用”分列，不能混写。"},{"title":"建立来源卡","body":"记录数据提供者、链接或档案位置、版本、许可、变量、缺失情况和原研究目的；无法说明来源的表格暂不进入候选。"},{"title":"比较最接近工作","body":"为每题找直接相关研究，写已做什么、尚不能回答什么；如果完全重复，说明做复现训练，或选择有根据的边界问题。"},{"title":"做一次小规模试运行","body":"尝试读取资料、构造一个主要指标并画一张图，记录卡住的环节和耗时；真实小样本不用于承诺最终效果。"},{"title":"写主要方案与备选","body":"固定分析单位、纳入规则、主要估计量、假设检查和停止条件；如果配对标识不存在，不能临时把任意行拼成一对。"},{"title":"安排周产物与复核","body":"按每周八至十二小时分配阅读、分析和写作。两周后评估来源、可复核性与问题价值；未过闸门就缩题或换题，保留失败原因。"}]},{"id":"worked","title":"把一个过大的想法改成可检验项目","paragraphs":["以下是虚构筹备示范，不表示已经取得任何真实数据。初始想法是“证明自动化测量全面优于人工”。盘点发现没有确认设备、没有招募许可，也没有可定义的“全面”。于是候选改为“在一个许可允许的公开配对测量数据集中，估计两流程绝对误差的平均差，并检查对象量级对差异的影响”。后一题仍须以实际数据存在、参考值可靠和已有研究核查为启动条件。","先导说明填写为：分析单位是具有完整参考值及两流程记录的对象；主要结果为对象内绝对误差差；探索结果为误差差与参考值的关系；先不作因果解释。第一周确认数据字段和来源，第二周重现原作者一个描述性表格。若无法对应对象编号，停止配对方案；若原工作已完整报告边界分析，转为明确标示的复现项目，重新评估研究意义。","真正迁移的成品是一页带条件的项目说明和一段已经运行的读取代码。它没有提前填入本书的负零点七五克，也没有把预期效果写成发现。项目随后应报告实际产生的结果，包括没有明显差异或与预期相反的情况。"],"annotations":[{"text":"本项目拟估计开放数据中两流程的对象内绝对误差差。","role":"问题与估计量","note":"“拟”表示筹备状态；对象内说明配对单位，尚无真实结果。"},{"text":"是否继续取决于许可、参考值质量及配对标识的核查。","role":"可行性边界","note":"把资源的不确定性转化为可检查的启动条件。"}]},{"id":"repair","title":"不要把培训数据换一个标题当成果","paragraphs":["错误版本：“我独立发现流程乙显著提高测量精度，已形成创新成果。”如果依据只是教材数据，这同时误述了资料来源、个人发现和贡献。可以改成：“我完成了教学配对数据的清理、比较及报告练习；下一步拟在来源明确的数据中检验一个有限问题。”这句话对能力已有证据，对研究发现仍保持空白。","另一个错误是承诺四周内“收集大量数据、发顶刊、申请成功”。应改为可控交付：“完成许可核查、先导分析、主要方案与一个可复核报告；是否投稿在质量评估后决定。”外部接收或录取结果不属于个人可以保证的里程碑。"]},{"id":"tips","title":"把未知写在计划里，而不是藏起来","paragraphs":["第一次真实项目建议保留决策日志：我为何选这个指标，何时见过结果，何处修改了计划，修改会影响什么解释。它既帮助报告透明，也让你在面试时能说清研究判断。不要为了展示独立性拒绝指导；记录求助问题和自己落实的修改，反而能证明你会学习。","若你尚未有可使用的数据，把当前状态写为“选题与可行性核查中”，先完成检索和方案。不应为赶申请期限而跳过必要权限。约半年是安排工作的约束，不是降低证据标准的理由。"]}],"exercise":{"materials":"三个筹备候选：甲需尚未确认的昂贵设备；乙有可访问数据但无使用许可说明；丙有许可、对象编号和参考值，但最接近文献尚未读。","task":"选择最适合先做可行性检查的候选，写三项启动条件、两周产物和一个停止条件。","template":"候选：\n当前证据：\n启动条件：\n第一周产物：\n第二周产物：\n停止或转向条件：","answer":"优先检查丙。启动条件为许可确实覆盖拟议分析、对象配对与参考值可信、最接近研究核查后能够说明项目定位。第一周产物是来源卡、变量字典和最接近工作对照；第二周产物是读取与质量检查记录以及一张描述图。若对象编号无法连接两流程，停止配对问题。丙尚未成为已批准或已完成研究，乙可另行询问许可，甲暂作资源不确定备选。","rubric":["没有把可访问等同于获准使用。","候选选择依据具体资源证据。","两周产物可检查且不预设好结果。","停止条件与研究设计直接相关。"]},"quiz":{"question":"重算本书教学数据后，最合适的申请表述是什么？","options":["独立完成真实实验并发现新机制。","完成配对分析训练，能够解释数据来源、计算和局限。","将模拟结果替换为自己的项目标题后作为预实验。"],"correct":1,"explanation":"教学练习能够证明部分方法能力，但没有生成真实实验发现；改标题不改变材料性质。"},"references":[{"id":"osf-preregistration","locator":"阅读预注册对计划、探索及后续变更的区分，用于记录研究决定。"},{"id":"ori-misconduct","locator":"Definition of Research Misconduct：fabrication、falsification、plagiarism及诚实错误的区别；美国PHS定义不等于所有机构的完整记录管理要求。"}],"next":"把实际项目的每一项产物整理进下一篇的交付包；申请准备同时继续，不必等全部研究结束。","core":true,"chapterId":"c23","stageId":"s8","chineseCount":2323},{"id":"a23-2","title":"整理文献、数据、分析和报告交付包","goal":"整理一个别人能找到依据、理解权限并重现主要结果的研究交付包。","scope":"适用于定量小研究和复现项目；敏感或受限资料采用说明与受控访问，不默认公开。","prerequisites":["a03-1","a16-4","a23-1"],"minutes":70,"tags":["通用","实证定量","申请"],"terms":[{"zh":"交付包","en":"research package","definition":"报告、资料说明、分析文件和运行入口组成的可检查集合。"},{"zh":"数据来源链","en":"data provenance","definition":"记录资料由谁产生、从何取得、经过哪些处理和版本变化。"},{"zh":"访问条件","en":"access conditions","definition":"说明他人是否可以取得材料，以及许可、隐私或机构限制。"}],"sections":[{"id":"concepts","title":"作品集不是一个塞满附件的文件夹","paragraphs":["研究交付包首先服务检查：读者看到报告中的结论后，应该能找到对应表格、分析步骤和数据来源。文件数量多不代表可复核。一个清楚的入口说明、少量有用目录和明确版本，通常比几十份名为“最终版”的文件更可靠。对于申请，可分享包还要适应评阅时间，入口先让人理解问题、主要发现、本人工作和边界。","公开、可访问与可复用是三个不同要求。数据可以出于隐私原因不公开，但仍提供数据字典、获取程序和分析代码；公开链接也可能没有允许再分发的许可。FAIR 强调可发现、可访问、可互操作和可复用，不等于把所有原始资料无限制上传。你需要分别说明文件内容、使用条件和复核方式。"]},{"id":"reasoning","title":"从每个主张反向寻找材料","paragraphs":["交付包的目录应从报告主张反推。如果结果表写“分析二十个对象”，就要有样本筛选记录；如果图中有一条回归线，就要有变量构造、模型和绘图设置；如果经历陈述写“本人完成分析”，就要有能解释的脚本或操作记录。备份可以完整保留工作历史，面向读者的包则提供一个稳定、明确的版本。","可复核不等于点击一个程序就一定成功。环境、软件版本、随机性和外部数据都会影响运行。真正有用的做法是交代入口、输入、依赖、预期输出和已知限制，并亲自从干净副本走一遍。只在自己电脑上打开过最后一张图，不能证明整个流程可重新生成。"]},{"id":"workflow","title":"整理一份别人拿到就能开始检查的包","paragraphs":["准备已经完成的研究报告、原始来源记录、表格或代码和贡献说明。先做本地审核，再决定分享哪些文件。"],"steps":[{"title":"确定交付版本","body":"为本次包设版本号和日期，写报告状态。工作草稿可以继续修改，但分享包里的图表、报告和结果文件必须属于同一版本。"},{"title":"分开原始、派生与成品","body":"设置原始资料、清理资料、分析、输出和文档等清楚目录；原始文件只读保存。派生表列出来源和生成步骤，不手工覆盖源文件。"},{"title":"写入口说明","body":"在说明文档中依次写研究问题、材料性质、目录地图、运行步骤、预期结果、限制、许可和本人贡献。使用项目相对路径，避免写死私人电脑盘符。"},{"title":"为每个结果建立指针","body":"给报告表一、图一对应具体输出文件和生成命令；表格用户记录工作表、公式范围和刷新顺序，并提供数值核对点。"},{"title":"检查可分享性","body":"逐项检查个人信息、机构机密、第三方原文和许可；不能分享的材料用访问说明替代，不把去掉姓名当作完成匿名化。"},{"title":"做一次冷启动复核","body":"复制到新目录，按照说明重新生成主要结果；记录所用环境与失败修复，再请一位不了解目录的人只看入口找到关键材料。"}]},{"id":"worked","title":"一个教学配对分析包怎样写入口","paragraphs":["教学包入口可以写成以下完整文本：“本包用于练习二十个教学模拟对象的配对测量误差分析，不能作为真实实验成果。先阅读 data-dictionary 中的对象编号、参考值和两流程读数定义；运行 analyze.py 生成结果汇总及图。主要核对值为流程甲平均绝对误差三点七五克、乙三点零零克，乙减甲的平均差为负零点七五零克。数据为教学构造，不涉及真实招募。代码说明列出依赖与运行环境。报告正文与本版本结果一致。”实际文件名应以你的项目目录为准。","若是受限资料，入口改为：“原始数据未随包发布，原因是使用协议限制再分发。资料申请条件见来源说明。包内提供变量字典、清理流程、分析代码及不含个人记录的汇总；合成示例仅验证程序接口，不复现真实效应。”这里不能宣称外部读者可以用合成数据得到与真实数据相同的研究结论。","再建立一条结果映射：“报告表一→结果汇总文件→分析脚本中的配对差汇总→清理表的对象编号、甲误差、乙误差→原始读数。”读者沿链条反向检查，能发现单位、筛选和版本是否一致。"],"annotations":[{"text":"数据为教学构造，不涉及真实招募。","role":"材料状态","note":"防止下载者将示范文件当成真实研究；不能伪造伦理批准。"},{"text":"原始数据未随包发布，原因是使用协议限制再分发。","role":"访问说明","note":"明确缺失材料和原因，随后提供允许范围内的复核路径。"}]},{"id":"repair","title":"常见的交付失败如何修复","paragraphs":["错误做法是压缩整个下载目录，其中包括付费论文全文、聊天记录、临时表和个人信息。修复方式是先建立文件清单：逐项写用途、来源、版本、是否可分享。文献库保留书目信息和必要链接；未经许可不能因为研究用途就向所有人再分发全文。","错误说明：“运行即可，结果见图。”可以改成：“在指定环境安装依赖后，从项目根目录运行分析入口；预期输出一个汇总表与两张图。先核对有效对象数，再核对主要均值差。若资料路径不同，按配置文件更改。”说明必须由自己实际跑通过，不能凭印象写命令。"]},{"id":"tips","title":"留出两条阅读路径","paragraphs":["为申请评阅者准备两分钟入口：研究问题、主要结论、本人贡献和报告位置。为深入检查者准备完整方法、代码、字典和来源链。两条路径使用相同事实，只是展开程度不同。封面不堆技术工具清单，要让读者知道工具解决了什么问题。","分享链接并不自动完成长期保存。保存一个稳定版本与本地备份，记录何时发给谁及版本。需要更新时说明变化，避免评阅者看到不断改写的结论。如果项目仍在进行，入口应直写“在研”，不要把未完成输出列为已有附件。"]}],"exercise":{"materials":"现有文件：原始读数表、手工删除三行后的结果表、脚本、最终报告、两份不同数字的图一，以及含姓名的联系名单。","task":"写出可分享包的目录和三个阻断交付的问题，再给一段入口说明。","template":"入口：\n可分享目录：\n需先修复的问题：\n复核顺序：\n访问限制：","answer":"目录包含说明文档、经许可的原始数据、清理规则、分析脚本、输出与报告；联系名单不进入分享包。先核查删除三行是否有预定与合理依据，统一图一和报告的版本，检查所有数据的使用与披露条件。入口写“先读来源及字典，再按分析入口生成表图，核对有效对象数和主要差异；本包状态为研究草稿”。未经解释的删行和数字冲突应修复后再分享。","rubric":["原始资料与派生结果分开。","报告数字能追溯到生成步骤。","对受限资料给出明确处理。","入口包含可执行顺序和核对点。"]},"quiz":{"question":"原始数据禁止再分发时，哪种交付方式合理？","options":["删除姓名后直接公开全部记录。","隐瞒缺失原始数据，声称完全可复现。","说明限制，提供获准的字典、代码、汇总和申请访问路径。"],"correct":2,"explanation":"限制需透明说明；去姓名未必消除识别风险，也不改变合同许可。允许范围内的复核材料仍有价值。"},"references":[{"id":"fair","locator":"阅读 FAIR 原则对可访问与可复用的要求，区分访问条件与无限制公开。"},{"id":"osf-preregistration","locator":"阅读研究计划及相关文件组织说明，用于保留时间与版本证据。"}],"next":"交付包建立后，下一篇会把其中的证据转写为准确的个人研究经历。","core":true,"chapterId":"c23","stageId":"s8","chineseCount":2216},{"id":"a23-3","title":"研究经历中怎样写清自己的实际贡献","goal":"把项目事实写成可核查的个人贡献陈述，并准确区分训练、独立工作、合作工作和成果状态。","scope":"用于作品集、学术简历、动机陈述和面试；示例不代表读者已经具备这些经历。","prerequisites":["a23-1","a23-2"],"minutes":65,"tags":["通用","申请","写作"],"terms":[{"zh":"贡献陈述","en":"contribution statement","definition":"明确说明本人在具体研究步骤中的实际行动、判断和责任。"},{"zh":"成果状态","en":"output status","definition":"描述训练、筹备、在研、草稿、投稿、接收或发表等可核实阶段。"},{"zh":"可核查证据","en":"verifiable evidence","definition":"你会支持经历表述的材料，如文件版本、分析日志、报告和合作者确认。"}],"sections":[{"id":"concepts","title":"项目有成果，不等于全部成果都是你做的","paragraphs":["“参与研究”没有说明你做了什么；“独立完成全部研究”则可能夸大。贡献应具体到行动与判断：你设计了哪部分，处理了哪些材料，选择或检查了什么方法，发现问题后怎样调整，最终留下什么证据。写清边界并不会削弱经历，它能让评阅者判断你真正可以独立承担什么。","CRediT 提供概念化、方法、软件、验证、数据整理、写作等贡献角色，适合整理分工，但角色标签不自动决定作者资格或排序。所属机构、学科和出版渠道的署名规则仍须核对。申请中的个人表述也不应把“参与讨论”改写成“主导理论创新”。"]},{"id":"reasoning","title":"让能力判断从事实中长出来","paragraphs":["研究经历常见的空话是“培养了创新能力和科研素养”。读者无法判断这些能力何时表现出来。更强的写法是给一个具体决定：发现同一对象被当成两个独立样本后，重构配对差并复核全部结果。这让方法理解、问题识别与执行能力从事实中显现，无须大量自我赞扬。","动词和成果状态要同时准确。“提出”意味着你形成了想法，“实现”意味着你把既定方案做成可运行内容，“验证”意味着你做了明确检查。使用教程代码并进行结果解释，可以写“使用并核查”，不能直接写“开发新算法”。论文只有提交回执时是已投稿，有正式接收通知才是已接收；在写草稿不能列为已发表。"]},{"id":"workflow","title":"从项目记录提炼一段有证据的经历","paragraphs":["拿出研究日志、文件版本和分工记录。以下操作先做事实盘点，再做语言压缩，避免先写漂亮句子后寻找证明。"],"steps":[{"title":"建立事实清单","body":"逐项写项目名称、时间、身份、资料性质、研究状态和合作人员；不记得的时间先核查，不凭感觉填精确月份。"},{"title":"逐环节分配贡献","body":"按问题、设计、材料、分析、解释、写作列出本人、导师和合作者的工作；共同决定写共同，不强行分成独占功劳。"},{"title":"找一个关键判断","body":"从日志选一次你能讲清原因的决定，例如选配对分析、调整不可靠指标或保留反例。写问题、选择、依据和影响。"},{"title":"关联支持材料","body":"为每项强表述附对应报告段落、提交记录或代码版本；证据不宜公开时说明可在允许范围核验，不能泄露合作机密。"},{"title":"写两个长度版本","body":"先写一百五十字完整段落，再压成两条简历要点。保留材料状态、本人动作和产出，删去没有证据的评价词。"},{"title":"让相关人员检查边界","body":"合作经历请知情者核对角色描述；修正误解后留存版本。申请每次更新时同步检查草稿、投稿和接收状态。"}]},{"id":"worked","title":"同一段训练经历怎样写得准确而有内容","paragraphs":["以下是完成本书练习后才可采用的举个例子：“在配对测量分析训练中，我整理了二十个教学模拟对象的数据字典，使用表格和 Python 计算对象内误差差，并核对两种实现的主要结果。分析中我明确区分对象数与读数数，保留流程乙误差更大的对象，解释均值差及其不确定性。最终形成可运行分析文件和一份标明模拟来源的报告。本项为方法训练，未产生真实实验成果。”句子有足够具体的行动，也没有把模拟结果包装为发现。","对于一个虚构的合作项目，原始事实是导师确定问题、同伴提供获准数据、你完成清理与图表、共同讨论解释。成品可以写：“在团队确定的研究问题下，我负责数据字典、清理记录及主要图表，并与合作者复核对象配对和缺失处理；报告解释由团队共同完成。”如果确实发现了一个清理错误，可再写处理过程，但不能虚构百分比或影响规模。","简历版则保留两点：“完成教学配对分析及双工具结果核对；整理数据字典、分析记录和完整训练报告。”研究段落用于解释判断，简历要点用于快速定位，不应在压缩后丢掉“教学”二字。"],"annotations":[{"text":"本项为方法训练，未产生真实实验成果。","role":"状态限定","note":"将学习产出与真实研究发现分开；训练仍可展示方法能力。"},{"text":"报告解释由团队共同完成。","role":"合作边界","note":"不将团队成果全部归给自己，也不抹去自己的清理和图表责任。"}]},{"id":"repair","title":"把夸张动词改成可回答追问的动作","paragraphs":["容易踩的坑：“独立研发高精度系统，在国际领先研究中取得突破。”如果实际是按教程运行脚本，这些词都缺少依据。改为：“复现教程的配对分析流程，核对数据字典与输出，能够说明分析单位及模型假设。”评阅者追问时，你可以展示文件和解释选择。","容易踩的坑：“发表论文一篇（正在准备投稿）。”改为独立栏目“研究报告草稿”，写真实标题、本人角色及截至日期的状态。预印本、投稿稿和正式发表应分别标示；有 DOI 不自动意味着经过同行评审。未获同意的合作标题或机密数据也不要自行披露。"]},{"id":"tips","title":"用行动证明潜力，也保留学习空间","paragraphs":["没有正式论文时，可以展示一份完成度高的研究报告、可复核分析和对局限的理解。它们能提供能力证据，但不同项目是否接受、怎样评估这些材料，需要依官方要求判断。不要为了填满简历而拆成很多貌似独立的项目，同一作品的多个版本应说明关系。","记录失败很有价值，前提是说明你如何判断和改进。比如“初始指标受尺度影响，我在指导下调整评价并报告前后差异”，比“所有步骤一次成功”更有信息。不能把所有建议都说成自己想出，也不必把获得指导解释为缺乏能力。"]}],"exercise":{"materials":"事实：题目由导师提出；你整理一个获准数据表，发现对象编号重复并核对修复，使用现有脚本画图；同伴解释结果；报告为草稿，无投稿。","task":"写两条简历要点和一句状态声明，明确哪些部分不能归为本人独立贡献。","template":"研究名称与身份：\n要点一：\n要点二：\n状态：\n合作边界：","answer":"要点一：“负责数据整理与质量核查，识别重复对象编号并依据来源记录修复。”要点二：“使用既有分析脚本生成图表，保留清理日志和结果核对记录。”状态：“合作研究报告草稿，尚未投稿。”边界：“题目由导师提出，结果解释主要由同伴承担；本人不主张独立提出题目或开发分析算法。”若修复需由数据提供者确认，应写经其核对后修复。","rubric":["动作与提供事实一一对应。","没有把使用脚本写成算法开发。","成果状态与实际进展一致。","合作分工清楚且没有抹去本人贡献。"]},"quiz":{"question":"完成一篇尚未提交的合作草稿，可以怎样写？","options":["第一作者已发表论文。","合作研究报告草稿，说明本人负责的数据整理与分析部分。","已被期刊认可的研究成果。"],"correct":1,"explanation":"草稿可如实列示，但作者排序需与合作方确认，投稿和接收更不能提前声称。"},"references":[{"id":"credit","locator":"阅读各项贡献角色定义，用于区分方法、软件、验证、整理和写作责任。"},{"id":"icmje-authorship","locator":"Who Is an Author：四项署名条件、共同确定作者与责任；Non-Author Contributors区分致谢。医学出版建议不自动约束全部学科。"}],"next":"下一篇用这些事实和交付材料进行作品集自评，然后转化为不同项目的申请材料。","core":true,"chapterId":"c23","stageId":"s8","chineseCount":2183},{"id":"a23-4","title":"研究作品集自评与外部反馈","goal":"用证据和外部反馈判断作品集的成熟度，形成可执行修改清单，而不是把打卡数当作竞争力。","scope":"用于个人小研究、复现项目和研究训练成果；本表不预测录取概率或替代导师评审。","prerequisites":["a23-2","a23-3"],"minutes":65,"tags":["通用","申请"],"terms":[{"zh":"评价量规","en":"rubric","definition":"把质量要求拆成能够观察和判断的维度，并说明达到要求的证据。"},{"zh":"关键缺陷","en":"critical flaw","definition":"会破坏研究解释或诚信的缺口，如材料来源不明、分析单位错误或贡献夸大。"},{"zh":"反馈闭环","en":"feedback loop","definition":"从具体意见到决定、修改、验证和再次检查的完整过程。"}],"sections":[{"id":"concepts","title":"把完成度、研究质量和申请结果分开","paragraphs":["完成一百篇阅读，是学习记录；交出可检查的分析和报告，是作品完成度；问题重要、设计合理、证据可信，是研究质量；获得录取又受匹配、推荐、名额和项目评价等影响。四者有关，但不能互相替代。自评的目的，是找到下一步最值得修复的地方，而不是给自己算一个“名校成功率”。","作品集需要呈现一个人如何研究。即使结论是没有明显差异，只要设计、分析和解释可靠，也可能提供有用能力证据。相反，显著结果、漂亮封面和流畅英文不能弥补错误的分析单位。评价时先看能否相信，再看能否理解，最后看如何压缩与展示。"]},{"id":"reasoning","title":"关键缺陷不能被其他高分抵消","paragraphs":["可以按问题、文献、设计、证据、分析、表达、复核和贡献八个维度逐项判断，但不要机械求平均。假如出处不明，其他七项再漂亮也不能直接交付；假如结论夸大因果，语言润色不会修复推断。用“已具证据、需修订、关键缺口”三个状态，并为每项写文件指针，更容易转成行动。","外部反馈需要选对任务。熟悉方法的人检查设计与分析，熟悉主题的人检查问题和已有工作，陌生读者检查表达。一个人没看懂引言，不等于方法错误；统计建议来自不熟悉配对结构的人，也需要结合证据判断。意见应受到尊重，但是否采纳要给理由，而不是按身份无条件接受。"]},{"id":"workflow","title":"做一次九十分钟的作品集审查","paragraphs":["准备一个稳定版本、简短自评表和明确反馈请求。时间为教学建议，可依作品规模调整。"],"steps":[{"title":"先做诚信和来源检查","body":"核对数据许可、引用真实性、本人贡献及成果状态；任何含糊处先修正，确保教学材料和真实研究有醒目标识。"},{"title":"按八个维度写证据","body":"每维度只写最强一项证据及一项不足，例如“分析：脚本可运行；不足：缺少异常值敏感性检查”。不能只填“优秀”。"},{"title":"定位三个优先问题","body":"按是否改变结论、是否阻碍复核、是否影响理解排序。先改分析单位或来源，随后改逻辑，最后处理版式。"},{"title":"向外部读者发具体任务","body":"请求其检查一到两个问题并标注位置，例如“请判断我的主要估计量是否回答研究问题”。附必要材料，约定可投入的时间。"},{"title":"将意见转成修改记录","body":"记录原意见、理解、采纳或不采纳理由、修改位置和验证结果。无法立刻解决时缩小主张或说明限制，不能只换词掩盖。"},{"title":"用新版本回查","body":"重新运行受影响分析，检查摘要、图表、结论和经历陈述一起更新；保留前后版本，确认问题真正解决后才标记完成。"}]},{"id":"worked","title":"一个作品包怎样从“读完了”变为“可检查”","paragraphs":["虚构自评案例：学习者已读完主修课，报告写了“乙全面优于甲”，分析使用二十对象的教学数据，却把四十次读数当成独立样本。文件能打开，图表也很美观。自评应标记三个关键缺口：材料状态被误述，分析单位错误，结论超出构造数据。这些问题不能被完成六十课的记录抵消。","修改顺序为：首先在标题页、方法和结论标明教学模拟；其次按对象内差重新分析，确认对象数为二十；再次把结论改为“在本构造数据中乙的平均绝对误差较低，此结果只展示配对分析流程”。报告保留三例乙更差和一例相等，不因结果方向删除对象。最后重新生成图表、摘要与结果段。","给外部读者的请求是：“请检查报告第二节是否清楚说明配对单位，第三节的数字是否可由所附文件重现，以及结论是否仍暗示真实成效。”反馈表的成品记录为：“读者指出结论仍用‘验证有效’，已改为‘演示计算’，核对摘要与图注同样修正；接受，因为构造材料不能验证真实流程。”这是一条完成的反馈闭环。"],"annotations":[{"text":"这些问题不能被完成六十课的记录抵消。","role":"评价标准","note":"把学习记录与研究质量分开，避免以数量覆盖关键缺陷。"},{"text":"请检查报告第二节是否清楚说明配对单位。","role":"具体求助","note":"给读者明确位置和判断任务，便于获得可执行意见。"}]},{"id":"repair","title":"别把自评变成自我宣传或自我否定","paragraphs":["容易踩的坑：“没有发表，所以一切都没价值。”可以改成：“目前作品能够展示资料整理和分析能力，尚未证明独立提出有价值问题；下一步通过最接近工作比较和外部讨论改进定位。”这既承认不足，也准确保留已有证据。","另一种容易踩的坑：“自评分九十分，说明能够录取。”量规没有经过招生预测验证，也没有包含不同项目的实际竞争条件。应改成：“来源与计算已检查，问题价值仍需主题专家反馈；申请适配需另查项目要求。”评分用于学习决策，不应伪装成招生判断。"]},{"id":"tips","title":"每轮只追最影响可信度的改进","paragraphs":["反馈过多时建立停车区，把暂时不影响主要结论的建议留到后面；但若意见揭示权限或诚信问题，应立即处理。每轮最多选几项高优先级问题，有助于形成真正完成的改进，避免不停换排版却不改研究逻辑。","可以请读者只花十分钟回答三个问题：你认为我研究什么、最可信的证据是什么、最不放心的环节是什么。答案若与作者意图不一致，先检查文稿表达，再解释给对方听。需要靠现场不断补充才能看懂的作品，通常还不适合独立评阅。"]}],"exercise":{"materials":"反馈四条：甲认为字体太小；乙发现报告未写数据许可；丙指出同一对象的重复读数被当成独立样本；丁建议摘要增加“突破性”。","task":"给出处理优先级、每条决定及检查方式，写一项完成标准。","template":"优先问题：\n意见／决定／理由／修改位置：\n验证方法：\n本轮完成标准：","answer":"先核查许可并纠正分析单位，这两项影响能否使用与解释证据；重跑分析后同步改报告和摘要。字体问题随后修复并检查可读性。“突破性”没有贡献证据，暂不采纳，保留具体发现描述。本轮完成标准是材料使用条件清楚、对象层级分析可重现、全部数字一致且主张不过界，不是仅将四条意见标为已读。","rubric":["先处理真实性、权限和推断问题。","不盲目采纳夸张措辞。","每项修改都有可检查结果。","没有将量规当录取预测。"]},"quiz":{"question":"自评表里分析、表达得分很高，但数据来源不明，应该怎样处理？","options":["平均分够高即可提交。","补一个漂亮来源名称即可。","先核查来源和使用条件，必要时更换材料或限制成果表述。"],"correct":2,"explanation":"来源是关键条件，不可由其他维度高分抵消，也不能虚构。核查后才知道能否继续使用和分享。"},"references":[{"id":"harvard-organizing","locator":"Tips for Organizing Your Essay：Strategy 1把论点拆成段落，Strategy 3从成稿建立反向提纲；用于检查这篇课结构与修改。"},{"id":"ori-misconduct","locator":"Definition of Research Misconduct：fabrication、falsification、plagiarism及诚实错误的区别；美国PHS定义不等于所有机构的完整记录管理要求。"}],"next":"把已核查的作品包、贡献说明和不足清单用于第二十四章的研究计划、项目匹配和面试准备。","core":true,"chapterId":"c23","stageId":"s8","chineseCount":2127},{"id":"a24-1","title":"研究计划的结构、问题与可行性","goal":"根据目标项目要求写出问题明确、与已有工作相连、方法和资源可行的研究计划，并区分已知与拟开展内容。","scope":"适用于要求研究计划的 PhD 申请；不是所有项目都要求同一种文书，篇幅与格式以具体课程官方要求为准。","prerequisites":["a08-3","a09-2","a23-4"],"minutes":75,"tags":["申请","写作","通用"],"terms":[{"zh":"研究计划","en":"research proposal","definition":"解释拟研究的问题、意义、已有工作、方法与可行性，并说明预期贡献及不确定性的文书。"},{"zh":"写作样本","en":"written work or writing sample","definition":"已经写成的学术作品，用来评价论证和写作能力，不等同于未来研究计划。"},{"zh":"预期贡献","en":"anticipated contribution","definition":"如果研究得以完成，希望增加的知识；属于有依据的目标，不是已经证实的成果。"}],"sections":[{"id":"concepts","title":"先确认你被要求交哪一种文书","paragraphs":["研究计划回答“准备研究什么、为什么值得做、怎样做”；动机陈述回答“为什么申请、已有准备是什么、为什么匹配”；写作样本展示一份已写成的作品。三个功能可以关联，不能互相代替。部分项目要求详细计划，另一些要求研究兴趣说明或在入学后确定课题。必须先查目标项目当年的官方清单，不能把一个通用模板直接投给所有学校。","一份计划通常包括问题、背景与最接近工作、研究目标、设计与材料、分析或论证方法、预期贡献、可行性和参考文献。具体次序可以随学科变化：人文计划要说明文本、语境与解释问题，理论计划要说明定义、已有命题和难点，定量计划要说明单位、指标和识别条件。不要把所有学科都改写成假设检验。"]},{"id":"reasoning","title":"计划的质量来自推理链，而不是任务数量","paragraphs":["好的计划应当让每个环节回答上一个环节提出的需要。问题若是描述某现象，就不必承诺建立因果机制；问题若是评价一种方法，就需要合理比较和评价标准；问题若依赖无法取得的材料，就要说明获取路径和备选。评阅者从这些连接判断你是否理解研究，而不是数你承诺使用多少种技术。","预期结果应写成可容纳不同发现的知识目标。比如“估计误差差异及其在不同范围的变化”，允许差异不存在或方向相反；“证明新方法必然更好”则提前锁定答案。计划可以表达有理由的预期，但必须指出依据、反例和会改变判断的证据。诚实的不确定性比未经验证的保证更专业。"]},{"id":"workflow","title":"从一页问题说明扩成可评阅计划","paragraphs":["准备官方要求、文献矩阵、资源清单和已有作品。先做内容骨架，再按实际字数限制压缩，参考文献是否计入字数也须查官方说明。"],"steps":[{"title":"提取提交约束","body":"记录文书类型、篇幅、语言、结构、引用要求、是否需联系导师及截止时区；保存核对日期和官方链接。未知要求不要凭其他学校经验补全。"},{"title":"用三句话定义核心","body":"分别写研究现象或争议、最接近工作尚未解决的具体问题、拟回答的问题。每句关键事实均找到支持材料。"},{"title":"写目标与贡献边界","body":"把总问题拆成少量相互关联的目标，说明可能新增哪类知识；不把更换对象名称自动视作创新。"},{"title":"使方法对准问题","body":"说明对象、材料、分析单位、获取与处理步骤、比较或论证标准及风险；列出替代解释和能区分它们的证据。"},{"title":"按资源安排阶段","body":"将文献与先导、正式实施、分析及写作分阶段；写明哪些条件已经具备、哪些需确认，准备一个缩小范围的备选方案。"},{"title":"做反向质询与压缩","body":"逐节问“这段支持哪项判断”；请读者指出最不可信的假设。删去套话而保留方法理由，最后核查引文、状态和项目特定要求。"}]},{"id":"worked","title":"一页计划的具体成品如何组织","paragraphs":["以下是虚构筹备计划，不表示已有数据或导师承诺。标题：“公开配对测量数据中误差差异的范围依赖性”。问题段：“整体平均误差可能掩盖不同对象量级上的表现差异。本计划拟在一个来源和许可可核实的数据集中，估计两流程的对象内绝对误差差，并描述其与参考值范围的关系。”背景段接着说明必须核查哪些直接相关研究，而不凭空声称现有研究全部忽视此问题。","方法段：“启动前核查参考值的生成方式、对象编号、两流程记录及许可。以对象为分析单位，先描述差值分布，估计平均配对差；范围关系作为明确标示的探索分析，并检查异常对象和模型假设。若配对记录不足，则停止该设计，不以随意拼接补足。”这段说明单位、主要分析、探索性质和失败处理。","贡献与可行性段：“预期产物为可复核的边界分析报告及资料处理记录；其新颖性仍需最接近工作对照确认。首阶段完成资料核查和先导，随后实施主要分析并接受方法反馈，最后整理报告。若许可或参考值质量无法满足要求，改选已确认可用的资料，并重新审查问题。”计划没有承诺显著差异或发表，仍具体表达了研究任务。"],"annotations":[{"text":"其新颖性仍需最接近工作对照确认。","role":"贡献状态","note":"当前为筹备示范，未完成检索不能宣布首创；正式提交前应补足核查。"},{"text":"若配对记录不足，则停止该设计。","role":"方法与风险","note":"失败条件直接来自设计需要，不靠任意数据加工维持原方案。"}]},{"id":"repair","title":"把宏大愿望改成有依据的研究承诺","paragraphs":["容易踩的坑：“本研究将彻底解决自动化误差问题，融合人工智能、机制分析和大规模实验，保证发表高水平论文。”缺少对象、资料、可完成范围和各方法的必要性。可以改成：“本阶段集中检验一种评价指标在已确认资料中的适用边界；其他机制研究以首阶段结果与资源核查为条件。”后一版本可以被质询，也可以按证据调整。","错误是把已经完成的教学分析写成预实验，或把想联系的导师写成已获得支持。应分别标为“方法训练”与“拟确认指导适配”。申请计划可以引用已有训练证明准备程度，但模拟数字不能成为现实效果或资源可用的证据。"]},{"id":"tips","title":"同时准备长稿和项目版本","paragraphs":["先保留一份有完整依据的母稿，再按各项目要求删改。每个提交版本重新核对题目、导师或团队、篇幅、文件名称和引用。不要只替换校名，因为不同项目可能更看重问题、方法或与现有课题的衔接。","约半年内申请时，截止日期核查和文书事实准备应从第一周并行；第二十八周只是建议定稿窗口。如果实际截止更早，应倒排提交日期、反馈和推荐材料，而不是等教材学完。计划不是与未来结果签合同，但重大修改须有知识与可行性理由。"]}],"exercise":{"materials":"拟题“用先进方法全面提高效率”；现有条件为一个许可尚待核查的数据来源、已经完成的教学配对分析、每周八至十二小时；目标项目是否要求计划尚未核实。","task":"写提交前的三个核查项，并将题目改成带对象、指标和条件的研究问题。","template":"文书核查：\n资料核查：\n已有能力与局限：\n具体问题：\n停止条件：","answer":"先核查目标课程要求的是研究计划、兴趣说明还是写作样本；核查资料许可、变量与分析单位；说明已有能力来自教学训练而非真实预实验。问题可改为“在许可与参考值可靠性确认后，估计某公开配对数据中两流程的绝对误差差及其范围变化”。若缺少对象配对或可信参考值，则停止该题并重新选材料。正式提交时应换成已经核实的数据名称与来源。","rubric":["文书类型以具体项目为准。","方法和材料能回答所提问题。","预期贡献没有写成已证实结果。","风险与停止条件具体。"]},"quiz":{"question":"一个项目只要求写作样本，最恰当的做法是什么？","options":["直接提交未来研究计划，因为它更显雄心。","按官方要求选已完成且可提交的作品，另行准备所需兴趣说明。","把教材模拟报告改写成真实发表论文。"],"correct":1,"explanation":"写作样本与计划功能不同；是否还需其他材料以项目要求为准，不能误报作品性质。"},"references":[{"id":"oxford-proposal","locator":"阅读研究计划与其他书面材料的区别，并转到具体课程页核对是否要求、篇幅和提交类型。"},{"id":"harvard-writing","locator":"Introductions：Orienting Information、what is at stake、Your thesis；用于检查问题、读者所需背景与中心主张。这篇课对题名、口头表达或计划的应用属于教学迁移。"}],"next":"下一篇检查研究计划与导师及项目的真实匹配证据，避免只按名称或关键词筛选。","core":true,"chapterId":"c24","stageId":"s8","chineseCount":2349},{"id":"a24-2","title":"导师和项目匹配的证据判断","goal":"建立能追溯官方来源和近期研究的项目匹配记录，区分学术匹配、指导条件和申请资格。","scope":"用于筛选 PhD 项目与潜在导师；不提供未经核实的当年招生名额、录取门槛或个人承诺。","prerequisites":["a04-3","a08-3","a23-4"],"minutes":70,"tags":["申请","通用"],"terms":[{"zh":"研究匹配","en":"research fit","definition":"你的问题、方法或发展目标与团队实际研究之间存在可说明的联系。"},{"zh":"资格条件","en":"eligibility requirements","definition":"项目规定的学位、成绩、语言或其他申请要求，与研究兴趣匹配分开判断。"},{"zh":"指导可用性","en":"supervisory availability","definition":"导师是否可以且愿意在相应周期指导，以及名额、资助和机构安排是否允许。"}],"sections":[{"id":"concepts","title":"匹配至少有三个不同问题","paragraphs":["第一，你的研究问题是否与团队的实际工作相连；第二，你的背景是否满足项目申请条件；第三，目标周期是否存在指导、资助和名额机会。三者不能相互推出。读过一位教授的论文，并不能知道其明年是否招生；达到最低资格，也不能说明研究匹配或竞争力足够。","研究匹配可以来自主题、方法或互补资源，但必须解释连接。双方都写“智能”只是一致关键词；你能指出对方研究的具体边界、你希望检验的相邻问题及方法关系，才是可讨论的联系。跨领域申请需要说明已有能力怎样迁移、缺口怎样补，而不是假装已经熟悉整个新领域。"]},{"id":"reasoning","title":"把证据、推断和待确认分开","paragraphs":["筛选记录的每个结论都应附来源与核对日期。课程官方页适合核查申请资格、材料与截止；团队页和近期论文适合理解方向；当年官方项目公告适合核查特定职位；个人交流只有其实际表达的范围内才构成证据。网页多年未更新时，只能记录最后已知状态，不能自动当成当前事实。","排名、城市和声誉可以作为个人选择因素，但不能替代指导适配。反过来，题目高度一致也不保证适合：可能存在资源限制、训练方式差异或资助问题。建立分项记录比给每位导师一个单一分数更透明，尤其在信息缺失时应写“待确认”，而不是用猜测填满表格。"]},{"id":"workflow","title":"为一个候选建立可复核的匹配卡","paragraphs":["先读项目现有目标表，避免重复建档。选择一个候选练习完整流程；示范中的甲、乙均为虚构候选，不对应现实学校。"],"steps":[{"title":"确认申请单位与机制","body":"核查是申请博士项目、院系、导师职位还是资助项目；记录官方名称、授予学位和申请入口，避免把团队网页当成正式招生系统。"},{"title":"提取资格与时间要求","body":"记录学位和语言等要求、所需材料、截止日期及所在时区、推荐提交方式；把明确符合、明确不符和未能确认分列。"},{"title":"阅读近期直接相关研究","body":"优先选择与拟题最接近的论文，摘录问题、资料、方法和局限；读完全文后才把论文观点写入匹配说明，不能只用标题。"},{"title":"写一条学术连接","body":"用“对方研究了什么—我希望研究什么—为什么存在连接—还缺什么”四项组成短段；允许发现不匹配并删除候选。"},{"title":"核查指导和资源条件","body":"查看官方当前信息，必要时准备具体询问。没有明确确认就保留未知；不把同事介绍、旧论文或网页欢迎语当录取承诺。"},{"title":"制定候选行动","body":"给出继续核查、准备申请、等待必要条件或暂缓的决定；每项下一步写产物和日期，截止临近时重新核对影响提交的信息。"}]},{"id":"worked","title":"从“关键词相同”写成一张匹配卡","paragraphs":["虚构候选甲的团队介绍出现“测量可靠性”，其教学文献卡显示研究重点是正常运行下的平均误差；候选乙的近期工作分析异常恢复和对象层级记录。若你的问题是恢复阶段的误差变化，乙在问题和资料结构上更接近。但这只是学术连接判断，甲也可能有未展示的新项目，乙也可能没有名额。不能根据这个例子推断真实学校情况。","完成的乙匹配卡写成：“连接：拟题关注异常恢复后的误差边界，与该团队对象层级比较的研究问题相邻；已有准备：完成配对设计和复核训练；待补：真实材料来源、恢复过程定义及相关领域知识；申请资格：待依据具体项目官方页核查；指导可用性与资助：尚未确认；行动：读两篇最接近论文，整理一页问题说明，再依据项目规定决定是否联系。”","如果后续官方页明确不要求提前联系导师，照其流程准备材料即可；如果明确要求事先取得指导支持，则把该步骤纳入倒排计划。两种机制都可能存在，不应把“先套磁”写成所有申请的硬性规则。"],"annotations":[{"text":"指导可用性与资助：尚未确认。","role":"动态事实边界","note":"学术匹配不能证明招生名额；未知信息明确保留。"},{"text":"与该团队对象层级比较的研究问题相邻。","role":"匹配理由","note":"说明问题和方法的连接，而非仅重复研究关键词。"}]},{"id":"repair","title":"不要把意向、礼貌回复或旧信息写成承诺","paragraphs":["容易踩的坑：“教授主页欢迎申请，所以我已获得博士机会。”可以改成：“主页显示一般申请意向，目标周期的名额、指导与正式录取仍须核查。”礼貌回复、讨论研究或推荐查看项目都不等于正式 offer；记录对方原意和日期，不擅自升级承诺强度。","容易踩的坑：“我的背景一般，只能找任何愿意接收的导师。”这无法帮助判断训练条件。应改为具体差距：“我已完成方法训练，尚缺真实研究经验；优先考察能支持该问题和训练需求的项目，同时核查硬性资格与材料要求。”项目选择需要证据，不能仅依自我标签。"]},{"id":"tips","title":"一次只核查会改变决定的信息","paragraphs":["早期建立较宽的候选池，之后用资格、方向和资源逐步筛选；数量没有通用标准。不要为填表而收集每位导师几十篇无关论文。先找到能支持或否定匹配的关键工作，再决定是否深入。重要日期和政策以官方页面为准，保存出处及核对时间。","若背景转向，诚实写出你能带来的能力和需要学习的知识。机械设计训练可能提供建模、约束分析或工程实现经验，但具体具备哪些能力必须由自己的作品和经历证明。本教材不会自动替你生成这些个人事实。"]}],"exercise":{"materials":"候选甲：官方资格明确符合，题目略远；候选乙：论文高度相关，资格与当年名额未知；候选丙：关键词相近，官方明确要求你尚不具备的必要资格。","task":"为三者写当前状态、下一项核查和不能作出的结论。","template":"候选：\n已知事实：\n匹配证据：\n待确认：\n下一步：\n当前不能声称：","answer":"甲继续查具体问题和训练条件，不能因资格符合就称录取机会高；乙优先核查硬性资格、申请机制和指导条件，不能因论文相关就写已获支持；丙记录明确资格缺口，核查是否存在官方允许的替代路径，若没有则暂缓，不自行推定豁免。三个候选都需保存出处和核对日期。","rubric":["把资格、研究和指导分开。","未知信息没有被猜测填入。","下一步会改变当前决定。","匹配说明具有具体研究依据。"]},"quiz":{"question":"教授回复“你的兴趣很有意思，欢迎关注项目”，能确认什么？","options":["已经录取并获得资助。","教授确定愿意担任导师。","对方给出积极但有限的反馈，正式申请和指导条件仍需核实。"],"correct":2,"explanation":"回复可以如实记录，不能扩展成未表达的录取、资助或指导承诺。"},"references":[{"id":"oxford-proposal","locator":"阅读申请材料与具体课程要求的关系，练习从通用指南转到目标项目官方页核查。"},{"id":"read-paper","locator":"运用分层阅读识别候选团队论文中的实际问题、方法和局限。"}],"next":"有了匹配证据，下一篇准备学术简历、动机陈述和推荐所需的事实材料。","core":true,"chapterId":"c24","stageId":"s8","chineseCount":2150},{"id":"a24-3","title":"学术 CV、动机陈述与推荐材料的事实准备","goal":"建立一致的申请事实底稿，再按不同功能写学术简历、动机陈述和推荐材料。","scope":"适用于研究经历较少的申请者；不假设已发表论文、获奖、英语成绩或导师支持。","prerequisites":["a23-3","a24-2"],"minutes":70,"tags":["申请","写作"],"terms":[{"zh":"学术简历","en":"academic CV","definition":"以可核查条目呈现教育、研究、技能及相关经历，具体栏目由实际事实和项目要求决定。"},{"zh":"动机陈述","en":"statement of purpose","definition":"解释研究目标、已有准备、申请理由及项目匹配的连贯文书；名称和内容要求因项目而异。"},{"zh":"推荐材料包","en":"referee information pack","definition":"提供给推荐人的真实背景、作品、申请要求和时间信息，帮助其独立判断与写作。"}],"sections":[{"id":"concepts","title":"三种材料承担三种工作","paragraphs":["简历让人快速知道你做过什么，动机陈述解释这些经历如何形成研究目标，推荐信由了解你的人提供独立评价。三份材料应相互支持，但不能复制同一段话。你负责提供准确事实，不能替推荐人编造评价、冒署姓名或提交未经授权的推荐内容；具体提交制度以项目官方要求为准。","你做过机械本科毕业设计，就如实写设计项目与个人工作。是否具有研究问题、比较证据和学术贡献，要看项目内容，不能自动改称科研论文。缺少正式论文时可以设置研究训练或项目经历栏目，展示真实可核查产物；没有的栏目可以省略，不需要用虚构条目填满。"]},{"id":"reasoning","title":"先建立事实库，再写叙述","paragraphs":["申请材料出错常常不是一句话特别夸张，而是不同文件互相矛盾：简历写独立，报告写合作；陈述写已发表，作品仍是草稿；推荐材料日期与成绩单不一致。建立唯一事实底稿，将教育时间、项目状态、角色、成果及证据放在一起，能减少反复修改带来的漂移。","叙述的重点是准备与目标之间的联系。可以解释一次工程项目如何让你开始关注测量可靠性，但不能编造顿悟故事。用真实问题、行动和反思展示成长，再说明为什么需要博士训练。申请博士不是仅表达热爱，也不是承诺已经会做所有研究；你需要呈现可观察的学习能力和合理下一步。"]},{"id":"workflow","title":"从事实底稿生成三类材料","paragraphs":["准备成绩与学位信息、项目记录、作品集、目标要求和推荐人联系方式。涉及他人信息时仅在申请所需范围使用。"],"steps":[{"title":"核对基础事实","body":"整理教育项目正式名称、学习时间、成绩的原始体系和已获学位状态；不自行把成绩换算成目标学校体系，除非其要求并给出规则。"},{"title":"编写经历证据表","body":"逐项列问题、本人动作、成果、状态和支持材料；培训、课程项目、毕业设计、真实研究分清，已投稿与已发表分清。"},{"title":"建立简历骨架","body":"优先放与申请有关的教育和研究准备，再列真实技能、经历和成果。技能附使用场景，例如用 Python 重现何种分析，而非只写精通。"},{"title":"写陈述的因果连接","body":"用真实经历说明当前兴趣和能力，再写知识缺口、研究目标和项目匹配；每段承担一个功能，删掉没有实例支持的形容词。"},{"title":"准备推荐信息","body":"给潜在推荐人整理合作背景、关键作品、希望其了解的事实、目标项目和截止信息；先确认对方是否愿意并了解你，再按正式系统操作。"},{"title":"做跨文件一致性检查","body":"逐项比对时间、身份、项目名称、状态与个人贡献；按每个项目要求生成独立版本，提交前再次检查截止时区和上传类型。"}]},{"id":"worked","title":"如何表述从工程训练到研究训练的真实过渡","paragraphs":["以下文本只在事实相符时使用，不能直接当作个人经历：“本科毕业设计使我接触到在约束条件下完成机械方案的过程。随后我开始系统学习如何把工程目标转成可检验问题，并完成配对分析的教学训练。在练习中，我核对了分析单位、计算流程与结论边界。当前仍缺少独立开展真实研究的经验，因此希望通过一个来源明确的小项目积累设计与证据判断能力。”这段没有贬低学位，也没有把训练包装成论文。","同一内容写入简历可分为“机械毕业设计”和“研究方法训练”两个实际栏目。前者填写你确实完成的设计、计算或验证；后者写教学数据分析及报告。若尚未完成某项训练，列入学习计划而不写成已有技能。不能凭本科专业推断你熟练某软件或拥有实验设备经验。","推荐材料包的成品说明为：“附件包含核对后的简历、两页项目说明、当前报告及项目截止清单。您曾指导的部分是毕业设计中的方案与验证工作，请以您实际了解的内容独立评价。方法训练是之后完成的材料，供背景参考，并不表示您曾参与指导。”这样既提供信息，也不把推荐人的知情范围扩张。"],"annotations":[{"text":"当前仍缺少独立开展真实研究的经验。","role":"准备程度","note":"说明真实缺口，后接具体改进行动；不把不足写成永久能力标签。"},{"text":"请以您实际了解的内容独立评价。","role":"推荐边界","note":"推荐人的判断与申请者事实材料分开，不能要求其证明未了解的表现。"}]},{"id":"repair","title":"删掉无法支撑的自我评价","paragraphs":["容易踩的坑：“精通所有科研方法，拥有突出创新能力。”可以改成：“完成文献矩阵、配对分析和报告训练；能够解释分析单位及主要假设，回归与真实资料设计仍在继续学习。”后者给出具体能力与边界，面试可以进一步核查。","容易踩的坑：“学校一般，所以急需名校证明自己。”申请叙述应聚焦研究训练需要和项目为何适合。可改为：“我希望在某一明确问题上接受系统训练，该项目的具体研究与方法资源与此目标相连。”是否相连必须用已读研究和官方信息证明，不能用夸奖学校替代。"]},{"id":"tips","title":"推荐关系要提前准备，但尊重独立性","paragraphs":["推荐人的了解程度通常比你在材料里反复强调其头衔更有信息。具体选择仍依项目要求与现实关系，不存在所有项目通用的最优组合。提前整理资料和截止，给对方合理时间；是否发送提醒由本人决定，提醒应准确、简短，不代写或施压。","保留每次提交材料的副本，面试时以已提交版本为起点。若成果状态后来改变，按项目允许的方式更新。多个申请版本可以强调不同相关经历，但事实与角色必须一致。母稿不是自动群发模板，每份都要做项目核查。"]}],"exercise":{"materials":"事实：完成机械毕业设计；教学统计练习已完成；真实小研究正在核查数据；没有论文发表；拟请了解毕业设计的教师推荐。","task":"写三个简历条目状态、一句陈述和给推荐人的事实说明。","template":"毕业设计：\n方法训练：\n拟开展研究：\n陈述连接：\n推荐人可知范围：","answer":"毕业设计列为已完成项目，内容依实际工作填写；教学统计练习列为已完成研究训练并标教学数据；真实小研究列为筹备或可行性核查中，不列结果。陈述可写“我正在把工程项目经验转化为研究问题与证据训练，已完成方法练习，下一步在获准材料中实施有限研究”。给教师说明其直接了解毕业设计，之后训练仅作为背景资料，不要求教师证明未观察的研究表现。","rubric":["没有新增未提供的论文或技能。","三类经历状态明确。","陈述以事实连接目标。","推荐材料尊重推荐人的知情与独立判断。"]},"quiz":{"question":"研究报告尚在写作，可以放在简历哪里？","options":["已发表论文栏目，先占位置。","研究项目或报告草稿栏目，注明本人贡献及当前状态。","写成已被导师推荐发表的论文，即使未有此事实。"],"correct":1,"explanation":"未发表成果可以如实呈现，但不能提前升级状态，也不能制造推荐或接收事实。"},"references":[{"id":"oxford-proposal","locator":"阅读申请材料种类与具体课程要求，核对陈述、计划和书面作品的不同功能。"},{"id":"credit","locator":"阅读贡献角色定义，用于核对简历与作品中的个人工作范围。"}],"next":"最后一篇把这些真实材料转化为口头讲解，并练习方法追问与未知问题。","core":true,"chapterId":"c24","stageId":"s8","chineseCount":2270},{"id":"a24-4","title":"面试中的研究讲解、方法追问与未知问题应对","goal":"用可核查事实讲清自己的研究准备，在方法追问、反例和未知问题面前展示思考过程。","scope":"适用于研究导向 PhD 面试准备；面试形式、时长和考查内容由具体项目决定。","prerequisites":["a21-2","a23-4","a24-1","a24-3"],"minutes":75,"tags":["申请","通用"],"terms":[{"zh":"研究讲解","en":"research explanation","definition":"向听众说明问题、依据、做法、结果或当前进展、局限和本人贡献。"},{"zh":"校准的回答","en":"calibrated response","definition":"让回答确定程度与自己掌握的证据相匹配，明确已知、推测和未知。"},{"zh":"反事实追问","en":"counterfactual question","definition":"通过改变一个条件，检查你是否理解方法为何成立及何时失效。"}],"sections":[{"id":"concepts","title":"面试考查的是你能否解释判断","paragraphs":["把报告背熟不等于理解研究。听众可能问：为什么是这个问题，为什么用这种设计，如果结果相反怎么办，换一种材料还成立吗，你到底做了哪些工作。回答这些问题需要掌握研究逻辑和证据，而不只是记住一个显著数值。尚无真实研究经验时，清楚展示训练、反思和下一步计划，也比虚构项目更有依据。","未知问题包括听不清术语、不熟悉方法、缺少数据和没有确定答案。不同未知应有不同回应：请求澄清、说明已有理解、提出验证路径或承认目前无法判断。不能把“我不知道”当结束一切讨论的口令，也不能为了显得有能力而编造。合理的推理可以继续，但必须把推测标出来。"]},{"id":"reasoning","title":"回答长度取决于问题任务","paragraphs":["先给直接答案，再提供一至两项关键依据，最后说明边界和下一步。若被问分析单位，先说对象而不是先介绍全部研究背景；若被问研究价值，则需要最接近工作和问题意义。这个顺序帮助对方快速判断，也给你空间在追问后补充。不是每个答案都应套四句公式，核心是围绕问题组织信息。","反例问题不是必然否定你的工作。对方可能想看你是否知道结论条件。例如“如果几个对象都来自同一设备批次呢”，是在检查独立性与聚类，而不是要求你立刻报一个复杂模型名称。你可以先说明批次内相关会影响不确定性估计，再讨论需要的批次信息和可能分析，避免未经资料检查就承诺唯一解决方法。"]},{"id":"workflow","title":"建立一套能练习而不靠背诵的面试材料","paragraphs":["准备已提交的简历、计划、作品包和一页事实清单。用自己真实做过的内容练习，模拟题的设定在回答中明确说明。"],"steps":[{"title":"准备三个长度的介绍","body":"分别做三十秒、三分钟和更完整版本；共同保留问题、本人动作、关键证据、局限与下一步，时间增长用于展开理由而非新增未经证实事实。"},{"title":"为每项强表述准备依据","body":"简历写会配对分析，就能解释单位、差值和假设；写完成报告，就能指出版本和本人段落。发现不能解释的表述先降级或补学。"},{"title":"整理五类追问","body":"按问题价值、设计选择、结果解释、失败局限和个人贡献各写若干题，标出需要复习的概念和可展示材料。"},{"title":"练习条件改变","body":"改变样本结构、缺失情况或指标定义，先说哪项假设受影响，再说需要检查什么；不要只背原案例的数值。"},{"title":"录一次模拟并复盘","body":"请知情或陌生读者提问，或自己录音。记录答非所问、过度确定、术语堆砌和无法说明依据的位置，下一轮只集中修复几项。"},{"title":"准备对项目的具体提问","body":"依据已查官方信息提出训练、指导方式和研究资源方面的问题；不重复网页已有答案，不把任何口头讨论自行理解为录取或资助承诺。"}]},{"id":"worked","title":"围绕配对训练完成一次真实尺度的答问","paragraphs":["问：“你做的研究有什么发现？”答：“目前这项作品是教学数据分析，不是真实实验发现。我完成了数据字典、表格与 Python 结果核对，并写出配对比较报告。它展示我能解释分析单位与结论边界；下一步是在许可和来源明确的材料中实施一个有限问题。”这先纠正项目性质，再说明能力证据，不把训练说得毫无价值。","问：“为什么不把四十条读数当四十个独立样本？”答：“每个对象各有甲乙两次读数，对象内读数有关联，比较目标是同一对象的误差差。因此主要分析以二十个对象的差值为单位。如果对象又属于共同批次，我还需要检查批次相关性，不能仅凭有二十行差值就保证独立。”回答展示已知结构和新增条件。","问：“如果差值分布很偏，你怎么办？”答：“先检查原始记录、差值图和是否存在主导结果的对象；若记录真实，不能为了正态而删除。之后根据估计目标和资料结构选择合适的区间或敏感性分析，并说明方法假设。我目前不能仅凭‘偏’这个描述指定唯一检验，需要看到数据结构。”这既没有虚构掌握的方法，也没有逃避分析判断。"],"annotations":[{"text":"目前这项作品是教学数据分析，不是真实实验发现。","role":"事实校准","note":"直接回答前先澄清问题前提，随后给出真实能力证据。"},{"text":"不能仅凭有二十行差值就保证独立。","role":"假设理解","note":"区别数据表行数与研究设计，能随条件变化调整判断。"},{"text":"需要看到数据结构。","role":"未知边界","note":"说明缺少的具体信息，避免把所有未知都回答成一个统计名称。"}]},{"id":"repair","title":"把背稿、硬撑和自我贬低改成讨论","paragraphs":["容易踩的坑：“这个方法最好，大家都这样用。”可以改成：“我选择它是因为主要问题是对象内平均差；使用时需要检查对象间独立性和差值分布等条件。若条件不合适，我会重新评估估计与区间方法。”不要只报权威名词，需要解释选择的条件。","容易踩的坑：“我什么都不会，背景太差。”可以改成：“我尚未完成独立真实项目，但已能完成文献矩阵和配对分析；目前最需要补的是材料获取与设计经验，我的下一步安排是……”同样不要反向夸大成“所有方法都精通”。准确的能力边界有助于讨论培养需求。"]},{"id":"tips","title":"把面试训练变成最后一次质量检查","paragraphs":["如果同一个追问始终回答不清，回到作品修改，不能只修口头话术。比如说不清贡献可能源于文献比较不足，说不清样本量可能源于设计尚未完成。训练中发现的缺口应写入学习计划，补好后同步更新报告和申请陈述。","现场允许短暂停顿，先确认你理解的提问；若口误，直接更正具体错误。不要猜测教授想听哪个结果，更不要为迎合对方改写材料事实。学术讨论可以有不同判断，但要说清证据和条件。最终保留练习记录、修订问题单和真实作品，让学习形成可持续的研究工作方式。"]}],"exercise":{"materials":"面试官问：“你说流程乙更好，但有三个对象更差，而且数据是模拟的，这个结论有意义吗？”","task":"给出一段不超过一分钟的回答，区分平均与个体、教学与真实发现，并说明下一步。","template":"直接回答：\n平均与个体：\n材料性质：\n能力证据：\n下一步：","answer":"“这组模拟数据只能展示分析方法，不能验证真实流程优越性。平均误差较低并不表示每个对象都更好，三个更差对象应保留并报告。我通过这项训练学习了配对单位、平均差及结果边界，也核对了表格和 Python 输出。下一步需要在来源和许可清楚的真实资料中预先明确比较问题，并分析可能的失败条件。”不需要用显著性回避反例，也不应把模拟材料说成预实验。","rubric":["直接回应模拟材料的限制。","区分总体平均描述与逐对象表现。","保留反例而非删除不利记录。","下一步可执行且没有保证成果。"]},"quiz":{"question":"面试遇到完全不熟悉的方法，哪种回应最好？","options":["编一个听起来专业的解释。","承认不熟悉，说明可理解的相关问题，请求澄清并提出核查路径。","宣称这个方法没有价值以避免回答。"],"correct":1,"explanation":"可以坦诚未知并继续有边界的推理；编造或贬低都无法展示可信的研究判断。"},"references":[{"id":"read-paper","locator":"复习如何识别问题、方法、证据与局限，将同一结构用于解释自己的作品。"},{"id":"oxford-proposal","locator":"复核研究计划和课程要求，确保面试中讨论的是已提交的真实目标与材料。"}],"next":"完成这篇课后，以作品自评中的关键缺口安排下一轮研究；学习记录、真实产出和申请结果继续分别维护。","core":true,"chapterId":"c24","stageId":"s8","chineseCount":2319}],"resources":[{"id":"read-paper","title":"Ten simple rules for reading a scientific paper","organization":"NIH / PLOS Computational Biology","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7392212/","language":"英语","free":true,"why":"一篇开放获取的阅读策略论文，帮助建立先看全貌、再深入方法与证据的顺序。","readingTask":"先浏览摘要和图表，再选一条建议应用到最近读的论文。","modules":["m1","m3"],"checked":"2026-11-05","boundary":"通用学习来源，具体学科与机构要求需要结合项目判断。"},{"id":"scholarly-articles","title":"Reading Scholarly Articles","organization":"Purdue University Libraries","url":"https://guides.lib.purdue.edu/research_approaches/scholarlyarticles","language":"英语","free":true,"why":"大学图书馆整理的学术文章结构与阅读方法入门。","readingTask":"选一篇论文，按页面提供的框架写出研究问题、方法和结论。","modules":["m2","m3","m8"],"checked":"2026-11-05","boun
