不明确、需要先形成问卷条目或模型变量；并行设计则在相近时间取得不同材料并比较。名称只是入口，实际项目仍需说明优先部分、时间、连接规则、样本关系与各自分析方法。"]},{"id":"reasoning","title":"选择背后的证据逻辑","paragraphs":["联合推断不能靠“多数证据投票”。两种材料冲突，可能因为它们观察了不同群体、时段、层级或概念。问卷问“总体满意”，访谈讨论“遇到故障时的体验”，高满意与强烈抱怨可以同时成立。先检查可比性，再判断是否真的矛盾；若矛盾仍存在，应把它作为需要解释的结果，而不是删除不方便的材料。"]},{"id":"workflow","title":"逐步完成方法判断","paragraphs":["把下面每一步写进同一份研究方案，保留未解决的问题。"],"steps":[{"title":"明确联合研究问题","body":"写成两层问题，例如“预约失败出现在哪里，以及不同经历者如何解释这些失败”。注明只有日志时缺少什么，只有访谈时又缺少什么。如果任一部分对联合问题没有独特作用，就缩减设计。"},{"title":"选择连接顺序","body":"画出定量收集、分析、访谈选择、定性分析、联合解释五个节点。解释型顺序中，访谈选择要依据具体的日志结果；探索型顺序中，问卷条目要能追溯到前期概念。说明为什么这个顺序符合时间和伦理安排。"},{"title":"规定连接规则","body":"例如按完成、取消和超时三类经历选择后续材料，而不是只选最支持想法的人。记录两部分是否来自同一人、同一场所或同一时期，以及哪些标识可合法连接。不能为了整合而违反匿名承诺。"},{"title":"分别完成合格分析","body":"定量先检查分母、测量和依赖关系；定性按声明的方法形成有材料支撑的解释。混合不允许任一部分降低标准。各自结果完成后才进入联合表，防止为配合另一部分而悄悄改写分析。"},{"title":"制作联合展示并追问差异","body":"表格至少包含数量发现、相关主题或材料、关系类型、联合解释、尚待检验五列。关系类型可以是一致、补充、扩展或冲突。对冲突列出两个候选解释和可以区分它们的新证据，再写有限度结论。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学联合展示示范：第一行，模拟日志中取消多发生在选择时间之后；访谈片段“我先点进去看看有没有空，再问同伴”提供补充解释；共同推断是部分取消可能是探索而非失败，需要重新定义失败指标。第二行，日志显示提交速度较快，访谈却提到不确定是否预约成功；两者不直接冲突，因为速度与理解是不同维度，下一轮应增加确认理解的测量。","最终报告可写：“先分析任务日志，依据三种完成状态选择后续访谈材料。两部分分别分析后，使用联合表审查结果关系。取消记录有时代表探索行为，因此初始失败定义需要修订；修订前后结果均保留。该解释来自教学构造材料，正式应用仍需独立收集和核查。”它交代了整合改变了什么，而不只是声称采用了多种方法。"]},{"id":"repair","title":"错误方案与修订","paragraphs":["错误版本：“问卷说用户满意，访谈有人抱怨，因此访谈不可信。”修改时先检查对象、问题措辞和观察层级。如果两部分不是同一个群体，就不能直接否定；如果是同一人，满意与局部障碍也可能并存。正确做法是列出对应关系和候选解释，并把无法消解的差异留在讨论中。另一个错误是用两段精选引文装饰统计结论，却不交代访谈如何取样和分析。"]},{"id":"tips","title":"经验、取舍与适用边界","paragraphs":["一个实用检查是删去联合表的某一列：若删掉定性部分后论文结论完全不变，那么这部分可能只是装饰；若删掉定量部分后所有数字都没有影响推理，则需要重新解释收集成本。整合的价值在于改变问题理解、变量定义、解释或后续行动，而不是使文章显得丰富。","混合研究往往需要更多时间和跨方法能力。个人初学项目可以先完成一种可信的分析，再把另一种作为后续研究建议。若决定采用混合方法，应把额外招募、同意、资料连接与共同解释时间计入计划，而非把它们塞进原来的时间预算。"]}],"exercise":{"materials":"教学材料：日志显示多数失败发生在确认页；访谈A说按钮看不见，访谈B说先询问同伴，访谈C说以为已经提交。","task":"写一行联合展示，并提出下一轮可检验的测量改进。","template":"数量发现：\n相关材料：\n关系类型：\n联合解释：\n下一轮测量：\n仍不能判断：","answer":"示范答案：确认页退出多是数量模式；三段材料给出不同原因，关系为补充和区分；不能把所有退出统一称为界面失败。下一轮分别记录按钮是否看见、提交理解和退出意图，保留各类分母。三段材料不能估计各原因在总体中的比例，因此不要写成大多数人因为按钮看不见而失败。","rubric":["联合问题需要两类证据","连接规则具体且不破坏隐私承诺","联合展示处理了不同解释","没有把访谈频率直接推广为总体比例"]},"quiz":{"question":"两类结果不一致时，首先应做什么？","options":["删除样本较小的一类","检查对象、时间、概念和层级是否可比","按统计显著性决定哪类是真的"],"correct":1,"explanation":"先核对是否在回答同一个问题。样本规模和显著性不能自动判定另一种证据无效。"},"references":[{"id":"mixed-methods","locator":"官方资源页Table of Contents中The Nature and Design of Mixed Methods Research，以及Introduction and Background；本次核对介绍与分节入口，具体设计报告PDF作为延伸阅读。"},{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"}],"next":"把今天的判断记进方法选择表，再用后面的具体方法课检查能不能做。","core":false,"chapterId":"c10","stageId":"s4","chineseCount":1894},{"id":"a11-1","title":"实验、对照、随机化、盲法与混杂控制","goal":"12台设备比较新维护与标准维护，每台可在维护前后各测三次。设计比较并标记随机化、单位和可盲角色。","scope":"适用于定量研究设计的入门判断；具体领域的测量技术、正式样本规划与审批需要相应专业支持。","prerequisites":["a10-2"],"minutes":65,"tags":["实证定量"],"terms":[{"zh":"随机分配","en":"random assignment","definition":"用预定随机机制将研究单位分到条件，减少组别与原有特征的系统关联。"},{"zh":"混杂","en":"confounding","definition":"某因素同时关联条件与结果，使观察差异不能单独归于目标条件。"},{"zh":"盲法","en":"blinding","definition":"让适当角色不知道条件身份，以减少预期对操作、测量或解释的影响。"}],"sections":[{"id":"concepts","title":"先理解设计中的概念","paragraphs":["实验的核心是主动安排条件，并通过设计让比较尽量公平。对照不是“什么也不做”的同义词；它可以是标准流程、安慰条件或另一种剂量，取决于问题。如果新方法既换设备又换人员，对照却沿用旧设备和旧人员，观察差异就混合了多种改变。需要先决定评价整个组合还是某个组成部分。","随机分配与随机抽样不同。前者改善条件可比性，后者关系到样本怎样代表总体。随机分配不会保证每一次小样本完全平衡，也不自动解决失访、测量偏差和执行差异。盲法需要明确角色：参与者、操作者、评估者或分析者，不能只写“双盲”而不说明谁不知道什么。"]},{"id":"reasoning","title":"比较为什么能够支持判断","paragraphs":["设计应从真正接受条件的单位开始。一台机器分到某流程后测十次，接受条件的仍是机器，十次读数不是十台机器。同一对象接受A和B可以利用配对，但可能出现顺序、疲劳或残留效应。随机安排AB/BA并设置间隔有助于处理这些问题，是否足够仍取决于过程是否可逆。"]},{"id":"workflow","title":"一步一步形成研究设计","paragraphs":["准备研究单位表和一页方案，将以下操作及理由逐项记录。"],"steps":[{"title":"确定主要比较","body":"写明比较A与B的哪个结果、单位和方向。绝对误差可为主要结果，时间为次要结果。不要看完结果才把表现最好的指标改成主要。把预期无差异或不利结果如何报告也先写清。"},{"title":"锁定研究单位","body":"列单位ID、条件、时点和重复次数。选择平行组或配对并说明原因。如果条件会不可逆地改变对象，不能简单先A后B；应考虑不同对象或适合的设计，并检查分配层级。"},{"title":"保存随机安排","body":"生成条件或顺序列表，记录随机种子、规则和最终安排。实际执行不得根据对象看起来好坏随意调换。正式研究还需考虑分配隐藏，防止入组者预知下一个条件而改变纳入选择。"},{"title":"固定测量与对照","body":"记录材料、环境、仪器、培训、频率、参考值和失败规则。能固定的固定，不能固定的测量或平衡。对照要代表有意义的现实基线，不能故意削弱基线来夸大新方法优势。"},{"title":"安排盲法与预演","body":"可用匿名X/Y标签供评估者和分析者处理，规定揭盲时间。记录设备故障、偏离方案、安全停止和排除理由。用小规模预演检查流程是否跑通，而非用漂亮的先导结果保证正式效果。"}]},{"id":"worked","title":"完整教学设计示范","paragraphs":["教学方案：比较称量流程A与B对同一组标准对象的绝对误差。对象各有参考值，两流程分别产生读数，分析对象内差。正式执行可随机化对象测量顺序和每个对象的AB/BA顺序，记录温度、操作者和设备状态；分析者在可以实现时只看X/Y条件。","教材20对象文件是构造数据，没有真实执行随机化。应写：“该文件演示配对分析；正式实验拟采用对象内比较和随机顺序，可信度还依赖参考值、稳定性和执行记录。”不能把拟议程序改写为已发生事实，也不能把构造差异当成真实设备效果。"]},{"id":"repair","title":"错误与具体修订","paragraphs":["错误句：“A测10次，B测10次，因此n=20，证明B更好。”若所有读数来自同一对象，只能反映这个对象下的重复性，不能声称20个独立对象。修订时区分对象数、条件与重复次数。若删除所有失败试次，还会美化方法表现；应保留失败记录并按预先规则报告失败比例。"]},{"id":"tips","title":"经验和边界","paragraphs":["实用技巧是先锁定分配表再实验，不能先做完再用随机数打乱数据制造随机化外观。盲化操作者不可行时，可以盲化结果读取或分析，并使用客观记录。诚实说明无法盲化的部分，比写含糊“双盲”更可信。","随机化不是研究质量的单一开关。测量错误、处理污染和差异失访仍会破坏比较。每次排查都要回到实际流程：谁接受条件、谁产生数据、谁知道标签，以及哪些决定可能受到结果影响。"]}],"exercise":{"materials":"12台设备比较新维护与标准维护，每台可在维护前后各测三次。设计比较并标记随机化、单位和可盲角色。","task":"12台设备比较新维护与标准维护，每台可在维护前后各测三次。设计比较并标记随机化、单位和可盲角色。","template":"研究问题：\n对象与单位：\n材料或条件：\n操作与比较：\n主要判断：\n限制与修改：","answer":"示范：以设备为分配单位随机分为两组，按统一程序测基线与维护后振动。每台三次读数可用于汇总稳定性，不当三台设备；分析考虑基线及设备层结构。能盲化时让测量者不知道维护类型。12台是资源数，不表示样本功效充分；不可逆维护不适合让同一设备依次接受两种维护当作普通交叉比较。","rubric":["说明对象与单位的关系","关键选择有理由而非只列术语","将设计能够支持的结论与不能支持的结论分开"]},"quiz":{"question":"随机分配最直接有助于什么？","options":["保证样本代表所有人","减少组别与原有特征的系统关联","保证结果显著"],"correct":1,"explanation":"随机分配改善组间可比性，不保证代表性、测量质量或显著性。"},"references":[{"id":"consort","locator":"阅读分配、盲法、流程与主要结果条目，注意临床试验适用范围。"},{"id":"nist-statistics","locator":"阅读试验设计、随机化与区组安排。"}],"next":"把设计写进自己的研究方案，再进入材料整理和分析。","core":true,"chapterId":"c11","stageId":"s4","chineseCount":1651},{"id":"a11-2","title":"观察研究、准实验与因果推断边界","goal":"高风险设备优先安装新传感器，安装组后续故障率仍较高。解释为什么不能直接说传感器有害，并提出需要的证据。","scope":"适用于定量研究设计的入门判断；具体领域的测量技术、正式样本规划与审批需要相应专业支持。","prerequisites":["a11-1"],"minutes":65,"tags":["实证定量"],"terms":[{"zh":"反事实","en":"counterfactual","definition":"同一单位在另一条件下本来会有的结果，通常不能与现实结果同时观察。"},{"zh":"准实验","en":"quasi-experiment","definition":"利用规则、时间或自然条件变化构造比较，在明确假设下估计因果效果。"},{"zh":"识别假设","en":"identification assumption","definition":"使资料中的比较能够对应目标因果量所需的条件，不能由拟合优度单独证明。"}],"sections":[{"id":"concepts","title":"先理解设计中的概念","paragraphs":["观察研究记录现实中已经存在的条件，不由研究者随机分配。它可以描述和预测，也可以在有充分设计论证时研究因果。“不是实验就不能谈因果”过于绝对；“控制几个变量就证明因果”同样错误。困难是接受条件的对象原本可能与未接受者不同，而这种不同也影响结果。","例如自愿用培训软件的人可能更积极，积极性同时影响使用和成绩。即使用户成绩高，也不能把差异全归于软件。应查条件如何发生，哪些共同原因已测，哪些未测，哪些变量是在条件之后形成。任意控制中介或碰撞变量可能引入偏差，不是变量越多越好。"]},{"id":"reasoning","title":"比较为什么能够支持判断","paragraphs":["准实验依赖具体分配机制。差分中的差分比较两组变化，需要论证没有干预时趋势可比；断点回归利用阈值附近规则，需要检查操纵和连续性；中断时间序列需要足够时间点并排查同期变化。方法名称不能替代假设。模型的预测能力也不能单独证明因果识别，因为预测与干预是不同任务。"]},{"id":"workflow","title":"一步一步形成研究设计","paragraphs":["准备研究单位表和一页方案，将以下操作及理由逐项记录。"],"steps":[{"title":"写目标与时序","body":"明确谁在什么时点接受什么条件，结果何时测量，估计希望针对谁。画条件前因素、条件和条件后结果。先定因果方向，再决定协变量，避免把事后结果当作条件前控制。"},{"title":"查分配机制","body":"条件由个人选择、专业判断、政策阈值、地理位置还是随机规则产生？找到原始规定与执行例外。机制未知时应降低因果措辞，不能仅靠回归系数弥补设计信息。"},{"title":"列替代解释","body":"画共同原因的箭头，如基线能力、设备年龄、经济条件。图表达假设而不是证明事实。对重要未测变量写出它可能如何改变估计，明确哪些假设需要背景知识支持。"},{"title":"构建合理比较","body":"前后比较检查季节、同期政策和群体组成；阈值比较检查执行与阈值附近分布；对照组选择应有领域理由。若材料不支持识别条件，改为描述或预测目标，而不是硬套准实验名称。"},{"title":"检查脆弱点并报告","body":"使用有理由的敏感性、替代设定或安慰检验，说明它们分别检查哪种疑虑。报告效果范围与不确定性，并注明适用对象；这些检查增加信息，不等于证明所有假设成立。"}]},{"id":"worked","title":"完整教学设计示范","paragraphs":["教学差分：处理城市政策前后指标10变7，对照城市8变6。处理变化−3，对照变化−2，变化之差−1。这个值比只报−3考虑了共同变化，但若处理城市同时发生独有改革，仍不能把−1全归政策。","合格写法：“在构造数据中，处理与对照的变化之差为−1；因果解释要求未实施政策时趋势可比，且不存在差异性同期冲击。仅四个汇总数不足以检查条件，因此只演示计算。”正式研究还要处理时间序列、单位结构、标准误和政策背景。"]},{"id":"repair","title":"错误与具体修订","paragraphs":["错误句：“控制年龄收入后系数显著，因此软件提高成绩。”可改为：“调整这些已测变量后仍存在关联；学习动机、选择机制和模型假设可能影响结果。”若有设计支持因果，应把支持来自何种机制、识别假设和检查写清，而不是用p值代替。"]},{"id":"tips","title":"经验和边界","paragraphs":["阅读因果论文的快捷入口是寻找“为什么这些单位接受了条件”。若全文只有算法而不说明机制，要格外留意。前期趋势检验不显著也不证明平行趋势，可能只是检验不精确，应结合图形、领域知识和区间判断。","预测准确的模型未必解释因果，因果模型也未必预测最好。区分用途能防止研究目标随着结果漂移。观察资料无法支持更强结论时，清楚描述关联及边界本身仍有研究价值。"]}],"exercise":{"materials":"高风险设备优先安装新传感器，安装组后续故障率仍较高。解释为什么不能直接说传感器有害，并提出需要的证据。","task":"高风险设备优先安装新传感器，安装组后续故障率仍较高。解释为什么不能直接说传感器有害，并提出需要的证据。","template":"研究问题：\n对象与单位：\n材料或条件：\n操作与比较：\n主要判断：\n限制与修改：","answer":"示范：基线风险同时影响安装和故障，构成指征混杂。应查安装前风险、维护、时间和故障定义；若有明确阈值，可研究阈值附近比较但须核实操纵和其他条件。当前只能说安装组观察故障率高，不能判定传感器造成故障。单纯加入安装组标签做回归也不解决未测量风险。","rubric":["说明对象与单位的关系","关键选择有理由而非只列术语","将设计能够支持的结论与不能支持的结论分开"]},"quiz":{"question":"差分中的差分算出−1后，最关键的下一步是？","options":["只看p值","论证没有干预时两组趋势是否可比","把所有记录视作独立"],"correct":1,"explanation":"计算结构与因果解释是两件事，平行趋势等条件决定估计含义。"},"references":[{"id":"strobe","locator":"阅读偏倚、混杂、设计与局限条目。"},{"id":"openstax-research","locator":"阅读关联、实验与研究设计的区别。"}],"next":"把设计写进自己的研究方案，再进入材料整理和分析。","core":true,"chapterId":"c11","stageId":"s4","chineseCount":1620},{"id":"a11-3","title":"问卷、量表、构念、信度与效度","goal":"修订“你是否经常觉得学校优秀科研培训很有用并让你更愿意读博”，拆分构念，写中性题并说明用途。","scope":"适用于定量研究设计的入门判断；具体领域的测量技术、正式样本规划与审批需要相应专业支持。","prerequisites":["a02-1","a10-2"],"minutes":65,"tags":["实证定量"],"terms":[{"zh":"构念","en":"construct","definition":"理论中不能直接完整观察的属性，例如信任、压力或自我效能。"},{"zh":"信度","en":"reliability","definition":"测量在指定条件下的一致性或精度证据。"},{"zh":"效度","en":"validity","definition":"证据与理论在多大程度上支持分数的解释和用途，并非工具永久拥有的标签。"}],"sections":[{"id":"concepts","title":"先理解设计中的概念","paragraphs":["问卷是提问工具，量表则按规则形成测量分数，两者不完全相同。收集年龄、是否使用和意见的问卷，不一定有理由把所有题目相加。如果想用五题测量“信任”，先定义其范围，解释条目为何属于这个构念，以及高低分准备作何用途。不同用途需要不同证据。","信度高不保证效度高。每次多读两厘米的尺可能很稳定，却不能准确测长度；意思重复的题目可以获得高内部一致性，却覆盖很窄内容。Cronbach α受条目数量、相关结构和假设影响，不是越高越好，更不能用一个阈值宣布量表有效。"]},{"id":"reasoning","title":"比较为什么能够支持判断","paragraphs":["工具的证据随人群、语言、文化、用途和实施方式变化。借用工具须核对原始条目、计分规则、验证样本与授权。翻译需要检查语义和理解，不只是替换单词；改变题目或选项后，原研究的验证证据不能无说明地继承。问卷测量与抽样代表性也要分开，即使题目合理，便利样本仍可能不代表总体。"]},{"id":"workflow","title":"一步一步形成研究设计","paragraphs":["准备研究单位表和一页方案，将以下操作及理由逐项记录。"],"steps":[{"title":"定义用途和范围","body":"写清想测什么、不测什么。例如预约结果可预期性的信任，不等于总体满意。说明分数用于描述、组间比较、预测还是个体决策，高风险诊断不能依赖课堂自制问卷。"},{"title":"核查已有工具","body":"搜索构念、量表与validation，找原始开发和后续验证。记录语言、人群、条目、维度、计分与授权，不从二手博客直接复制总分公式。若需要改编，列明改动及重新取得证据的安排。"},{"title":"写单一中性条目","body":"每题只问一个主要意思，有明确时间与对象。将“先进系统很快也很可靠”拆开；选项需匹配题干，覆盖合理回答，并区分不适用和中立。避免暗示赞同更符合期望。"},{"title":"进行认知预试","body":"在适当许可下让少量目标读者讲述理解、回忆和选项选择过程，记录误解的具体词。预试检验问题是否被按预期理解，不用少量预试回答推断总体。修改后复查是否改变构念。"},{"title":"写评分与验证计划","body":"规定反向题、缺失、不适用和分量表处理。按用途规划内容、结构、相关关系及重复测量等证据。如果只做预试，报告预试发现，不能把它包装成完整量表验证。"}]},{"id":"worked","title":"完整教学设计示范","paragraphs":["教学初稿“系统快捷而且让我信任”同时问速度和信任，读者可能觉得快却不可靠。拆成“过去四周，点击最终确认后我能判断预约状态”和“过去四周，完成一次预约需要很少操作”。它们分别反映状态可预期性和操作负担，未经理论和结构证据不能直接加成信任总分。","若虚构预试读者把“提交”理解为点击查询，就改成“点击最终确认按钮后”；未使用者应选不适用而不被迫猜。记录修改理由和影响，再规划后续收集。这里没有真实参与者，不是实际验证结果。"]},{"id":"repair","title":"错误与具体修订","paragraphs":["错误句：“α=0.91，所以问卷有效并可诊断。”修订：“在该样本与计分条件下观察到较高内部一致性，仍需检查维度、内容覆盖及拟议用途证据。”另一个错误把不适用记成最低分，会将没经历误作负面态度；应按预定规则处理并报告。"]},{"id":"tips","title":"经验和边界","paragraphs":["检查条目时问自己：能否同意前半句而不同意后半句？若可以，通常需要拆题。再检查时间、对象、术语和选项。研究者熟悉的词不等于参与者理解，认知预试常比增加更多题目有用。","每一题应连接研究目的或必要描述。敏感身份、健康和收入信息不是模板必填项，要考虑必要性、可跳答和保护。较长问卷不自动提供更多可靠信息，疲劳可能让后段答案变差。"]}],"exercise":{"materials":"修订“你是否经常觉得学校优秀科研培训很有用并让你更愿意读博”，拆分构念，写中性题并说明用途。","task":"修订“你是否经常觉得学校优秀科研培训很有用并让你更愿意读博”，拆分构念，写中性题并说明用途。","template":"研究问题：\n对象与单位：\n材料或条件：\n操作与比较：\n主要判断：\n限制与修改：","answer":"示范：第一题问“过去四周参加的科研培训，对你完成文献检索任务的帮助程度如何”，设无帮助至帮助很大及未参加；第二题问“目前你未来两年申请博士的可能性如何”。分别反映帮助感与意向，不相加成单一总分；即使相关也不能断言培训导致意向变化。","rubric":["说明对象与单位的关系","关键选择有理由而非只列术语","将设计能够支持的结论与不能支持的结论分开"]},"quiz":{"question":"内部一致性高最合理表示什么？","options":["所有用途都有效","提供一个方面的一致性证据，效度仍需论证","无需检查题目"],"correct":1,"explanation":"一致性不是内容、结构或用途有效性的替代证据。"},"references":[{"id":"openstax-research","locator":"阅读测量、操作化和问卷部分。"},{"id":"strobe","locator":"检查变量定义、测量来源及偏倚报告。"}],"next":"把设计写进自己的研究方案，再进入材料整理和分析。","core":false,"chapterId":"c11","stageId":"s4","chineseCount":1557},{"id":"a11-4","title":"抽样、样本量、配对、聚类与重复测量","goal":"3校，每校2班，每班20人，每人前后一次；条件按学校分配。报告各层数量及不能视240个独立观察的理由。","scope":"适用于定量研究设计的入门判断；具体领域的测量技术、正式样本规划与审批需要相应专业支持。","prerequisites":["a11-1"],"minutes":65,"tags":["实证定量"],"terms":[{"zh":"抽样框","en":"sampling frame","definition":"实际可被抽中的单位名单或覆盖范围，可能不等于目标总体。"},{"zh":"配对","en":"pairing","definition":"观察通过同一单位或预设匹配关系连接。"},{"zh":"聚类","en":"clustering","definition":"同一机构或批次的观察可能相关，不能当完全独立。"}],"sections":[{"id":"concepts","title":"先理解设计中的概念","paragraphs":["样本量先是结构问题，才是数字问题。20对象各用两流程测量形成20对，而不是40独立对象；一张纸10个测点仍主要来自一张纸；学生来自少数班级时，同班环境使观察相关。忽略依赖关系会压小标准误，让结果看起来比真实信息量更精确。","随机抽样有助于由抽样框推断总体，但名单遗漏、无应答和退出仍可造成偏差。便利样本可以研究，却必须说明覆盖范围。增加样本只能减少某些随机误差，不能自动消除系统性选择。应分别记录邀请、纳入、完成及进入分析的数量。"]},{"id":"reasoning","title":"比较为什么能够支持判断","paragraphs":["不存在通用的至少30规则。估计精度要考虑变异和期望区间宽度；检验差异涉及重要效果、错误风险、设计效率与失访；聚类设计还需群数和群内相关。小先导样本的效果估计往往不稳定，不能挑最有利估计保证功效。资源给出的数量要与统计需要区分，必要时将目标调整为可行性或描述。"]},{"id":"workflow","title":"一步一步形成研究设计","paragraphs":["准备研究单位表和一页方案，将以下操作及理由逐项记录。"],"steps":[{"title":"画材料层级","body":"按批次、对象、条件、时间、重复读数画图，标出接受处理的层级。整班接受条件时班级是分配单位，即使每人有分数也不能忽略群组结构。把图交给分析合作者比只说有多少行更有效。"},{"title":"比较总体和名单","body":"写结论希望覆盖谁、实际能取得谁、哪些单位无法接触。分别记录资格排除、拒绝、失访和缺数据，不能把不利结果临时认定为不符合资格。"},{"title":"检查配对真实性","body":"用稳定ID连接同一对象，数每对是否同时有A、B。多时点测量需考虑重复结构。缺失一边不能随便找另一对象补上；仅因为两列等长也不表示存在配对。"},{"title":"确定规划输入","body":"先定估计、检验或流程目标，再写重要差异、变异来源、误报风险和预期失访。参数来自领域依据、透明假设或可信先导信息；复杂设计带着输入向统计合作者核实。"},{"title":"核算成本和停止","body":"将对象、批次、重复与操作时间相乘，检查资源。不足时缩小问题或改进测量，不能靠重复读数假装增加独立对象。预先规定停止，不因p刚过线就结束，也不无限补样直到显著。"}]},{"id":"worked","title":"完整教学设计示范","paragraphs":["统一案例有20个构造对象，各有参考值、A和B读数。每个对象形成一个绝对误差差值，配对分析n=20。40个读数共享20个对象，不能当40个独立样本；文件大小只是教学设定，不是通过功效计算确定的真实实验规模。","另一教学结构：4批、每批5样品、每样品3读数，共60读数，应同时报4批、20样品和60次测量。如果处理按批分配，条件比较信息主要来自4批；若在批内分给样品，也需考虑批次。单写n=60掩盖了决定分析的关系。","一个可以实际操作的精度规划教学算例：假设预计配对差标准差约为 1 g，希望平均差的百分之九十五区间半宽约为 0.4 g。先用正态近似 n≈(1.96×1÷0.4)²=24.01，向上取二十五个独立完整配对。这只是起始粗估，不能把二十五解释为任何研究的通用要求。因为标准差也是估计的，小样本时需要用 t 临界值迭代：先取候选 n，算 T.INV.2T(0.05,n−1)×1/SQRT(n)，增大 n 直到半宽不超过 0.4。n=26 时约 0.404，n=27 时约 0.396，因此这组假定下的简单 t 规划约需二十七个完整独立配对。","若假定完整数据损失约百分之十，可用 27÷0.9=30 作为初步招募数量；这只补数量，不消除失访偏差。若先导研究对标准差估计很不稳定，应再试 1.3 g 等有理由的较大变异假设，并咨询相应领域的规划方法。此算例按区间精度规划，不等于针对某个效果的检验功效计算。样本聚类、重复测量、多个主要结果和有限总体都可能改变算法；真实申请方案应把假定、来源和资源限制一起写出。"]},{"id":"repair","title":"错误与具体修订","paragraphs":["容易踩的坑：“每组不足30，重复测几次凑够。”重复可能提高测量稳定性，却不等于新增对象；应区分对象变异与测量噪声，再决定增加哪一层信息。另一错误按表格行序相减制造配对；真正配对要有对象ID或事先明确的匹配理由。"]},{"id":"tips","title":"经验和边界","paragraphs":["分析前用透视表数唯一ID、各ID条件数和时点数，可以发现重复录入、缺配对和错误合并。合并造成的重复行不能自动当新增观察。整理时保留原始记录，修订另存并说明理由。","小型可行性研究可以报告流程、失败和变异，不必伪装成充分检验效果的研究。把限制写进问题是研究判断的一部分；隐藏单位结构会直接破坏推断。"]}],"exercise":{"materials":"3校，每校2班，每班20人，每人前后一次；条件按学校分配。报告各层数量及不能视240个独立观察的理由。","task":"3校，每校2班，每班20人，每人前后一次；条件按学校分配。报告各层数量及不能视240个独立观察的理由。","template":"研究问题：\n对象与单位：\n材料或条件：\n操作与比较：\n主要判断：\n限制与修改：","answer":"答案：3校、6班、120人、240次读数，分配单位是学校。读数嵌套人员，人员嵌套班级学校；前后有配对，群内可能相关。只有3所学校使组间比较信息很有限，需要审慎设计，不能用240个读数掩盖群数不足。","rubric":["说明对象与单位的关系","关键选择有理由而非只列术语","将设计能够支持的结论与不能支持的结论分开"]},"quiz":{"question":"20对象各在A、B测一次，通常形成多少个对象内差值？","options":["40个","20个","由软件任意决定"],"correct":1,"explanation":"每个对象形成一个B−A差，须保留对象内联系。"},"references":[{"id":"nist-statistics","locator":"阅读配对比较、试验设计与样本规划。"},{"id":"consort","locator":"阅读样本量、随机化单位及参与者流程，注意群组设计。"}],"next":"把设计写进自己的研究方案，再进入材料整理和分析。","core":true,"chapterId":"c11","stageId":"s4","chineseCount":1744},{"id":"a12-1","title":"访谈、焦点小组与访谈提纲","goal":"写三个不诱导的追问，并说明它们分别补充什么证据。","scope":"提供可执行的入门练习和方法判断；真实人类参与者研究须遵循所在机构伦理与资料使用要求。","prerequisites":["a10-3"],"minutes":60,"tags":["定性与案例"],"terms":[{"zh":"半结构访谈","en":"semi-structured interview","definition":"有共同主题与提问线索，但允许依据回答追问具体经历。"},{"zh":"焦点小组","en":"focus group","definition":"利用参与者互动讨论某个问题，互动本身也是需要分析的材料。"},{"zh":"追问","en":"probe","definition":"请对方补充过程、例子、含义或变化，避免替对方给出答案。"}],"sections":[{"id":"concepts","title":"辨认本方法要理解的对象","paragraphs":["访谈不是把调查问卷读给别人听。它特别适合了解参与者如何理解经验、描述行动和解释选择，但访谈中的叙述不等于对事件的直接录像。回忆、身份、场合和采访关系都会影响表达。你需要记录这些条件，并把“受访者如何讲述”与“事件客观怎样发生”区分开。","半结构访谈使用共同提纲保证相关主题被谈到，同时允许追问新线索。焦点小组更重视互动：谁响应、谁沉默、意见怎样改变，不能将它看成一次便宜收集多人独立答案的工具。敏感经历、权力差距大或容易相互识别的情境，个人访谈可能更合适，但同样需要保护。"]},{"id":"reasoning","title":"材料怎样成为解释的依据","paragraphs":["取样要围绕研究问题和信息需要作理由充分的选择。想理解新手操作障碍，可以寻找不同经验与不同任务结果的参与者，而不是只访谈最配合的朋友。数量不是唯一标准；材料深度、问题范围、群体差异和分析取向都重要。不应预先宣称访谈某个固定人数必然饱和，尤其不同定性传统对“饱和”的理解并不相同。"]},{"id":"workflow","title":"从准备到分析的操作顺序","paragraphs":["先使用这篇课提供的教学材料练习，再决定是否具备正式开展研究的条件。"],"steps":[{"title":"写问题与取样理由","body":"将“大家怎么看AI”改成“新手在首次使用文献辅助工具时怎样判断回答能否引用”。列希望覆盖的经历差异，例如成功核实、发现错误、放弃使用。写清招募途径和排除理由，避免按预期答案挑人。"},{"title":"设计从经历到解释的提纲","body":"先问最近一次具体任务，让对方按时间讲过程，再问关键决定和原因。准备开放问句：“当时你先做了什么？”“能举一个例子吗？”少用带结论的“是不是因为工具不好”。给结尾留出对方补充的空间。"},{"title":"准备同意与记录安排","body":"说明目的、录音方式、用途、退出规则、资料保存与匿名限制。不要承诺无法实现的完全匿名，焦点小组成员也会听到彼此内容。建立身份表与材料的分离规则，取得必要批准后才能正式收集。"},{"title":"预试并调整提纲","body":"先用合适教学演练检查术语、顺序和访谈时长。记录哪个问题只能得到一句口号、哪个问题引出了具体经历。修改提问，不为了期待的结果诱导答案；正式版本变化应保留日期和理由。"},{"title":"访谈后立即写备忘","body":"区分录音可见的话语、场景观察、个人感受和初步解释。标记值得追问的矛盾与新问题。转录时保存必要的停顿或互动信息，按照分析用途决定细节，而不是追求所有项目同一转录标准。"}]},{"id":"worked","title":"具体材料与完整示范","paragraphs":["教学提纲成品：开场问“请回忆最近一次查找论文的任务”；过程问“你在哪里卡住”；具体追问“能指给我看当时哪一句让你不确定吗”；决策问“你怎么决定继续查或停止”；比较问“与以前不用这个工具时有何不同”；结束问“还有什么我没问到却影响这次任务”。每个问题对应经历、判断或背景，不把工具优劣预设在题干。","教学片段：“它给了我三个标题，我觉得很像真的，后来第一个查不到，我就全部放弃。”初步记录可写：先依据形式可信感接受，第一次核验失败后整体撤回信任。尚不能断言所有新手都这样，也不能假定三个标题全部虚假；需要进一步问核验方式和是否有其他解释。"]},{"id":"repair","title":"错误处理及修订","paragraphs":["错误追问：“所以你就是因为AI经常骗人而害怕，对吧？”这替对方建立了情绪和因果。修订为：“查不到第一个标题后，你当时怎么想？接下来做了什么？”如果对方只说“不好用”，请其讲具体一次行为，不能自动将“不好用”编码成准确性差。"]},{"id":"tips","title":"经验和方法边界","paragraphs":["好用的追问通常很短：请举例、当时怎么判断、有没有相反经历。沉默不必立刻填满，给思考时间；但不要用长时间沉默施压让对方透露敏感信息。研究者在场会影响回答，应把关系和位置写入反思。","访谈不能单独估计总体发生率，也不必总用于因果验证。焦点小组中某意见被多次响应，可能体现互动规范而非独立支持票数。分析时保留谁对谁作回应，避免把一场讨论拆成许多独立样本。"]}],"exercise":{"materials":"使用这篇课“标题查不到后全部放弃”的教学片段。","task":"写三个不诱导的追问，并说明它们分别补充什么证据。","template":"研究问题：\n材料边界：\n操作记录：\n支持解释的材料：\n替代解释：\n有限结论：","answer":"答案：“你当时用了什么途径查第一个标题？”补充核验过程；“另外两个标题后来有没有再查？”区分全部错误与一次失败后的判断；“有没有一次查到原文后继续使用工具的经历？”寻找对照与反例。三问不预设受访者害怕或工具全部造假，能够帮助形成更细的解释。","rubric":["提问围绕具体经历","没有把研究者结论塞给受访者","材料与解释分开记录","说明招募和隐私边界"]},"quiz":{"question":"焦点小组中五人附和一人，最应怎样理解？","options":["获得六个独立投票","把附和及互动情境作为材料分析","无需记录最初发言者"],"correct":1,"explanation":"小组互动会影响表达，不能机械地当独立问卷计数。"},"references":[{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"},{"id":"thematic-analysis","locator":"阅读访谈材料进入分析时如何保留语境。"}],"next":"把练习里的材料、解释和疑问分开存；后面用证据整理和反例检查的课再核一遍。","core":false,"chapterId":"c12","stageId":"s4","chineseCount":1686},{"id":"a12-2","title":"案例研究、观察、田野与民族志","goal":"为版本混乱案例写边界、三种证据来源与一个竞争解释。","scope":"提供可执行的入门练习和方法判断；真实人类参与者研究须遵循所在机构伦理与资料使用要求。","prerequisites":["a12-1"],"minutes":60,"tags":["定性与案例"],"terms":[{"zh":"案例","en":"case","definition":"围绕问题划定的有边界对象，可以是组织、事件、流程、社区或实践，而不只是一个人。"},{"zh":"参与观察","en":"participant observation","definition":"研究者通过一定程度参与情境并作系统观察来理解实践。"},{"zh":"民族志","en":"ethnography","definition":"通过持续情境接触、观察及多种材料理解群体的文化与实践，不能简化为几次访谈。"}],"sections":[{"id":"concepts","title":"辨认本方法要理解的对象","paragraphs":["案例研究先问“这个案例的边界在哪里”。研究一个实验室的异常恢复流程，可以界定为某团队、某任务和某时段；若边界无限扩大到整个行业，就很难说明哪些材料属于案例。单案例不是“只有一个数据点”的同义词：一个案例可以包含文件、观察、访谈与日志，但其推断方式仍需解释，不能自动推广到总体比例。","观察让你看到人们如何实际行动；访谈让你理解他们如何解释行动，两者可能不同。民族志通常需要持续而深入的情境参与，并关注意义、惯例、权力与研究者位置。短期参观写成“民族志”会夸大材料基础；也不能因为进入现场就获得任意记录人员和敏感内容的权利。"]},{"id":"reasoning","title":"材料怎样成为解释的依据","paragraphs":["案例选择需要与理论或问题连接。可以选择典型、极端、关键或对照案例，但这些词不是装饰。典型案例需要说明典型于什么，极端案例不能代表一般发生率，对照案例要解释可比较条件。案例研究的贡献可能是机制理解、概念发展或对既有解释的挑战，质量在于证据链和解释，而非把样本数机械对标调查研究。"]},{"id":"workflow","title":"从准备到分析的操作顺序","paragraphs":["先使用这篇课提供的教学材料练习，再决定是否具备正式开展研究的条件。"],"steps":[{"title":"界定案例边界","body":"写对象、场所、时间、参与者与活动范围，并列不纳入什么。比如只分析资料交接流程，不把整个组织绩效纳入。边界改变时记录理由，否则材料越收越多却没有焦点。"},{"title":"说明为什么选择它","body":"把案例与研究问题连接：它是否展示一个难以解释的失败，是否能观察某机制，是否提供条件对照。记录便利性因素，不能把“容易进去”改称理论抽样而没有理论依据。"},{"title":"安排多源证据","body":"制作问题—材料表：流程规定来自文件，执行来自观察，参与者理解来自访谈，时间顺序来自日志。不同材料不是互相盖章，先检查是否观察同一对象与时段。"},{"title":"写现场记录","body":"将时间、地点、动作、原话与研究者解释分栏。尽快补全简记，并标出记忆补写。观察到某人没按流程做，不等于知道其动机；把动机作为后续问题而非直接事实。"},{"title":"建立事件链与解释","body":"按时间重建关键事件，比较不同来源和相反案例。为每个解释列支持材料、反证与缺口。报告应让读者能追到证据，同时避免通过组合细节重新识别原本匿名的人。"}]},{"id":"worked","title":"具体材料与完整示范","paragraphs":["教学案例：一个虚构团队交接数据时出现版本混乱。边界是四周内两次交接，材料包括操作规定、文件时间戳和两段教学访谈。规定要求统一目录，时间戳显示两次从个人文件夹发送，访谈称共享盘访问不稳定。初步解释是正式规则与可用工具之间存在张力，但还需核实访问日志和其他成功交接。","完成的事件链：周一生成版本A；周二甲在个人目录修改为B；周三乙按邮件中的A继续分析；周四发现图表不一致。证据支持版本分叉发生，却不能据此指责某个人粗心。改进建议可以针对唯一交接入口与版本标识，并明确需要后续观察验证。"]},{"id":"repair","title":"错误处理及修订","paragraphs":["错误写法：“观察了两小时，所以我们完成了民族志并揭示所有实验室文化。”修订为：“完成一次短时现场观察，记录该时段任务协作；材料不足以支持长期文化解释。”另一错误是只选成功故事说明机制，而不检查为什么类似条件下也有失败；应主动寻找反例或对照情境。"]},{"id":"tips","title":"经验和方法边界","paragraphs":["现场笔记可以采用两栏：左边写可观察事件，右边写解释与追问。这个做法简单，却能减少把猜测写成事实。写人物代号并不一定匿名，罕见职位、日期和事件组合仍可能识别个人，分享前需审查。","研究者与现场关系会影响能看见什么：作为管理者、实习生或外部访客，获得的信息不同。把位置与访问限制写出来，帮助读者理解材料边界。无法长期进入现场时，可以做更窄的案例或文件研究，不必给方法起更宏大的名称。"]}],"exercise":{"materials":"教学材料：同一流程规定、两份文件时间戳、两名成员对版本问题的不同解释。","task":"为版本混乱案例写边界、三种证据来源与一个竞争解释。","template":"研究问题：\n材料边界：\n操作记录：\n支持解释的材料：\n替代解释：\n有限结论：","answer":"答案：边界为团队四周内两次数据交接；规定证明正式要求，时间戳帮助重建版本，访谈解释成员感受。竞争解释是共享盘故障、培训不足或职责不清，不能只凭一段访谈选定。下一步查访问记录、培训安排及一次成功交接，比较哪种解释能覆盖正反例。","rubric":["案例边界具体","选择理由与问题相关","证据与解释可追溯","没有将案例频率推广为总体比例"]},"quiz":{"question":"单案例研究最重要的首先是？","options":["把案例称为典型就足够","界定案例边界及其与问题的关系","必须添加统计检验"],"correct":1,"explanation":"案例边界与选择逻辑决定材料范围及可作的推断。"},"references":[{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"},{"id":"openstax-research","locator":"阅读田野、案例和观察方法的介绍。"}],"next":"把练习里的材料、解释和疑问分开存；后面用证据整理和反例检查的课再核一遍。","core":false,"chapterId":"c12","stageId":"s4","chineseCount":1679},{"id":"a12-3","title":"定性编码、主题分析与扎根理论的区别","goal":"给出两个候选主题，选择一个并写出反例如何限制它。","scope":"提供可执行的入门练习和方法判断；真实人类参与者研究须遵循所在机构伦理与资料使用要求。","prerequisites":["a12-1","a10-3"],"minutes":60,"tags":["定性与案例"],"terms":[{"zh":"编码","en":"coding","definition":"为材料片段赋予分析标签，帮助组织含义和进一步比较。"},{"zh":"主题","en":"theme","definition":"围绕核心概念形成的有解释力的意义模式，不只是常被提及的话题。"},{"zh":"反思性主题分析","en":"reflexive thematic analysis","definition":"强调研究者主动解释与反思的主题分析取向，主题通过分析建构而非被动发现。"}],"sections":[{"id":"concepts","title":"辨认本方法要理解的对象","paragraphs":["编码是动作，不是完整研究方法。相同的标注工具可以服务不同分析传统，因此“用了NVivo”不能说明怎么分析。主题分析、内容分析和扎根理论在目标与实践上不同：主题分析形成意义模式，内容分析可按特定规则归类，扎根理论通常强调持续比较、概念发展和理论形成，部分传统还要求理论取样。不能做几段编码就宣称产生扎根理论。","主题也不等于访谈提纲标题。“工具”“困难”“优点”是话题目录，未必是有解释力的主题。较具体的主题可能是“形式可信感先建立信任，核验失败后信任整体撤回”。它说明材料中怎样发生意义关系，仍需用多处材料及差异支撑，而不是把一段引文包装成宏大解释。"]},{"id":"reasoning","title":"材料怎样成为解释的依据","paragraphs":["先声明分析取向再决定质量做法。反思性主题分析把研究者的视角视为分析资源，讨论和反思比追求唯一正确编码更关键；某些代码本取向强调共同分类规则，可以使用一致性检查。编码者一致率不是所有定性方法必需，成员核验也不是每种研究的普遍金标准。需要说明你的方法为什么与问题、知识立场和团队工作方式一致。"]},{"id":"workflow","title":"从准备到分析的操作顺序","paragraphs":["先使用这篇课提供的教学材料练习，再决定是否具备正式开展研究的条件。"],"steps":[{"title":"熟悉完整材料","body":"读完整访谈而非只摘有用句，记录语境、矛盾、情绪和初步问题。先写一段整体摘要，防止后来编码把片段从原有意义中切断。反复阅读时保留初步理解如何变化。"},{"title":"形成初始编码","body":"给片段写短而具体的标签，既可贴近原话也可解释潜在含义，取决于分析目标。同一片段可以有多个相关编码。记录标签指什么、不指什么和示例，但不要求所有取向都冻结成不变代码本。"},{"title":"比较并形成候选主题","body":"把相关编码放一起，问它们共同表达什么中心意思。不要只按词频排序；罕见但揭示边界的材料也可能重要。画主题关系图，检查主题之间是否重复或过宽。"},{"title":"回到原文审查","body":"检查候选主题是否覆盖材料、是否忽略反例，是否把研究者预设硬塞给所有片段。主题不合适就拆分、合并或放弃，并记录理由。这个循环可能多次发生，并非一次标注后自动完成。"},{"title":"写分析叙事","body":"每个主题先说明解释，再给必要片段，接着分析片段怎样支持判断及其限制。报告研究者立场和分析过程。若只是引用堆砌而没有解释，或解释宏大却没有材料，均需重写。"}]},{"id":"worked","title":"具体材料与完整示范","paragraphs":["教学材料甲：“标题排得很像真的，我先信了”；乙：“查不到第一篇，我就不敢用了”；丙：“错一条没关系，我会逐条核实”。初始编码可为形式信任、核验失败触发撤回、逐条校准信任。候选主题为“信任从外观判断转向核验实践”，但丙提醒并非所有人都整体撤回。","完成的分析段可写：“教学片段呈现两种核验后的信任调整：乙将一次失败扩展为对工具整体的不信任，丙则逐条判断。甲说明最初信任可能受到形式线索影响。由此提出的解释是核验策略影响信任调整方式；三段构造材料不能说明这些方式在实际人群中的分布，也不能证明策略因果作用。”"]},{"id":"repair","title":"错误处理及修订","paragraphs":["错误过程：“三个人提到信任，因此主题是信任，结论为所有人信任AI。”修订要区分提及、立场与过程；材料事实上包含信任变化与差异。另一错误是用一致率低否定反思性分析，却没说明为何它需要唯一编码答案。应先声明取向，再用适合它的反思、讨论和材料审查评价。"]},{"id":"tips","title":"经验和方法边界","paragraphs":["一个有效写作技巧是给主题起一个能表达关系或过程的名字，再问每个词有何材料依据。如果标题只剩一个大名词，通常还需要分析。也别为了新颖而起难懂名称，主题应帮助读者理解证据。","初学者可以完整做一次小型主题分析练习，但不要自动称为扎根理论。若目标是建构理论，需要进一步学习所属传统的持续比较、取样与理论发展要求。分析软件只帮助组织，不会替你承担解释责任。"]}],"exercise":{"materials":"使用甲乙丙三个教学片段。","task":"给出两个候选主题，选择一个并写出反例如何限制它。","template":"研究问题：\n材料边界：\n操作记录：\n支持解释的材料：\n替代解释：\n有限结论：","answer":"参考答案：候选一“核验失败导致整体撤回”仅适合乙；候选二“核验策略塑造信任调整”能容纳乙与丙的差异，也将甲置于初始判断阶段。选择后者，但承认它是对三段教学材料的解释线索，不是经验证的普遍机制。还需具体任务经历与不同策略形成背景。","rubric":["编码与主题有区别","主题有中心概念与材料支持","反例改变或限定解释","质量标准与分析取向一致"]},"quiz":{"question":"反思性主题分析必须把编码者一致率当作唯一质量指标吗？","options":["必须，否则不科学","不应机械要求，应与分析取向和知识立场相符","只要用了软件就不需解释"],"correct":1,"explanation":"不同主题分析取向有不同质量实践；反思性分析强调研究者解释及反思，不默认唯一编码答案。"},"references":[{"id":"thematic-analysis","locator":"阅读反思性主题分析、主题概念与常见方法混用问题。"},{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"}],"next":"把练习里的材料、解释和疑问分开存；后面用证据整理和反例检查的课再核一遍。","core":false,"chapterId":"c12","stageId":"s4","chineseCount":1719},{"id":"a12-4","title":"文本细读、史料批判、语境与解释","goal":"写一个同时解释便利与登记条件的短段，并提出需要的补充史料。","scope":"提供可执行的入门练习和方法判断；真实人类参与者研究须遵循所在机构伦理与资料使用要求。","prerequisites":["a02-2","a10-1"],"minutes":60,"tags":["人文解释"],"terms":[{"zh":"细读","en":"close reading","definition":"注意文本语言、结构、修辞和形式中的具体细节，并解释其作用。"},{"zh":"史料批判","en":"source criticism","definition":"检查材料的来源、形成情境、作者位置、传递与用途，以评估其可支持的历史判断。"},{"zh":"语境","en":"context","definition":"理解材料时相关的时间、制度、语言习惯、受众和文本关系。"}],"sections":[{"id":"concepts","title":"辨认本方法要理解的对象","paragraphs":["人文解释不是自由联想。一个有说服力的解释需要让读者看到具体词句、形式、史料关系和推理步骤。文本可以是小说、报刊、政策文件、图像或档案；不同材料的产生方式不同，所能支持的判断也不同。某份公开通告说明机构希望怎样呈现政策，不必然说明实际执行已经如此。","细读关注如何表达：重复、对照、叙述视角、词义变化、沉默和结构安排。史料批判则追问谁在何时为什么留下这份材料，谁保存或编辑了它，有没有版本变动，是否直接见闻。两者可以结合，但不能把“作者写了”直接当作“现实发生了”，也不能把后来的概念不加说明地放回历史人物口中。"]},{"id":"reasoning","title":"材料怎样成为解释的依据","paragraphs":["解释需要在文本细节与较大语境之间来回校正。只看语境容易把材料当作既定理论的例子；只看一个词又可能忽略当时常用含义。对同一段材料提出至少一种竞争解读，比较哪种更能解释关键细节、哪种需要更多未经证明的假设。解释可以不唯一，但不能因此免于证据约束。"]},{"id":"workflow","title":"从准备到分析的操作顺序","paragraphs":["先使用这篇课提供的教学材料练习，再决定是否具备正式开展研究的条件。"],"steps":[{"title":"确定文本与版本","body":"记录题名、作者或机构、时间、版本、出处和使用范围。若只有转录件或译本，说明它与原件的关系。区分当时材料、事后回忆和后来的研究，不把二手转述当一手观察。"},{"title":"先描述再解释","body":"摘出短句或记录具体形式，先说它实际出现什么，再说你如何理解。用两栏区分文本描述与解释。避免尚未引用任何细节就先宣布材料证明压迫、进步或现代性等大判断。"},{"title":"检查形成与保存情境","body":"查受众、用途、作者立场、制度背景和保存选择。档案缺少某群体声音可能源于记录制度，不能直接当作他们没有行动。注明未知之处，寻找其他材料比较。"},{"title":"建立对照与竞争解释","body":"找同一作者不同文本、同时期其他声音或版本变化。提出两种解释并列支持与冲突细节。对照材料的选择应有理由，不只挑最符合主张的句子。"},{"title":"写证据推动的段落","body":"先给有限主张，再呈现必要短引文或细节，解释语法、修辞或史料关系如何支持判断，最后说明范围与替代解释。引文不是自己解释自己，段落中必须看见你的分析动作。"}]},{"id":"worked","title":"具体材料与完整示范","paragraphs":["原创教学通告：“本馆暂设夜间阅览，惟须持证者方得入内。”一种读法强调开放时间延长；另一种强调准入限制。细读“暂设”提示试行性质，“惟须”标记条件，二者共同显示扩展服务与控制资格并存。不能只引前半句便宣布完全开放，也不能只引后半句便否定时间扩展。","完成段落：“该通告把服务扩展与资格限制置于同一安排中。‘夜间阅览’扩展使用时段，而‘暂设’使持续性悬而未定；‘须持证’又明确了进入条件。所以，这里把它解释为有条件的开放表述，而非无差别开放的证据。实际执行和无证者经历需要其他材料。”这只是原创教学文本，不是历史发现。"]},{"id":"repair","title":"错误处理及修订","paragraphs":["容易踩的坑：“通告说欢迎市民，所以所有人都实际自由进入。”修订：“通告以欢迎语言呈现政策，但资格条款限制准入；实际执行尚需登记、投诉或其他材料核对。”另一个错误把现代词义当作历史词义，应查同时期用法、词典和上下文，必要时说明翻译选择。"]},{"id":"tips","title":"经验和方法边界","paragraphs":["有效技巧是给每个解释句标一个证据位置：词、句、段落、版本差异或来源关系。找不到位置时，检查它是否只是背景知识或你的价值判断；后者并非不能出现，但应以恰当形式论证。","不要把“材料没有写”直接当作“事情没有发生”。沉默的意义依赖材料本来应该记录什么、记录机会和保存机制。也不要要求所有人文论证都提出可量化变量；其严谨性可以体现为语义区分、材料比较和对反驳的回应。"]}],"exercise":{"materials":"原创教学文本：“为便利职工，本厂增设休息室；使用须经主管登记。”","task":"写一个同时解释便利与登记条件的短段，并提出需要的补充史料。","template":"研究问题：\n材料边界：\n操作记录：\n支持解释的材料：\n替代解释：\n有限结论：","answer":"示范：表述同时包含福利与管理。增设休息室说明机构提出改善休息设施，登记则使使用进入管理程序。仅凭通告无法判断员工是否觉得便利或受到阻碍，应查使用记录、职工叙述、规章版本及实际开放时间。不能将机构目的直接写成实施效果。","rubric":["引文或细节准确","区分文本表述与实际执行","解释考虑语境与版本","提出有理由的竞争解释"]},"quiz":{"question":"通告没有提及投诉，能否断言没有人不满？","options":["可以，没写就是没有","不能，需考虑材料用途和记录机制","只要通告很正式就可以"],"correct":1,"explanation":"公开通告通常不负责记录所有反应，沉默要结合来源功能解释。"},"references":[{"id":"history-source","locator":"阅读一手来源分析时关于作者、目的、语境和限制的问题。"},{"id":"harvard-paragraph","locator":"Anatomy of a Body Paragraph：Topic sentence、Evidence、Analysis三项与示范段落；这里把它用于组织主张与材料，不将其当作细读或史料研究的完整方法。"}],"next":"把练习里的材料、解释和疑问分开存；后面用证据整理和反例检查的课再核一遍。","core":false,"chapterId":"c12","stageId":"s4","chineseCount":1643},{"id":"a13-1","title":"定义、命题、证明与反例","goal":"选择直接或逆否策略完成证明，并解释为何列举不是证明。","scope":"用于识别方法逻辑并完成透明的小练习；正式研究还需相应领域知识和独立核查。","prerequisites":["a02-3"],"minutes":65,"tags":["理论与计算"],"terms":[{"zh":"定义","en":"definition","definition":"约定对象或概念的准确含义，决定哪些对象属于讨论范围。"},{"zh":"命题","en":"proposition","definition":"在明确范围内可以判断真假的陈述，常包含条件和量词。"},{"zh":"证明","en":"proof","definition":"依据允许的前提、定义和已知结论，通过有效推理支持命题。"}],"sections":[{"id":"concepts","title":"理解本方法的判断对象","paragraphs":["数学或形式研究不能用“测了很多例子都成立”替代证明。有限测试可以帮助发现规律和错误，却不能证明所有整数都满足某性质。反例则不同：如果命题说所有对象都成立，一个满足前提而违反结论的对象就足以否定它。所以，提出命题前要把量词、对象范围和条件写完整。","定义不是装饰。说“稳定”可能指误差有界、扰动后收敛或统计波动小，这些含义不同；定理证明其中一种，不能把结论换成另一种。形式论证通常先定义，再提出命题、证明及推论。证明的价值在于排除推理缺口，而非堆叠复杂符号。"]},{"id":"reasoning","title":"推理成立需要哪些条件","paragraphs":["常见证明策略有直接证明、逆否命题、反证和归纳。策略选择由命题结构决定：条件蕴含结论可从定义展开；整数序列性质可能用归纳；不可能存在某对象可考虑反证。每种策略仍需检查边界。归纳必须有基例和一般归纳步，不能只验证前几个数；反证必须从命题的准确否定出发。","量词顺序也会改变命题。“每个人都有一个可以联系的导师”允许不同人对应不同导师；“存在一个导师能联系所有人”要求同一导师覆盖全体，明显更强。写理论时先用日常小例检查量词，再转成符号，能避免把逐对象成立误写成统一成立。证明每一步都要保持同一含义，不能中途偷偷改变对象范围。"]},{"id":"workflow","title":"从材料到结论的操作","paragraphs":["按顺序留下中间结果，读者应能知道每一步依赖什么。"],"steps":[{"title":"写对象与量词","body":"把“平方是非负的”写成“对任意实数x，x²≥0”。如果对象改为复数，不等号本身需要解释。圈出所有、存在、至少一个、唯一等词，检查它们是不是你真正准备证明的意思。"},{"title":"展开定义与前提","body":"列允许使用的定义和已知结论，明确变量范围。不要把要证明的结论偷偷放进前提；如果使用已有定理，注明其适用条件，尤其连续性、独立性或有限性等条件。"},{"title":"先寻找边界反例","body":"试零、负数、极端值、空集和最小对象等边界。发现反例时判断是命题错误还是缺少条件。记录失败尝试，它们常帮助形成正确版本，而不是只保留最后成功的证明。"},{"title":"选择并写推理链","body":"给每一步写理由，例如由定义、代入、归纳假设或已知定理。若某一步只能说显然，尝试展开到自己能解释的程度；读者应能看出结论如何从前一步得到。"},{"title":"独立检查与收缩结论","body":"将证明交给未参与推导的人或隔一段时间重读，检查是否遗漏条件、循环论证和量词变换。若证明只在特定条件成立，就把条件放回命题，而不是在讨论末尾轻描淡写。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学命题：任意两个奇整数之和是偶整数。定义奇整数为可写成2k+1的整数，其中k是整数。设a=2m+1，b=2n+1，m、n为整数，则a+b=2(m+n+1)。由于m+n+1仍是整数，依偶数定义，a+b为偶数。这个证明覆盖全部符合定义的奇整数，不依赖列举几个例子。","若原命题是“两个奇数之和是奇数”，取1+3=4就是反例。反例必须满足原前提，所以不能拿两个偶数来反驳。这里也显示定义如何进入推理：关键是写成2乘一个整数，而不是仅看结果末位数字。","再检查一个容易漏掉定义域的命题：“对所有实数 x，x² 大于 x。”取 x=0 时两者相等，取 x=0.5 时 x²=0.25 小于 0.5，故全称命题不成立。不是加上“通常”就完成修复；应求解 x²−x=x(x−1)>0，得到 x\u003c0 或 x>1 时成立，而 x=0、1 时相等。成品命题要把范围写进去，并逐一检查边界。这种从反例回到准确条件的过程，也适用于发现某个算法保证只在特定假设下成立。"]},{"id":"repair","title":"错误与修订","paragraphs":["错误证明：“1+3=4，3+5=8，所以所有奇数相加都是偶数。”例子支持猜测但不覆盖无限对象。修订采用一般表示2m+1。另一容易踩的坑：“设a+b是偶数，所以能写成2k，于是结论成立”，这是把结论当假设，构成循环。"]},{"id":"tips","title":"经验和边界","paragraphs":["写证明前先用普通话讲策略，能暴露符号掩盖的跳步。每个变量首次出现都说明是什么，避免同一个符号在不同段落换含义。若结论依赖一个未证明引理，要么补证明，要么明确引用可信来源。","计算机辅助证明与数值测试也不同。数值算法可能有舍入和覆盖范围限制；形式验证需要说明逻辑系统、工具与信任边界。初学时不必追求复杂工具，先完成小命题的定义、量词、证明和反例训练。"]}],"exercise":{"materials":"命题：“任意整数n，若n²为偶数，则n为偶数。”","task":"选择直接或逆否策略完成证明，并解释为何列举不是证明。","template":"问题：\n定义或材料：\n假设：\n操作与推理：\n结果：\n限制或反例：","answer":"示范：用逆否命题，若n为奇数，则n=2k+1，n²=4k²+4k+1=2(2k²+2k)+1为奇数。因此原命题成立。量词范围是整数，k也是整数。检查1、3、5只是例子，不能替代该一般推导。","rubric":["关键概念和前提明确","每一步可被他人检查","示例与一般结论有区别","主动说明反例或限制"]},"quiz":{"question":"要推翻“所有满足条件P的对象都满足Q”，需要什么？","options":["一个不满足P的对象","一个满足P却不满足Q的对象","很多满足Q的对象"],"correct":1,"explanation":"反例必须在原命题讨论范围内，同时违反结论。"},"references":[{"id":"proof-book","locator":"阅读命题、量词、直接证明、逆否和反例章节。"}],"next":"把练习整理成一条能逐步核对的论证，再看对应论文结构课怎么报告。","core":false,"chapterId":"c13","stageId":"s4","chineseCount":1640},{"id":"a13-2","title":"规范性论证、思想实验与反驳","goal":"写一个包含事实假设、规范前提、反对意见与回应的短论证。","scope":"用于识别方法逻辑并完成透明的小练习；正式研究还需相应领域知识和独立核查。","prerequisites":["a02-2","a02-3"],"minutes":65,"tags":["人文解释"],"terms":[{"zh":"规范性主张","en":"normative claim","definition":"关于应该怎样行动、评价或分配的判断，需要价值或规范前提。"},{"zh":"思想实验","en":"thought experiment","definition":"构造受控情境来检验概念、原则或直觉，目的不是报告实际发生率。"},{"zh":"反驳","en":"objection","definition":"指出前提、推理或结论面临的具体问题，要求作者回应。"}],"sections":[{"id":"concepts","title":"理解本方法的判断对象","paragraphs":["规范性研究问“应该怎样”，不能只由“现实怎样”直接推出答案。即使多数人支持某政策，也还需要说明为什么多数偏好足以构成正当性；即使某措施提高效率，也需要讨论效率与权利、公平或责任的关系。经验材料可以约束方案可行性，但不能自动替代价值论证。","一个规范论证通常有事实前提、规范前提和结论。必须把两种前提分开，读者才知道分歧在哪里。例如事实前提“算法会犯错”和规范前提“涉及重大权益的错误应可申诉”，共同支持“应设置申诉机制”。如果事实不准确或规范原则存在冲突，结论都要重新审查。"]},{"id":"reasoning","title":"推理成立需要哪些条件","paragraphs":["思想实验通过改变一个关键条件来检验原则。它应足够清楚，不能靠偷偷换定义或把相反意见写得荒谬来获胜。直觉可以提出疑问，但不同人对同一情境的直觉可能不同；作者需要进一步给出理由，检查原则一致性及现实相关性。哲学写作的说服力往往来自对最强反对意见的认真回应。"]},{"id":"workflow","title":"从材料到结论的操作","paragraphs":["按顺序留下中间结果，读者应能知道每一步依赖什么。"],"steps":[{"title":"写出明确主张","body":"把“AI应当公平”改成一个可争论的要求，如“用于奖学金筛选的自动系统应提供能够纠正错误资料的申诉渠道”。注明适用情境，避免用宽泛美德词掩盖具体制度选择。"},{"title":"分列事实与价值前提","body":"事实部分要有适当来源或标为假设；价值部分解释采用何种原则。把隐藏前提补出来，例如为何纠错权重高于行政便利。若原则冲突，不能假装只有一个价值值得考虑。"},{"title":"画论证结构","body":"按前提一、前提二、推论、结论排列，检查结论是否真的由前提出发。不要只用情绪性例子重复结论；必要时增加限定条件，说明原则在什么情况下会被其他理由压过。"},{"title":"构造最强反对意见","body":"请替对方提出有理由的成本、滥用、公平或责任问题。先准确呈现再回应，可以承认反对意见使方案需要修改。不要把所有反对者都描述为不关心公平。"},{"title":"用思想实验检查边界","body":"改变一个关键条件，例如申诉成本极高或决定可立即逆转，观察原原则是否仍成立。若你随情境变化调整判断，写清是哪个理由起作用；最后再检查思想实验与真实制度有何差距。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学论证：“自动筛选可能使用错误个人资料；重大机会分配应允许当事人纠正可核实的事实错误；因此自动筛选应设置资料纠错通道。”反对意见是无限申诉会拖延全部决策。回应可将通道限定为可核实事实、更正期限和复核责任，并区分事实纠错与对评判标准的不满。","完成后的主张变为：“对以个人资料作出且影响重大机会的自动初筛，应提供有期限、可记录的事实纠错程序；其范围和响应时限应与风险及行政成本相称。”这比“任何AI决定都必须无限次重审”更精确，也展示反对意见如何改变设计。该段是规范性教学论证，不是假装已经证明某政策现实效果。"]},{"id":"repair","title":"错误与修订","paragraphs":["容易踩的坑：“调查显示80%支持，所以政策在伦理上正确。”数字只能说明特定样本中的态度，尚需论证态度为何具有规范权重。修订应分别报告态度证据与正当性理由。另一错误是思想实验每次同时改变多个条件，导致不知道是什么推动判断，应尽量控制关键差异。"]},{"id":"tips","title":"经验和边界","paragraphs":["写作时可给每个句子标“事实、原则、推理、反对、回应”。如果一整页只有口号和评价，缺少论证连接；如果只有事实，可能还没回答应该怎样。清楚标注有助于把争论定位在真正不同的前提。","不要把反驳理解为必须完全击败对方。承认一部分成本并修改范围，常使主张更稳健。也不要把个人道德直觉直接当普遍规则；说明原则来自何种理论、为何适用，以及读者可以在哪些位置提出异议。"]}],"exercise":{"materials":"教学问题：公共图书馆是否应要求所有读者实名预约座位？","task":"写一个包含事实假设、规范前提、反对意见与回应的短论证。","template":"问题：\n定义或材料：\n假设：\n操作与推理：\n结果：\n限制或反例：","answer":"示范：假设实名有助于处理重复占座，但也增加身份资料收集。规范前提是管理措施应与问题程度相称并尽量减少不必要隐私负担。反对全面实名的理由是存在较低侵入替代，例如临时号码与现场验证；回应需比较替代是否有效。结论暂为先评估较少资料方案，不能仅因管理方便就证明全面实名必要。","rubric":["关键概念和前提明确","每一步可被他人检查","示例与一般结论有区别","主动说明反例或限制"]},"quiz":{"question":"从“多数人赞成”直接推出“道德上正确”缺什么？","options":["更多形容词","解释多数偏好为何具有规范权重的前提","只需要更大样本"],"correct":1,"explanation":"经验态度与规范正当性之间需要明确论证，而不只是增加调查人数。"},"references":[{"id":"philosophy-writing","locator":"Brief Guides to Writing in the Disciplines目录入口：可选择Philosophy/History/English对应指南继续阅读。本次仅核对该目录及链接，未将所链接PDF当作已核读的全文；这篇课论证示范为原创教学整理。"}],"next":"把练习整理成一条能逐步核对的论证，再看对应论文结构课怎么报告。","core":false,"chapterId":"c13","stageId":"s4","chineseCount":1641},{"id":"a13-3","title":"数学建模、仿真及模型验证","goal":"解释计算验证与现实适用性检验的区别，并给出一个未纳入模型的过程。","scope":"用于识别方法逻辑并完成透明的小练习；正式研究还需相应领域知识和独立核查。","prerequisites":["a10-2","a13-1"],"minutes":65,"tags":["理论与计算"],"terms":[{"zh":"模型","en":"model","definition":"为特定目的选择变量、关系和假设构成的现实简化。"},{"zh":"验证计算","en":"verification","definition":"检查代码与计算是否正确实现了规定的数学模型。"},{"zh":"检验适用性","en":"validation","definition":"检查模型在拟议用途下是否足够贴合相关现实证据。"}],"sections":[{"id":"concepts","title":"理解本方法的判断对象","paragraphs":["数学模型不是现实的缩小照片，而是为问题保留部分关系、忽略其他细节的选择。模型是否好，取决于用途：粗略预测趋势和高风险控制需要不同精度。参数拟合得好不表示机制一定正确，因为不同模型可能产生相似曲线；解释、预测和控制用途必须分清。","仿真是在模型与设定条件下计算后果。它可以探索难以实验的情境，但输出的精度受输入、假设、数值方法和现实适用范围限制。必须区分代码是否实现正确与模型是否适用于现实。前者通过解析例、单位测试和守恒检查等验证，后者需要独立现实资料、误差评价和用途判断。"]},{"id":"reasoning","title":"推理成立需要哪些条件","paragraphs":["模型研究中一个常见陷阱是用同一批数据调参数又评价表现。这样得到的误差常过于乐观。另一个陷阱是把默认参数当作已知事实。参数来自测量、文献或教学设定，应分别标注，检查不确定性如何传到输出。敏感性分析帮助辨认哪些参数最影响结论，但不能自动消除错误结构。"]},{"id":"workflow","title":"从材料到结论的操作","paragraphs":["按顺序留下中间结果，读者应能知道每一步依赖什么。"],"steps":[{"title":"限定问题与输出","body":"写模型准备预测或解释什么，结果单位、时间尺度和允许误差是什么。先选最简单仍能回答问题的结构，避免为了显得复杂引入无法确定的参数。"},{"title":"列变量与假设","body":"定义状态、输入、参数、初始条件和边界条件；逐项写单位。说明忽略哪些过程及理由，例如假设环境温度恒定。若假设明显不适用，先改问题范围而不是直接运行。"},{"title":"推导并检查量纲","body":"从关系式到可计算形式，检查左右单位、极端条件和符号方向。若温差为零仍预测持续变化，可能有公式错误。优先找一个有解析解的小例子验证数值程序。"},{"title":"实现与数值核查","body":"记录代码版本、软件环境、随机种子与步长。改变步长看解是否收敛，检查是否违反守恒或物理限制。数值方法的误差应与模型误差分开说明。"},{"title":"独立比较与敏感性","body":"用未用于调参的资料评价输出与用途相关误差；逐步改变有根据的参数范围，展示结论是否稳定。报告失效条件和没有外部数据的限制，避免把纯仿真写成实测验证。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学模型：冷却过程T(t)=T_env+(T0−T_env)exp(−kt)。令T_env=20℃，T0=80℃，k=0.1每分钟，t=10分钟，则T约42.07℃。这一数值来自明确的假设与参数，不是对真实杯子温度的测量。若k=0，模型保持80℃；时间很长时趋向20℃，这些边界检查能发现部分实现错误。","若用欧拉法，更新为T_next=T−k(T−T_env)Δt。先用小步长与解析值比较，再减半步长检查误差是否下降。即使计算正确，现实中的蒸发、空气流动和温度依赖参数仍可能使模型不适用。完整报告应分别写代码检查通过了什么和现实验证尚缺什么。","还可以把数值误差算出来：欧拉法步长为一分钟时，十分钟后 T=20+60×0.9^10≈40.92℃，相对解析值约低 1.15℃；步长半分钟时为 20+60×0.95^20≈41.51℃，约低 0.56℃。减小步长后误差下降，符合该例的数值收敛预期，却仍没有提供真实物体符合冷却模型的证据。表格中一列时间、一列温度，逐行用上一温度更新，即可核对这个过程；必须让步数与总时间一致，不能减半步长却仍只算十步。"]},{"id":"repair","title":"错误与修订","paragraphs":["容易踩的坑：“曲线很光滑，因此模型准确。”光滑只是计算表现。修订应列解析或守恒检查、独立数据比较和误差。另一错误是调参直到同一数据拟合很好再称验证成功，应分开校准资料与验证资料，或清楚报告尚无独立验证。"]},{"id":"tips","title":"经验和边界","paragraphs":["最省力的排错顺序是先查单位、符号、初始条件和极端输入，再查算法。保存一个最小可运行例子，修改模型后重跑它，比直接在巨大仿真中寻找异常快得多。","仿真结果可以形成有价值的条件性结论：“在这些假设与参数范围内，模型预测……”它不必伪装成现实事实。若用模型支持安全或临床决策，验证要求远高于课堂演示，应由相关专业规范确定。","参数 k 的单位是一分钟的倒数，因为指数 kt 必须无量纲。若把时间换成秒却保持 k=0.1，就把过程速度错误放大六十倍。单位检查往往比复杂算法更早发现致命错误。真实报告应把数值误差、参数不确定性和模型结构误差分开：三者需要不同证据，不能统一称为计算误差。"]}],"exercise":{"materials":"使用上述冷却模型，令t=0、k=0、t很大，检查三种边界。","task":"解释计算验证与现实适用性检验的区别，并给出一个未纳入模型的过程。","template":"问题：\n定义或材料：\n假设：\n操作与推理：\n结果：\n限制或反例：","answer":"答案：t=0时T=80℃；k=0时任意t均80℃；k>0且t很大时趋向20℃。它们检查公式与实现的基本一致性，不能说明真实杯子必然这样冷却。蒸发、空气流动变化或环境温度变化都可能使恒定参数假设失效，需要现实测量。","rubric":["关键概念和前提明确","每一步可被他人检查","示例与一般结论有区别","主动说明反例或限制"]},"quiz":{"question":"解析解与代码一致，能否说明模型适合真实系统？","options":["可以，代码正确即现实正确","不能，还需独立现实证据及用途相关评价","只需提高图像分辨率"],"correct":1,"explanation":"计算正确性与现实适用性是不同问题。"},"references":[{"id":"nist-statistics","locator":"阅读模型拟合、残差与模型验证相关内容。"}],"next":"把练习整理成一条能逐步核对的论证，再看对应论文结构课怎么报告。","core":false,"chapterId":"c13","stageId":"s4","chineseCount":1693},{"id":"a13-4","title":"系统综述、范围综述与叙述综述","goal":"选择综述类型并写四个提取字段，说明结论边界。","scope":"用于理解方法选择及完成透明的教学练习；正式证据综合或模型研究需要完整方案与领域支持。","prerequisites":["a06-2","a10-1"],"minutes":70,"tags":["证据综合"],"terms":[{"zh":"系统综述","en":"systematic review","definition":"以明确问题和预先规定的方法系统寻找、选择、评价并综合相关研究。"},{"zh":"范围综述","en":"scoping review","definition":"系统梳理某领域的概念、证据类型和范围，通常问题较宽，目的不等于估计单一效果。"},{"zh":"叙述综述","en":"narrative review","definition":"围绕主题或论点组织解释性综合，应透明说明选择边界，不能假装穷尽检索。"}],"sections":[{"id":"concepts","title":"理解方法的用途与组成","paragraphs":["综述不是把论文摘要按作者顺序串起来。它应回答已有研究共同说明什么、证据为何不同、还缺什么。系统综述强调明确问题和可复核的方法；范围综述常用于地图式梳理概念与证据分布；叙述综述可以围绕理论发展作解释性综合。三者没有简单高低排序，选择取决于目的，但标签应与实际过程一致。","元分析是统计合并研究结果的技术，不是系统综述的必需组成。研究差异过大或结果不可比时，系统综述也可以不合并。PRISMA主要是报告指南，帮助交代研究怎样完成，不是按清单勾选就获得质量认证，也不能替代检索、偏倚评价和领域判断。"]},{"id":"reasoning","title":"为什么需要这些限制","paragraphs":["综述结论受纳入资料、检索覆盖、研究质量和综合方式限制。只纳入容易获取的正面论文可能形成选择偏差；同一研究的多个论文版本若当独立研究计数，会重复使用证据。不同研究的问题、对象、测量和随访不相同，即使关键词相同，也未必可以合并比较。清楚界定研究单位和报告单位十分重要。"]},{"id":"workflow","title":"从方案到结果的完整步骤","paragraphs":["每个决策都写入带日期的记录，发现问题时说明修改原因。"],"steps":[{"title":"选择综述问题与类型","body":"若想估计干预效果，写对象、干预、比较、结果等适当框架；若想了解领域用了哪些概念和方法，可选择范围问题。框架为问题服务，不能把所有人文或理论综述硬塞进临床PICO。"},{"title":"制定并保存方案","body":"写纳入排除、数据库、语言与时间范围、筛选流程、提取字段、评价方法和综合计划。正式项目按需要注册或公开方案；未注册也须保留带日期版本，不能事后伪装事前决定。"},{"title":"检索去重与筛选","body":"保留每个数据库的完整检索式、日期和结果数；去重时检查同一研究不同报告。标题摘要与全文筛选按规则进行，保留全文排除理由。团队复核安排应与领域规范和资源相匹配，并报告实际做法。"},{"title":"提取并评价证据","body":"建立研究—报告对应表，提取对象、设计、结果、风险与局限。选择适用于研究类型的偏倚或质量工具，不能用引用量代替评价。提取不确定时回原文或记录无法核实。"},{"title":"综合差异与报告","body":"先比较可比性，再决定统计或叙述综合。报告搜索流程、证据表、主要结论及限制，区分没有发现证据和证据支持无效果。流程图数字必须能够从筛选记录重算。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学范围问题：“公开研究怎样定义并测量远程学习中的参与？”方案纳入实证研究，提取参与定义、行为或自报指标、对象和平台。最终可以画出定义与测量地图，并指出同名指标实际含义不同；不能仅凭出现次数宣称最常用指标就是最有效指标。","另一个教学系统问题是比较两种具体训练对同一结果的效果。若研究使用不同随访和不可换算量表，应先分类并解释差异，不为了得到一个漂亮汇总数强行合并。完整结论可以是“现有材料不能支持统一效果估计，主要不确定性来自测量及设计异质性”，这仍是有信息的综合。"]},{"id":"repair","title":"错误版本与修订","paragraphs":["容易踩的坑：“搜索一个关键词找到10篇，按摘要整理，因此是系统综述。”修订应说明实际范围和选择方式，称为入门性文献整理；若要系统综述，就补齐明确问题、可复核搜索、筛选、评价和综合。另一错误把未检索到研究写成没人做过，应限定为在指定来源与日期未找到符合条件的研究。"]},{"id":"tips","title":"经验、效率与边界","paragraphs":["先试提取三篇可以暴露字段定义是否清楚，再正式扩大提取。试提取的修改要记录，不因某研究结论不合预期改变纳入标准。保存排除理由比保存收藏夹更能体现筛选逻辑。","对个人申请准备，完成可信的主题文献综合往往比仓促自称系统综述更有帮助。若决定采用严格综述形式，要为多数据库、全文获取、复核与评价预留足够工作量。综述也需要原创问题与综合判断，不能只靠汇总数量。"]}],"exercise":{"materials":"教学情境：你想知道一个新领域使用哪些测量定义，但未准备比较干预效果。","task":"选择综述类型并写四个提取字段，说明结论边界。","template":"问题与目标：\n纳入或划分规则：\n材料：\n主要操作：\n结果解释：\n限制：","answer":"示范：选择范围综述或先做明确标注的范围性梳理，提取构念定义、测量工具、研究对象和使用情境。若实施正式范围综述，需透明方案与系统检索筛选。结论可以说明证据分布和概念差异，不能直接推荐最有效干预或把没有检索到当绝对空白。","rubric":["问题与方法用途相符","流程和决策可复核","没有把计算输出当自动结论","说明资料与设计限制"]},"quiz":{"question":"系统综述是否一定包含元分析？","options":["一定，没有合并就不算","不一定，是否合并取决于问题和可比性","只需画森林图即可"],"correct":1,"explanation":"系统性来自寻找、选择、评价和综合的方法；统计合并需要额外条件。"},"references":[{"id":"prisma","locator":"阅读PRISMA 2020清单与说明，理解其报告用途。"},{"id":"cochrane-search","locator":"Chapter 4：4.1说明系统检索与选择的作用，4.4–4.6交代检索、记录和筛选。这里不把本章当作三类综述全部方法的统一标准。"}],"next":"把这篇课的流程与自身题目对照；需要深入使用时先完成方案，再取得和分析资料。","core":false,"chapterId":"c13","stageId":"s4","chineseCount":1667},{"id":"a13-5","title":"元分析的条件、效应合并与偏倚","goal":"手算权重、合并值与标准误，并列两个可能使合并不合理的条件。","scope":"用于理解方法选择及完成透明的教学练习；正式证据综合或模型研究需要完整方案与领域支持。","prerequisites":["a13-4"],"minutes":70,"tags":["证据综合"],"terms":[{"zh":"效应量","en":"effect size","definition":"研究结果的可比较表达，例如均值差、风险比或标准化差异。"},{"zh":"异质性","en":"heterogeneity","definition":"研究之间在临床、方法或真实效果方面的差异，不能只归结为一个统计数。"},{"zh":"发表偏倚","en":"publication bias","definition":"研究是否发表或容易获得与结果有关，使可见证据不代表所有已开展研究。"}],"sections":[{"id":"concepts","title":"理解方法的用途与组成","paragraphs":["元分析先问研究是否在回答足够相近的问题，然后才问如何加权。不同对象、比较、时间与结果定义可能让同一个数字失去共同含义。均值差要求单位可解释且可比，标准化差异虽然消除单位，也受到测量可靠性和样本变异影响。不能因为软件可以计算，就认为所有结果都能合并。","常见逆方差加权给较精确估计更大权重。共同效应模型与随机效应模型表达不同假设，后者允许研究间真实效果变化，但不自动解决偏倚或不可比性。研究很少时，研究间方差和预测范围可能不稳定。I²不是研究质量分数，也不能单靠某个阈值决定是否合并。"]},{"id":"reasoning","title":"为什么需要这些限制","paragraphs":["统计合并会把输入资料的问题带进结果。同一研究报告多个时间点或多个相关效果，若全部当独立研究，会重复计权；高风险研究大量进入也可能产生精确但偏的汇总。应先建立研究单位，核对效应方向、标准误和是否调整，并选择合适的依赖处理。森林图是展示，不是结论自动成立的证明。"]},{"id":"workflow","title":"从方案到结果的完整步骤","paragraphs":["每个决策都写入带日期的记录，发现问题时说明修改原因。"],"steps":[{"title":"确定可合并对象","body":"写清目标效应、对象、比较、时间及结果。逐研究检查定义与设计，先决定哪些可以合理一起讨论。排除应依据问题与规则，不依显著与否决定。"},{"title":"核对效应与不确定性","body":"从原文提取点估计、区间或标准误，确认符号方向、单位和换算。比例与比值常需适当变换；转换必须记录公式和来源。缺失信息不能凭感觉补数字。"},{"title":"处理重复与依赖","body":"将同一研究多篇报告合并到一个研究记录。多时间点、多结局或共享对照有相关性，按预定规则选取或采用适合模型。不能以论文篇数代替独立研究数。"},{"title":"选模型并计算","body":"依据目标与真实异质性假设选择模型，记录估计方式及不确定性处理。先用小教学例手算核对，再运行软件。合并值必须与各研究方向和权重一致，出现反常先查数据。"},{"title":"审查偏倚与稳健性","body":"比较高低偏倚风险研究、合理替代模型和异常研究的影响；漏斗图不对称有多种原因，研究少时解释尤其谨慎。报告异质性和证据局限，避免把精确区间误作所有情境效果。"}]},{"id":"worked","title":"完整例子","paragraphs":["手算教学例：两项假定独立且可比研究的均值差分别为−1和−2，标准误均为0.5。逆方差权重各为1/0.5²=4；加权均值=(4×−1+4×−2)/8=−1.5，合并标准误为√(1/8)≈0.354。若采用大样本正态近似，95%区间约−2.193至−0.807。这个例子仅演示共同效应加权，不表示模型在真实资料中合理。","如果第二项研究用的是完全不同结果，或两项来自同一批对象，以上计算就不再有直接依据。即使数字恰好能相加，也必须回到可比性与独立性。真正的报告应先说明为何适合该模型，再展示估计、异质性、偏倚评价和敏感性。"]},{"id":"repair","title":"错误版本与修订","paragraphs":["容易踩的坑：“随机效应模型已经处理所有差异，所以不必研究异质性。”修订为：“模型允许某种研究间效果变异，但研究的对象和设计差异仍需解释，偏倚仍需评价。”另一错误按各研究p值投票，三篇显著两篇不显著就宣布有效；显著标签混合了效应与精度，不能代替效应量综合。"]},{"id":"tips","title":"经验、效率与边界","paragraphs":["最实用的检查是把每项研究的方向统一到同一含义，并逐行重算一个效应量。许多严重错误来自反向量表或把标准差错当标准误。保存换算表，后续才能解释每个汇总数字从何而来。","一个精确的错误估计不比宽区间更值得相信。合并后的结论要综合偏倚、精度、一致性和适用范围；若证据不足，清楚说明不足比强行给出实践建议更有价值。初学者可以完成手算示范，但正式元分析应使用经过核对的方法和代码。"]}],"exercise":{"materials":"两项教学研究差异为2、4，标准误都为1，假定独立、单位可比且共同效应模型适用。","task":"手算权重、合并值与标准误，并列两个可能使合并不合理的条件。","template":"问题与目标：\n纳入或划分规则：\n材料：\n主要操作：\n结果解释：\n限制：","answer":"答案：权重各1，合并值3，标准误√(1/2)≈0.707。若研究共享对象或对照，独立性有问题；若结果定义或比较条件不同，可比性有问题。教学假设只为计算练习，真实研究需论证共同效应假设、检查偏倚和异质性。","rubric":["问题与方法用途相符","流程和决策可复核","没有把计算输出当自动结论","说明资料与设计限制"]},"quiz":{"question":"随机效应模型能自动消除发表偏倚吗？","options":["能，模型更复杂","不能，偏倚需另行评价","只要研究数多就能"],"correct":1,"explanation":"模型处理效果变异的假设，不等于纠正研究选择机制。"},"references":[{"id":"cochrane","locator":"Chapter 10：效应合并、共同/随机效应模型与异质性；出版偏倚等缺失证据问题需结合手册相关专章进一步阅读，不把第10章当作完整偏倚工具。"},{"id":"prisma","locator":"核对综合方法、结果与限制的报告条目。"}],"next":"把这篇课的流程与自身题目对照；需要深入使用时先完成方案，再取得和分析资料。","core":false,"chapterId":"c13","stageId":"s4","chineseCount":1569},{"id":"a13-6","title":"机器学习、基准比较、消融与数据泄漏","goal":"指出两个主要泄漏风险，并写修订后的划分和管线规则。","scope":"用于理解方法选择及完成透明的教学练习；正式证据综合或模型研究需要完整方案与领域支持。","prerequisites":["a11-4","a13-3"],"minutes":70,"tags":["理论与计算","实证定量"],"terms":[{"zh":"数据泄漏","en":"data leakage","definition":"训练或决策过程使用了真实预测时不应知道的信息，使评价过于乐观。"},{"zh":"基线","en":"baseline","definition":"用于理解新方法增益的合理比较对象，例如简单规则或已有方法。"},{"zh":"消融","en":"ablation study","definition":"在可比条件下移除或改变组成部分，检查其对表现的作用。"}],"sections":[{"id":"concepts","title":"理解方法的用途与组成","paragraphs":["机器学习研究不仅是训练一个模型，还要定义预测任务、使用情境、可用信息和评价单位。预测新患者、同一患者的新时点、未来月份和随机抽取的新图像，是不同任务。数据划分必须模拟你真正希望推广的对象，否则测试集分数回答的可能只是较容易的问题。","泄漏不只发生在把测试标签直接输入模型。先用全数据标准化、按全数据选特征、把同一对象的近重复图像分到训练与测试、使用结果发生后的字段，都可能泄漏。交叉验证也不能自动修复这些问题，预处理与调参应在相应训练折内完成，最终测试保持独立于选择过程。"]},{"id":"reasoning","title":"为什么需要这些限制","paragraphs":["合理基线帮助判断复杂模型是否必要。除了领先方法，应考虑简单均值、频率或线性模型，所有方法使用可比信息、数据划分和调参预算。指标要对应实际代价；类别不平衡时准确率可能隐藏少数类失败。性能增益需要考虑不确定性、数据分布变化、计算成本与可复现性，而不只报最好的单次分数。"]},{"id":"workflow","title":"从方案到结果的完整步骤","paragraphs":["每个决策都写入带日期的记录，发现问题时说明修改原因。"],"steps":[{"title":"定义部署问题","body":"写预测对象、时点、输入和输出，注明哪些信息在实际预测时可获得。例如预测明天故障时，明天维修记录不能作为今天输入。把一个样本的生成过程画出来，有助于发现时间倒置。"},{"title":"按单位和时间划分","body":"若要推广到新对象，按对象分组；预测未来则尊重时间顺序。保留测试集，训练内再分验证或交叉验证用于调参。记录每份样本归属和划分种子，检查重复或同源材料跨集合。"},{"title":"建立预处理管线","body":"缺失填补、缩放、特征选择都只在训练部分拟合，再用于验证测试。使用管线让步骤随交叉验证正确重做。目标编码和文本词表同样需要检查信息来源，不能只管模型本体。"},{"title":"公平比较与消融","body":"建立简单基线与合理已有方法，在相同划分和指标下运行。消融一次改变清楚的组件，必要时重新训练和匹配预算。组件移除导致其他结构改变时，解释比较不再是完全隔离的因果作用。"},{"title":"分析误差并冻结报告","body":"按对象类型、时间或条件查看失败，报告多次运行或适当区间。测试集用于最终评价后，不能不断依据它改模型仍称独立测试；如需继续开发，承认它成为开发材料并安排新的外部评价。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学例：100名对象每人10张图像。随机按1000张图划分可能让同一个人的特征同时出现于训练和测试，若目标是识别新对象，就会高估泛化。正确做法是按对象ID划分，例如训练、验证和测试对象互不重叠；具体比例应结合任务和数据规模，而非照搬固定数字。","报告可以写：“所有同一对象的图像保留在同一集合；缩放和特征选择仅在训练折拟合；简单逻辑回归与新模型使用相同划分；主要指标预先确定，并报告少数类召回与误报。”这里是设计示范，没有实际训练成绩，不能补写一个好看的准确率。"]},{"id":"repair","title":"错误版本与修订","paragraphs":["容易踩的坑：“先用全体数据选择最相关特征，再做交叉验证，所以没有泄漏。”选择已经见到验证信息，应放进训练折内部。另一个错误反复查看测试结果选择最佳模型，再把该分数称一次性独立检验；应披露选择过程并使用新的独立材料评价。"]},{"id":"tips","title":"经验、效率与边界","paragraphs":["快速查漏可以给每个字段写“何时产生、谁知道、上线时是否存在”。检查样本ID、文件名和采集批次，它们可能暗含标签或环境。对于重复测量，分组逻辑往往比换一个更复杂模型更重要。","消融结果是对指定模型、数据和训练条件的证据，不等于证明组件在所有任务都有独立贡献。若总体提升很小但成本很大，应报告这种权衡；新方法可能在某一边界条件更有价值，需相应设计证据。"]}],"exercise":{"materials":"100名对象各10张图像，计划预测从未见过的人；全数据归一化后随机划分图像。","task":"指出两个主要泄漏风险，并写修订后的划分和管线规则。","template":"问题与目标：\n纳入或划分规则：\n材料：\n主要操作：\n结果解释：\n限制：","answer":"答案：同一对象跨集合造成身份或近重复泄漏；全数据归一化让训练过程使用测试分布。修订为按对象ID划分，在训练折拟合缩放、填补和特征选择，再应用到验证与最终测试；保留测试不参与模型选择，并报告对象数与图像数。","rubric":["问题与方法用途相符","流程和决策可复核","没有把计算输出当自动结论","说明资料与设计限制"]},"quiz":{"question":"预处理应何时拟合？","options":["划分前对全部资料拟合","在相应训练部分拟合，再应用到验证测试","只要不输入标签，任何时候都行"],"correct":1,"explanation":"即使不直接用标签，测试分布也可能影响预处理与特征选择，需与训练流程一起隔离。"},"references":[{"id":"sklearn-leakage","locator":"阅读常见陷阱中数据泄漏、预处理和Pipeline部分。"},{"id":"nist-statistics","locator":"阅读模型验证和误差评价的基本原则。"}],"next":"把这篇课的流程与自身题目对照；需要深入使用时先完成方案，再取得和分析资料。","core":false,"chapterId":"c13","stageId":"s4","chineseCount":1631},{"id":"a14-1","title":"定量数据、测量、校准、数据字典与质量检查","goal":"新增误差字段并填写difference_g字典，核对两行计算。","scope":"学习资料整理与可追溯处理；实际项目依所属机构的权限、伦理和专业要求执行。","prerequisites":["a11-4"],"minutes":65,"tags":["实证定量"],"terms":[{"zh":"数据字典","en":"data dictionary","definition":"解释字段含义、类型、单位、取值、缺失规则和生成过程。"},{"zh":"校准","en":"calibration","definition":"在规定条件下建立仪器示值与参考量值关系，不表示永远无误差。"},{"zh":"原始数据","en":"raw data","definition":"采集流程最初保存的记录，修订须保留依据和版本。"}],"sections":[{"id":"concepts","title":"资料的身份与含义","paragraphs":["可分析数据不是只把数字排进表格。你必须知道每行表示什么、每列怎样产生、单位是什么、缺失意味着什么。没有这些说明，数字即使格式漂亮也难以解释。测量误差可能来自参考、仪器、环境、操作者和对象变化；分析再复杂也不能恢复从未记录的条件。","准确度、重复性与分辨率需要区分。显示到小数后两位不代表误差只有0.01，重复读数很接近也可能有系统偏差。校准把仪器与参考联系起来，但参考自身有不确定性，关系也只适用于规定范围和条件。字典应记录量、单位与过程，而不只写重量。","数据库中用一行一个对象是本案例的宽表选择，不是所有研究的通用规则。若同一对象跨日期多次测量，可用对象编号、日期、流程和重复编号共同识别一条读数。单靠行号不能稳定追踪对象，因为排序和筛选会改变行位置。与背景表合并时，先检查连接键是否唯一，避免一对多连接无意增加记录数。"]},{"id":"reasoning","title":"为什么要保留证据链","paragraphs":["原始和处理数据分开既防止误覆盖，也让别人看清改变。清洗应处理有依据的错误或按规则标记问题，不是删除不舒服的结果。设备故障、录入错误、缺失与真实极端观察性质不同；真实极端值可能正是研究需要解释的现象。每个排除都要保留理由及对结论的影响。"]},{"id":"workflow","title":"逐步建立资料包","paragraphs":["在不覆盖原始材料的前提下完成下面操作。"],"steps":[{"title":"确认一行代表什么","body":"统一案例一行是一个教学对象，有A、B和参考值。先数唯一object_id，检查重复。若转成长表，每行一流程读数，分析仍按对象连接，不能把行数当独立样本数。"},{"title":"逐列写字典","body":"object_id为唯一标识；reference_g是构造参考；measurement_a_g和measurement_b_g为构造读数，单位g；data_status标示教学合成。50g参考只是设定，不暗示真实标准器无误差。"},{"title":"检查原件格式","body":"保留CSV原件，检查编码、小数点、分隔符、空白、文本数字和缺失标记。用筛选看范围，不把空白自动填零，零与未知有不同含义。真实项目还需检查设备与校准记录。"},{"title":"生成派生字段","body":"新增ABS(A−参考)、ABS(B−参考)及B误差减A误差，不改原列。写公式、单位和方向，手算首行、末行与中间行，确认填满所有对象。"},{"title":"保存质量日志","body":"每条记录写检查项、发现、决定、依据和日期。真实数据要连接温度、批次和操作者；教材没有这些实际记录，必须保留教学身份。输出原件、处理表、字典和脚本。"}]},{"id":"worked","title":"完整例子","paragraphs":["O01的参考为50g，A=52g，B=51g，绝对误差分别2g与1g，差−1g。O05的A=52.5g、B=52.7g，差0.2g，B更差；它不是应该删去的异常，而是与平均趋势不同的一个构造对象。","字典成品：“difference_g，数值型，g，ABS(measurement_b_g−reference_g)−ABS(measurement_a_g−reference_g)；负值代表B绝对误差小；任一必要读数缺失则差值缺失，并记录原因。”它包含含义、公式、方向和缺失，而非只列英文名称。","质量检查成品可以写：“文件有二十行，二十个唯一 object_id；reference_g 全部为 50；A、B 必要字段完整；data_status 标为教学构造。O01 和 O05 的派生结果手工核对一致。未因差值方向进行排除。”这是一条可以由他人重做的记录，比只写数据已清洗更有用。","另设校准教学例：参考件为 10、20、30 g，仪器依次读 10.2、20.2、30.2 g。三个点都偏高 0.2 g，提示此范围内可能有近似固定偏移；不能仅据三点认定所有范围都可减 0.2。需要复测、参考不确定性、稳定性和适用范围。若在预先认可方案中应用修正，保存原读数、修正公式和修正后字段，不能用新数覆盖原件。"]},{"id":"repair","title":"错误与修订","paragraphs":["错误是空白填零，再删除所有B较差对象。第一步把未知变为确定值，第二步按结果选择，两者都会改变结论。修订为保留缺失及原因，按预定方案分析；确有录错时从可核对原件更正，并保存日志，不因结果是否有利决定处理。","容易踩的坑：“系统导出为空，所以测量值为零。”修订应区分未测、无效、超范围与确实为零，并在原因列编码。例如 NA_device 表示设备故障，NA_not_measured 表示未测；进入软件分析时可统一为缺失，但原因列保留。可用性判断与原因记录同时存在，才有机会评价缺失是否集中于困难对象。"]},{"id":"tips","title":"什么时候有用，什么时候不够","paragraphs":["实用顺序是冻结原件，检查ID、类型、单位、范围、配对完整性，再派生变量。排序时选择整张表，防止只排序一列破坏配对。每次公式改动重新抽行手算，尤其检查绝对值和减法方向。","数据字典随数据更新：单位换算、重命名、排除和新变量都需要版本。可追溯不等于全部公开，敏感资料可以受控访问，但仍应有清楚处理记录和授权边界。"]}],"exercise":{"materials":"统一CSV的O01与O05以及字段定义。","task":"新增误差字段并填写difference_g字典，核对两行计算。","template":"来源：\n单位或材料ID：\n处理规则：\n处理记录：\n输出：\n限制：","answer":"F2=ABS(C2-B2)，G2=ABS(D2-B2)，H2=G2-F2，填至21行。O01为2、1、−1g；O05为2.5、2.7、0.2g。差值负表示B误差较小，原五列保留且状态为synthetic_teaching，不把构造数据称真实实验。","rubric":["原件与处理结果分开","字段或来源意义清楚","处理决定有依据且可追溯","事实与解释没有混淆"]},"quiz":{"question":"B在某对象更差应怎样做？","options":["删除","保留并核查有无记录错误，按预定规则处理","改为与A相同"],"correct":1,"explanation":"与预期不同不是删除理由；真实错误需要证据与日志。"},"references":[{"id":"fair","locator":"阅读元数据、访问条件与可复用原则。"},{"id":"nist-statistics","locator":"阅读测量、校准和数据检查内容。"}],"next":"把资料包交给另一个人，看看他能不能理解并重做关键步骤。","core":true,"chapterId":"c14","stageId":"s5","chineseCount":1653},{"id":"a14-2","title":"访谈材料、编码记录、匿名化与研究者反思","goal":"写更正流程与一条克制的分析备忘。","scope":"学习资料整理与可追溯处理；实际项目依所属机构的权限、伦理和专业要求执行。","prerequisites":["a12-1","a12-3"],"minutes":65,"tags":["定性与案例"],"terms":[{"zh":"转录","en":"transcription","definition":"把录音或互动转为适合分析的记录，细节取决于方法。"},{"zh":"去标识化","en":"de-identification","definition":"删除或替换识别信息，但不保证全部再识别风险消失。"},{"zh":"反思备忘","en":"reflexive memo","definition":"记录研究者位置、预设与选择如何参与材料生成和解释。"}],"sections":[{"id":"concepts","title":"资料的身份与含义","paragraphs":["访谈包需要来源登记、录音或合适替代材料、转录、处理日志和分析备忘。转录不是完全中性复制：是否保留停顿、重叠、语气和方言要看问题。分析会话互动通常需要更细转录，主题层面可以较简化，但必须说明规则及检查过程。","化名不等于匿名。唯一职位、罕见事件和日期组合也可能识别个人。应考虑直接标识、间接线索、第三人内容和声音本身。保留必要语境与降低风险之间有取舍，需要依据同意范围、机构要求与研究目的，而不是机械删除所有背景。"]},{"id":"reasoning","title":"为什么要保留证据链","paragraphs":["反思不是一句研究者保持客观。它应具体说明如何进入现场、与参与者的关系、哪些预设影响追问，以及怎样审视这些影响。研究者常是材料生成的一部分，透明记录有助于理解知识怎样形成。把个人解释与原话分开，既不否认研究者作用，也防止猜测伪装成参与者意思。","整理过程要区分参与者原话、现场观察和研究者解释。比如“说完后沉默五秒”是可记录的互动现象，“他感到羞愧”则是解释，若没有进一步依据不能直接当事实。把三者分栏可以保留观察价值，也让后来审读者看清哪些推论需要回到语境验证。"]},{"id":"workflow","title":"逐步建立资料包","paragraphs":["在不覆盖原始材料的前提下完成下面操作。"],"steps":[{"title":"登记材料身份","body":"为访谈设稳定ID，记录日期、方式、同意范围、转录版本和权限。身份对应表与分析材料分开保管，文件名不用真实姓名或敏感诊断。"},{"title":"确定转录规则","body":"依目的决定停顿、笑声和重叠的保留；听不清处标时间点，不凭期待补写。自动转录可辅助，但否定词、专名和核心片段必须核对。"},{"title":"检查识别线索","body":"先处理姓名联系方式，再看职位、地点、罕见经历和第三人。替换保留分析意义并记录规则，不能为匿名化把不同情境改成完全一样。"},{"title":"写反思记录","body":"记录关系、诱导风险、意外发现和初步解释。受访者停顿是可观察事件，猜测其担心领导是解释，应分开。写下一次具体改进，如增加角色经历追问。"},{"title":"保留原文连接","body":"编码带材料ID及段落或时间位置，修改主题能回原文。向合作者或公开分享前检查授权和再识别风险，引用片段要连上下文，不能一次去标识后永久免检。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学原句“我在西区唯一的夜间实验室，去年接任负责人，大家知道我没用过系统”。只换姓名仍可识别。可在保留分析意义时写“我在一家有夜间工作的实验室，接任管理角色时还不熟悉系统”，并在受控日志记录删改类型。","反思成品：“我原把不使用理解为技术困难，追问集中于界面；材料提示岗位变化与团队期待也可能相关。下次应询问角色经历，避免只问按钮。”它说明预设如何影响行为，并给出可执行调整，不是空泛宣布没有偏见。","一条转录核对记录可以具体到：“P03，录音片段 02:10–02:24，自动稿 V1 写‘没时间核查’，回听后 V2 改为‘不是没时间核查，是不知道去哪里查’；原编码‘时间压力’撤销，新增分析备忘‘检索路径不清’。”这是原创教学示范的时间定位格式，不是声称存在真实录音。更正必须同时传到引用表、编码表和报告，不能只改转录稿。","对去标识材料可维护两份互相分离的表：研究用材料只含 P03 等代号，身份联系表受更严格控制并仅由获授权者访问。分析中若角色信息必不可少，可用较宽类别并说明模糊处理。不要把整段故事剪得失去意义，也不能为了生动而保留无关的唯一身份线索。"]},{"id":"repair","title":"错误与修订","paragraphs":["容易踩的坑：自动转录把“不是没时间”变成“没时间”，据此归为时间不足。修订要回录音核对，更正版本并搜索受影响编码。参与者同意自己的话被分析，也不自动允许公开他人身份和敏感经历，第三人线索需要独立审查。"]},{"id":"tips","title":"什么时候有用，什么时候不够","paragraphs":["先核对否定、数字、专名及核心片段，往往能发现影响解释最大的错误；完整检查范围仍按方案执行，不能只核对支持主张的句子。每版材料注明是否用于分析。","共享不等于公开所有录音。受限材料可以用受控访问、处理说明或去标识片段支持核查。清楚说访问限制及理由比为追求开放随意上传原件更合适。"]}],"exercise":{"materials":"原句“我不是不信任系统，只是那天网络断了”，自动版“我不信任系统，那天网络断了”。","task":"写更正流程与一条克制的分析备忘。","template":"来源：\n单位或材料ID：\n处理规则：\n处理记录：\n输出：\n限制：","answer":"回到录音时间点，保留原版与修订说明，更新分析文本并检查受影响编码。备忘写“说话者区分信任与一次网络故障，不能用此句证明普遍不信任；需结合其他经历”。无法访问录音时标无法核实，不任选有利版本。","rubric":["原件与处理结果分开","字段或来源意义清楚","处理决定有依据且可追溯","事实与解释没有混淆"]},"quiz":{"question":"使用化名后能否直接公开全部访谈？","options":["可以","仍须检查间接识别与授权范围","只删电话就够"],"correct":1,"explanation":"职位、事件和第三人内容仍可暴露身份或超出承诺。"},"references":[{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"},{"id":"thematic-analysis","locator":"阅读反思与材料解释的关系。"}],"next":"把资料包交给另一个人，看看他能不能理解并重做关键步骤。","core":false,"chapterId":"c14","stageId":"s5","chineseCount":1690},{"id":"a14-3","title":"文本和史料的来源、版本、真实性与整理","goal":"画来源链，说明研究原始政策与研究后世接受时的不同用法。","scope":"学习资料整理与可追溯处理；实际项目依所属机构的权限、伦理和专业要求执行。","prerequisites":["a12-4"],"minutes":65,"tags":["人文解释"],"terms":[{"zh":"来源链","en":"provenance","definition":"材料形成、保存、编辑、转录到当前版本的关系。"},{"zh":"版本","en":"edition","definition":"文本在特定编辑、时间与媒介下的形态，差异可能影响解释。"},{"zh":"史料批判","en":"source criticism","definition":"检查身份、目的、语境和内容可支持的判断，不只是判真假。"}],"sections":[{"id":"concepts","title":"资料的身份与含义","paragraphs":["文本材料像数据一样需要身份。影像、OCR、选集、译本和网页转载可以指向同一来源，却不能随意互换。标点、删节、译词变化都可能改变解释。先确认你实际读了什么，再说明引用，不能借二手引文声称核对原件。","真实性不是单一开关。真实官方文件可能夸大执行效果；回忆录可能日期不准，却提供当事人理解经历的材料。外部批判帮助确定形成与身份，内部批判帮助理解作者知道什么、为何如此表达以及怎样与其他材料比较。","来源卡还应区分形成日期、事件日期、出版日期和本次获取日期。一本多年后出版的回忆录可能谈早年的事件，不能把出版日期当事件日期；网页更新也可能只是格式调整。未知字段写未见记载，不能用系统文件时间冒充历史形成时间。保持时间层级，能够避免把后来的判断投射到更早材料。"]},{"id":"reasoning","title":"为什么要保留证据链","paragraphs":["档案保存具有选择。什么被记录、谁能发声、哪些被保存都影响证据分布。某群体声音少，不直接证明他们没有活动。数字化资料容易搜索，但不等于全部历史；未数字化部分与OCR错误会影响检索结果，需要在方法中交代覆盖和遗漏。"]},{"id":"workflow","title":"逐步建立资料包","paragraphs":["在不覆盖原始材料的前提下完成下面操作。"],"steps":[{"title":"填写来源卡","body":"写题名、作者机构、形成时间、载体、收藏发布位置、版本、访问日期与具体页码。未知标未知；使用译本记译者和版本，关键术语尽量核原文。"},{"title":"保留原貌与转录","body":"合法保留原图，将OCR和工作转录另存。给页段稳定编号，使引文能回影像。历史拼写和标点可能有意义，不要无痕现代化。"},{"title":"核对核心文字","body":"逐字核查进入论证的引文、数字、否定词和姓名。OCR可能混字、错列或漏行；辨不清须标注，不按期待补写。引用的位置需让别人也找到。"},{"title":"比较来源关系","body":"标出重印、删节、翻译、编辑及转载关系。多个网页复制同一原文不等于多个独立证据，记录版本变化怎样影响问题，区别互证与同源重复。"},{"title":"形成可追溯输出","body":"问作者位置、受众、目的、事件距离及知识权限，再与独立来源比较。保存来源卡、版本对照、引文表和解释备忘，使最终判断能回到具体材料。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学通告影像写“暂行开放”，OCR变成“暂停开放”，网页转载复制OCR。引用两网页互证就把一次识别错误变成貌似双重支持。应回影像核字，保留转录修订，说明转载同源，再修改解释。","来源卡成品：“原创教学材料T01，工作转录V2核对关键句‘暂行开放’，V1误为‘暂停开放’；W01转载V1，不作独立互证。解释关注试行性质，实际执行须另查材料。”教学身份明确，不伪造档案馆、日期或历史发现。","一次版本核对可以这样记录：教学影像 T01 的末句为“惟须持证者方得入内”，转录 T02 完整保留，选编 T03 只摘“设夜间阅览”。若只读 T03 就概括无条件开放，会漏掉关键限定。成品比较表应列原句、各版差别、编辑删节及其对解释的影响；引用时标明实际使用版本，并在关键论证处回到可核材料。","建立来源家谱也很实用：画出影像→人工转录→数据库→两家转载的路径。五个载体不等于五条独立证据；对于“原文到底写什么”，它们可能共享同一错误。对于“某解释怎样传播”，转载关系本身却可能成为研究对象。材料的独立性和用途必须随研究问题判断。"]},{"id":"repair","title":"错误与修订","paragraphs":["容易踩的坑：“三网站都写，所以可靠。”它们可能共享同一转录。修订先追原始出处、核独立性和事项。另一错误把编者加的标题当原作者用语，会将后世判断投射回原文；应区分原始文本与编辑层。"]},{"id":"tips","title":"什么时候有用，什么时候不够","paragraphs":["引文表增加“实际阅读层级”：原件影像、全文转录、选段或二手转引，能避免写作中无意升级证据。每次使用关键引文再核定位，比靠记忆重打可靠。","文学虚构也可支持形式或文化分析，真实来源也可能策略性表达。材料价值依问题决定，不能只分真有用、假无用。关键是别让材料承担它无法支持的事实断言。","数字文件命名可使用来源代号、版本和材料类型，避免只写最终版。关键页图与转录相互链接，保留原页码和扫描页码对应。若由于权限不能保存影像，就记录稳定定位、访问方式与必要短引文，并遵守收藏机构的使用条件；可追溯不意味着可以任意复制传播。"]}],"exercise":{"materials":"选集删去原文限制条款，网页采用选集，博客转载网页。","task":"画来源链，说明研究原始政策与研究后世接受时的不同用法。","template":"来源：\n单位或材料ID：\n处理规则：\n处理记录：\n输出：\n限制：","answer":"原文→选集删节→网页→博客，后三者不构成三份独立互证。研究原始政策应核原文限制条款与版本；研究后世接受可把删节选集本身作为材料，但应解释编辑如何改变含义，不能拿删节版替代原政策全文。","rubric":["原件与处理结果分开","字段或来源意义清楚","处理决定有依据且可追溯","事实与解释没有混淆"]},"quiz":{"question":"互证前先查什么？","options":["篇幅","来源独立性与事项可比性","排版正式程度"],"correct":1,"explanation":"同源复制不增加独立证据，不同事项也不能直接互证。"},"references":[{"id":"history-source","locator":"阅读作者、目的、受众、语境与限制问题。"},{"id":"harvard-paragraph","locator":"Anatomy of a Body Paragraph：Topic sentence、Evidence、Analysis三项与示范段落；这里把它用于组织主张与材料，不将其当作细读或史料研究的完整方法。"}],"next":"把资料包交给另一个人，看看他能不能理解并重做关键步骤。","core":false,"chapterId":"c14","stageId":"s5","chineseCount":1709},{"id":"a14-4","title":"理论假设、推导、模型代码与计算记录","goal":"列最小修改与一次独立运行检查。","scope":"学习资料整理与可追溯处理；实际项目依所属机构的权限、伦理和专业要求执行。","prerequisites":["a13-1","a13-3"],"minutes":65,"tags":["理论与计算"],"terms":[{"zh":"假设清单","en":"assumption ledger","definition":"记录推导或模型依赖的前提、依据、用途和限制。"},{"zh":"计算环境","en":"environment","definition":"运行所需软件、库、版本和配置。"},{"zh":"最小例子","en":"minimal reproducible example","definition":"足够小又完整呈现问题或结果的代码和输入。"}],"sections":[{"id":"concepts","title":"资料的身份与含义","paragraphs":["理论计算的依据可能是定义、推导、代码、参数与输入，而非访谈或仪器读数。一张最终曲线不说明方程、步长或参数，一个漂亮证明也可能漏条件。组织中间材料，才能让别人检查结果由何而来。","固定随机种子不保证所有环境完全相同。库版本、并行、硬件和实现可能改变输出。接近零也不总是严格等于零，数值比较需合理容差；证明中的精确等式与浮点近似要分清，不能用数值碰巧相同代替一般推导。","最小可复核单位不必是整个庞大项目。一个命题应有定义、假设、依赖引理和证明；一张模型图应有输入、方程、参数、求解设置和生成命令；一项统计结果应有数据版本、变量定义和分析步骤。按结果反向列依赖，能及时发现脚本外还藏着手工改值或未记录的选择。"]},{"id":"reasoning","title":"为什么要保留证据链","paragraphs":["记录重点是每个结论能回到依赖。模型假设来自定义、领域知识、测量还是教学设定，应分别标识；公式写推导及条件，结果写版本及参数。假设改变时能找到哪些图和结论需要重算，不必靠手工逐页猜测。可复核过程不自动证明模型正确，但缺少过程会阻碍任何检查。"]},{"id":"workflow","title":"逐步建立资料包","paragraphs":["在不覆盖原始材料的前提下完成下面操作。"],"steps":[{"title":"保存稳定版本","body":"推导、代码、报告分别保存并连接，修改写目的及影响。不能覆盖唯一旧版本后再说无法重现。版本名或版本管理工具都可用，关键是知道实际运行哪版。"},{"title":"写参数假设表","body":"列符号、意义、单位、值或范围、来源和使用位置。恒定环境、独立性、忽略摩擦都显式写出；未确认前提保留待核实，不假装测量事实。"},{"title":"建立最小检查","body":"找解析答案、守恒或边界例检查实现。冷却模型k=0不变化、初始时恢复T0。每个检查应能暴露具体错误，不仅重复默认运行。"},{"title":"说明环境和命令","body":"列Python版本、依赖、输入和一条运行命令，用项目相对路径。标准库可降低门槛，但复杂算法仍需可靠核查。不要依赖个人桌面未提供文件。"},{"title":"重新生成结果","body":"从原输入重跑，比对数值和图。容差匹配算法与用途，自动生成可减少手抄。改变时先查输入、参数、版本和随机性，再判断是否需要修改结论。"}]},{"id":"worked","title":"完整例子","paragraphs":["教材包给出teaching-measurements.csv和analyze.py，脚本按自身目录找输入，检查20对象ID，计算差值并写analysis-results.json。报告的−0.750g及区间应能重新生成，运行者不需要作者个人目录。它复现的是教学计算，不是真实实验。","冷却模型同样可记录T_env、T0、k单位与教学设定来源，保存解析解和数值脚本，比较步长0.1和0.05分钟。若环境温度假设改变，就升级模型并重算，而不是只改图注。","参数表成品：“T_env=20℃，T0=80℃，k=0.1/分钟，三者均为教学设定；时间 t 单位分钟；解析解作为数值算法核对参照，欧拉步长分别为 1 和 0.5 分钟。”这样读者能检查指数是否无量纲，并知道参数没有来自实际测量。若将 t 改为秒，k 必须相应改为 0.1/60 每秒。","运行日志成品：“输入文件名和版本已登记；执行命令 python analyze.py；预期生成 analysis-results.json；关键核对对象数二十、差值方向 B−A、均值 −0.75 g；成功与错误信息另存。”在真实项目中还要记录操作系统、Python 与依赖版本；标准库脚本也不意味着完全无需环境说明。"]},{"id":"repair","title":"错误与修订","paragraphs":["容易踩的坑：“我的电脑能跑，所以可复现。”若用个人绝对路径、缺依赖或手工修改输出，别人仍不能检查。修订提供完整输入、相对路径、环境和命令。另一错误把近似零称数学证明，应改为说明容差和未验证范围，或补严格论证。","容易踩的坑：“临时在图上把一个点挪到正确位置，数据不用改。”这会破坏图与计算链条。若输入确有错误，应在有依据的清理步骤中修订，重新生成图并记录受影响结果；若只是标签位置，可在绘图代码说明。科学数值和纯排版调整必须分清，不让图形软件成为隐蔽数据处理器。"]},{"id":"tips","title":"什么时候有用，什么时候不够","paragraphs":["最小例应小到每行能解释又包含真实问题。求助时提供它和错误信息，比发无法运行的巨大工程有效。失败尝试也写日志，某次程序修复可能其实改变模型含义。","受限数据可说明访问条件并提供代码、模拟输入与检查步骤。复现特定过程不等于数据真实、模型正确或贡献重要；这些还需其他证据，不能用一键运行徽章替代。"]}],"exercise":{"materials":"脚本读个人桌面绝对路径，未写库版本，图手工修过，只留下PNG。","task":"列最小修改与一次独立运行检查。","template":"来源：\n单位或材料ID：\n处理规则：\n处理记录：\n输出：\n限制：","answer":"提供合法输入或获取方法，使用相对路径，列环境，保存生成图表的代码和修改记录，在新目录按命令重跑并比较数值。手工编辑若影响表达，应改为代码生成或明确披露。无需堆与项目无关的工具。","rubric":["原件与处理结果分开","字段或来源意义清楚","处理决定有依据且可追溯","事实与解释没有混淆"]},"quiz":{"question":"固定随机种子是否已充分？","options":["是","不是，仍需输入、环境和实现信息","截图足够"],"correct":1,"explanation":"种子只是随机过程的一部分，软件、并行和数值实现也重要。"},"references":[{"id":"fair","locator":"阅读元数据和可复用要求。"},{"id":"nist-statistics","locator":"阅读模型、参数与结果核查。"}],"next":"把资料包交给另一个人，看看他能不能理解并重做关键步骤。","core":false,"chapterId":"c14","stageId":"s5","chineseCount":1656},{"id":"a15-1","title":"从原始表格到清理、描述统计和图形","goal":"保留原件，建立可复核清理表，算出配对差并画出能检查个体变化的图。","scope":"主修实证定量；数字仅来自本教材构造数据，学习计算和解释，不代表真实实验效果。","prerequisites":["a14-1"],"minutes":90,"tags":["实证定量"],"terms":[{"zh":"描述统计","en":"descriptive statistics","definition":"用数量和图形概括目前这批资料，描述本身不自动推广到更大总体。"},{"zh":"长表与宽表","en":"long and wide format","definition":"宽表把同一对象不同测量放在不同列；长表把测量放在多行，保留对象标识与条件列。"},{"zh":"派生变量","en":"derived variable","definition":"由原字段按照明确规则计算的新字段，必须能追溯公式与单位。"}],"sections":[{"id":"concepts","title":"先看清一行究竟代表谁","paragraphs":["这篇课使用随教材提供的 teaching-measurements.csv。它有二十个教学构造对象，每行包含对象编号、参考值和流程 A、B 的读数。两流程测的是同一对象，所以表里虽然有四十个读数，仍只有二十个对象内配对。先确定这一点，再决定公式和图形；否则后面的精确数字会回答错误问题。","整理数据的目的不是让结果好看，而是让字段与实际含义一致。原始文件保存收到的内容，清理文件保存按记录修订的内容，分析文件保存从清理数据产生的结果。三者可以在同一工作簿的不同工作表中管理，但不要覆盖原件。数据字典应同时说明字段名称、单位、取值规则和缺失值含义。","平均数把所有数值合成一个中心，但会受极端值影响；中位数指出排序后的中间位置，不能替代所有问题里的平均数；标准差描述对象之间的分散程度。最小值、最大值、分布形状和样本量一起帮助理解。标准差与下一篇的标准误不是同一个量：前者描述数据，后者描述估计量在模型中的不确定性。"]},{"id":"reasoning","title":"先检查资料，再计算概括","paragraphs":["自动把所有空格填零，会把不知道变成确实为零；自动删除重复行，则可能删掉合法的重复测量。清理规则必须由数据产生过程决定。对象编号重复可以是错误，也可以说明一次对象有多次试验，需要增加试验编号，而不是直接去重。若暂时找不到依据，标记疑问并保留原记录。","图形应该帮助检查问题，而不只是装饰均值。比较同一对象的 A、B 时，连接每个对象的两点能显示方向与异质性；画配对差分布能发现是否少数对象支配均值。只有两个均值的柱状图会把这些信息藏起来。当前构造数据只是提供一种练习，真实量表、时间序列和类别变量需要相应图形。"]},{"id":"workflow","title":"用表格做出第一份分析工作簿","paragraphs":["输入是 CSV、数据字典和一个新工作簿。先保留原始表，再创建清理表和结果表。以下列号假定导入后 A:E 依次是原文件五列；如果软件调整了列顺序，先核表头，不能机械照抄字母。"],"steps":[{"title":"导入并检查结构","body":"用数据导入功能打开 CSV，确认逗号分隔、首行表头、读数为数值而非文本。检查二十个对象编号是否唯一，A、B 读数及参考值是否都有值，单位统一为 g。产出一条“二十行、二十个唯一对象、无必要字段缺失”的检查记录；若不符合，暂停分析并查原因。"},{"title":"生成三个派生字段","body":"F1 写 abs_error_a_g，G1 写 abs_error_b_g，H1 写 difference_g。F2 输入 =ABS(C2-B2)，G2 输入 =ABS(D2-B2)，H2 输入 =G2-F2，向下填到第 21 行。差值必须是 B 绝对误差减 A 绝对误差，负数才表示 B 较小。"},{"title":"抽行手算核对","body":"核对 O01：A 误差为 2，B 为 1，差为 −1。核对 O05：A 误差为 2.5，B 为 2.7，差为 0.2。两种方向都核对，避免公式只在一个例子上碰巧正确。不要分别排序 A、B 两列，必须保持配对。"},{"title":"建立描述结果表","body":"分别使用 COUNT、AVERAGE、MEDIAN、STDEV.S、MIN 和 MAX 汇总 F、G、H。记录软件和公式，结果保留计算精度，展示时统一小数位。用 COUNTIF(H2:H21,\"\u003c0\")、等于零和大于零分别统计改善、相同和恶化对象。"},{"title":"制作诊断图","body":"用对象编号为横轴、两流程绝对误差为纵轴画带点折线或配对点图，同时画差值点图并加零参考线。不要把编号轴误解成连续时间。图注写明每点含义、单位、二十个构造对象及差值方向。"},{"title":"保存可追溯结果","body":"保存工作簿时写清版本，保留公式而非只粘数值。结果表附上原始文件名、处理日期和每个排除或更正理由。请他人任选一行从原件算到图上的点，能对上才进入推断分析。"}]},{"id":"worked","title":"一份已经完成的结果记录","paragraphs":["完成计算后，A 的平均绝对误差为 3.75 g，B 为 3.00 g，平均配对差为 −0.75 g。二十个对象中十六个 B 误差更小，一个相同，三个更大。因此“所有对象都改善”与数据不符。合适的描述是：“在本构造数据中，B 的平均绝对误差较小，多数但并非所有对象呈相同方向。”这句话只概括当前数据。","观察 O09 可见 A 读数 56、B 读数 56.4，参考值 50，所以两者绝对误差为 6 和 6.4，配对差 0.4。它为“平均更小不表示每个更小”提供具体材料。它不是录入错误的证据，也不能因为与希望相反就删去。描述表和配对图应同时保留它。","下面的 Python 片段只使用标准库，放在材料目录中运行，可核对表格均值和方向。脚本中的绝对值、减法顺序与表格完全一致；它不会替你判断输入来源是否可靠。完整分析脚本 analyze.py 另提供推断计算与结构检查。"],"code":{"language":"python","text":"import csv\nfrom pathlib import Path\nfrom statistics import mean, stdev\nwith Path(\"teaching-measurements.csv\").open(encoding=\"utf-8-sig\", newline=\"\") as f:\n    rows = list(csv.DictReader(f))\na = [abs(float(r[\"measurement_a_g\"]) - float(r[\"reference_g\"])) for r in rows]\nb = [abs(float(r[\"measurement_b_g\"]) - float(r[\"reference_g\"])) for r in rows]\nd = [y - x for x, y in zip(a, b)]\nprint(len(d), mean(a), mean(b), mean(d), stdev(d))\nprint(sum(x \u003c 0 for x in d), sum(x == 0 for x in d), sum(x > 0 for x in d))"}},{"id":"repair","title":"修正三个会改变结果的习惯","paragraphs":["错误版本：“读数统一四舍五入成整数，再算误差。”这会丢掉原来的小数信息，甚至改变个体方向。修改版本：“保留原始精度计算，最终显示统一保留适当位数。”展示精度和计算精度应分开。","错误版本：“B 的均值更小，说明流程 B 已经有效。”这里从构造数据跳到了真实效力，越过了研究设计、抽样和实施证据。可以改成：“构造数据的描述结果为平均差 −0.75 g，后续以配对模型演示区间估计；不能据此判断真实流程表现。”"]},{"id":"tips","title":"让检查变得容易","paragraphs":["新手最有用的技巧是把每一步的预期写在旁边：预计行数二十、ID 不重复、差值单位 g、至少核对正负两行。发现结果不符时回到最近一步查，而不是从最终 p 值倒猜哪里错。工作簿使用冻结首行、筛选和条件标记可以提高检查效率，但这些操作不等于统计验证。","真实资料中，绝对误差并不总是最佳结果变量。若正负偏差方向对安全或校准重要，需要同时报告有符号误差；若不同对象量级悬殊，可能考虑比例指标并解释接近零的风险。指标应该服务于研究问题，而不是选择最容易显得改善的一种。"]}],"exercise":{"materials":"使用教学 CSV；另有疑似记录 O05 的 B=52.7，A=52.5，参考=50。","task":"生成清理表、描述表和一张显示个体差异的图，写一段不超过一百五十字的结果描述。","template":"输入版本：\n行数与独立单位：\n清理规则：\n派生公式：\n三项均值：\n方向计数：\n图注与解释边界：","answer":"输入为教学构造 CSV；二十个对象、二十对；未发现需更正项。绝对误差=ABS(读数−参考)，差=B−A。均值 A=3.75 g、B=3.00 g、差=−0.75 g；十六个负差、一个零差、三个正差。O05 差 0.2 g 应保留。图注说明一对点对应一个构造对象；结论只描述教学数据。","rubric":["原件没有被覆盖，字段和公式可追溯","抽行手算包含正差与负差且均正确","个体图显示三个方向例外，单位与教学标记齐全","描述没有把模拟计算写成实际研究发现"]},"quiz":{"question":"把 A、B 读数分别从小到大排序后再相减，最大的问题是什么？","options":["只是图不好看","破坏对象配对，差值不再属于原来同一个对象","只会影响小数位"],"correct":1,"explanation":"配对由对象身份决定，不能用分别排序替代。整表排序保留同一行关系才安全；错误配对会改变差值分布与推断。"},"references":[{"id":"nist-statistics","locator":"探索性数据分析中的图形与位置、尺度度量；用于理解描述与诊断的区别。"}],"next":"有了差值列，再进入 a15-2，学习怎样从分散程度算不确定性。","core":true,"chapterId":"c15","stageId":"s5","chineseCount":2169},{"id":"a15-2","title":"效果量、置信区间与 p 值的计算和解释","goal":"算出平均配对差、置信区间和双侧 p 值，并把统计结果写成强度适当的句子。","scope":"主修实证定量；数字仅来自本教材构造数据，学习计算和解释，不代表真实实验效果。","prerequisites":["a15-1"],"minutes":90,"tags":["实证定量"],"terms":[{"zh":"效果量","en":"effect size","definition":"描述差异或关联大小的数量；可以保留原单位，也可以经过标准化，不等于是否显著。"},{"zh":"置信区间","en":"confidence interval","definition":"按某方法反复抽样构造区间时，长期覆盖真实参数的比例由置信水平规定；单次区间解释依模型与设计。"},{"zh":"p 值","en":"p-value","definition":"在零假设及计算所需假定下，出现当前或更极端检验统计量的概率，不是零假设为真的概率。"},{"zh":"标准误","en":"standard error","definition":"估计量在重复抽样模型下的波动尺度，与对象间标准差不同。"}],"sections":[{"id":"concepts","title":"大小、精度与相容性回答不同问题","paragraphs":["“效果有多大”“估计有多不确定”“数据与某个零差模型是否相容”是三件事。平均差回答大小，区间描述模型下的估计精度，p 值考察数据相对于零假设的极端程度。三个数字可以一起报告，但不能互相替代。一个很小的差异在大样本中可能有很小的 p 值，一个有实际意义的差异在资料不足时也可能区间很宽。","本例的结果变量是每个对象的绝对误差，配对差定义为 B 减 A，因此 −0.75 g 表示 B 的平均绝对误差低 0.75 g。保留 g 这一原单位，读者才能讨论实际要求。若做标准化，可以用平均差除以差值标准差得到一种配对标准化指标，但必须说明分母；不同标准化定义不能不加解释地混用。","双侧配对 t 检验的零假设是总体平均配对差为零，而不是每个对象的差均为零。其经典小样本模型关注差值分布，而不是要求 A 和 B 各自通过正态检验。独立对象、合理取样或适当设计、差值分布和极端值都影响解释。当前资料由教材构造，没有真实抽样过程，数字只演示假定模型下的计算。"]},{"id":"reasoning","title":"为什么先算差，再估计不确定性","paragraphs":["同一对象两流程共享对象特征，先求差能利用这种配对关系。若误当独立样本处理，就忽略对象内联系，标准误可能不合适。对二十个差值求标准差得到约 0.6621 g；除以二十的平方根得到标准误约 0.1481 g。增加独立对象通常可以减少估计不确定性，但反复读取同一对象不能自动算作增加独立对象。","区间计算是平均差加减临界值乘标准误。自由度为十九，双侧百分之九十五的 t 临界值约为 2.093，比常见大样本正态近似 1.96 更大。它反映估计标准差带来的不确定性。无论公式多精确，区间都不会自动包含未记录的系统偏差、选择偏差或失真的测量过程。"]},{"id":"workflow","title":"在 Excel 中得到同一套结果","paragraphs":["继续使用上篇 H2:H21 的差值，先核方向是 B 绝对误差减 A。把以下量放到独立结果区，并在相邻格写名称和单位，不要把显示值手工复制后参与后续运算。"],"steps":[{"title":"计算有效配对数和均值","body":"n=COUNT(H2:H21)，均值=AVERAGE(H2:H21)，得到二十与 −0.75。若有缺失，不能直接假定仍为二十；检查完整配对及方案中的缺失规则。"},{"title":"计算标准差和标准误","body":"sd=STDEV.S(H2:H21)，se=sd/SQRT(n)，得到约 0.6621337 与 0.1480576 g。STDEV.S 使用样本标准差；标准误不是把均值除以样本量。"},{"title":"构造区间","body":"临界值=T.INV.2T(0.05,n-1)，下限=均值−临界值*se，上限=均值+临界值*se。结果约 [−1.059888,−0.440112] g。区间两端都为负，与当前差值方向对应。"},{"title":"计算检验量与概率","body":"t=均值/se，得到 −5.065596；p=T.DIST.2T(ABS(t),n-1)，得到约 0.0000686813。ABS 使双侧尾概率函数接收非负检验量，不改变平均差方向。"},{"title":"用第二条公式核对","body":"=T.TEST(F2:F21,G2:G21,2,1) 指定双侧与配对，可核对 p 值。它返回概率，不返回有方向的平均差。若区域设置要求分号，按软件提示替换参数分隔符。"},{"title":"形成结果句并解释","body":"写平均差、区间、统计量、自由度和双侧 p 值；另外说明教学构造身份、模型假定和实际意义需要的判断标准。不要把软件显示的 0.000 写成 p=0，可提高显示精度。"}]},{"id":"worked","title":"从计算表到完整报告句","paragraphs":["结果成品：“在二十个构造的教学对象中，B−A 的平均绝对误差差为 −0.750 g，配对 t 模型下百分之九十五置信区间为 [−1.060,−0.440] g，t(19)=−5.066，双侧 p≈0.0000687。本例只演示计算，不能据此认定真实流程 B 有效。”第一句给出对象、方向、大小和不确定性，第二句限制证据能够承担的结论。","设想真实应用要求误差至少减少 2 g 才值得增加设备成本。即使真实研究得到相同数值，−0.75 g 和小 p 值也不能证明达到这一实际要求。实际重要性阈值应由使用情境、成本和风险事先说明，不能在看见结果后把阈值改小。这里的 2 g 只是教学假设，不是行业标准。","Python 完整版本可运行材料目录中的 analyze.py。若已安装 SciPy，也可用下面短代码核对；先按 a15-1 得到列表 a、b、d。它给出的平均差方向来自 b−a，与表格一致。不同软件的小数末位差异通常来自数值算法，不能掩盖对象数、方向或显著量级的错误。"],"code":{"language":"python","text":"# 需先安装 scipy；a、b、d 为 a15-1 已计算的列表\nfrom statistics import mean, stdev\nfrom math import sqrt\nfrom scipy import stats\nn = len(d)\nse = stdev(d) / sqrt(n)\nci = stats.t.interval(0.95, df=n-1, loc=mean(d), scale=se)\ntest = stats.ttest_rel(b, a)\nprint(mean(d), se, ci, test.statistic, test.pvalue)"}},{"id":"repair","title":"三个常见解释怎样改","paragraphs":["容易踩的坑：“p 很小，零假设为真的概率几乎为零。”修改：“在零均值差和检验假定下，这样或更极端的统计量较少出现。”概率条件不能倒过来。容易踩的坑：“百分之九十五的对象改善介于区间两端。”修改：“区间针对总体平均差，不是个体差异范围。”","容易踩的坑：“没有显著差异，因此两者相同。”修改：“本分析没有得到足够证据拒绝零差模型；区间显示仍有哪些差异与资料相容。”证明足够接近需要预先规定等效界限和适合的等效分析。任意把未显著当相同，会把低精度误作没有效果。"]},{"id":"tips","title":"先读单位和区间，再看阈值","paragraphs":["读结果时先问平均差是什么单位、正负意味着什么，再看区间是否跨过具有实际意义的界限，最后看 p 值如何计算。不要把 0.049 与 0.051 当作截然相反的科学事实。临界线可以服务预定决策，但不能取代连续证据和不确定性表达。","样本很小、存在严重异常或复杂聚类时，单个配对 t 公式可能不适用。可考虑更合适的模型、置换或重抽样方案，但这些也有设计与交换性等条件，不能用“非参数”三个字保证安全。先检查数据产生机制，必要时寻求统计指导。"]}],"exercise":{"materials":"平均配对差 −0.75 g，差值标准差 0.662133712 g，二十对；另设实际改善要求为 2 g。","task":"独立算出标准误与区间，写统计结论和实际判断各一句，并指出模拟数据的边界。","template":"d 的方向：\nse=\nt=\n区间=\np=\n统计解释：\n实际要求判断：\n材料边界：","answer":"d=B−A；se≈0.148058 g；t≈−5.065596，自由度十九；区间约 [−1.059888,−0.440112] g；双侧 p≈0.0000686813。假定模型中数据与零均值差较不相容，但平均减少量与所设 2 g 要求不同，不能声称达到要求。所有值来自教学构造，不能作为真实有效性证据。","rubric":["使用二十个配对差而非四十独立读数","区间和 p 与教材数字一致且保留方向","解释未把 p 当假设为真的概率","实际意义和教学身份都有独立表述"]},"quiz":{"question":"区间完全低于零、p 很小时，哪句话仍需另外的证据？","options":["当前平均差的估计为负","使用该假定模型算得的数据与零均值差较不相容","流程在所有真实场景都值得采用"],"correct":2,"explanation":"推广、成本收益与所有场景需要额外证据；统计推断不能自动给出这些结论。当前还是构造数据，更不能声称真实有效。"},"references":[{"id":"nist-statistics","locator":"均值的置信区间、配对观察和 t 检验相关内容，用于核查计算。"},{"id":"asa-p","locator":"关于 p 值的六条原则，重点阅读 p 值不能衡量假设为真概率及效果重要性的说明。"}],"next":"在 a15-3 把研究设计与比较方法连接起来，再在 a15-4 检查处理选择的影响。","core":true,"chapterId":"c15","stageId":"s5","chineseCount":2083},{"id":"a15-3","title":"比较方法、回归及其假设检查","goal":"依据结果变量、独立单位和设计选择分析，并解释回归系数的条件含义。","scope":"主修实证定量；数字仅来自本教材构造数据，学习计算和解释，不代表真实实验效果。","prerequisites":["a11-2","a15-2"],"minutes":90,"tags":["实证定量"],"terms":[{"zh":"回归","en":"regression","definition":"描述结果与一个或多个解释变量之间的模型关系，系数的含义依变量编码、模型和条件而变。"},{"zh":"残差","en":"residual","definition":"观测结果减去模型拟合值，常用来检查模型未解释的模式。"},{"zh":"混杂","en":"confounding","definition":"某因素与研究暴露和结果相关，使观察到的关系混入其他路径的影响。"},{"zh":"交互作用","en":"interaction","definition":"一个变量与结果的关系会随另一个变量的取值改变，必须说明所在的模型尺度。"}],"sections":[{"id":"concepts","title":"选方法先回答三个问题","paragraphs":["第一，结果变量是什么：连续读数、二分类结局、计数、顺序等级还是时间到事件？第二，观测彼此怎样相关：不同独立对象、同一对象前后、同一学校多人还是一人多次？第三，问题是描述差异、预测新对象，还是估计因果效果？同一个表可以用于不同任务，不能只凭“有两组”就选择 t 检验。","配对比较分析对象内差；独立组比较分析两组不同对象的均值差；列联表方法处理类别计数；线性回归常处理连续结果的条件均值；逻辑回归常处理二分类结果的概率相关结构。这些是起点，不是完整菜单。样本结构、非线性、方差、极端值和稀疏程度都会改变具体方法。","线性回归可写成 Y=β0+β1X+误差。截距是 X=0 时的模型均值，若零不在实际范围，解释要谨慎；斜率是 X 增加一个单位时模型条件均值的变化。加入 Z 后，X 系数表示在模型中固定 Z 的条件关联，不自动变为因果效果。“控制越多越科学”是错误直觉，控制中介或碰撞变量可能改变问题甚至引入偏差。"]},{"id":"reasoning","title":"模型用来简化，不用来掩盖设计","paragraphs":["模型假设可以来自数据结构、误差机制和目标。线性回归并不要求每个自变量都呈正态分布；经典小样本区间常依赖误差相关假定。独立性通常来自设计，无法单凭一张残差图证明。方差不齐可能需要适当标准误或其他模型；严重非线性则提示函数形式不合适，不能只更换 p 值算法。","真实因果解释还依赖时间顺序、混杂控制和识别假设。把观察数据放进回归不会消除未测量的关键因素。若准备控制变量，应先根据领域知识画出可能关系并说明理由，再看数据。为了得到显著系数反复增删变量，会造成选择性分析，最终标准误和 p 值不能如同事前固定模型那样解释。"]},{"id":"workflow","title":"建立一张分析选择记录","paragraphs":["准备问题句、字段字典、抽样与设计说明，以及一张记录候选方法的表。目标是让另一位读者知道为什么选这个方法、哪些条件尚未满足。"],"steps":[{"title":"写清估计对象","body":"把“看看是否不同”改为“估计同一对象中 B−A 的平均绝对误差差，单位 g”。若要预测，将目标改为在未见对象上预测误差，并另设验证方案。目的不同，评价标准也不同。"},{"title":"识别独立单位与相关结构","body":"画出对象、批次、测量之间的关系。教学数据是一对象一对；若真实项目一对象十次读数，不能把十次当十独立对象，可预先汇总或使用适当重复测量模型。"},{"title":"选择主分析与备选","body":"本教学问题以配对 t 模型演示平均差。独立两组连续结果可能采用 Welch 比较；有协变量的连续结果可能用线性模型。写出为何这些方法回答目标，而不只列软件命令。"},{"title":"检查图形与数据问题","body":"查看差值分布和极端值；回归则画残差对拟合值、关键自变量关系及必要的诊断图。扇形提示方差变化，弯曲提示结构遗漏。记录看到的具体模式，不只说假设通过。"},{"title":"检查敏感性和可解释性","body":"根据问题检查异常值影响、合理函数形式及预定替代分析。改变方法时解释目标是否仍是同一个量；秩检验不总能直接解释为中位数差检验。"},{"title":"报告方法理由与限制","body":"给出估计值、区间、样本结构、必要诊断和限制。预测模型报告样本外表现，因果模型交代识别条件，描述模型避免写成干预建议。"}]},{"id":"worked","title":"同一问题怎样避免选错方法","paragraphs":["教学案例的二十个对象分别有 A、B，所以采用差值而不是将 A 的二十行与 B 的二十行看作无关。模型可以直接写 d_i=μ_d+ε_i，截距就是平均配对差。估计为 −0.75 g，标准误约 0.1481 g。这个只有截距的模型帮助理解：配对分析并非孤立技巧，而是在恰当单位上估计一个均值。","再看一个完全独立的教学小算例：X=[0,1,2,3]，Y=[1,2,2,5]。最小二乘直线为 Ŷ=0.7+1.2X；预测值依次 0.7、1.9、3.1、4.3，残差依次 0.3、0.1、−1.1、0.7。斜率的含义是这个拟合模型中 X 每增一单位，Y 的预测均值增 1.2。只有四点且来源是假设，不能据此称 X 导致 Y，或保证 X=100 时仍如此。","表格可用 =SLOPE(Y区域,X区域) 和 =INTERCEPT(Y区域,X区域) 核对系数，再逐行算预测与残差。把残差画出来，会看到中间低估或高估的结构是否明显；在四个点上不能靠图确认所有假定。真实模型的评价还需要更多设计信息和适当验证。"],"table":{"headers":["情境","合理起点","必须补查"],"rows":[["同对象 A/B 连续结果","对象内差与配对模型","差值分布、对象独立性和顺序影响"],["不同对象两组连续结果","独立组均值差，如 Welch 方法","分组机制、混杂和极端值"],["连续结果与多个因素","适当回归模型","变量角色、函数形式与相关结构"],["预测新对象","训练与独立验证的预测流程","泄漏、目标总体和评价指标"]]}},{"id":"repair","title":"把方法名称改成可审查的理由","paragraphs":["容易踩的坑：“所有数据都做正态检验，p 大于阈值就用参数检验。”小样本检验不容易发现偏离，大样本又可能对微小偏离敏感；相关假定还可能针对误差或差值。修改：“先识别目标量和设计，再用图形、背景和敏感性检查相关假定。”","容易踩的坑：“加入年龄、成绩、满意度后，系数显著，所以找到了因果。”其中满意度若由研究处理引起，控制它可能改变需要估计的总效果。修改：“根据因果问题与时间顺序说明协变量角色，报告条件关联，并列明未解决的混杂；没有足够识别依据时不作因果声称。”"]},{"id":"tips","title":"把诊断结果变成行动","paragraphs":["不要把诊断表做成一排自动通过的勾。发现非线性后，画关系并讨论理论上合理的形式；发现聚类后，核对独立单位并选择相应模型；发现极端残差后，回到原件判断错误还是有意义个例。每个动作都应留下原模型与修订理由，避免结果导向的试法。","当项目涉及很多预测变量但对象很少，模型可能在样本里拟合很好，却对新对象不稳定。此时缩小问题、减少有理论依据的参数或补数据，常比继续添加复杂算法更合理。统计方法的名称不能补足缺失的设计与资料。"]}],"exercise":{"materials":"资料甲为二十对象各一次 A/B；资料乙为三学校各二十学生且同校共享教学；资料丙为 X=[0,1,2,3]、Y=[1,2,2,5]。","task":"说明甲的分析单位、乙为何不能简单视作六十独立处理单位，并核对丙的回归系数与一项残差。","template":"问题与目标量：\n独立单位和相关：\n方法理由：\n诊断事项：\n可作和不可作的结论：","answer":"甲先求二十个对象内差，可用配对模型演示均值差。乙学生可能在校内相关，若教学条件按学校分配，处理层面的独立单位是学校，只有三所的推断尤其受限。丙斜率 1.2、截距 0.7，X=2 时预测 3.1，残差 −1.1；这是四个构造点的拟合，不能推成因果规律。","rubric":["选择理由先交代问题与单位","识别配对和聚类而不是只数行","回归系数、预测和残差计算一致","没有把调整回归等同因果识别"]},"quiz":{"question":"回归调整了所有手头变量后，最合理的判断是哪一个？","options":["混杂一定被消除","仍需核查变量的因果角色、测量与识别假设","变量越多结论必然越可靠"],"correct":1,"explanation":"未测量混杂仍可能存在；控制不适当变量还可能引入偏差。调整后的条件关系只有在额外假设成立时才支持因果解释。"},"references":[{"id":"nist-statistics","locator":"线性最小二乘、残差分析和模型诊断相关章节，重点看图形如何暴露模型失配。"},{"id":"strobe","locator":"观察研究报告中的偏倚、统计方法与混杂处理条目；报告规范不能替代研究设计。"}],"next":"进入 a15-4 记录缺失、极端值和多重分析，检查结论是否依赖某个处理选择。","core":true,"chapterId":"c15","stageId":"s5","chineseCount":2356},{"id":"a15-4","title":"缺失值、异常值、多重比较与敏感性分析","goal":"制定有依据的数据处理规则，记录分析分支，检查主要结论对合理选择的依赖。","scope":"主修实证定量；数字仅来自本教材构造数据，学习计算和解释，不代表真实实验效果。","prerequisites":["a15-3"],"minutes":90,"tags":["实证定量"],"terms":[{"zh":"缺失机制","en":"missingness mechanism","definition":"资料为何没有被观察到的过程；与结果或已知变量的关系会影响分析偏差。"},{"zh":"异常值","en":"outlier","definition":"相对于某种模式显得偏离的观察，可能是错误、不同机制或真实极端，不能仅凭偏离决定删除。"},{"zh":"多重比较","en":"multiple comparisons","definition":"同时或反复检验许多问题，增加偶然出现较小 p 值的机会，需要与推断目标匹配的控制和报告。"},{"zh":"敏感性分析","en":"sensitivity analysis","definition":"改变有理由的假设或处理选择，检查结论是否明显变化，并解释变化来自哪里。"}],"sections":[{"id":"concepts","title":"无法观察、观察错误与不喜欢结果是三回事","paragraphs":["缺失可以由设备失败、拒答、记录丢失或不适用引起。完全随机缺失、在已知变量条件下可解释的缺失、仍与未观测值相关的缺失，是常见建模区分；仅靠现有数据通常不能彻底证明某种机制成立。没有测到不能直接当零，“不适用”也不总能与“忘记填”合并。先查产生原因，再决定分析。","异常值也需要先查来源。单位录错、坐标小数点错、传感器脱落和真实极端事件，对应不同处理。用四分位距规则或标准分数标记，只是提示检查，不能自动判定无效。特别是在安全、可靠性和失败研究中，极端事件可能正是最重要的对象。","多重比较不只发生在同时测一百个指标。尝试多种分组、不同截断值、不同模型，再只报告一个显著结果，同样会产生选择问题。事先区分主要问题与探索问题，保留分析记录，比事后给所有结果贴上确认性标签更诚实。调整方法服务具体错误控制目标，不存在每种情境通用的一步按钮。"]},{"id":"reasoning","title":"处理规则会改变你实际回答的问题","paragraphs":["完整案例分析只使用必要变量都有值的对象，简单但可能浪费资料并引入选择偏差；均值填补会压缩变异并破坏关系；多重插补通过多个合理填补反映部分不确定性，也依赖模型和缺失假定，不能凭空恢复不可识别的信息。新手不应因为工具提供按钮就跳过这些判断。","对异常值删或留、使用哪种缺失方案、是否调整多重比较，都会影响估计和不确定性。敏感性分析的目的，是暴露这些依赖，而不是找一个最有利版本。若合理选择导致结论改变，应把不稳定性写进结论，并检查下一步需要补什么资料。"]},{"id":"workflow","title":"建立一份分析决策与敏感性表","paragraphs":["准备原始资料、数据字典、初始分析方案和处理日志。对每个问题至少记录对象、原因、依据、主方案与替代方案；绝不覆盖原始结果。"],"steps":[{"title":"制作缺失概览","body":"按变量和对象统计缺失数量、比例与已知原因，画缺失模式表。配对差缺 A、缺 B 或缺参考值时无法按原定义计算，先查原始记录，再按计划处理。说明分母是否因分析而不同。"},{"title":"核查偏离记录","body":"根据物理范围和图形标记疑点，回查原件与操作日志。确有录入错可更正并记录旧值、新值、依据；真实极端则保留并评估影响；无法核实的疑点标注不确定。"},{"title":"区分主问题与探索问题","body":"写一个主要结果变量、主要比较和预定模型；其他指标或亚组标为次要或探索。若同时需要确认多项主张，选择与问题相符的多重控制方案，并解释所控制的是何种错误。"},{"title":"定义合理替代分析","body":"例如对明确质疑的记录分别保留与按有据规则排除，对缺失采用若干有科学理由的范围假设。每个方案必须解释为何可能成立，不能仅挑有利方案。"},{"title":"汇总而不只挑显著者","body":"在同一表中列样本数、估计值、区间和假定。先看效果大小和方向变化，再看不确定性，避免只比较显著与不显著两个标签。"},{"title":"修改结论强度与后续动作","body":"若结论对某个无法判断的假定敏感，就明确这一点，并把复核原件、补测或补充资料列为后续。不把删除后的漂亮结果取代全资料结果。"}]},{"id":"worked","title":"不删除三个方向相反的对象","paragraphs":["主教学数据没有缺失，二十对平均差为 −0.75 g，总差为 −15 g。三个 B 较差对象的差为 0.2、0.4、0.1 g。如果因为“它们不符合趋势”删去，就会得到十七对、总差 −15.7 g、平均约 −0.9235 g，看起来改善更大。这个计算演示的是选择性删值怎样夸大均值，不是推荐的敏感性方案。主结果必须保留这三项。","再设一个独立的教学情境：四个已观测配对差为 −1、−1、0、1，另一个对象 B 读数缺失，故差未知。已观测均值为 −0.25。若有领域依据认为缺失差可能为 −2 或 2，则五对象均值分别为 −0.6 或 0.2，方向会改变。这里的范围不是从数据自动推出的，必须写明它只是情境假设；真实项目应说明范围依据。","多重检验小算例：若进行二十次相互独立、零假设均成立、每次显著性水平为 0.05 的检验，至少一次误报的概率为 1−0.95^20，约 0.642。实际检验常相关，不能把这个数直接套到任何项目；它解释了为何大量寻找并只报告命中结果会误导。Bonferroni 可用总体阈值除以比较数控制家族错误，但可能保守，仍须先明确比较家族。"]},{"id":"repair","title":"把有利结果改成透明结论","paragraphs":["容易踩的坑：“去掉异常后结果显著，因此以清理后结果为准。”需要先问异常如何定义、是否看结果才定规则、是否确有错误。修改：“主分析保留全部有效资料；依据预先说明的质量规则另做敏感性分析，并报告两者估计及差异原因。”","容易踩的坑：“缺失少于百分之五，所以无影响。”少量缺失若集中在关键失败对象，也可能重要。修改：“缺失占比为多少、集中于何类对象、已知原因是什么；在以下合理情境中结论如何改变。”比例只是一个描述，不是免除分析的保证。"]},{"id":"tips","title":"预先写规则，事后仍允许有理由修订","paragraphs":["方案不是禁止学习。发现未预见的设备问题时可以修订处理，但应写清何时发现、是否已看结果、修订理由及原方案结果。把事后变化透明呈现，比假装一切早已计划更可靠。探索分析可以产生好问题，前提是不把它伪装成事前检验。","敏感性表至少保留一个会让你不舒服的合理方案。若所有分析只是换图颜色或小数位，就没有检验关键依赖。真正需要检查的是资料缺失机制、变量定义、独立单位、模型结构和主要处理规则。无法凭现有资料解决的歧义应保留，不能靠反复计算消除。"]}],"exercise":{"materials":"主案例差值总和 −15 g、二十对，其中三个正差为 0.2、0.4、0.1；独立缺失示例有差 −1、−1、0、1 和一个未知。","task":"计算选择性删值后的均值以说明偏差风险；为缺失例写两种有明确标签的情境，说明结论是否稳定。","template":"主分析：\n删值理由是否成立：\n替代结果：\n缺失情境与依据：\n结论变化：\n需要补充的材料：","answer":"主分析 −0.75 g；按正差删值不成立，删后三项均值 −15.7/17≈−0.9235 g 只说明选择影响。缺失差假定 −2 时均值 −0.6，假定 2 时均值 0.2，方向不稳定；范围为教学假设，实际应追查缺失原因和可接受范围。","rubric":["区分有据更正与结果导向删值","主案例原结果完整保留","缺失情境明确是额外假设并计算正确","报告不稳定性而非只选择有利版本"]},"quiz":{"question":"发现一个极端但核实无误的真实观察，第一步应该是什么？","options":["为了正态性直接删除","保留其来源，理解产生机制并评估对目标量的影响","改成平均数以减少波动"],"correct":1,"explanation":"极端不等于错误。是否改变分析取决于问题、机制和预定规则，删除或填均值都不能自动得到可信结论。"},"references":[{"id":"nist-statistics","locator":"异常值识别和探索性数据分析相关内容，注意识别异常与删除的区别。"},{"id":"asa-p","locator":"关于完整报告和避免选择性分析的原则。"},{"id":"strobe","locator":"缺失数据、敏感性分析和参与者数量的报告条目。"}],"next":"接着用 a16-1 检查基线、稳健性和失败条件，再用 a16-4 从原始材料完整重跑。","core":true,"chapterId":"c15","stageId":"s5","chineseCount":2265},{"id":"a16-1","title":"基线、稳健性、消融、误差与失败分析","goal":"建立公平比较与失败记录，判断改善主张是否依赖特定条件。","scope":"检查研究结论与其证据的对应；示例均为原创教学材料，检查策略须符合具体方法。","prerequisites":["a11-2","a08-3"],"minutes":80,"tags":["实证定量","理论与计算"],"terms":[{"zh":"基线","en":"baseline","definition":"用于判断新做法增加了什么的参照方案；应与任务和实际使用有关并得到公平实现。"},{"zh":"稳健性","en":"robustness","definition":"结论在一组有理由的条件或分析变化下是否保持，不能理解为对所有变化都不变。"},{"zh":"消融","en":"ablation","definition":"去掉或替换系统某个组成部分，检查该部分对表现的贡献；解释依其余条件如何控制。"},{"zh":"误差分析","en":"error analysis","definition":"按对象、条件和失败形式检查错误的分布与原因，不只看总体平均分。"}],"sections":[{"id":"concepts","title":"先问比谁好，再问在哪里好","paragraphs":["一个新方法得分高，并不说明它有增量价值。基线可以是现行做法、简单而可靠的方案、已有较强方法或理论上的无改进参照。它应代表真实要超越的对象。若拿认真调参的新方法与错误实现的旧方法比较，差异可能只说明资源投入不同。基线选择、实现、调参与评价条件都要透明。","稳健性与敏感性相互关联：敏感性分析揭示结果如何随假定变化，稳健性描述在已检查范围内保持了什么。既可能保持方向但大小变动，也可能平均结果稳定而某类对象失败。不能只写“结果稳健”，要说对哪些变化、哪个结果指标、在什么范围内。","消融适合由若干可拆部分构成的方法或系统，例如去掉校准步骤、替换特征模块或关闭反馈。它不必适用于每一类研究，也不是创新证明。去掉模块同时改变训练时长、信息量或资源预算，可能混入其他因素。若两个模块交互，单独删去一个产生的差异也不能简单相加当作总贡献。"]},{"id":"reasoning","title":"公平性与解释力比更多表格重要","paragraphs":["比较公平并不是所有细节强行完全相同，而是哪些条件需要相同、哪些差别正是研究对象，要预先说明。例如比较总成本，不能只比较精度而省略新设备价格；比较固定预算下精度，就要在同等预算内给各方案合理实现机会。解释对象不同，比较设计也不同。","总体平均值会遮住失败条件。对高风险对象偶尔出现大误差，可能比多数对象小幅改善更重要。按有科学意义的类别检查，可以帮助形成下一轮问题；但看结果后反复切分找显著组，需要明确标为探索，并在独立资料中检查。失败分析的价值在于解释边界，而不是找借口抹掉失败。"]},{"id":"workflow","title":"做出一张可以被质询的验证表","paragraphs":["输入是问题、主要结果、现有流程说明和分析结果。先规定比较对象与关键条件，再检查系统表现；不要先看哪张表最漂亮再决定验证项目。"],"steps":[{"title":"确定参照与资源","body":"写清为什么选此基线：现行标准、简单方案或最接近方法。记录版本、参数、训练或调试投入、计算时间与硬件等相关条件。若无法复现强基线，写限制并降低比较结论，而非假装公平。"},{"title":"锁定评价目标","body":"注明主要指标、方向、使用条件和最小实际改善要求。若主要目标是绝对测量误差，不能只挑相对百分比最有利的表达；次要指标可补充成本和失败风险。"},{"title":"列关键变化而非随意变动","body":"根据机制选参考偏差、对象范围、批次或分析规则等变化。每一项写为什么可能影响结论，以及什么表现会使原主张不成立。"},{"title":"设计有理由的消融","body":"适用时仅改变目标模块并保持必要条件可比，记录删去模块后的系统是否仍合理可用。若改变整个任务定义，不能把差异都归给被删模块。"},{"title":"检查个体误差与失败","body":"按事先有意义的条件列出失败类型、频数、严重程度及来源。对个别异常回查原始资料；新发现的分组线索标为探索，不把小样本偶然差异解释为确定机制。"},{"title":"写验证后的结论","body":"同时报告有效范围、失败范围和未测试范围，说明哪些检查支持大小、方向或机制。若一个关键合理条件使结论逆转，优先修订主张或设计，而不是省略该检查。"}]},{"id":"worked","title":"教学配对案例怎样发现失败边界","paragraphs":["现有 A 作为教学比较基线，B 为另一流程。全体二十个构造对象的平均绝对误差分别为 3.75 和 3.00 g，但 O05、O09、O17 的 B 误差更大，差分别为 0.2、0.4、0.1 g；O06 两者相同。因此完成的失败记录可以写：“总体平均差为 −0.75 g；三个对象方向相反，尚无对象特征资料，不能解释其机制，也不能据此认定存在可推广的亚组。”","如果参考值存在共同偏移，绝对误差的变化可能是非线性的，因为绝对值在零点改变方向。本案例所有读数高于参考值，但真实资料未必如此。一个合理检查是根据校准报告规定的参考不确定性范围重新计算，而不是随意挑一个让 B 更好的参考值。教材没有真实校准报告，故不能声称已经完成了这种真实验证。","再设一个独立、纯假设的系统例：新流程包含校准模块 C 和滤波模块 F。完整系统误差 2.0，去 C 后 3.0，去 F 后 2.4，全去掉为 4.0，单位一致。这些数字不能证明 C 独立贡献恰为 1.0、F 恰为 0.4 且可相加，因为模块可能交互。合适结论是：“在所设组合与评价条件下，两项删除均降低表现；独立和交互作用仍需更完整设计。”","另一项可直接重算的检查是逐次留出一个对象，再对其余十九个差值求均值。二十次均值范围约为 [−0.810526,−0.684211] g；全部差值的中位数为 −0.75 g。这表明在此构造数据中，没有单个对象的有无使平均差方向翻转；它不证明对成组缺失、参考错误或新场景也稳健，更不能替代真实验证。表格可用 (SUM($H$2:$H$21)−H2)/(COUNT($H$2:$H$21)−1) 向下填充，再取最小和最大值。"],"table":{"headers":["验证问题","所需证据","本教学案例可说到哪里"],"rows":[["B 的平均误差是否较小","配对数据与估计","构造资料平均差 −0.75 g"],["B 是否对每个对象都较好","个体差值","否，三个更差、一个相同"],["为何三个对象失败","对象特征、过程记录与进一步设计","资料不足，不能虚构机制"],["真实系统是否值得替换","真实验证、成本和风险","本构造案例不能判断"]]}},{"id":"repair","title":"修改过强的验证结论","paragraphs":["容易踩的坑：“换三种统计方法都显著，所以方法完全可靠。”若三种方法都使用同一批有偏资料，无法排除共同偏差。修改：“三种与目标相符的分析在这些假定变化下方向一致；抽样、测量和未测试场景仍有限制。”方法数量不能代替关键替代解释。","容易踩的坑：“去掉模块性能下降，证明模块实现了我们设想的机制。”下降也可能因为容量或信息减少。修改：“消融显示该组件在当前系统配置中与表现有关；机制解释还需控制其他变化并设计更有针对性的证据。”"]},{"id":"tips","title":"从最可能推翻你的检查开始","paragraphs":["验证资源有限时，优先检查最接近真实使用、最可能使结论失效的条件。对测量研究，这可能是参考值和对象范围；对预测研究，可能是新地点或新时期；对系统研究，可能是延迟、资源与失败恢复。只反复验证已经容易成功的条件，会留下最重要的不确定性。","记录失败时同时保存输入、版本、参数和症状，避免只写“效果不好”。如果失败来自明确软件错误，应修复并重跑受影响结果；若来自方法边界，应写进讨论并据此缩小贡献。诚实界定适用范围通常比声称普遍最优更有说服力。"]}],"exercise":{"materials":"主案例三个正差 0.2、0.4、0.1 和一个零差；假设模块 C/F 误差分别为完整 2.0、去 C 3.0、去 F 2.4、全去 4.0。","task":"写一份公平比较与失败分析记录，并给消融数字一个不过强的解释。","template":"基线与选择理由：\n比较条件：\n主要指标：\n失败记录：\n可支持的主张：\n未排除的解释：","answer":"基线为教学流程 A，比较同对象绝对误差；二十对象平均 B 较小但三对象更差、一相同。缺少特征不能解释失败机制。假设消融中去 C 或 F 都使误差上升，支持组件在该配置下有作用，但不能把增量当独立可加贡献或证明指定机制；需检查资源变化和交互。","rubric":["基线选择与比较条件具体","保留方向相反和相同的对象","消融解释包含交互或资源替代解释","实际效果与构造计算分开"]},"qu
