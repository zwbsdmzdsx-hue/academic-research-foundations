iz":{"question":"哪项检查最能补充“总体平均误差较小”的结论？","options":["把同一均值换成更多颜色的图","查看有科学意义条件下的个体误差、失败严重度与适用边界","只删去三个方向相反对象重算"],"correct":1,"explanation":"个体和条件层面的失败分析提供均值没有显示的信息；改图颜色不增加证据，按结果删值会产生选择偏差。"},"references":[{"id":"nist-statistics","locator":"模型验证、残差和误差检查相关内容。"},{"id":"sklearn-leakage","locator":"Common pitfalls 中数据泄漏与保持预处理、评价分离的说明。"}],"next":"用 a16-4 将最终保留的分析从原件重跑，并在 a19-3 写清验证支持和未覆盖范围。","core":true,"chapterId":"c16","stageId":"s5","chineseCount":2549},{"id":"a16-2","title":"定性研究中的反例、反思与证据一致性","goal":"用材料和研究者反思检查主题解释，保留反例并说明结论适用范围。","scope":"检查研究结论与其证据的对应；示例均为原创教学材料，检查策略须符合具体方法。","prerequisites":["a12-3","a14-2"],"minutes":80,"tags":["定性与案例"],"terms":[{"zh":"反例","en":"negative or deviant case","definition":"与初步解释不一致或使其范围需要修订的材料，不等同于应删去的坏数据。"},{"zh":"反思性","en":"reflexivity","definition":"持续检查研究者的位置、关系和理论预设如何参与资料生成与解释。"},{"zh":"证据链","en":"chain of evidence","definition":"让读者能从研究主张回到分析过程、语境和具体材料，理解解释如何形成。"},{"zh":"成员反馈","en":"participant or member feedback","definition":"向参与者了解其对某种材料或解释的回应；它是一种可选择的研究互动，不是自动裁决真假的程序。"}],"sections":[{"id":"concepts","title":"可信并不等于所有人说同一句话","paragraphs":["定性研究常试图理解意义、过程、经验和语境。材料中的差异可能正是研究发现，而不是必须消除的噪声。若初步主题是“新手面对一次工具错误就放弃工具”，遇到仍继续逐条核查的参与者，应追问解释范围，而不是因为不符合主题就舍弃其发言。好的主题能够说明材料间有意义的关系和边界。","证据一致性不是要求每句原话都支持同一个结论，而是主张、问题、方法和材料之间没有无法解释的冲突。引文需带必要语境，分析需说明怎样从具体表达走到较抽象理解。列十句相似引文不自动构成深度；一个有语境、能比较竞争解释的片段也可能很有分析价值。","不同定性传统的质量标准不完全相同。在反思性主题分析中，研究者的解释工作是资源，编码者一致性系数通常不是必然要求；在采用固定编码框架、以分类一致性为目标的研究中，编码规则、训练和一致性检查可能更重要。应先交代方法立场，再选择检查，不能把一种传统的工具强加给所有研究。"]},{"id":"reasoning","title":"反例会帮助你把宽泛主题改准确","paragraphs":["初步解释往往从最醒目的材料产生，容易过度覆盖。主动寻找反例能迫使你识别条件：是所有新手都放弃，还是缺少独立核查经验的人更可能整体否定？后一种说法仍需材料支持，不能为了挽救主题随意发明条件。每次修订都要回到其他案例，检查新解释是否只是为一个例外临时打补丁。","研究者提出的问题会影响材料。若访谈者一直问“你为什么不信任工具”，参与者可能围绕不信任作答；若同时问实际操作、继续使用的条件和例外，材料会更丰富。反思记录应追踪这种影响，而不只是写“我承认存在主观性”。透明记录让读者看见解释如何在研究关系中形成。"]},{"id":"workflow","title":"对一个主题做完整的证据复核","paragraphs":["输入是带语境的去标识材料、初始编码、主题草稿和研究备忘。这里所有片段都是原创教学模拟，不代表已开展访谈。"],"steps":[{"title":"把主题写成可讨论的命题","body":"不要只写“信任”这个主题名，写“出现无法检索的引用后，一些新手把单条错误推广为对整个工具的否定”。记录这句话解释的过程、对象和可能范围。"},{"title":"为主题建立证据表","body":"列材料编号、片段、上下文、解释与不确定性。原话和研究者推断分列，避免把“我猜他害怕”当成参与者已经说出的经历。"},{"title":"主动找反例与模糊案例","body":"重新阅读不符合命题的片段，寻找同样遇错但继续使用、从未遇错却拒用或态度与行动不一致的材料。标出材料不足，不能把沉默理解成同意。"},{"title":"比较竞争解释","body":"至少考虑技术熟练程度、任务风险、时间限制或指导经验等有材料依据的解释。检查哪一种能解释更多细节，哪里还不能判断；不要将多个标签简单堆在一起。"},{"title":"审视研究关系和提问","body":"回看自己是否暗示答案、过早打断或偏爱某类故事。写清这如何可能影响当前主题，并在后续收集或解释中作具体调整。"},{"title":"修订主题并保存轨迹","body":"保留旧主题、修订理由和支持及反例。若使用参与者反馈或同伴讨论，说明目的、过程和不同意见如何处理；最终报告呈现主题的条件与未覆盖范围。"}]},{"id":"worked","title":"从“都放弃”改成有条件的解释","paragraphs":["教学片段 P01：“标题看着都很真，找不到第一篇，我就把整份列表关了。”P02：“我也找不到一篇，但老师教过查 DOI，我把能查到的逐条留下。”P03：“有的找到了，可这次是要交正式报告，我还是重新搜了一遍。”三个片段都涉及引用核查，但行动不同。","初稿“引用错误让所有新手放弃 AI”无法解释 P02，也忽略 P03 的任务风险。完成的修订可写：“在这组教学材料中，遇到无法核验的引用后，受访角色采取整体放弃、逐条保留或重新检索等不同策略；核查经验和任务责任感提供了可探索的解释线索，现有片段不足以判定其因果作用。”这段既保留共同情境，也承认路径差异。","分析备忘成品：“我原把关闭列表视为不信任，却未区分节省时间和担忧后果。P02 提示核查策略可能改变行动，P03 提示高风险任务影响容忍度。下一轮若获准开展真实研究，应询问具体任务、时间约束和核查步骤，避免只问是否信任。”这里新增问题来自对材料的比较，不把教学角色当真实参与者。"]},{"id":"repair","title":"让引文支持解释而不是装饰解释","paragraphs":["容易踩的坑：“百分之八十受访者提到信任，所以信任是最重要主题。”出现频次可作为一种描述，但不能自动等同解释重要性；访谈提问和样本构成也会影响频次。修改：“说明信任如何参与具体决策、有哪些相反或模糊材料，以及为何这个主题能回答研究问题。”","容易踩的坑：“把报告给参与者看，他们认可，所以解释完全真实。”参与者可能出于礼貌认同，也可能只熟悉自己的经历；社会层面解释未必与每个参与者的自我描述一致。修改：“把反馈视作额外材料，交代谁回应、回应什么、如何处理分歧，并按研究方法解释其作用。”"]},{"id":"tips","title":"让反思产生实际修改","paragraphs":["每次分析会后写三行具体备忘：我目前偏向哪种解释；什么材料最可能推翻它；下一次要怎样检查。比长篇宣言更能指导行动。保留反例索引也很有用：写作时主动打开它，防止最后只选择最顺畅的引文。","材料共享必须遵守同意与隐私安排，不能为了证据链公开可识别录音。可用去标识片段、分析过程说明、受控访问等方式支持核查。没有任何单一清单能保证定性质量，关键是方法、问题、材料与解释之间保持可说明的一致。"]}],"exercise":{"materials":"P01 发现一篇无法核验后关闭列表；P02 逐条查 DOI 并保留可核验条目；P03 因正式报告责任重新检索。","task":"修订“错误导致所有人弃用”的主题，写一个反例分析和一条研究者反思。","template":"初始主题：\n支持片段：\n反例与竞争解释：\n修订主题：\n研究者预设：\n下一步检查：","answer":"初始全称主张被 P02 反驳，P03 还显示任务风险。可改成：遇到核验失败后存在不同应对路径，核查经验与责任情境可能参与其中。不能据三个片段认定因果。反思是原提问只关注不信任，后续应问实际操作、时间和任务，而不暗示弃用。","rubric":["主张回到具体片段和语境","反例真正改变主题范围","反思包含可执行调整","不把所有定性方法都要求编码一致性或成员认证"]},"quiz":{"question":"反思性主题分析中，两位研究者编码不同，最恰当的处理是什么？","options":["必须算到完全一致才算有效","讨论不同解释与立场如何影响分析，按所采用方法透明说明","直接删除有分歧的材料"],"correct":1,"explanation":"反思性主题分析不把一致性系数当普遍质量门槛。差异可以促进解释，但仍需材料依据和方法一致性；其他编码传统可能有不同要求。"},"references":[{"id":"thematic-analysis","locator":"反思性主题分析的六阶段与常见问题，重点看分析的递归性和研究者作用。"},{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"}],"next":"在 a17-2、a19-3 中把这种检查写进定性报告与讨论。","core":false,"chapterId":"c16","stageId":"s5","chineseCount":2306},{"id":"a16-3","title":"人文解释和理论论证的竞争解释与反驳","goal":"区分事实、解释和推导主张，用最强替代解释或反例检验论证。","scope":"检查研究结论与其证据的对应；示例均为原创教学材料，检查策略须符合具体方法。","prerequisites":["a12-4","a13-1","a13-2"],"minutes":80,"tags":["人文解释","理论与计算"],"terms":[{"zh":"竞争解释","en":"competing interpretation","definition":"对同一组材料给出的不同理解，需要比较解释范围、语境契合与所需假设。"},{"zh":"反例","en":"counterexample","definition":"满足某个一般命题前提却不满足结论的实例；是否足以推翻取决于原命题的逻辑形式。"},{"zh":"钢人化","en":"steelmanning","definition":"先准确重构对方最有力、合理的版本再回应；这是教学性的讨论技巧，不代替文献核查。"},{"zh":"论证负担","en":"burden of argument","definition":"某项主张需要提供何种理由才能成立，不能要求别人先证明它错。"}],"sections":[{"id":"concepts","title":"不同主张需要不同反驳方式","paragraphs":["“这份通告写了持证条件”是文本事实主张；“持证条件体现一种受限制的公共性”是解释主张；“所有公共开放都没有身份限制”是一般命题；“公共机构应给申请人申诉机会”是规范主张。它们分别需要原文、语境与解释比较、逻辑检验、原则与后果论证。不能用一句“这很主观”把所有讨论混在一起。","竞争解释并不是随意想出另一种故事。它应同样面对主要材料，解释关键用词、体裁、受众和背景，且不靠大量无证据假设勉强成立。一个解释可能很好地说明文本修辞，却不足以说明实际制度执行；另一个解释可能针对实施资料。比较前先确认双方是否在回答同一个层次的问题。","形式论证中的反例要求严格满足前提。要推翻“所有奇数平方都是奇数”，必须找到一个确为奇数而平方非奇数的整数；拿非整数或偶数举例无效。相反，要反驳“只要有一个可信例外就说明整体趋势不存在”，一个例外也未必足够，因为趋势命题与全称命题不同。精确写量词与条件是第一步。"]},{"id":"reasoning","title":"先加强对手，再检查自己的桥梁","paragraphs":["只回应对手最粗糙的说法，容易制造稻草人。应该先让对方的立场在合理条件下显得有道理，再说明你的证据为何仍支持另一判断。这样做不是礼貌装饰，而是测试自己的解释是否有真实区分力。若两种解释对现有材料给出同样预期，诚实结论可能是资料不足以裁决。","论证常在桥梁处出问题：从文字规定跳到实际执行，从一个时代跳到所有时代，从模型结论跳到现实必然，从平均趋势跳到每个个体。把每一步的隐含前提写出来，便能看见需要补充什么材料。若前提只在某条件成立，缩小结论范围往往比加入更多修辞更有效。"]},{"id":"workflow","title":"对一段核心论证进行压力检查","paragraphs":["准备一段自己的主张、全部关键材料、已有解释和引用位置。先处理最影响结论的理由，不要把文字润色当作论证已经通过。"],"steps":[{"title":"拆分主张种类与范围","body":"逐句标事实、解释、规范或形式推导；圈出所有、必然、仅、导致等强词，写明对象、时段和条件。产出一张主张与所需证据表。"},{"title":"重建推理链","body":"把前提、桥梁和结论分开写。引用是否只支持词语存在，却被用来证明实际执行？模型是否只在理想条件证明，却被写成现实规律？标出缺失环节。"},{"title":"提出最强竞争版本","body":"找实际文献中的最接近观点，或将教学竞争解释明确标为自拟。完整说明它为何合理及能解释哪些材料，不能给它故意安排明显错误的前提。"},{"title":"寻找区分性材料或反例","body":"思考哪一项材料在两种解释下会不同：执行记录、不同版本、反向案例或边界参数。形式命题则检查定义边界、小规模实例与极端条件，反例必须满足所有前提。"},{"title":"比较并修订","body":"依据证据决定支持、限定、合并或暂不裁决。若只是证明一个反对理由不成立，不能据此自动证明自己的全部主张；仍需正面论证。"},{"title":"写出回应段","body":"依次准确呈现竞争观点、承认其解释力、说明关键不足、给出你的证据与限定。把尚无法排除的替代解释放入局限，而非悄悄删去。"}]},{"id":"worked","title":"一份通告如何支持有限的解释","paragraphs":["原创教学通告：“本馆暂设夜间阅览，惟须持证者方得入内。”解释甲说它证明无条件全面开放；解释乙说它展示有限准入的开放措施。词语“夜间阅览”支持服务扩展，“暂设”提示安排的临时性，“惟须持证”明确准入条件。仅据这句话，乙比甲更符合文字，但还不能知道证件如何获得、谁被拒绝或制度怎样执行。","较强竞争解释丙认为，持证只是统计管理手续，实际对公众几乎没有排除。它不是凭原句就能排除的无意义说法。需要证件规则、申请成本、拒绝记录或使用者经验等资料区分乙的不同版本。完成回应可以写：“该通告明确规定持证准入，因此不能称文字层面无条件开放；条件实际具有多强排除作用，仍需实施资料判断。”","形式小例：“若整数 x 的平方为偶数，则 x 为偶数。”用逆否命题证明：若 x 为奇数，可写 2k+1，其平方为 4k²+4k+1=2(2k²+2k)+1，为奇数。因此原命题成立。检查时发现“整数”不可省略；若允许任意实数，x=√2 的平方为 2，但奇偶本来就未对这种数按同一方式定义。这个例子显示定义域缺失会使命题不清楚，不能把概念错误当作有意义的新发现。"]},{"id":"repair","title":"修正三种看似有力的反驳","paragraphs":["容易踩的坑：“作者带有立场，所以文献无效。”立场可能影响写法，但不能直接证明其中每个事实都错。修改：“结合作者位置与写作目的分析哪些内容需互证，并具体比较材料。”来源批判需要进入内容与形成过程。","容易踩的坑：“没有找到执行记录，所以制度从未执行。”缺乏记录可能源于保存、检索或记录方式。修改：“当前材料不能确认执行，且资料覆盖有这些限制。”把没有证据与证据显示没有区分开。","容易踩的坑：“对方一个例子不准确，所以我的理论正确。”修改：“该例子不能支持那项反对意见；我的理论仍需独立论证与其他反例检查。”推翻一个对手理由并不自动完成正面证明。"]},{"id":"tips","title":"把最危险的问题提前写在纸上","paragraphs":["在初稿边上写一句“如果哪条材料出现，我会修改这段结论”。这能帮助区分可被检验的解释与无论何种材料都能自圆其说的叙事。人文解释不必变成统计假设，但应说明什么会增加或削弱其说服力。","理论计算中测试许多例子可以发现错误，却不能代替一般证明；人文研究中一个反例可能限制全称主张，却未必否定具有条件的趋势。不同证据标准不能互相偷换。遇到无法裁决的解释，明确剩余分歧和所需资料，本身就是清楚的学术工作。"]}],"exercise":{"materials":"教学通告中的“暂设”“惟须持证”；竞争说法为持证只是行政登记，对准入没有实质限制。","task":"写一段回应，区分文字限制和实际排除，并列两种需要补充的材料。","template":"当前主张：\n竞争解释的最强版本：\n双方共有依据：\n可区分的材料：\n修订后的结论：","answer":"原文在文字上规定持证，故不能说无条件准入；但持证可能容易取得，实际排除程度不能只凭原句判断。需要证件申请规则、费用或拒绝记录，也可查使用者经验。结论限定为文本上的条件性开放，执行后果待资料支持。","rubric":["区分文本事实、解释和实施判断","竞争解释被准确而非歪曲呈现","提出能区分解释的具体材料","结论强度与证据覆盖一致"]},"quiz":{"question":"用一份制度文本直接证明制度在所有地点都有效实施，主要问题是什么？","options":["文字太少所以必定不可信","从规定跳到实施，缺少执行证据且扩大范围","任何文本都不能用于研究"],"correct":1,"explanation":"制度文本可以证明规定和话语表达，却不自动证明实施情况。需要适合问题的其他材料，并限制地点、时期和对象范围。"},"references":[{"id":"history-source","locator":"分析一手来源时关于作者、受众、语境、证据与局限的提问。"},{"id":"philosophy-writing","locator":"Brief Guides to Writing in the Disciplines目录入口：可选择Philosophy/History/English对应指南继续阅读。本次仅核对该目录及链接，未将所链接PDF当作已核读的全文；这篇课论证示范为原创教学整理。"},{"id":"proof-book","locator":"命题、量词、证明策略与反例相关章节。"}],"next":"进入 a17-3 或 a17-4，把证据链与反驳组织成符合方法的完整论文。","core":false,"chapterId":"c16","stageId":"s5","chineseCount":2328},{"id":"a16-4","title":"从原始材料重新生成结果的复核流程","goal":"让另一个人从明确入口重建表格、数字和报告句，并能定位不一致。","scope":"检查研究结论与其证据的对应；示例均为原创教学材料，检查策略须符合具体方法。","prerequisites":["a14-1","a15-4","a16-1"],"minutes":80,"tags":["通用","实证定量"],"terms":[{"zh":"计算复现","en":"computational reproducibility","definition":"在给定输入、代码和环境下重新得到分析结果；不同学科对复现术语的定义可能不同，应说明本项目用法。"},{"zh":"独立重复研究","en":"replication","definition":"用新资料或独立实施检验原发现的方式之一，不等同于重跑同一段代码。"},{"zh":"来源追踪","en":"provenance","definition":"记录材料从获取、处理、分析到报告的来源、版本和变化。"},{"zh":"容差","en":"tolerance","definition":"比较数值结果时允许的合理误差范围，需要根据数值方法和用途说明，不能用来掩盖实质差异。"}],"sections":[{"id":"concepts","title":"你会重跑只是可信研究的一部分","paragraphs":["复核的目标是检查结论怎样从材料产生。输入来源不明，即使代码每次得到相同数字，也不能证明数据真实；模型有错，即使完全可运行，也不能证明科学解释正确。因此要分别检查资料身份、处理流程、计算和结论。计算可复现是重要条件之一，不能代替方法适当性与真实性。","“在我电脑上能运行”可能依赖没有分享的文件、个人路径、手工操作或旧缓存。一个完整入口应告诉复核者需要什么、从哪里开始、怎样执行、会生成什么、预期值是什么。对受限数据还要说清授权与访问条件；不能因为公开受限就声称无须保存过程。","单次计算复现和独立研究重复要分开。本教材的 CSV、脚本和结果文件可以让你重算教学统计，但不等于重新实施真实测量，更不是为真实流程提供独立验证。报告中使用“复核了教学分析”比“复现了实验发现”准确。"]},{"id":"reasoning","title":"让每个数字有一条可返回的路径","paragraphs":["人工复制数字容易造成文章、图表和附录不同步。最好由同一个分析结果生成或核对各处文本，至少维护一张结果索引：指标、源文件、计算步骤、输出字段和出现位置。修改数据或模型时，沿索引更新所有相关内容，而不是凭记忆搜索。","复核也应覆盖失败情况。输入少一列、重复 ID 或读数非数字时，程序如果悄悄给出结果，会造成难以发现的错误。适当的输入检查应早报错并说明原因。测试不是越多越好，优先保护会影响科学含义的地方，如配对身份、单位、减法方向、排除规则和对象数。"]},{"id":"workflow","title":"让自己扮演第一次打开资料包的人","paragraphs":["使用 materials 目录中的 teaching-measurements.csv、analyze.py、analysis-results.json 和 case-facts.json。先复制资料包到一个新的工作目录再操作，原始包保留不动。不要在含敏感信息的真实项目中随意复制到不合规位置。"],"steps":[{"title":"阅读入口并核文件","body":"列出输入、脚本、预期输出、环境和运行命令。确认文件不是只有快捷方式或个人云盘路径。对教学包注明 CSV 为构造材料，二十对象配对，无真实研究身份。"},{"title":"检查输入与定义","body":"核表头、ID 唯一性、必要字段、单位、差值定义和行数。抽算 O01 与 O05，确认 d=B绝对误差−A绝对误差。检查脚本使用同样顺序，不把 A−B 的统计量与 B−A 的文字混合。"},{"title":"在新位置执行","body":"进入材料目录运行 python analyze.py；若系统命令名不同，可用 py analyze.py。脚本使用标准库，按自身所在目录找输入并输出结果。记录 Python 版本、命令和成功或报错信息，不仅截图最后一行。"},{"title":"比较关键数值","body":"核对 n=20、mean_difference_b_minus_a_g=−0.75 以及标准差、标准误、区间、统计量和 p。实际 JSON 字段名以文件为准，不能凭记忆重命名。用合理容差比较末位，不以字符串格式是否完全相同判断科学一致。"},{"title":"跨软件交叉核查","body":"按 a15-1、a15-2 在表格中独立计算，检查均值和区间端点。若不同，依次查读入类型、配对、差值方向、样本或总体标准差、自由度与单双侧，而不是直接手工改输出匹配。"},{"title":"核正文并形成复核记录","body":"把最终报告里的每个统计数字指向输出与位置；核查教学声明、单位、图注和限制。写明通过项目、未验证项目、发现和修复，另请别人按入口做一次，才能发现作者习惯带来的隐含依赖。"}]},{"id":"worked","title":"一份完整的教学复核记录","paragraphs":["复核记录成品：“输入为二十行教学构造 CSV，一行一个对象，ID 唯一，必要字段齐全。由脚本重新生成分析结果；A、B 平均绝对误差为 3.75 和 3.00 g，差为 −0.75 g，差值标准差约 0.662134 g，标准误约 0.148058 g。配对 t 为 −5.065596，自由度十九，双侧 p≈0.0000686813，区间约 [−1.059888,−0.440112] g。表格公式核算一致。这里只复核构造数据的分析，没有核实真实测量、抽样或流程效果。”","若表格得到正的 0.75 g 而脚本为负，先看 H 列是否用了 F−G。修正为 G−F 后，均值、t 和区间方向一起改变，双侧 p 值可能完全不变。这说明只核对 p 值无法发现方向错；复核必须包括有单位、有方向的效果估计与文字。","若复核者只得到相同数字却无法知道某一排除规则如何产生，就把计算一致和来源不完整分别记录。对于访谈可抽查主题到片段再到受控原件的链条；对史料可核引文版本和位置；对证明可核定义、引理和每一步依赖。复核形式可以不同，但都要让主张回到相应依据。"],"code":{"language":"text","text":"在材料目录执行：\npython --version\npython analyze.py\n\n核对教学结果：\n对象数 20；均值 A=3.75 g，B=3.00 g；差 B−A=−0.75 g\n95% CI ≈ [−1.059888, −0.440112] g\nt(19)≈−5.065596；双侧 p≈0.0000686813\n\n完整命令、软件版本和输出文件写入自己的复核日志。"}},{"id":"repair","title":"修正表面可复现的资料包","paragraphs":["容易踩的坑：“把最终图和一个脚本放进文件夹就是完整包。”脚本若缺输入、依赖或手工步骤，别人仍无法生成图。修改：“从一个明确入口说明输入、环境、命令、输出和核对指标，去掉个人路径，记录必要手工步骤或将其转成可追溯操作。”","容易踩的坑：“表格不一致，所以把脚本结果改成老师要求的数。”修改：“保留不一致，逐步定位类型、方向、自由度和计算实现，解释修复依据后重新生成。”复核不是对答案作弊，而是检查推理过程。","容易踩的坑：“运行无报错，因此所有结论正确。”修改：“运行检查通过，计算值一致；研究设计、资料真实性和推广仍需独立评价。”程序也可能忠实执行错误公式。"]},{"id":"tips","title":"交付前做一次冷启动","paragraphs":["隔一天从新目录、按 README 的第一条命令开始，是低成本的冷启动检查。不要沿用打开的工作簿、缓存变量或已手工修改的结果。若发现必须凭记忆补一步，把那一步写进入口或脚本。这能直接改善未来导师或合作者第一次审查的体验。","共享程度依权限而定。公开可共享的代码与模拟输入，受限原始资料说明申请条件、去标识过程和复核方式；不要把模拟替代数据说成原研究数据。文件哈希可帮助识别版本，但哈希相同仅说明内容一致，不证明其科学正确或伦理合规。"]}],"exercise":{"materials":"教学材料包；另设表格平均差为 +0.75 g、脚本为 −0.75 g，双侧 p 相同。","task":"完成一份运行与跨软件复核日志，解释方向不一致最先查什么，并核对报告所有关键数字。","template":"输入身份与版本：\n环境和命令：\n关键结果：\n表格交叉核对：\n差异与修复依据：\n已验证范围：\n尚未验证范围：","answer":"先查差值公式是否 A−B 与 B−A 混用，双侧 p 相同不排除方向错误。正确为 B−A=−0.75 g，区间 [−1.059888,−0.440112] g，t≈−5.065596，n=20。日志说明脚本与表格一致，只验证构造资料的计算及文字对应，未验证真实流程或研究实施。","rubric":["从原始输入重新运行而非只打开旧结果","核对对象数、方向、大小和不确定性","差异有追查过程且未手工篡改输出","清楚区分计算复核与真实研究验证"]},"quiz":{"question":"脚本和表格的双侧 p 值相同，但平均差符号相反，能否判断全部一致？","options":["可以，p 值是唯一需要核的量","不可以，可能差值方向相反并使报告解释错误","可以，只要都显著"],"correct":1,"explanation":"双侧 p 对符号对称，无法检出减法方向错误。均值、区间、统计量、变量定义和文字必须共同核查。"},"references":[{"id":"fair","locator":"FAIR 原则中的可发现、可访问、可互操作与可复用；可访问不等于必须无条件公开。"},{"id":"nist-statistics","locator":"统计计算、模型检验和不确定性相关内容，用于交叉检查推断。"}],"next":"完成复核后进入 a17-1，使用同一结果源写完整实证报告，并在 a23-2 整理交付包。","core":true,"chapterId":"c16","stageId":"s5","chineseCount":2271},{"id":"a17-1","title":"实证定量论文与 IMRaD","goal":"你会用研究问题和证据安排实证论文的各部分，解释 IMRaD 每部分的职责，并避免把教学模拟写成真实研究。","scope":"适用于采用观察、实验或量化分析回答问题的论文；具体标题、篇幅与报告清单须按学科和目标渠道调整。","prerequisites":["a05-1","a16-4"],"minutes":65,"tags":["实证定量","写作"],"terms":[{"zh":"IMRaD","en":"Introduction, Methods, Results and Discussion","definition":"引言、方法、结果、讨论四项功能的缩写，是常见组织方式，不能代替研究本身。"},{"zh":"报告规范","en":"reporting guideline","definition":"按研究类型提醒应交代哪些信息的清单，用于改善透明报告，不会自动保证设计正确。"},{"zh":"论证链","en":"argument chain","definition":"从问题经过方法和观察到解释的关系；每一项结论都需要对应的证据与限定。"}],"sections":[{"id":"concepts","title":"IMRaD 是一条回答问题的路径","paragraphs":["读者打开实证论文，通常依次要确认四件事：这个问题为什么值得回答，你如何得到答案，你实际观察到了什么，这些观察允许怎样的解释。引言回答第一件事；方法回答第二件事；结果呈现第三件事；讨论承担第四件事。标题、摘要、结论、参考文献及附录帮助读者发现、理解和检查这条链。部分期刊把结果与讨论合并，这只是呈现方式改变，证据与解释仍需辨认。","方法部分要交代研究设计、对象或材料、采样与排除、变量或测量、处理流程和分析。结果部分应按主要问题排列，而非照软件输出顺序堆表。讨论连接发现、既有文献、可能解释、局限和意义。结论通常浓缩已有答案，不突然引入新数据。摘要则是整条论证的短版本，必须与正文同口径。"]},{"id":"reasoning","title":"结构为什么这样安排","paragraphs":["结构要求来自可检查性。若引言声称要解释因果，方法却只是一次横断面相关分析，问题并非缺一个小标题，而是设计不能支持原来的承诺。若方法预先指定绝对误差为主要指标，结果却只展示最漂亮的一次读数，也破坏了论证链。写作之前先核对问题、指标、比较对象和结论强度，能比修改句子更早发现缺口。","报告规范需要匹配研究类型。随机试验、观察研究和其他设计的信息要求不同，不能因为某篇医学论文使用 CONSORT，就把它当所有工程论文的统一格式。使用清单时记录适用条目与不适用原因；学校学位论文格式和目标期刊作者指南则负责页面、字数及材料上传要求。"]},{"id":"workflow","title":"从材料到论文结构","paragraphs":["准备研究问题一页纸、分析前计划、主要图表和材料索引。先做论证地图，再把地图转成目录。"],"steps":[{"title":"写一句主要问题","body":"只写本研究实际回答的问题，例如在指定模拟对象中比较两流程的绝对测量误差；不要混入未来还想做的研究。"},{"title":"列出回答它的证据","body":"为每个拟写结论指定数据表、图或分析记录。找不到证据的句子标为假设或删除，不能用背景文献冒充自己的结果。"},{"title":"先搭方法和结果","body":"按对象、测量、分析写方法，再按主要比较和辅助检查写结果。每张图都填写读者要看到的一个结论。"},{"title":"补引言和讨论","body":"引言只保留理解问题所需背景与真实缺口；讨论逐项回应结果，说明与既有研究是否可比较及不能排除的解释。"},{"title":"核对外层材料","body":"最后拟标题、写摘要、压缩结论，检查参考文献、数据可用性、利益冲突和贡献声明是否符合实际要求。"}]},{"id":"worked","title":"一份已经完成的结构示范","paragraphs":["完整教学结构示范的题名为“在二十个模拟对象上比较两种测量流程的绝对误差”。引言解释为什么需要比较误差，并声明这篇课用于练习报告，不主张方法创新。方法交代二十个对象各有参考值、流程 A 与 B 的读数，先计算绝对误差，再在对象内计算 B 减 A 的差值。结果依次呈现对象级配对图、主要差值摘要和敏感性检查；具体数值由统一分析文件生成。","讨论指出，这个构造数据例子说明如何报告配对差异，但不能证明真实仪器、操作人员或实验室中的改善。结论写成：“这篇文章建立了从原始教学表格到配对误差报告的可复核过程；实际性能仍需真实采样检验。”附录列数据字典与运行步骤。这样一份短报告已有完整研究表达结构，同时准确保留教学性质。"],"annotations":[{"text":"二十个对象各有两种流程的读数，比较在对象内完成。","role":"方法中的单位与设计","note":"明确独立单位是对象，避免把四十次读数说成四十个独立样本。"},{"text":"实际性能仍需真实采样检验。","role":"结论边界","note":"数据为教学构造，句子阻止把分析练习推广为真实有效性证据。"}]},{"id":"repair","title":"结构错误与具体修订","paragraphs":["错误结构是“绪论—软件介绍—操作截图—结果很好—展望”。它能说明做过什么，却没有让读者判断问题、对象、比较规则和证据强度。修订时将软件说明压缩进方法，把关键处理参数留下，把重复截图移到附录；结果改为按研究问题组织的图表；讨论补上不确定性与限制。","另一个错误是先写“本研究显著提高了测量精度”，再寻找能够支持它的结果。应先确定比较量和数据，再写方向、大小及不确定性；如果尚未完成分析，论文草稿可以写方法与待报告项目，但不能提前填写结果。"]},{"id":"tips","title":"写作经验与适用边界","paragraphs":["用“标题—研究问题—主要图—结论”做一次四点对照。四者如果谈的不是同一件事，就先修结构。正文篇幅紧张时，优先保留影响判断的方法细节，而不是只保留最顺畅的故事。为了简洁删掉失败试次和偏离记录，会使读者得到错误印象。","写作顺序不必等于阅读顺序。已有数据时，从方法和结果写起通常更容易准确；尚在立项时则先写问题和方案。无论顺序怎样，最终都应让独立读者沿证据链走完，而不是要求他猜测作者做了哪些隐含决定。"]}],"exercise":{"materials":"统一教学测量数据、对象内差值定义及样稿库中的实证定量样稿。","task":"为这一研究写六段功能摘要，每段只说明该部分的任务及应放入的材料。","template":"引言的问题：\n方法的单位与比较：\n结果的证据：\n讨论的解释与边界：\n结论：\n附录与声明：","answer":"示范：引言说明需要比较两流程误差；方法说明二十个模拟对象内配对、绝对误差及差值方向；结果列配对图与差值摘要；讨论说明构造数据无法代表现场效果；结论强调可复核分析流程；附录提供原表、变量字典和脚本，并声明全部数据为教学模拟。","rubric":["每个部分有不同职责而非重复摘要","研究单位、主要指标与比较方向一致","结论未超出模拟数据的范围","附录能追溯正文关键结果"]},"quiz":{"question":"方法规定比较对象内绝对误差，结果部分最先报告什么最合理？","options":["挑出误差最小的一次测量","报告预定的配对比较及其分布或摘要","先介绍使用软件的全部菜单"],"correct":1,"explanation":"预定比较直接回答主要问题。最优单次测量会选择性呈现，软件菜单通常不构成主要结果。"},"references":[{"id":"equator","locator":"按研究设计查找适用报告指南，理解清单服务于透明报告。"},{"id":"icmje","locator":"阅读稿件准备中关于原始研究结构与报告的说明，注意医学出版适用范围。"}],"next":"下一步比较其他研究范式的结构，再逐篇练标题、摘要、引言和主体。","core":true,"chapterId":"c17","stageId":"s6","chineseCount":2019},{"id":"a17-2","title":"定性研究和案例研究报告","goal":"你会为定性或案例研究安排问题、背景、取样、材料、分析、研究者位置和论证，避免把引语清单当作发现。","scope":"适用于访谈、观察和案例材料形成的解释性研究；不同定性传统的质量标准需要具体说明。","prerequisites":["a12-1","a12-3"],"minutes":65,"tags":["定性与案例","写作"],"terms":[{"zh":"研究者位置","en":"positionality","definition":"研究者的身份、经验、关系和立场如何影响问题、进入现场及解释。"},{"zh":"厚描","en":"thick description","definition":"提供理解行动与意义所需的具体情境，而非只增加描述字数。"},{"zh":"案例边界","en":"case boundary","definition":"说明研究的组织、事件、时间或活动范围，以及哪些材料不属于该案例。"}],"sections":[{"id":"concepts","title":"让读者看见从材料到解释的过程","paragraphs":["定性研究报告不仅交代受访者说了什么，还要解释研究者怎样把话语、行动或文件理解为某种模式。常见功能包括问题与背景、研究取向、取样与情境、资料生成、分析过程、发现、讨论及反思。标题未必采用 IMRaD；有的文章把材料呈现和解释交织起来，仍需让读者找到依据。","案例研究强调对有边界案例的深入理解，可以使用定性、定量或混合材料。“只有一个案例”不是方法说明：必须解释为什么选它、边界如何划定、哪些资料回答哪些问题。访谈研究也不能只写“采用定性方法”，因为反思性主题分析、编码可靠性取向或扎根理论对研究者角色和分析程序的要求并不相同。"]},{"id":"reasoning","title":"结构为什么这样安排","paragraphs":["定性报告的说服力来自材料与解释的充分连接。主题不是把常见词汇换成小标题，而是对与问题有关的意义模式作有理由的说明。引语用于让读者检查解释，并非每个主题配一句话就自动成立。反例、场景差异、沉默和矛盾也可能改变主题的边界。","透明性不等于所有传统都要双人编码、计算一致率或进行成员核查。某些方法重视编码规则的一致实施，反思性主题分析则强调解释活动与研究者反思。作者应说明自己的分析取向并据此解释质量做法，而不是堆一串看起来严格的术语。参与者隐私又要求作者在透明和不可识别之间作明确取舍。"]},{"id":"workflow","title":"从材料到论文结构","paragraphs":["准备去标识材料、访谈或观察记录、分析备忘录和伦理说明。若使用虚构课堂片段，始终称它们为教学材料。"],"steps":[{"title":"界定问题与研究取向","body":"写明希望理解的经验或过程，例如人们何时信任自动记录；说明采用解释性访谈而非测量总体支持比例。"},{"title":"交代场景和取样","body":"说明地点、角色、进入方式、纳入理由和资料范围。解释选择能带来什么信息，也写出未被包括的声音。"},{"title":"展示分析路径","body":"选一段材料，演示初步阅读、编码、比较、形成候选主题和修订。分析过程应与所声明方法一致。"},{"title":"写主题论证段","body":"每段先给解释主张，再放有语境的材料片段，随后解释它为什么支持主张，并讨论不一致材料。"},{"title":"补反思与伦理边界","body":"说明研究者与参与者关系、可能影响、匿名化处理以及引用是否可能暴露身份；材料不可公开时说明可提供的替代审查方式。"}]},{"id":"worked","title":"一份已经完成的结构示范","paragraphs":["原创教学片段甲说：“自动表单省时间，但发现设备停顿时，我会再记在纸上。”片段乙说：“只要系统显示成功，我通常不会检查原记录。”一个候选主题段可以写成：“在这组教学片段中，信任表现为有条件的依赖。甲在异常时增加纸面记录，显示系统方便性未取消自己的核查责任；乙则把成功提示作为行动依据，呈现另一种依赖方式。两段并不能说明哪类行为更常见，却提示后续访谈应区分正常流程与异常情境。”","报告结构因而包含研究问题、两段片段的构造说明、解释性分析步骤、上述主题段及局限。这里没有真实受访者，也没有饱和或总体代表性主张。若是真实研究，必须补上实际招募、场景、同意、分析迭代和研究者关系，不能把这份课堂练习包装成访谈成果。"],"annotations":[{"text":"信任表现为有条件的依赖。","role":"候选解释","note":"主题是一个关系性判断；其支持范围仅为所给教学片段。"},{"text":"两段并不能说明哪类行为更常见。","role":"推断边界","note":"解释性材料中的模式不能直接变成总体比例。"}]},{"id":"repair","title":"结构错误与具体修订","paragraphs":["错误段落：“大多数人信任系统。甲说省时间，乙说不用检查，所以系统应全面推广。”它同时把有限材料夸大为多数、忽略甲在异常时补记的反例，并跳到推广建议。修订为：“两段材料呈现不同的核查策略；自动记录的便利性与异常时的人工确认可以并存。”再补明为何这种差异值得追问。","另一个常见错误是为了显得规范而写“达到饱和”，却没有说明样本形成、分析目的和停止依据。应报告真实决策及方法论理由。若只是教学分析，直接说明材料数量有限、只能演示解释过程。"]},{"id":"tips","title":"写作经验与适用边界","paragraphs":["写完主题标题后问自己：这个标题表达了什么超出材料复述的理解？“设备”“时间”“信任”只是话题，“异常经历使信任转向可核查的依赖”才是可争论的解释。强解释同样需要反例，不能通过删去不同声音来维护。","用化名不必然完成匿名化。职位、罕见事件和时间地点组合可能重新识别个人。发表引语前应按实际同意范围和伦理安排审查细节；不能为了叙事精彩暴露参与者，也不能改动关键语意却不说明处理方式。"]}],"exercise":{"materials":"这篇课甲、乙两段原创教学片段；另加丙：“我不看提示，只看第二天能不能找到记录。”","task":"将丙纳入已有主题，写一个包含证据、解释与局限的发现段。","template":"主题主张：\n支持片段及语境：\n差异或反例：\n解释：\n材料不能回答：","answer":"示范：三段材料提示信任与可验证性相关。甲在异常时补记，乙依靠即时成功提示，丙依据事后可检索性判断；三者把验证放在不同位置。因此可把主题细化为“信任由不同的核查时间点支撑”。这不说明三类策略的总体比例，也不能确定某策略导致更少错误。","rubric":["写出解释关系而非只列词汇","片段与解释一一对应","保留不同材料的差异","承认教学构造与推断范围"]},"quiz":{"question":"采用反思性主题分析时，哪种写法更合理？","options":["所有定性研究必须报告编码一致率","交代分析立场、研究者反思和主题形成过程","只展示最符合主张的引语即可"],"correct":1,"explanation":"方法取向决定质量论证。不能把某种可靠性指标强加给所有传统，也不能选择性删除有意义的差异。"},"references":[{"id":"srqr","locator":"SRQR书目信息与PubMed入口；本次只核对题名/作者线索，未取得正文。可在取得原文后核对研究者位置、材料与分析透明度；这篇课不声称已逐条核对清单。"},{"id":"thematic-analysis","locator":"核对反思性主题分析与其他主题分析取向的区别。"}],"next":"用下一篇的人文论证结构继续比较：材料解释可以成为正文核心，而不一定分成独立结果与讨论。","core":false,"chapterId":"c17","stageId":"s6","chineseCount":1919},{"id":"a17-3","title":"人文论证型论文","goal":"你会围绕一个可争论的解释命题组织人文论文，使用文本或史料支持细读，并处理竞争解释。","scope":"适用于文本、历史、文化和思想研究的入门论证；具体材料传统与学科惯例仍须进一步学习。","prerequisites":["a12-4","a16-3"],"minutes":65,"tags":["人文解释","写作"],"terms":[{"zh":"中心论点","en":"thesis","definition":"作者希望通过全文论证使读者接受的具体判断，通常能够被另一种合理解释挑战。"},{"zh":"细读","en":"close reading","definition":"仔细分析用词、叙述、形式与语境之间的关系，并把解释连接到材料细节。"},{"zh":"竞争解释","en":"alternative interpretation","definition":"你会解释同一材料但与这篇文章的结论不同的理解，需要公平呈现和比较。"}],"sections":[{"id":"concepts","title":"让结构跟随论证，而不是跟随材料清单","paragraphs":["人文论文常以引言提出解释问题，随后按论证步骤组织主体，而不是统一分成方法、结果、讨论。主体标题可以围绕意象变化、制度语境、概念冲突或不同证据来源。你要让读者看清：材料是什么，这篇文章提出何种理解，哪些细节支持它，以及为什么它比另一种解释更充分。","“讨论某作品中的门”只是主题；“门在两个场景中从阻隔转为身份选择的标记”才接近论点。论点必须与材料规模相称。分析一篇短文不能直接代表某一时代所有人的意识；一份官方文件中的说法也不能不加判断地当作当时社会的完整现实。来源、版本和写作情境因此属于论证组成部分。"]},{"id":"reasoning","title":"结构为什么这样安排","paragraphs":["以材料类别排目录容易产生“作者生平—时代背景—作品简介—我的感想”的报告，但这些内容之间未必构成论证。更有效的结构让每一节承担一步推理：先建立文本中的区别，再说明区别如何发生，最后讨论解释能够覆盖什么、遇到什么反例。背景只在帮助解释具体细节时进入正文。","人文研究也要透明，但透明的对象不一定是可重复实验。版本选择、材料纳入、概念使用和解释路径都可以被读者复查。解释允许多样性，不意味着任何读法同样合理；对反例的处理、与历史语境的兼容程度、概念的一致使用和对细节的覆盖能力，都能成为比较依据。"]},{"id":"workflow","title":"从材料到论文结构","paragraphs":["准备可合法使用的文本或史料、版本信息、关键片段和已有解释笔记。练习先使用这篇课原创短文本，避免把虚构片段误作历史材料。"],"steps":[{"title":"区分主题与论点","body":"将“我想谈什么”改写为“我认为材料显示了什么”。写一个可以被反对的完整句，检查它是否需要证据才能成立。"},{"title":"建立材料定位卡","body":"记录作者或产生主体、时间、版本、页段位置和材料类型。对真实性或语境尚不确定的内容明确标注，不据此作强推断。"},{"title":"安排三步论证","body":"为论点写三项支持理由，各配一个具体细节。若两节只重复同一理由，合并；若某节无材料支撑，重新设计。"},{"title":"纳入竞争读法","body":"写出一位合理反对者会怎样理解同一片段，然后用更多文本细节、语境或概念分析比较两种解释。"},{"title":"写限定性结尾","body":"回到最初问题，说明这篇文章增加了什么理解，以及材料、版本或理论视角使结论受到哪些限制。"}]},{"id":"worked","title":"一份已经完成的结构示范","paragraphs":["原创教学文本为：“清晨，他把门推开，却站在门内。傍晚，他关上门，把钥匙交给来客。”中心论点可以是：门的动作没有简单对应自由与封闭，人物与边界的关系在于谁决定通行。第一节分析“推开”与“站在门内”的并置，指出物理开放并未带来行动；第二节分析“关上”与“交钥匙”，说明封闭动作也能伴随权力转交；第三节回应“只是生活习惯”的读法，承认文本过短无法排除该解释，但动作对照为边界控制的阅读提供了依据。","完整结尾可写：“这两句文本把开放与自主拆开：门的状态不足以说明人物的行动位置，钥匙的转交则改变了控制关系。此解释依赖动作的对照组织；缺少更长叙事和历史语境时，不宜进一步断定人物的社会身份或作者意图。”这已经形成一个小型论证，而不仅是象征意义词典。"],"annotations":[{"text":"门的状态不足以说明人物的行动位置。","role":"细读所得主张","note":"由推开门却不出去的并置支持，不能扩展为所有文本的规则。"},{"text":"不宜进一步断定人物的社会身份或作者意图。","role":"材料边界","note":"避免用短篇教学片段推断未提供的生平或历史事实。"}]},{"id":"repair","title":"结构错误与具体修订","paragraphs":["错误写法：“门象征封建社会压迫，作者强烈反抗旧制度。”给定片段没有作者、年代或制度资料，这些判断没有来源。修订时退回可见细节：“开门与停留形成张力，提示物理边界与自主行动并不相同。”如果要提出制度解释，必须另找能够建立语境联系的真实证据。","另一错误是每引一句就写“说明中心论点正确”，没有解释细节与论点之间的关系。应指出具体词、语法位置、叙事次序或版本差异如何支持推断；只有引用存在而推理缺席，仍然没有完成论证。"]},{"id":"tips","title":"写作经验与适用边界","paragraphs":["每个主体段落至少包含一个可定位细节和一次解释动作。描述回答“材料里有什么”，分析回答“这个细节怎样改变我们对问题的理解”。修改时用两种颜色标出描述和分析，整页只有描述时，应补论证而不是增加形容词。","对原作者意图保持谨慎。文本效果、当时读者可能理解和作者本人意图是不同问题，可能需要不同材料。引用二手研究时也要区分研究者的解释和原始材料的陈述，不能把二手概括写成文本本身直接说过的话。"]}],"exercise":{"materials":"这篇课两句原创文本，以及解释A“门只表示封闭”和解释B“门的动作涉及通行决定权”。","task":"用不超过两段的论证比较两种解释，必须指出一个细节和一个限制。","template":"论点：\n关键细节：\n推理：\n竞争解释：\n比较理由：\n限制：","answer":"示范：解释B对片段的覆盖更完整，因为第一句开门却停留，第二句关门却交出钥匙，均不符合开放等于自由、关闭等于封闭的简单对应。两次动作把边界状态与控制关系分开。但文本缺少上下文，生活习惯或礼节仍可能解释动作，故本论点是有依据的局部阅读而非作者意图定论。","rubric":["论点具体且可以争论","引用细节准确且解释其作用","公平提出竞争解释","未虚构文本之外的时代或作者事实"]},"quiz":{"question":"人文论证正文的小标题最应依据什么形成？","options":["每找到一份材料就单列一节","论证中心判断所需的推理步骤","所有论文统一使用结果和讨论"],"correct":1,"explanation":"材料服务于论证。材料分类有时有用，但不能自动替代推理结构；IMRaD并非人文论文的普遍要求。"},"references":[{"id":"harvard-counterargument","locator":"Counterargument：How to address counterarguments，说明如何公允呈现异议、承认合理部分并修订论证；这里把这个建议迁移到相应研究表达任务。"},{"id":"history-source","locator":"核对材料来源、目的与历史语境的分析问题。"}],"next":"理论证明型论文同样依赖清楚论证，但对成立条件与推导有效性的要求具有不同形式。","core":false,"chapterId":"c17","stageId":"s6","chineseCount":1964},{"id":"a17-4","title":"理论与证明型论文","goal":"你会安排定义、假设、命题、证明、例子、反例和讨论，并区分证明与计算检验。","scope":"面向数学、理论计算和形式模型的论文阅读与基础写作，不替代领域内的专业证明训练。","prerequisites":["a13-1","a14-4"],"minutes":65,"tags":["理论与计算","写作"],"terms":[{"zh":"定理","en":"theorem","definition":"在明确假设和定义下通过有效推理建立的命题。"},{"zh":"引理","en":"lemma","definition":"用于证明其他主要结果的辅助命题，其正确性仍需证明或引用。"},{"zh":"反例","en":"counterexample","definition":"满足某主张前提却不满足其结论的一个实例，足以否定该范围内的全称主张。"}],"sections":[{"id":"concepts","title":"先说明命题在什么条件下成立","paragraphs":["理论与证明型论文的核心通常是一个或一组命题。常见结构为问题与背景、符号和定义、假设、主要结果、证明、例子与边界、相关讨论。证明可以放在命题后面，也可先给主要结果与直觉，再在后文展开；无论如何，读者必须能识别每一步使用了什么前提。","定义规定这篇文章讨论的对象，假设限制命题适用范围，命题说明要建立的结论，证明给出理由。数值例子可帮助理解，不能替代无限范围的证明。相反，例子只要满足前提又违反结论，就可能成为反例。程序在有限输入上通过测试，说明已检验的输入没有暴露错误，不自动证明程序对所有输入正确。"]},{"id":"reasoning","title":"结构为什么这样安排","paragraphs":["把主要结论提前能帮助读者知道证明的目的；把关键定义藏在证明中则会迫使读者反复猜符号。应在第一次需要之前定义对象，并把非常规约定说清。比如“序列递减”究竟允许相等，若不说明，严格不等式的结论可能产生歧义。","证明长度不是严格性的代名词。初学者容易跳过最关键的一步，却反复展开无争议的代数。可先画依赖图：主命题依赖哪些引理，引理依赖哪些假设。任何环形依赖都需检查是否循环论证。引用已有定理时应核对其条件，而不是只凭结论形状相似就直接套用。"]},{"id":"workflow","title":"从材料到论文结构","paragraphs":["用一条简单而完整的命题练习：任意有限个实数的最大值不小于其算术平均值。该练习是已有基础知识，不称为原创数学贡献。"],"steps":[{"title":"界定对象与符号","body":"设 n 为正整数，x1到xn为实数，M为这些数的最大值。写清平均值的定义，避免n等于零或空集合造成无意义表达。"},{"title":"写主命题及等号条件","body":"先写M≥平均值，再说明等号恰在所有数都等于M时成立。等号条件是命题的一部分，需要相应论证。"},{"title":"搭建证明链","body":"由每个xi≤M求和，再除以正数n得到结论。证明等号时检查每个非负差M−xi的和为何为零。"},{"title":"加入例子和边界","body":"用2、3、7说明最大值7大于平均值4；用3、3、3说明等号。解释负数并不会破坏证明。"},{"title":"检查可推广范围","body":"问是否可以把最大值换成任意一个元素，是否可以允许负权重。给出反例，说明推广需要额外条件。"}]},{"id":"worked","title":"一份已经完成的结构示范","paragraphs":["完整教学证明如下。命题：设 n≥1，x1,…,xn 为实数，M=max{x1,…,xn}，则 M≥(x1+…+xn)/n；等号成立当且仅当所有 xi 都等于 M。证明：因为对每个 i 都有 xi≤M，求和得到Σxi≤nM；由于n为正，除以n不改变不等号方向。若所有xi相等，显然取等号。反之，若取等号，则Σ(M−xi)=0，每项均非负，因此每项都为零，即xi=M。证毕。","正文随后可以说明：这个命题不要求各数非负，也不依赖它们来自随机样本。若把最大值换成第一个元素，序列1、5的第一项小于均值3，构成反例。这一组织同时交代条件、证明、等号与边界，读者无需依靠几个数值试验来猜结论。"],"annotations":[{"text":"由于 n 为正，除以 n 不改变不等号方向。","role":"推理条件","note":"把操作成立的依据说出来，避免省略对符号与范围的检查。"},{"text":"每项均非负，因此每项都为零。","role":"等号条件证明","note":"仅有和为零不足以推出各项为零，非负性是必要理由。"}]},{"id":"repair","title":"结构错误与具体修订","paragraphs":["错误证明：“试了1、2、3以及4、5、6，最大值都比平均值大，所以任意实数成立。”它把有限例子当作全称证明，也漏掉相等情况。修订为对任意i写xi≤M并求和，同时把“大于”改为“不小于”。例子应保留在解释部分，不能承担证明职责。","另一个错误是写“根据平均值定义显然成立”后直接结束。对于目标读者，这可能隐藏关键推理。应判断哪一步值得展开；在入门教材中，逐个不等式求和的理由必须写出，而已建立的基本符号不必每次重新解释。"]},{"id":"tips","title":"写作经验与适用边界","paragraphs":["把“直觉说明”和“严格证明”分成不同段落，会使文章更易读。直觉可以借图像或例子帮助理解，但标明其角色；证明则保证每一步在声明的条件下成立。对复杂论文，可将常规计算放附录，把关键想法和依赖关系留在正文。","理论论文也要讨论贡献。基础命题的完整证明是训练成果，不会因为写成定理形式就变成新结果。真正的理论贡献需要和已知结果比较范围、条件、强度或证明方法；在查新不足时只称为推导练习，不能宣布首次证明。"]}],"exercise":{"materials":"命题“任意两个实数的平均值介于两数之间”，以及数值例子−4与2。","task":"写清定义与假设，给出证明，再说明等号何时发生。","template":"对象与假设：\n命题：\n证明：\n等号条件：\n数值例：\n贡献性质：","answer":"示范：设a≤b，二者为实数。由a≤b可得2a≤a+b≤2b，除以2得到a≤(a+b)/2≤b。任一端等号都要求a=b。对−4与2，平均值−1位于两数之间。本证明为基础知识练习，不主张新定理或新证明方法。","rubric":["对象范围和符号明确","证明覆盖任意允许输入","关键操作的条件成立","没有把练习写成原创贡献"]},"quiz":{"question":"程序检查了一百万个整数输入，能直接证明对所有整数成立吗？","options":["能，数量足够大就是证明","不能，有限检查未覆盖所有整数","能，只要程序运行无错误"],"correct":1,"explanation":"除非另有严格理由将无限问题归约为这组有限检查，否则测试只提供已检验范围的证据。"},"references":[{"id":"proof-book","locator":"阅读命题、直接证明与反例的章节，核对推理结构。"},{"id":"philosophy-writing","locator":"Brief Guides to Writing in the Disciplines目录入口：可选择Philosophy/History/English对应指南继续阅读。本次仅核对该目录及链接，未将所链接PDF当作已核读的全文；这篇课论证示范为原创教学整理。"}],"next":"计算与系统论文需要同时解释方法机制和评价证据，下一篇展示两条线怎样组成文章。","core":false,"chapterId":"c17","stageId":"s6","chineseCount":1685},{"id":"a17-5","title":"计算、方法与系统论文","goal":"你会组织计算、算法、工程方法或系统论文，使技术方案、实现与评价分别提供可检查的信息。","scope":"适用于计算方法、机器学习、软件及工程系统的入门论文；评价方式取决于具体领域与任务。","prerequisites":["a13-3","a13-6","a16-1"],"minutes":65,"tags":["理论与计算","写作"],"terms":[{"zh":"问题设定","en":"problem formulation","definition":"明确输入、输出、目标、约束和评价条件，使读者知道方法解决的具体问题。"},{"zh":"基线","en":"baseline","definition":"用于比较的参照方法，应合理实现并在可比资源与条件下评价。"},{"zh":"消融","en":"ablation","definition":"有计划移除或替换某组件以检查其作用；不能自动消除所有混杂或证明唯一机制。"}],"sections":[{"id":"concepts","title":"把提出的方法和证明其价值的评价分开","paragraphs":["计算与系统论文常由引言、相关工作、问题设定、方法或系统设计、实验设置、评价结果、讨论与结论组成。问题设定回答输入和输出是什么，方法回答怎样从输入得到输出，评价回答在何种条件下是否有价值。把系统成功运行的视频当作全部评价，通常只能说明某次演示可行，不能支持稳定性、泛化或优于已有方法。","算法贡献可能来自目标、约束、推导或实现机制；系统贡献还可能涉及架构整合、实用能力和可复现评估。论文必须说明哪些部分是采用已有技术，哪些是本人提出或验证的。使用一个新模型名字、叠加几个模块或者换一个数据集，均需要额外论证才构成有意义的贡献。"]},{"id":"reasoning","title":"结构为什么这样安排","paragraphs":["方法描述与效果证据分开，能减少“因为设计看起来合理，所以必然有效”的推理错误。作者可以先提出机制解释，再通过比较、消融、误差分析或其他适用证据检验，但评价仍需公平。测试集参与调参、基线使用较少预算或只报告最好一次运行，都会使结构完整的论文得出不可靠印象。","计算结果还依赖环境、随机性、数据版本和实现选择。复现信息不只是附一条代码链接，而应说明数据来源与划分、预处理、参数选择、随机种子或多次运行策略、资源预算及执行步骤。有保密限制时应诚实说明，并提供允许公开的配置或合成演示，不能宣称所有材料开放。"]},{"id":"workflow","title":"从材料到论文结构","paragraphs":["以“给教学文档查找系统加入字段过滤”为原创教学场景，先写能够评价的任务，再安排方法与实验。不要虚构真实检索性能。"],"steps":[{"title":"冻结任务和使用场景","body":"写输入是文档查询、输出是排序结果，目标是帮助定位指定信息。说明文档来源和允许的使用范围，不能笼统写提高智能水平。"},{"title":"画出方法与已有部分","body":"将索引、分词、排序和字段过滤分别标注；已有软件记录版本，新增逻辑写伪代码或流程，说明如何处理缺失字段。"},{"title":"设计公平比较","body":"确定基础检索和加入过滤的方案共享相同文档与查询集，说明查询标签由谁建立；调参与最终测试材料分开。"},{"title":"组织评价小节","body":"先报告主要任务指标，再报告耗时、失败查询和资源需求；有多次运行时解释变异，案例展示不能替代总体统计。"},{"title":"写机制和限制","body":"用消融或错误分类检查过滤的作用，并说明字段标注错误可能使相关文档被排除。将机制假设与证据强弱分开。"}]},{"id":"worked","title":"一份已经完成的结构示范","paragraphs":["完成的教学结构为：引言提出“查询者能记住文档类型但不记得准确词语时，字段信息是否有帮助”；问题设定定义查询、文档字段和评价标注；方法说明先按允许字段筛选再执行相同排序；实现说明字段缺失时退回基础检索，并记录该分支。实验设置预先列出查询集划分和主要指标；结果依次比较总体查询、字段正确子集与字段错误子集，不填写未运行的数值。","讨论的完成段落可以写：“字段过滤通过缩小候选集合改变检索范围，但它也可能排除真正相关的文档。所以，性能评价必须同时覆盖字段正确与字段错误的查询；仅展示一次准确查找不能区分组件价值与示例选择。”这个成品是评价论证与结构示范，尚非报告系统性能的成稿；真正结果必须运行后写入。"],"annotations":[{"text":"字段缺失时退回基础检索，并记录该分支。","role":"方法边界与实现规则","note":"说明异常输入如何处理，使方案能被复做。"},{"text":"性能评价必须同时覆盖字段正确与字段错误的查询。","role":"评价条件","note":"对应方法的失效风险，防止只展示适合新增模块的输入。"}]},{"id":"repair","title":"结构错误与具体修订","paragraphs":["错误写法：“我们提出先进框架，融合大模型、知识图谱和智能检索，实验表明十分有效。”读者无法知道具体任务、本人改动、比较对象和证据。修订为“这篇文章评估在固定检索流程中加入字段过滤的作用，比较条件共享文档、排序器与预设查询集；同时报告字段错误时的失败类型”。在尚未完成试验时，不能继续写性能结论。","还要修正“消融后指标下降，所以完全证明模块机制”的夸大。移除组件可能同时改变参数量、计算预算或训练动态。作者应说明干预改变了哪些因素，并把结果解释限定为本设计下的比较证据。"]},{"id":"tips","title":"写作经验与适用边界","paragraphs":["用一张贡献—证据对照表管理文章：每项贡献旁边写对应定理、实验、用户任务或工程验证。只有实现细节而无价值证据的项目，可以作为技术说明而不勉强包装成研究突破。对于新系统，可靠失败处理和清楚边界可能比夸大指标更有说服力。","写清单位和成本。毫秒、吞吐、参数量、显存、训练时间属于不同资源量，不能互相替代。描述硬件只是起点，还要说明测试规模与计时范围，否则不同读者很难理解所谓更快到底指什么。"]}],"exercise":{"materials":"字段过滤检索场景；已有基础检索器；字段可能正确、错误或缺失。","task":"写一段方法说明和一段评价说明，并列出两种不能支持的结论。","template":"输入与输出：\n新增机制：\n异常分支：\n基线与共享条件：\n评价子集：\n不能支持的结论：","answer":"示范：输入查询与可选字段，输出排序文档。字段可用时先筛选，缺失时沿用基础检索；所有分支记录日志。两方案共享文档和排序器，在预留查询集评价，并分别检查字段正确、错误、缺失的表现。尚不能声称适用于所有检索任务，也不能由一次演示断言优于全部已有系统。","rubric":["输入输出和新增部分清楚","基线条件具有可比性","评价覆盖主要失效场景","没有填入未实际运行的性能结果"]},"quiz":{"question":"哪项信息最能改善计算论文评价的可检查性？","options":["增加更多先进技术的名称","报告数据划分、调参规则、基线条件和失败案例","只展示最好一次运行的截图"],"correct":1,"explanation":"可检查条件决定比较如何解释。名词数量和挑选出的成功截图都不能替代评价设计。"},"references":[{"id":"sklearn-leakage","locator":"阅读数据泄漏和一致预处理的反例。"},{"id":"fair","locator":"理解可查找、可访问、可互操作、可复用的原则及限制。"}],"next":"综述论文的证据来自已有研究，下一篇会说明检索和综合过程如何成为方法与结果。","core":false,"chapterId":"c17","stageId":"s6","chineseCount":2010},{"id":"a17-6","title":"综述与证据综合论文","goal":"你会区分综述类型，并据此组织检索、筛选、提取、质量判断和综合，避免把文献摘要堆成研究。","scope":"面向叙述综述、范围综述、系统综述及包含元分析的报告；各领域方法与注册要求需另外核对。","prerequisites":["a13-4","a13-5"],"minutes":65,"tags":["证据综合","写作"],"terms":[{"zh":"系统综述","en":"systematic review","definition":"用预先明确且透明的方法寻找、选择并综合与问题有关的研究，降低选择性处理。"},{"zh":"范围综述","en":"scoping review","definition":"常用于描绘领域概念、证据类型和研究范围，目的与可回答问题不同于效果估计。"},{"zh":"元分析","en":"meta-analysis","definition":"在适当条件下以统计方法合并研究的效果估计，是分析技术而非所有综述的必需步骤。"}],"sections":[{"id":"concepts","title":"综述也需要回答明确的问题","paragraphs":["综述论文不是把已读论文逐篇缩短再串联。它应提出一个综合问题，说明哪些研究属于范围，如何寻找和评估材料，再给出跨研究层面的认识。系统综述通常明确报告检索来源与日期、完整策略、筛选规则、提取项目、偏倚评估和综合方法；叙述综述也应让读者理解范围与选择逻辑，不能把未系统搜索称为穷尽研究。","综述的结果可以是概念分类、证据分布、研究间一致与冲突，也可能是合并效果。不是出现流程图就成为系统综述，也不是搜到很多篇就适合元分析。问题、对象、干预或暴露、结果和设计的可比性决定哪些综合方式有意义。报告指南帮助说清做法，不替代实际执行这些步骤。"]},{"id":"reasoning","title":"结构为什么这样安排","paragraphs":["综述的材料选择本身会改变结论。只纳入支持某方法有效的论文，再写“文献一致证明有效”，实际上把结果写进了筛选条件。研究质量和偏倚也不能只按期刊名评价；某篇高声誉期刊论文仍可能不适合当前问题，某个结果也可能因设计限制不能合并。","结构应体现综合推理。按主题、设计、对象或效果模式组织结果，比“作者甲做了什么、作者乙做了什么”更能回答问题。同时，综合段落仍要能追到单篇证据；读者要知道哪些判断来自多项研究的一致趋势，哪些只是作者提出的解释。"]},{"id":"workflow","title":"从材料到论文结构","paragraphs":["使用原创教学文献卡练习结构，所有卡均称教学卡而不伪装成真实引用：卡A为成人短期实验，卡B为成人观察研究，卡C为青少年短期实验，三者评价不同记录方式。"],"steps":[{"title":"先确定综述任务","body":"选择回答效果问题还是描绘研究版图。若目的是列出记录方式与应用情境，可做范围型整理；若估计效果，则需更严格定义比较与结果。"},{"title":"写透明方法目录","body":"列数据库、检索时间、词式、筛选规则、人员流程与提取表。没有执行双人筛选就不能写成执行过；限制应如实说明。"},{"title":"建立证据表","body":"每项研究提取对象、设计、比较、指标、方向和主要偏倚。先核实能否比较，再考虑是否合并。"},{"title":"按问题组织结果","body":"将成人实验、成人观察、青少年实验分层，说明覆盖与缺口。流程数字、纳入数和表格行数必须一致。"},{"title":"写综合与局限","body":"区分证据缺失、低确定性和没有效果。解释检索覆盖、语言或发表偏倚的可能影响，并避免把相关性研究当因果证据合并。"}]},{"id":"worked","title":"一份已经完成的结构示范","paragraphs":["完成的教学综述段如下：“三张教学卡覆盖两类人群与两种设计。成人短期实验用于比较规定条件下的表现，成人观察研究反映既有使用差异，青少年实验则涉及不同对象。由于设计和结果定义不一致，本练习采用分层叙述综合，不计算一个总效果。当前材料能够展示研究分布，却不足以判断所有记录方式在长期真实场景中的有效性。”","对应目录为：引言说明综合问题；方法声明这是三张原创教学卡的课堂演示，不是实际数据库综述；结果给证据矩阵并按设计分层；讨论解释不能直接合并的理由与未来需要的证据；附录提供三张卡。若升级为真实系统综述，就必须实际完成可重复检索和筛选记录，不能只替换标题。"],"annotations":[{"text":"由于设计和结果定义不一致，本练习采用分层叙述综合。","role":"综合方法理由","note":"把方法选择与材料特征连接，而不是因喜欢某种统计方法就强行合并。"},{"text":"这是三张原创教学卡的课堂演示。","role":"材料身份","note":"避免把练习卡当作真实文献数量或检索结果。"}]},{"id":"repair","title":"结构错误与具体修订","paragraphs":["错误写法：“阅读十篇文章后发现八篇结果显著，因此该方法有百分之八十概率有效。”显著性受样本、设计与选择过程影响，票数不能变成有效概率。修订时比较效果大小、不确定性、设计与偏倚，并解释为什么采用某种综合方式。如果资料不足以估计总体效果，就明确报告这种不足。","另一错误是把没有检索到某类研究写成“该问题无人研究”。应写明数据库、日期、检索策略与范围，并说明在这些条件下未发现；必要时补引文追踪和术语变体搜索。"]},{"id":"tips","title":"写作经验与适用边界","paragraphs":["把提取表和写作大纲一起设计：若正文准备讨论长期效果，提取表就必须记录随访时长；若准备比较不同人群，提取表就应保留纳入标准。写到最后才发现没有提取关键字段，会迫使你重读材料。","PRISMA 及其扩展针对特定证据综合报告，不能当作所有文章的格式模板。范围综述是否评估偏倚、系统综述采用哪种确定性评价，应由问题与方法规范决定。对于初次训练，可先完成透明的有限范围综述练习，再准确命名其范围。"]}],"exercise":{"materials":"这篇课三张原创教学文献卡及其人群、设计差异。","task":"写一段综合结果并说明是否应计算总效果。","template":"综合问题：\n材料范围：\n关键可比性差异：\n综合策略：\n得到的认识：\n不能作出的判断：","answer":"示范：问题是现有教学卡覆盖哪些对象和设计。材料包含成人实验、成人观察与青少年实验；由于对象、设计和结果定义不同，先分层叙述，不计算一个总效果。得到的认识是证据结构存在差异；不能据三张卡断定某方式普遍有效或不存在其他研究。","rubric":["综述名称与实际做法相符","没有把显著研究票数当有效概率","给出综合方式的材料依据","区分证据不足与效果不存在"]},"quiz":{"question":"一组研究的对象、结果定义和设计差异很大，最合理的第一步是什么？","options":["立即计算总体平均效果","检查可比性并选择适当的分层或叙述综合","删除不支持结论的研究"],"correct":1,"explanation":"合并需要有意义的共同估计目标；不适合合并时，透明分层比制造一个数字更可靠。"},"references":[{"id":"prisma","locator":"阅读适用范围和报告清单，区分系统综述与其他综述。"},{"id":"cochrane","locator":"Chapter 10：效应综合、模型和异质性；用于理解结果组织，不代替独立的偏倚评价与检索设计。"}],"next":"确定论文类型后，从下一章开始逐段写出读者首先看到的标题、摘要和引言。","core":false,"chapterId":"c17","stageId":"s6","chineseCount":1935},{"id":"a18-1","title":"标题和关键词怎样准确表达研究","goal":"写出准确、可检索且不夸大结论的标题与关键词，并说明每个词承担的作用。","scope":"适用于各类学术文章；不同期刊对标题长度、缩写和关键词数量的规定以实际作者指南为准。","prerequisites":["a17-1"],"minutes":70,"tags":["写作","通用"],"terms":[{"zh":"信息型标题","en":"informative title","definition":"告诉读者对象、核心问题或方法，必要时表达经过证据支持的主要发现。"},{"zh":"检索词","en":"search term","definition":"读者可能实际使用的概念表达，帮助文章在主题检索中被发现。"},{"zh":"范围限定","en":"scope qualifier","definition":"用对象、条件、设计或材料性质限制标题所承诺的知识范围。"}],"sections":[{"id":"concepts","title":"标题首先是一份范围承诺","paragraphs":["标题不是广告口号，而是读者判断是否阅读的第一条信息。通常需要让人看出研究对象、核心关系或任务；必要时加上研究设计或材料性质。标题可以陈述发现，也可以描述问题。前者必须有足够证据支撑，后者适合探索、方法讨论或不宜压缩为单一结论的研究。没有统一规则要求所有标题都包括方法名称或结果方向。","关键词负责补充检索入口。它们可涵盖研究对象、关键概念、方法和场景，但不应堆满宽泛词语。新手常写“人工智能、创新、技术、研究”，这些词难以区分文章。选择实际论文和数据库使用的词汇，比创造炫目的缩写更有用；专门缩写首次出现应能被目标读者理解。"]},{"id":"reasoning","title":"写作选择背后的理由","paragraphs":["标题的动词决定了读者对证据强度的预期。“导致”“改善”“验证”通常比“关联”“比较”“探索”承诺更多。观察研究发现相关性时，标题若写成因果效果，即使正文局限很诚实，读者也可能已受到误导。教学构造数据更应把“教学”或“模拟”保留在题名中，不把统计输出转成真实流程的性能声明。","标题应与摘要、主要结果和结论组成一致的范围。如果主要分析比较绝对误差，标题只写“精度”可能引入准确度、精密度等不同含义；若测量时间只是探索性指标，也不能因为它看起来更有吸引力而放到标题中心。关键词的判断类似：只列文章确实处理的概念，而不借热门领域扩大曝光。"]},{"id":"workflow","title":"一步一步完成","paragraphs":["准备一页研究说明和主要结论。将现有题名当作可修改草稿，先写三个结构不同的候选，再逐项核查。"],"steps":[{"title":"列四项事实","body":"写对象、主要问题、所用设计与真实材料性质。例如：二十个构造对象、A/B绝对误差比较、对象内配对、教学数据。未研究的对象先不列。"},{"title":"写描述型候选","body":"用“对象＋问题＋设计”组织，例如“两种测量流程的绝对误差比较：二十个教学对象的配对分析”。检查读者是否知道比较的是什么。"},{"title":"检查是否适合结论型","body":"只有结果可靠且标题不会隐藏关键条件时，才考虑加入方向。教学案例不把B更好写成真实有效性结论；解释性论文也不必强行表达效果。"},{"title":"删除空泛修饰","body":"逐个审查先进、智能、全面、高效等词。若没有独立定义和证据，删除；保留具有技术含义且确实使用的术语。"},{"title":"选择关键词并回查","body":"选对象、结果概念、设计与方法各一项；用主题数据库或相关论文核对标准表达，再对照目标渠道的数量、大小写与缩写规定。"}]},{"id":"worked","title":"成稿与逐句批注","paragraphs":["教学初稿“智能测量革命：先进流程大幅提高精度”同时夸大了新颖性、材料真实性和效果。下面展示完整修订题名及关键词，随后给出人文和理论标题的对照；它们都是原创教学示例。","修订时先固定对象、指标与设计，再决定标题长度。量化题名直接对应教学数据字典；人文题名对应本书原创短文本，理论题名对应基础证明练习。三者都避免制造不存在的作者、历史背景或新定理。"],"annotations":[{"text":"两种流程的绝对测量误差：配对分析教学案例","role":"完整定量题名","note":"依据：教学数据字典中的参考值、两流程读数和对象编号。“绝对误差”指定结果，“配对”指定结构，“教学”限定材料；不宣称真实性能。"},{"text":"关键词：绝对测量误差；配对设计；误差分析；教学模拟。","role":"关键词成品","note":"依据：报告实际指标、设计与材料性质。选可检索概念而非“革命”等宣传词；这些标签不表示已产生原创贡献。"},{"text":"开门、停留与交钥匙：一则短文本中的边界控制","role":"完整人文题名","note":"依据：本书原创短文本的三个动作。前半列材料线索，后半提出解释焦点；“一则”限定范围，未虚构历史作者或普遍文化结论。"},{"text":"有限实数集合最大值与均值关系的证明练习","role":"完整理论题名","note":"依据：理论教学样稿的命题与证明。“有限实数”保留成立条件，“练习”说明成果身份，不暗示发现新定理。"}]},{"id":"repair","title":"错误版本怎样改","paragraphs":["容易踩的坑：“基于人工智能的实验室效率优化研究”。如果文章没有用人工智能、没有现场数据，题名同时虚增了方法与应用范围。具体修订为“构造测量数据中两流程绝对误差的配对分析”，并把它作为学习报告。若之后实际开展实验，再依据真实对象与研究设计重新拟题。","错误关键词：“论文、结果、实验、方法”。这些词几乎适用于所有文章，不能帮助读者辨别主题。修订为具体任务、指标和设计名。也不要列只在引言中顺带提及的技术；关键词表应反映正文的主要内容。"]},{"id":"tips","title":"技巧与边界","paragraphs":["将标题读给不了解项目的同学，请他复述“研究什么、用什么材料、想回答什么”。如果复述与实际工作偏离，问题通常来自歧义词或缺少限定，而不只是字数。对长标题，先删无信息修饰，再考虑把设计放到副标题；不要先删掉决定结论范围的对象与条件。","标题不需要一次定稿。立项题名负责聚焦问题，分析完成后的题名负责忠实表达成果；两者可以不同，但变更要与研究计划及实际做法对应。最终提交前，把题名中的每个能力或效果词指向正文证据，指不到就重新选择措辞。"]}],"exercise":{"materials":"统一模拟测量案例，二十对象内比较A、B绝对误差；未做真实实验。","task":"写两个准确题名和四个关键词，解释为何不用“证明有效”。","template":"描述型标题：\n另一标题：\n关键词：\n对象限定：\n删除的夸大词及理由：","answer":"示范：标题一“两种测量流程的绝对误差：配对分析教学案例”；标题二“从原始表格到误差比较：二十个模拟对象的分析演示”。关键词为绝对误差、配对设计、测量分析、教学模拟。不用“证明有效”，因为数据是构造的，未提供现场抽样和性能验证证据。","rubric":["题名能对应实际对象与主要指标","材料性质准确","关键词具体且与正文相关","没有未经证据支持的效果或首创承诺"]},"quiz":{"question":"只有横断面观察数据时，哪个标题动词最需警惕？","options":["关联","描述","导致"],"correct":2,"explanation":"导致表达因果，需要相应识别条件。关联或描述也必须准确，但通常不作同等强度的因果承诺。"},"references":[{"id":"harvard-writing","locator":"Introductions：Orienting Information、what is at stake、Your thesis；用于检查问题、读者所需背景与中心主张。这篇课对题名、口头表达或计划的应用属于教学迁移。"},{"id":"icmje","locator":"查阅标题页与关键词的稿件准备要求，注意其出版领域。"}],"next":"标题承诺的研究将在摘要中展开，下一篇会逐句建立摘要信息链。","core":true,"chapterId":"c18","stageId":"s6","chineseCount":2020},{"id":"a18-2","title":"摘要逐句写作与压缩","goal":"写出与正文一致的完整摘要，能逐句说明问题、方法、结果和结论，并在字数限制下保留关键条件。","scope":"重点练实证摘要，同时比较理论与解释型摘要；是否结构式、字数与缩写限制由目标渠道决定。","prerequisites":["a17-1","a18-1"],"minutes":70,"tags":["写作","通用"],"terms":[{"zh":"结构式摘要","en":"structured abstract","definition":"用背景、方法、结果、结论等标签组织信息的摘要，具体标签因渠道而异。"},{"zh":"非结构式摘要","en":"unstructured abstract","definition":"不用显式标签而以连续段落传达必要信息，并非没有逻辑结构。"},{"zh":"信息压缩","en":"compression","definition":"删去重复和次要细节，同时保留影响读者判断的对象、设计、结果和限定。"}],"sections":[{"id":"concepts","title":"摘要是完整论证的缩小版","paragraphs":["摘要面对的读者可能只读这一段，因此不能只写研究背景和操作意图。完成研究的实证摘要通常应说明问题或目的、对象与设计、主要方法、关键结果和受范围约束的结论。研究计划摘要则应使用拟开展的语气，不得填写尚不存在的发现。理论摘要可突出命题、假设与证明贡献，人文摘要可交代材料、解释问题、中心论点及意义，不要求硬塞样本量和p值。","写摘要前先完成主要结果核对。否则容易在摘要中保留早期数字，正文更新后却出现矛盾。每个数字应能找到正文或分析输出的准确位置；分母、单位、比较方向、置信区间和数据性质都要一致。摘要中的一个错误可能被数据库或他人综述反复传播。"]},{"id":"reasoning","title":"写作选择背后的理由","paragraphs":["压缩不是只保留最强的结论。假如删掉“教学模拟”后，句子从计算练习变成实际有效性声明，这种压缩改变了事实。删掉对照对象后，“平均减少0.75g”也失去比较意义。应先确定哪些信息改变解释，再删除读者可从正文补充的次要操作细节。","摘要的结果应优先报告主要问题的效应方向、大小与不确定性。单独写“结果显著”没有告诉读者差异多大，也没有说明实际价值。相反，把每个次要分析都塞进摘要会掩盖主线。通常用一个主要结果加一个关键限制已经比一长串显著标签更有信息。"]},{"id":"workflow","title":"一步一步完成","paragraphs":["打开统一案例数据说明和分析结果；用六句话先写信息齐全的版本，再压缩为目标长度。以下为教学建议，不是所有期刊统一句数要求。"],"steps":[{"title":"写目的句","body":"说明要回答什么，不先写宏大领域口号。教学报告可说旨在演示对象内配对误差的分析和报告方法。"},{"title":"写设计与指标句","body":"交代二十个构造对象、A/B配对读数、绝对误差及B−A差值方向。保留模拟性质与独立单位。"},{"title":"写分析句","body":"说明使用配对t模型计算均值差与区间；必要时交代模型假设，不能把计算软件名字当作分析方法。"},{"title":"写结果句","body":"填入经复核的平均差−0.750g和95%区间[−1.060,−0.440]g；若版面允许可补双侧p≈0.0000687，不能写p=0。"},{"title":"写结论与范围","body":"说明计算示范显示该构造数据中的差异，不能推论真实流程有效。删去与主要问题无关的细节，再逐句对照正文。"}]},{"id":"worked","title":"成稿与逐句批注","paragraphs":["下面是一段可完整阅读的五句摘要，切换逐句批注可查看每句的作用、证据与措辞。这里的数字已经由同一份教学数据计算，不需要再用占位符替换。","若篇幅更紧，可删去对象方向计数和检验的具体数值，保留设计、主要均值差、区间与模拟边界。不能删去“模拟”后继续保留同样的效果结论；也不能在摘要里首次加入正文没有的结果。"],"annotations":[{"text":"本教学案例旨在演示两种测量流程绝对误差的配对分析。","role":"目的与材料身份","note":"依据：教材训练任务与数据来源声明。用“演示”而非“验证”，将范围限定为分析教学，不主张现实性能改善。"},{"text":"我们为二十个模拟对象提供参考值与A、B读数，并将每个对象的B绝对误差减去A绝对误差作为比较量。","role":"设计与估计量","note":"依据：原始表格和变量字典。明确二十个对象及对象内B−A，避免把四十条读数当独立样本；这是构造资料的设计说明。"},{"text":"在配对t模型的教学假设下，平均差为−0.750g，95%置信区间为[−1.060,−0.440]g，双侧p约为0.0000687。","role":"主要数值结果","note":"依据：分析汇总中的均值差、区间和检验。保留方向、单位及模型条件；“教学假设”限制为模型计算，不赋予真实总体推断。"},{"text":"B的绝对误差在十六个对象上较小、一个相同、三个较大。","role":"差异分布与反例","note":"依据：逐对象差值的符号计数，总数为二十。不写“所有对象改善”，将主张限制在构造数据的实际方向分布。"},{"text":"本例提供可复核的计算与报告流程，但构造数据不能证明真实流程B具有性能或因果优势。","role":"产出与结论边界","note":"依据：材料包与无真实采样的来源声明。“提供流程”描述训练产出，后半明确不能推断的内容，阻止显著数值被解读为现实验证。"}]},{"id":"repair","title":"错误版本怎样改","paragraphs":["错误摘要：“随着科技发展，测量十分重要。这篇文章使用先进方法处理大量数据，结果非常显著，具有广泛应用价值。”它缺少对象、比较、指标、数值与边界。修订应直接使用上面的目的—设计—结果—限定结构，删除无证据支持的“先进”“大量”和“广泛”。","另一个错误是摘要写二十个样本，方法写四十次独立观察，结果却用配对检验。应统一为二十个对象，每对象两次流程读数；配对差只有二十个。摘要是发现口径冲突的好位置，不能为了简短模糊真正的分析单位。"]},{"id":"tips","title":"技巧与边界","paragraphs":["完成摘要后做逆向检查：只把摘要交给同学，让他写出研究问题、材料、比较和结论。如果他误判设计或范围，修改摘要而不是要求他读正文。再删去每句的装饰词，看信息是否还完整；学术摘要通常从明确名词和准确动词获益。","英文摘要应先确认中文逻辑，再翻译术语和句法。翻译工具可帮助润色，但不能自动核实设计、数字和因果措辞。最终作者需检查同一概念译法、时态与单位；投稿渠道是否允许摘要引用或缩写也要单独核对。"]}],"exercise":{"materials":"这篇课完整摘要及统一分析输出。","task":"把摘要压缩到四句话，保留设计、一个主要结果和结论边界。","template":"目的：\n设计与指标：\n主要结果：\n结论与限制：","answer":"示范：本案例演示两流程绝对误差的配对分析。二十个构造对象各有A、B读数，比较量为对象内B减A绝对误差。在教学配对t模型下，均值差为−0.750g，95%区间为[−1.060,−0.440]g。本例说明计算与报告流程，不能证明真实流程B有效。","rubric":["摘要独立可读","数值、单位、方向与正文一致","结果不是仅报显著","压缩后仍保留模拟与推断边界"]},"quiz":{"question":"摘要超过字数限制时，以下哪项最不应直接删去？","options":["重复的背景形容词","决定结论范围的教学模拟说明","与主问题无关的次要操作步骤"],"correct":1,"explanation":"删掉材料性质会改变结论含义。压缩应优先移除重复和不影响判断的细节。"},"references":[{"id":"icmje","locator":"阅读摘要应准确反映正文、主要发现和限制的要求。"},{"id":"harvard-organizing","locator":"Tips for Organizing Your Essay：Strategy 1把论点拆成段落，Strategy 3从成稿建立反向提纲；用于检查这篇课结构与修改。"}],"next":"摘要中的问题与必要性将在引言中获得文献依据，下一篇会把这条论证展开。","core":true,"chapterId":"c18","stageId":"s6","chineseCount":1999},{"id":"a18-3","title":"引言怎样建立问题、缺口和研究必要性","goal":"你会从具体研究情境建立必要性、真实缺口与研究目标，写出有证据支撑且范围清楚的引言。","scope":"各类研究都需要说明问题与位置；不同学科允许不同引入方式，不强制三段或固定句式。","prerequisites":["a07-3","a08-3"],"minutes":70,"tags":["写作","通用"],"terms":[{"zh":"研究领域","en":"territory","definition":"论文所处的知识与实践范围，要具体到读者能识别的问题。"},{"zh":"研究缺口","en":"research gap","definition":"已有知识未充分回答且具有价值的问题，不等于作者暂时没读到。"},{"zh":"贡献定位","en":"positioning","definition":"说明这篇文章相对最接近工作增加了什么，并解释增加部分为何值得研究。"}],"sections":[{"id":"concepts","title":"引言要让读者理解为什么需要这项研究","paragraphs":["引言通常承担四项工作：建立具体问题，概括与该问题相关的已有认识，解释尚未解决的张力或限制，提出这篇文章的问题与贡献。它不是从人类文明写到某个小实验的漫长背景，也不是把整份文献综述提前搬入。读者要足够背景理解你的选择，却不需要在第一页读完所有领域知识。","缺口可以是证据矛盾、机制未明、测量不足、某条件下失效、理论条件过强或新材料带来的问题。真正的缺口必须与重要性和可研究性相连。仅仅指出某个城市、设备型号或样本组合没人研究，不能自动说明值得写一篇论文；你需要解释改变这些条件为何可能影响现有理解。"]},{"id":"reasoning","title":"写作选择背后的理由","paragraphs":["引言越强烈地声称“首次”“完全未研究”“解决长期难题”，越需要全面、准确的比较证据。初学者容易用绝对语言补足查新不足，但这会使整篇论文暴露于一个简单反例。更可靠的表达是明确检索范围、最接近工作和具体差异，让读者自己判断贡献的分量。","研究目标应与方法能够完成的任务一致。若目标是比较误差，方法只需提供公平比较；若目标是解释误差为什么变化，则需要能区分机制的额外设计。把解释机制当作比较结果的自然副产品，会在讨论中形成过度因果推断。引言因此也是防止研究范围失控的工具。"]},{"id":"workflow","title":"一步一步完成","paragraphs":["准备文献矩阵、最接近工作对照表和一页研究方案。每一个外部事实先标来源，再组织段落，不先写引用占位的流畅故事。"],"steps":[{"title":"用具体问题开场","body":"写目标读者认识的困难，例如两流程的平均误差比较可能掩盖对象内差异。说明这一问题影响什么判断，不靠空泛的时代背景。"},{"title":"概括已知证据","body":"选择真正支持现有认识的研究，说明对象、设计与主要发现。这里可概括多篇，但每项判断都能追溯到实际读过的来源。"},{"title":"提出可核查张力","body":"把最接近研究的限制与自己的问题连接，明确是缺少某类证据、存在矛盾还是需要检验某条件。避免声称没人研究整个领域。"},{"title":"写问题与设计概述","body":"用一句可回答的问题，再用一句说明将使用什么材料和比较。只承诺实际完成的内容。"},{"title":"收束为贡献与边界","body":"列一到三项有证据支持的增加，注明复现、方法验证或教学分析的真实性质；全文完成后回查这些承诺是否兑现。"}]},{"id":"worked","title":"成稿与逐句批注","paragraphs":["统一案例的引言不应伪造文献来证明创新。下面四句组成一个完整教学引言：以配对呈现的需要建立任务，再交代材料和目标。","真正研究还需要核查领域来源，例如绝对误差为什么是有意义的结果量、已有方法怎样比较及场景限制是什么。下面段落作为教学成稿已经完整，但不能靠替换题名变成创新论文；真实文献位置必须靠实际检索和阅读建立。"],"annotations":[{"text":"比较两种测量流程时，分别报告平均误差可能不足以展示同一对象上的变化。","role":"具体问题背景","note":"依据：本例对象内两读数的设计，以及分别均值无法呈现逐对象对应的信息。“可能不足”指出呈现局限，不断言所有均值比较无效。"},{"text":"对象内配对差能够保留两次读数的对应关系，并使比较方向更加明确。","role":"方法选择理由","note":"依据：变量字典的对象编号与B−A定义。说明表示方式为何合适；它是已有分析逻辑，未被称为新方法。"},{"text":"本教学案例使用二十个构造对象，演示从参考值和读数计算绝对误差、形成B减A配对差并报告其摘要的过程。","role":"材料与任务范围","note":"依据：原始表格和分析入口。按实际操作列步骤，使用“构造”和“演示”防止误读为真实实验或预实验。"},{"text":"这篇文章的目标是训练透明分析与写作，不主张提出新的测量方法或证明真实流程有效。","role":"目标与贡献边界","note":"依据：项目教学定位和来源声明。让产出名称与证据匹配，明确未支持的新颖性和现实有效性判断。"}]},{"id":"repair","title":"错误版本怎样改","paragraphs":["错误引言：“目前国内外没有人研究自动测量，因此本研究填补世界空白。”只要存在一项相关工作就会推翻此句，而且它没有界定自动测量是什么。修订应聚焦一个可核查条件，并写清最接近研究已做到什么、还有什么问题。本教材教学例不能承担查新结果，需明确其练习性质。","另一错误是引言列出三个目标，结果只回答其中一个，却把另外两个藏进未来工作。应提前收缩目标，或在正文中坦率报告未完成事项及原因。最终引言必须描述这篇文章实际做的工作，不能保留项目最初愿景而让读者误判范围。"]},{"id":"tips","title":"技巧与边界","paragraphs":["可以为每段写一句边栏标签：背景、已知、张力、问题、做法、贡献。若连续三段都只是背景，试着提前进入具体问题；若直接宣布贡献而读者不理解为何需要它，补上最短的必要背景。标签用于修改，不必在成稿中显式展示。","“值得研究”与“值得我现在做”分别需要论证。前者关系到知识或实践价值，后者涉及资源、时间与方法能力。申请研究计划尤其需要两者同时成立；本科设计经验可以成为能力依据，但不自动证明你已掌握某项专业研究方法。"]}],"exercise":{"materials":"这篇课教学引言，以及“两个流程都能完成任务，但对象内误差可能不同”的问题描述。","task":"写一段不虚构文献和创新的引言，分别标出问题、方法理由和目标边界。","template":"具体问题：\n已知依据：\n需要澄清：\n这篇文章的材料与做法：\n贡献性质与边界：","answer":"示范：两流程都能输出读数，但是否在相同对象上呈现不同误差，需要保留对象对应关系才能检查。本练习使用构造数据计算对象内绝对误差差值，展示从原表到报告的过程。练习产出是透明分析示范；它没有开展真实性能检验，也不主张新方法贡献。","rubric":["问题具体且与方法对应","外部事实有真实来源或明确未作主张","缺口不是泛化的无人研究","贡献承诺与实际产出一致"]},"quiz":{"question":"下面哪种情况最适合作为进一步研究的起点？","options":["只因某个地区尚未出现在论文题目中","最接近研究在一个影响结果的条件上存在未解释矛盾","把已有方法改一个名字"],"correct":1,"explanation":"矛盾且重要的条件可以形成有价值问题；换地区或名称需要额外理由才能构成贡献。"},"references":[{"id":"harvard-writing","locator":"Introductions：Orienting Information、what is at stake、Your thesis；用于检查问题、读者所需背景与中心主张。这篇课对题名、口头表达或计划的应用属于教学迁移。"},{"id":"read-paper","locator":"把已有论文的问题、方法和局限一起阅读，避免孤立引用一句结论。"}],"next":"下一篇会把引言中的文献位置扩展成有组织的相关工作，而非逐篇摘要。","core":true,"chapterId":"c18","stageId":"s6","chineseCount":2108},{"id":"a18-4","title":"相关工作怎样组织、比较与定位","goal":"用比较维度组织相关工作，准确表达与既有研究的联系、差异和限制，而不是堆作者名单。","scope":"适用于独立相关工作部分、引言中的文献定位以及研究计划的研究现状；格式依学科调整。","prerequisites":["a06-2","a18-3"],"minutes":70,"tags":["写作","通用"],"terms":[{"zh":"比较维度","en":"comparison dimension","definition":"用于横向理解研究的共同问题，如对象、任务、假设、方法、证据和边界。"},{"zh":"综合","en":"synthesis","definition":"将多份来源围绕问题整合，指出关系、分歧和整体认识，而非简单相加摘要。"},{"zh":"最接近工作","en":"closest prior work","definition":"在问题、方法或条件上最能挑战这篇文章的差异主张的研究，不一定是最著名或引用最高者。"}],"sections":[{"id":"concepts","title":"相关工作需要形成一幅比较地图","paragraphs":["相关工作要帮助读者回答“这篇文章站在什么已有知识之上，新增部分在哪里”。它的基本单位可以是方法家族、理论争议、研究对象或证据类型，而不必是一位作者。先确定比较维度，再选择来源和组织段落，才能避免把文献数量当作研究理解程度。","引用关系有不同功能：定义概念、提供背景、支持事实、指出分歧、采用方法或比较贡献。把每条引用的功能写出来，能发现有的参考文献只是装饰，也能发现某个关键判断没有来源。引用一个领域综述可以帮助概览，但评价具体方法时仍需回到相关原始研究核实。","综合是按一个问题把多项来源放在一起比较，写出一致、差异及其含义；它不同于逐篇缩写。可以先用“共同点—条件差异—对本研究的影响”组织一段，再检查每个连接是否由文献卡支持。"]},{"id":"reasoning","title":"写作选择背后的理由","paragraphs":["公平定位要求先准确说出已有工作做到了什么。将他人方法简化到最弱版本，再宣布自己的方法弥补缺点，会导致不公平比较。不同研究可能服务不同目标、成本与约束；如果某方案没有优化速度是因为重点在解释性，就不应直接称其落后。","对照表也可能制造假精确。勾选“有或没有”之前要定义标准，不能只凭摘要没有提及就判定没有功能。对未获取全文、实现不明或评价不完整的条目写明信息不足；不能把未知填成否定，从而人为扩大这篇文章的贡献。"]},{"id":"workflow","title":"一步一步完成","paragraphs":["准备至少三张已经核实的文献卡。练习阶段可用明确标注的原创教学卡，实际论文必须换为真实读过的来源。"],"steps":[{"title":"确定段落问题","body":"先写这段文献要回答什么，例如不同研究怎样验证记录可靠性。不要从按年份列所有作者开始。"},{"title":"建维度表","body":"为每项研究记录问题、对象、设计、主要结果、限制和这篇文章的关系；每格给页段或图表位置，未知不猜测。"},{"title":"按关系分组","body":"把共同假设、不同场景或冲突结果聚在一起。类别应服务当前问题，同一文献可以承担多个功能，但避免重复大段介绍。"},{"title":"写综合段落","body":"先写组内共同认识，再用具体来源说明差异，最后指出这些关系怎样引出这篇文章的任务。每一步都保留适用条件。"},{"title":"做反向挑战","body":"单独挑最接近工作，问它是否已经完成这篇文章声称的新贡献。若答案接近肯定，调整贡献或承认复现定位，而不是隐藏这篇文献。"}]},{"id":"worked","title":"成稿与逐句批注","paragraphs":["下面使用原创教学卡，不对应真实论文：卡A研究正常流程中的记录完整率；卡B研究异常后的恢复，却没有对象级日志；卡C同时保留日志并检查异常。四句成品将它们按条件与证据结构比较。","段落先给分类，再说明差异，最后用最接近工作约束贡献判断。正式写作时每项描述都应链接实际来源与位置，并核查最接近工作的具体做法；不能将这些教学卡引用为真实文献。"],"annotations":[{"text":"这些教学卡把记录可靠性置于不同条件中。","role":"综合主题句","note":"依据：三张教学卡的条件描述。先提出共同主题和比较维度，结论仅覆盖给定材料，不概括整个真实领域。"},{"text":"A关注正常运行时的完整率，B将问题扩展到异常恢复，C进一步保留对象级过程记录。","role":"支持综合的差异证据","note":"依据：上方卡A、B、C内容。“关注”“扩展”按已有信息陈述，不虚构各卡的效果或优劣。"},{"text":"所以，如果拟研究异常恢复与可追溯性，C比A更接近目标问题。","role":"有条件的定位判断","note":"依据：卡C同时包含异常与对象日志。“如果”绑定拟研究问题，不声称C在所有评价维度都优于A。"},{"text":"新研究需要解释相对C还增加了什么，不能只以A未覆盖异常为由宣称填补空白。","role":"贡献判断约束","note":"依据：最接近工作比较逻辑。要求对真正邻近研究说明增量，未因新题名或更弱对照就宣布创新成立。"}]},{"id":"repair","title":"错误版本怎样改","paragraphs":["错误段落：“A提出一种方法，B也提出一种方法，C提出更好方法，所以本研究有意义。”它缺少共同维度，也没有解释更好指什么。修订时先选择任务、对象、指标或理论问题，再写一致与分歧。只有给出可比较条件和证据，才适合评价相对优劣。","错误对照表把“全文未找到”填为“未提供数据”，再把本研究的数据公开当作首次贡献。应改成“当前阅读范围未核实”，并继续查询补充材料或联系作者。信息缺失不能直接转换成对已有工作的否定。"]},{"id":"tips","title":"技巧与边界","paragraphs":["写相关工作时保留一列“这篇改变了我的哪项决定”。若读了十篇却没有改变问题、方法、比较或边界中的任何一项，可能只是收集摘要。真正的综合会促使你修订研究，而不仅为文章增加参考文献数量。","相关工作不必穷尽所有文章，但必须诚实覆盖影响这篇文章的主张的关键研究。对系统综述则有更严格检索和筛选义务。不要把普通背景综述的自由组织方式，误用为系统证据综合中选择性纳入的理由。"]}],"exercise":{"materials":"这篇课A、B、C教学卡，以及拟研究问题“异常后的记录是否可追溯”。","task":"写一段综合，并列出与C比较还需要核实的两项信息。","template":"共同问题：\n分组与差异：\n最接近工作：\n未核实信息：\n这篇文章的定位：","answer":"示范：A关注正常完整率，B关注异常恢复，C同时记录过程日志，因此C最接近可追溯性问题。还需核实C是否记录失败尝试，以及日志能否链接最终输出。只有核实后，才能判断自己的方案是扩展、复现还是重复；不能先声称创新。","rubric":["段落有共同的比较维度","准确呈现最接近工作","未知与不存在明确区分","这篇文章的贡献受到既有证据约束"]},"quiz":{"question":"发现一篇非常接近自己的研究后，最合理的写作做法是什么？","options":["不引用以免削弱创新","认真比较并修订贡献定位","只引用较弱的早期研究"],"correct":1,"explanation":"研究价值必须建立在真实知识位置上。隐瞒近邻工作不能创造创新，反而损害论证可信度。"},"references":[{"id":"read-paper","locator":"按照问题、方法与局限精读近邻研究。"},{"id":"harvard-paragraph","locator":"Anatomy of a Body Paragraph：Topic sentence、Evidence、Analysis三项与示范段落；这里把它用于组织主张与材料，不将其当作细读或史料研究的完整方法。"}],"next":"明确已有工作和研究承诺后，下一章从方法部分开始把自己的研究写到可检查。如需更早练习文献综合，可选读第六章第四篇；它不是主修通行条件。","core":true,"chapterId":"c18","stageId":"s6","chineseCount":1983},{"id":"a19-1","title":"方法部分写到别人能够检查和复做","goal":"从真实记录写出足以检查和复做的方法，区分预定方案、实际执行和事后修改。","scope":"以定量研究为主，同时指出定性、人文与理论研究中需要透明交代的对应内容。","prerequisites":["a14-1","a16-4","a17-1"],"minutes":75,"tags":["写作","实证定量"],"terms":[{"zh":"操作化","en":"operationalization","definition":"将研究概念转换为可记录、可比较或可解释的具体规则。"},{"zh":"分析单位","en":"unit of analysis","definition":"统计或解释所针对的基本单位，需要与采样、干预及重复测量结构相协调。"},{"zh":"方案偏离","en":"protocol deviation","definition":"实际执行与预先方案不一致的变化，应记录时间、原因及对解释的影响。"}],"sections":[{"id":"concepts","title":"方法部分回答证据是怎样产生的","paragraphs":["方法部分的任务不是显示作者用了多少复杂工具，而是让读者判断证据产生过程是否适合研究问题。最小信息通常包括研究设计、对象或材料来源、纳入排除、变量与测量、操作过程、分析规则以及必要的伦理与权限说明。具体深度由研究类型决定；对影响结果的决策写得更细，对通用且有准确来源的步骤可以适当引用。","“使用Excel分析”只告诉读者工具，未告诉分析。需要进一步写怎样计算绝对误差、差值方向、缺失怎么处理、统计量与区间怎样得到。仪器名称同样不等于测量定义；量程、分辨率、校准、参考值不确定性、取样时机等是否重要，取决于它们能否改变当前结论。"]},{"id":"reasoning","title":"先理解报告逻辑","paragraphs":["方法应描述实际完成的研究。把计划写成已经执行，或把事后决定说成预先规定，会改变证据可信度。若没有预注册，可如实说明预先保存的方案与实际时间线；若发生数据质量问题，应解释如何识别、如何处理、主要分析是否受影响。透明并不要求研究从未调整，而要求调整不被隐藏。","同样的方法名可能对应不同实现。例如配对t比较以对象内差值为基础，不能把两列互不对应的读数随意配对。定性分析则需说明材料生成和解释过程，历史研究需交代版本和选材，理论研究需交代定义与假设。可复核性的共同要求是留下判断链，具体形式不必相同。"]},{"id":"workflow","title":"逐步写出这一部分","paragraphs":["收集研究日志、原始文件、数据字典、方案版本与分析脚本。先写事实清单，再转成段落，避免靠记忆补齐理想流程。"],"steps":[{"title":"确定设计和对象","body":"第一段说明材料来自哪里、多少独立单位、如何形成样本。统一案例写二十个构造对象，不写真实招募、随机分组或伦理批准。"},{"title":"定义测量与结果","body":"写参考值为50g的教学设定、A/B读数和绝对误差公式。差值定义为B减A，负号代表B误差更小；说明单位。"},{"title":"记录处理规则","body":"写原始数据保存、变量计算、缺失与异常检查。哪些规则事前确定、哪些是发现问题后决定，要按实际版本区分。"},{"title":"描述主要分析","body":"说明在对象内形成二十个差值，再计算均值、标准差及配对t模型下区间与检验；说明独立差值和分布假设。"},{"title":"提供可复做入口","body":"给出数据字典、脚本、运行步骤和输出对应。软件版本或依赖影响结果时应记录；不能公开的材料说明原因和可提供范围。"}]},{"id":"worked","title":"完整段落与逐句批注","paragraphs":["下面六句组成教学案例的方法段，包括材料、指标、比较方向、分析、假设和复核入口。每句都有可检查对象，能够独立放入报告。","方法必须写到读者能检查公式、单位、对象结构与推断范围；这里不虚构设备型号、招募流程或伦理编号。真实项目还需报告实际执行条件、处理决定及必要权限，这些不能从本构造数据示范自动继承。"],"annotations":[{"text":"数据由二十个构造对象组成，每个对象均有50g参考值及流程A、B各一次读数；这些记录不来自真实实验。","role":"材料来源和分析对象","note":"依据：原始数据二十个对象及参考值列。交代结构与来源，明确“构造”而非声称真实采样，避免虚构实验事实。"},{"text":"对每个流程计算绝对误差，即读数与参考值之差的绝对值，单位为g。","role":"指标操作化","note":"依据：数据字典与分析公式。把“精度”改为可计算的绝对误差，单位明确；指标解释仅针对本测量定义。"},{"text":"主要比较量为同一对象的B绝对误差减去A绝对误差，因此负值表示B误差较小。","role":"估计量及方向","note":"依据：逐对象差值列。固定减法次序使负号可解释，未将方向等同于因果效应。"},{"text":"分析以二十个对象内差值为单位，报告差值均值及配对t模型下的双侧95%置信区间和检验结果。","role":"分析策略","note":"依据：脚本中的配对差汇总与t计算。说清对象数、摘要和区间类型；不把四十读数当独立单位。"},{"text":"该计算假定对象间差值独立、差值分布适合t近似且不存在支配性异常；构造数据没有真实抽样机制，区间与p值仅用于演示模型计算。","role":"假设与推断边界","note":"依据：配对t模型条件与数据来源声明。将可计算性和现实推断分开；较小p值不能突破这一材料边界。"},{"text":"原始表格、变量字典与分析脚本随教学材料提供，处理结果由同一原表重新生成。","role":"复核入口","note":"依据：本书材料包中的原始文件、字典和脚本。描述确有的支持材料，不将提供代码自动等同于独立验证全部研究结论。"}]},{"id":"repair","title":"识别并修订错误","paragraphs":["错误方法：“取四十个样本，用软件做显著性分析，删除几个异常后结果更好。”这里混淆读数与独立对象，没有定义检验，也把删除理由绑定于结果。修订为二十个对象内配对，说明检验和误差定义；若有异常，先查记录或设备原因，按透明规则处理并报告敏感性分析。统一数据中三个B较差对象不能因不支持预期而删除。","错误方法还包括写“随机化顺序”却没有真实随机记录。教学构造数据没有执行顺序，必须明确这一点；未来真实研究才需要设计并记录顺序、学习效应和漂移控制。"]},{"id":"tips","title":"经验与适用边界","paragraphs":["让一个没参与项目的人按方法重建一条数据记录和一个结果。如果他必须问“这一列是什么”“删了哪些行”“负号代表谁”，就说明方法还缺关键信息。复做不必一次运行全部项目，先追一条最重要的结论最有效。","方法篇幅受限时，将完整参数表、检索词式或代码放补充材料，并在正文给准确入口。不能把决定研究是否可信的信息全部藏在无法获取的附件里。对专业技术，用准确来源解释采用的程序，再清楚写出自己做过的修改。"]}],"exercise":{"materials":"统一教学数据说明与原始表格，含20对象、A/B读数、50g参考值。","task":"写一段不超过两百字的方法摘要，必须包含独立单位、指标、方向和数据性质。","template":"材料来源与单位：\n测量定义：\n主要比较：\n分析：\n假设与边界：","answer":"示范：二十个构造对象各有50g参考值及A、B读数。计算每次读数与参考值之差的绝对值，再形成对象内B减A误差差。对二十个差值报告均值及配对t模型下的区间；负值代表B误差较小。数据为教学构造，计算不构成真实流程有效性证据。","rubric":["读数数目与独立对象数分清","公式、方向及单位完整","分析与配对设计一致","未虚构实际执行或审批事实"]},"quiz":{"question":"研究中实际改变了排除规则，方法部分应如何写？","options":["仍写原计划，保持文章简洁","说明变化、时间、理由并评估影响","只要结果更显著就不必解释"],"correct":1,"explanation":"实际流程与变化都影响证据解释，透明记录允许读者判断，而隐藏会造成误导。"},"references":[{"id":"equator","locator":"根据研究设计核对材料、测量和分析信息是否充分。"},{"id":"osf-preregistration","locator":"理解事前计划与后续偏离记录的区别。"}],"next":"方法决定可以报告哪些结果，下一篇会把计算输出组织成回答问题的证据。","core":true,"chapterId":"c19","stageId":"s6","chineseCount":2190},{"id":"a19-2","title":"结果部分怎样组织证据与图表","goal":"将分析输出整理成有顺序的结果段，报告效应、变异与失败情况，并做到正文图表互相对应。","scope":"重点适用于实证定量结果；定性发现应使用相应的材料解释结构而非硬套统计段落。","prerequisites":["a15-1","a15-2","a19-1"],"minutes":75,"tags":["写作","实证定量"],"terms":[{"zh":"主要结果","en":"primary outcome result","definition":"与预先确定主要问题直接对应的观察或估计，不能事后按最漂亮结果替换。"},{"zh":"效应估计","en":"effect estimate","definition":"比较方向和大小的数值表达，应带清楚单位或参照。"},{"zh":"不确定性","en":"uncertainty","definition":"估计精度与结论受限程度，可能来自抽样、测量、模型和材料范围。"}],"sections":[{"id":"concepts","title":"结果段要让读者看见发生了什么","paragraphs":["结果部分以研究问题为顺序，而不是以软件窗口为顺序。通常先交代进入分析的单位与数据情况，再报告主要比较，之后呈现预先规定的次要分析和必要检查。读者应能找到样本、指标、差异大小与不确定性；只写“存在显著差异”无法说明差异对研究问题的意义。","正文、图和表承担不同任务。图有助于看分布、配对关系、趋势或异常；表适合精确查值；正文指出读者要注意的模式和关键数字。三者不必逐字重复。所有缩写、单位、方向和分析范围应保持一致，图例和图注要让人不依靠作者口头解释也能读懂。"]},{"id":"reasoning","title":"先理解报告逻辑","paragraphs":["均值会压缩差异，不能替代对对象层面的观察。统一教学例中B平均误差较小，但并非每个对象都改善。报告方向计数和配对图能防止读者把平均结论误读成普遍保证。相反，展示几个成功对象而不交代整体，会产生选择性呈现。","结果与讨论之间不必机械禁止任何解释词，但必须分清观察和推断。“B−A均值为负”是估计结果，“B通过某机制改善可靠性”需要额外机制证据。期刊若合并结果与讨论，也应在段落内让读者识别两种角色，避免把猜测写成测得事实。"]},{"id":"workflow","title":"逐步写出这一部分","paragraphs":["准备锁定的分析输出、数据质量摘要和主要图表草稿。先确认数字一致，再写句子。统一案例以下数字全部来自同一计算。"],"steps":[{"title":"交代分析对象","body":"写二十个对象形成二十个配对差。说明缺失、失败或排除情况；没有排除也可以说明，不能把完整数据假定为真实采样无偏。"},{"title":"先报主要方向与大小","body":"写A平均绝对误差3.75g，B为3.00g，B−A均值−0.750g。均值差是对象内差值的摘要，明确负号意义。"},{"title":"给出不确定性","body":"报告配对t模型下95%区间[−1.060,−0.440]g，必要时加t(19)=−5.066与双侧p≈0.0000687；不要写p=0。"},{"title":"展示分布和例外","body":"用配对图或差值点图展示个体，文字说明十六个改善、一个相同、三个变差。不能为让图更好看删去变差对象。"},{"title":"核对结果与计划","body":"把每项主要问题勾到对应段落，探索分析明确标注，未完成分析说明原因。正文数值与表格精度统一后再排版。"}]},{"id":"worked","title":"完整段落与逐句批注","paragraphs":["下面六句组成完整结果段，顺序是样本范围、主要摘要、不确定性、对象方向、限制及材料身份。阅读者不必先猜作者想证明什么，就能看到证据全貌。","主要图可以选差值点图：横轴对象编号，纵轴B−A绝对误差差，零线表示两流程相同。图注注明n=20对象、单位g、负值方向和教学模拟。图与文字互补，使均值之外的变差对象仍然可见。"],"annotations":[{"text":"二十个教学模拟对象均纳入配对分析。","role":"分析范围","note":"依据：原始表格及完整对象计数。说明分母、单位和模拟身份，没有隐藏剔除或重复计算读数。"},{"text":"流程A与B的平均绝对误差分别为3.75g和3.00g；对象内B减A的平均差为−0.750g。","role":"主要估计","note":"依据：分析汇总的两均值与配对差均值。先给大小与方向，数值只描述这组构造数据。"},{"text":"配对t模型下95%置信区间为[−1.060,−0.440]g，t(19)=−5.066，双侧p约为0.0000687。","role":"模型计算的不确定性","note":"依据：分析脚本的标准误、自由度十九及双侧计算。“模型下”限定条件，不把小p值解释为假设为真的概率。"},{"text":"对象层面上，B误差在十六个对象中较小、一个相同、三个较大。","role":"对象差异和反例","note":"依据：全部二十个差值的符号计数。保留不利对象，不把平均优势改写为普遍改善。"},{"text":"所以，均值方向并不表示所有对象都改善。","role":"结果内部的限定","note":"依据：上一句三个较大和一个相同对象。只作由计数直接支持的解释，未引入未测量的机制。"},{"text":"本段数值来自构造数据，只演示结果表达。","role":"材料身份重申","note":"依据：教学数据来源声明。使结果段独立阅读时仍能识别训练性质，不能据此评价真实设备性能。"}]},{"id":"repair","title":"识别并修订错误","paragraphs":["容易踩的坑：“B提升精度百分之二十，证明所有场景有效。”从3.75到3.00的相对变化可以按明确分母计算为20%，但“精度”未定义，且相对数隐藏绝对单位，后半句更超出数据。修订为报告绝对误差平均减少0.750g，并说明这是构造对象内的比较；若报告相对变化，交代分母为A均值且不替代主要配对估计。","另一错误是把统计量写成t(20)，因为有二十个对象。单样本差值t模型的自由度为n−1，即19。数字格式、自由度、区间端点与符号应一起对照输出检查，不能凭印象抄写。"]},{"id":"tips","title":"经验与适用边界","paragraphs":["先写最重要的一张图，再问它是否足以支持主要结果段。若必须靠正文额外解释未展示的删选，图的设计可能不透明。配对数据优先保留配对关系；柱状图只显示均值时，应考虑补充原始点或分布信息。","实际重要性需要事前或领域依据，不能单靠p值大小判断。若0.750g在某场景有意义，在另一场景可能超过容许误差或毫无价值。结果段可报告预定阈值对照，但教学例没有真实应用阈值，不应临时编一个有利标准。"]}],"exercise":{"materials":"统一分析结果：均值差−0.750g、区间[−1.060,−0.440]g、16较小1相同3较大。","task":"写两句主要结果和一条图注，禁止使用普遍有效或p=0。","template":"分析对象：\n主要差异及区间：\n对象差异：\n图注：","answer":"示范：在二十个构造对象中，B−A绝对误差的均值为−0.750g，配对t模型下95%区间为[−1.060,−0.440]g。B在十六个对象上误差较小，但三个较大。图注：二十对象的配对误差差，单位g；负值表示B误差较小，零线表示相同，全部为教学构造数据。","rubric":["数值和方向与统一输出一致","报告效应和不确定性","保留不支持预期的对象","图注说明对象数、单位与数据性质"]},"quiz":{"question":"B平均误差较小，但三个对象误差较大，结果应怎样呈现？","options":["删掉三个对象保持结论清楚","报告总体摘要并展示这三个例外","只写显著差异不写分布"],"correct":1,"explanation":"平均比较不能代表所有对象；例外是理解分布和范围的一部分，不应被选择性排除。"},"references":[{"id":"nist-statistics","locator":"查阅配对比较、图形探索和结果解释的相关内容。"},{"id":"asa-p","locator":"理解p值不能替代效果大小与科学推理。"}],"next":"下一篇在这些结果之上讨论意义、机制假设和与已有研究的关系。","core":true,"chapterId":"c19","stageId":"s6","chineseCount":1909},{"id":"a19-3","title":"讨论部分怎样解释结果并回应文献","goal":"围绕主要发现展开解释、文献比较和竞争解释，区分已观察结果与尚需检验的机制。","scope":"适用于实证讨论段，也可迁移到定性发现的综合讨论；人文和理论论文按其论证功能调整。","prerequisites":["a18-4","a19-2"],"minutes":75,"tags":["写作","实证定量"],"terms":[{"zh":"解释","en":"interpretation","definition":"说明观察对研究问题意味着什么，依赖理论、背景和假设，必须与直接结果区分。"},{"zh":"机制","en":"mechanism","definition":"产生某种现象的过程或关系，通常需要能区分替代解释的证据。"},{"zh":"外推","en":"generalization","definition":"把当前材料中的认识延伸到其他对象、条件或理论范围，需要说明依据和限制。"}],"sections":[{"id":"concepts","title":"讨论不是把结果换一种说法再写一遍","paragraphs":["讨论常从主要发现的简短回答开始，然后解释其含义，与最相关研究比较，审视竞争解释和局限，最后提出受证据约束的意义。它不必按所有结果逐行复述，也不应成为堆放新分析的杂物间。读者要理解作者为何采用某种解释，以及还有哪些解释不能排除。","“数据中出现差异”和“某机制导致差异”是不同层次。若实验只比较流程整体，不能仅凭差异推断新增模块是唯一原因；若采用观察材料，还可能存在选择、背景变量或测量差异。讨论应说明解释依据，必要时称为假说，并提出能够区分它们的后续设计。"]},{"id":"reasoning","title":"先理解报告逻辑","paragraphs":["与文献对话不是机械写“与某研究一致”。需要检查对象、指标、条件和分析是否可比。两个研究方向相同，但一个测平均误差、一个测重复性，其意义未必相同；方向不同也可能来自人群、材料或操作条件差异，不应立即认定谁错。","局限应影响具体主张，而非列一串礼貌性缺点。“样本小”只有在说明它导致何种估计不精确或范围受限时才有价值。对教学构造数据，最关键局限不是样本只有二十，而是根本没有真实抽样和实验过程。因此即使增加到两万个构造对象，也不能据此证明现实流程有效。"]},{"id":"workflow","title":"逐步写出这一部分","paragraphs":["把结果段、文献矩阵和研究限制列在同一页。先写能确定的答案，再写解释层次，避免从希望得到的应用价值倒推。"],"steps":[{"title":"给主要发现一句话回答","body":"在限定对象与条件下回答研究问题。统一案例只能说构造数据中B绝对误差均值较小，不能把教学计算说成实际性能试验。"},{"title":"解释研究含义","body":"说明配对表示揭示了什么，例如平均改善与个体变差可以同时存在；这一点来自实际数据模式，而不是未测机制。"},{"title":"对照真正相关来源","body":"选择最接近研究，分别写一致点、差异点和可比性条件。没有真实来源时不制造“与前人一致”句子。"},{"title":"列竞争解释及所需证据","body":"对真实研究考虑顺序、学习、漂移、批次或参考值误差；写哪项设计能够区分这些解释，哪些目前无法排除。"},{"title":"形成有限建议","body":"把建议限定到证据能够支持的层面，例如后续真实验证应保留对象配对并检查变差对象；不跳到全面部署。"}]},{"id":"worked","title":"完整段落与逐句批注","paragraphs":["下面五句是完整教学讨论段：先概括发现，再解释其呈现含义，接着限定真实推断、提出需要的设计，最后定位教学价值。","这段没有重复全部统计数值，也没有虚构文献支持。真实投稿中还应补充已核实的同领域研究比较；未完成查新时，不能用“优于已有研究”占据这个位置。后续方向来自当前限制，而非随意追加更多技术。"],"annotations":[{"text":"这组构造数据中，流程B的平均绝对误差低于A，但三个对象出现相反方向。","role":"主要发现与异质性","note":"依据：均值差−0.750g和方向计数。开头限定“构造数据”，同时保留反例，不概括为所有对象有效。"},{"text":"这说明平均差和对象层面的异质性应同时报告；一个总体摘要不能替代对失败情形的检查。","role":"由证据导出的方法含义","note":"依据：平均方向与三个相反对象同时存在。说明本例为何需要两种呈现，不凭此决定所有学科的唯一报告格式。"},{"text":"由于读数由教学构造产生，本例不支持关于真实设备、操作者或作用机制的结论。","role":"证据来源限制","note":"依据：原始材料性质，无真实执行和采样。明确不能回答的对象和因果机制，边界不因统计数值改变。"},{"text":"若在真实测量中观察到类似差异，需要进一步控制流程顺序、校准与批次，检查改善是否超过参考测量的不确定性。","role":"有条件的后续研究","note":"依据：当前示例缺少这些实际执行条件。“若”说明假设场景，提出可检验设计需求，未声称已经排除混杂。"},{"text":"当前最直接的教学价值是示范如何让结果、解释与边界相互一致。","role":"贡献归类","note":"依据：本报告已展示的计算、结果和限定。贡献限定为教学产出，不升级成真实技术突破。"}]},{"id":"repair","title":"识别并修订错误","paragraphs":["错误讨论：“p值很小，所以B的原理正确，适用于任何实验室。”p值描述指定模型下的数据相容性，不是原理正确的概率；任何实验室则需要广泛外部验证。修订为“在本构造数据及计算模型下，差值估计为负；其现实机制和外部适用性不由该教学例回答”。","错误局限：“本研究存在一些不足，未来将不断完善。”没有说明哪项判断受影响。具体修订为“由于没有真实执行流程，无法判断顺序效应、设备漂移和校准误差；后续真实试验需记录并控制这些因素”。"]},{"id":"tips","title":"经验与适用边界","paragraphs":["给讨论句子加内部标签：结果复述、解释、文献比较、机制假说、限制、建议。最后去掉标签，但检查每个强动词的证据。尤其是“证明”“表明机制”“普遍适用”，往往需要比当前数据更多的信息。","不要认为讨论越积极越有说服力。承认一个不能排除的解释，并设计下一步检验，通常比把它藏起来更能体现研究判断。也不要无限自我否定；局限后说明本研究仍能支持的结论，读者才能准确理解贡献大小。"]}],"exercise":{"materials":"统一案例中16改善、1相同、3变差和教学构造的材料性质。","task":"写一段讨论，包含一个可支持的意义、一个不能支持的机制判断和一个具体后续设计。","template":"主要发现：\n能够说明：\n尚不能说明：\n竞争解释：\n下一步区分方法：","answer":"示范：平均误差较小与部分对象变差同时出现，提示报告应保留对象层面差异。该构造数据不能说明真实流程为何改善。真实验证可随机或平衡流程执行顺序、记录校准与批次，并比较差异是否仍存在，从而减少顺序和漂移解释。","rubric":["讨论建立在已报告结果上","机制假说与直接观察分开","局限具体影响结论","后续研究能回应某项不确定性"]},"quiz":{"question":"比较了两个完整流程后看到差异，能否直接证明其中某一个组件的机制？","options":["能，只要差异显著","不能，需要额外设计区分组件与其他变化","能，只要讨论写得合理"],"correct":1,"explanation":"整体比较不能自动隔离某组件作用；消融、受控干预或其他机制证据仍需匹配问题。"},"references":[{"id":"asa-p","locator":"阅读统计推断需要结合设计、背景与科学推理的说明。"},{"id":"harvard-counterargument","locator":"Counterargument：How to address counterarguments，说明如何公允呈现异议、承认合理部分并修订论证；这里把这个建议迁移到相应研究表达任务。"}],"next":"讨论建立解释边界后，下一篇会结论、局限和未来工作写成相互衔接的收束。","core":true,"chapterId":"c19","stageId":"s6","chineseCount":2043},{"id":"a19-4","title":"结论、局限与未来工作怎样守住边界","goal":"写出能够回答问题的结论，把具体局限连接到后续研究，而不在最后一段扩大贡献。","scope":"适用于研究报告、论文和研究计划中的结果预期；未开展研究时不能使用已发现的语气。","prerequisites":["a19-3"],"minutes":75,"tags":["写作","实证定量"],"terms":[{"zh":"结论","en":"conclusion","definition":"对研究问题给出的凝练回答，依据前文已建立的证据和推理。"},{"zh":"局限","en":"limitation","definition":"影响某项解释、精度或适用范围的研究条件，而非泛泛的谦虚声明。"},{"zh":"未来工作","en":"future work","definition":"针对尚未解决问题的具体后续行动，应说明它将减少哪一种不确定性。"}],"sections":[{"id":"concepts","title":"结尾要精确收束已经建立的知识","paragraphs":["结论不是重新写一次引言，也不是许愿清单。它应告诉读者这篇文章回答了什么、增加了什么认识、哪些范围仍不成立。许多论文不单设结论标题，而在讨论末段完成这一功能；结构可以变化，收束职责不能缺席。","局限可以来自取样、测量、设计、材料、模型或解释视角。它们的严重程度不同：某些只影响精度，某些使因果推断不成立，某些使结论只能适用于一类对象。只有写清“这项局限影响哪句话”，读者才能判断该如何使用成果。未来工作应对应这些影响，而非把所有流行技术列为下一步。"]},{"id":"reasoning","title":"先理解报告逻辑","paragraphs":["结尾往往最容易过度推广，因为作者希望最后一句有力量。但“该方法值得进一步验证”和“该方法已经可以替代现有流程”之间存在实质差异。前者可能由可行性证据支持，后者涉及性能、风险、适用范围和实际部署。不能用修辞跨越尚未完成的验证。","局限也不意味着研究毫无价值。一个边界清楚的小研究，可以可靠回答有限问题；一个没有边界的大结论反而不可信。好的结尾既不夸大，也不把已建立的证据全部否定。对于复现、负结果或理论边界研究，澄清哪些判断不能成立本身可能是重要贡献。"]},{"id":"workflow","title":"逐步写出这一部分","paragraphs":["打开研究问题、主要结果、贡献对照表和限制清单。只允许结论引用已经在正文建立的内容；新的分析先回到结果部分补齐。"],"steps":[{"title":"写一句直接答案","body":"用对象、条件和主要发现回答原问题。统一教学例可写构造对象中B的平均绝对误差较小，同时不是所有对象改善。"},{"title":"写一句贡献性质","body":"说明增加的是方法知识、经验发现、解释、复现还是教学训练。不要把完整流程练习自动称为创新算法。"},{"title":"选择最影响解释的局限","body":"将每项局限后接“因此不能判断什么”。优先写决定性限制，再写次要限制，不以一长串通用词淹没关键问题。"},{"title":"把未来工作变成可验证行动","body":"对每项重要局限给下一步数据或设计。例如真实对象采样、平衡执行顺序、独立参考校准；说明这些行动解决哪个问题。"},{"title":"检查最后一句强度","body":"把结尾与标题、摘要对照，确保没有新增对象、场景或效果承诺。若写普遍适用，必须问证据在哪一段。"}]},{"id":"worked","title":"完整段落与逐句批注","paragraphs":["以下四句构成完整教学结尾，分别承担答案、贡献、边界与下一步。每句的依据都能在方法、结果或材料说明找到，没有到结尾才新增实验。","结尾不必重复全部检验输出；最重要的是研究问题得到了什么尺度的回答，以及结论在何处停止。后续计划先处理测量与设计条件，再考虑扩大样本，避免把样本数当成一切问题的解决办法。"],"annotations":[{"text":"在二十个构造对象中，B相对A的平均绝对误差差为−0.750g，同时存在三个B误差更大的对象。","role":"有边界的回答","note":"依据：结果汇总的均值差与方向计数。“构造对象”限制适用范围，反例限制“全部改善”的主张。"},{"text":"本报告的产出是一个从原始表格到配对分析、图表和文字的可复核教学流程。","role":"产出与贡献","note":"依据：材料包、分析入口和报告成稿。说出实际完成的训练链条，不主张新测量方法或现实性能成果。"},{"text":"由于没有真实采样和执行过程，这些结果不能评价现实流程的有效性、因果优势或应用安全性。","role":"局限及其后果","note":"依据：数据来源声明。明确限制影响哪些结论，比仅说样本小更准确；显著性不能修补缺失的真实证据。"},{"text":"后续若开展真实研究，应先确认测量容差和参考值不确定性，再设计对象采样、流程顺序控制及独立复核，以检验观察差异能否在目标场景重现。","role":"后续优先次序","note":"依据：当前缺少真实测量条件与外部验证。“若”表示拟开展工作，目标是检验而非保证重现，具体设计仍依实际问题。"}]},{"id":"repair","title":"识别并修订错误","paragraphs":["错误结论：“实验完美证明B全面优于A，未来将结合AI实现产业化。”数据不是真实实验，三个对象反向，也没有产业化证据。修订时保留有限的均值结果，诚实写教学性质，并将未来工作改成真实场景中的采样、校准和顺序控制。","另一错误是“由于样本小，本研究所有结果均无意义”。应具体说明小样本可能使估计不精确或覆盖不足，而不是否定所有观察。统一案例的根本限制是构造数据，这与样本量大小不同；准确诊断局限才能提出有效下一步。"]},{"id":"tips","title":"经验与适用边界","paragraphs":["可以使用“已经回答—仍未回答—下一次怎样回答”的三问法检查结尾。这是写作工具，不是固定三句模板。研究内容复杂时允许多段，但每段应承担不同功能，避免重复摘要和讨论的全部细节。","未来工作要有优先级。为解决一个主结论的关键不确定性而做小规模验证，通常比同时提出十个扩展方向更可信。申请研究计划尤其应说明第一步怎样降低风险，让评审看见你的判断能力，而不只是愿景规模。"]}],"exercise":{"materials":"这篇课教学结尾及统一案例事实。","task":"将“未来增加更多样本并用更先进方法”改写成两项有理由的具体任务。","template":"当前局限一：\n影响的判断：\n具体行动：\n当前局限二：\n影响的判断：\n具体行动：","answer":"示范：第一，构造数据没有现实抽样，无法判断现场效果；应在确认权限和测量可靠后采集目标对象的真实配对读数。第二，真实比较可能受流程顺序与漂移影响；应平衡或随机安排顺序并记录校准与时间，再检查差异是否稳健。","rubric":["结论直接回答原问题","贡献性质准确","局限说明具体推断后果","未来工作与局限一一连接"]},"quiz":{"question":"哪项未来工作最有信息？","options":["使用更先进技术全面提升效果","为区分顺序效应与流程差异，设计平衡顺序的真实配对试验","尽可能多做实验直到结果更好"],"correct":1,"explanation":"具体设计说明要减少哪种不确定性；空泛先进或以结果为目标的追加试验不构成清楚研究计划。"},"references":[{"id":"harvard-conclusions","locator":"Conclusions：Begin with the what、Highlight the so what、Leave your readers with the now what，以及What to avoid；具体结论仍服从学科与证据范围。"},{"id":"asa-p","locator":"理解统计结果不能单独支撑实践价值和结论强度。"}],"next":"完成主体后，下一章把段落、引文、图表和语言逐项修到一致。","core":true,"chapterId":"c19","stageId":"s6","chineseCount":1973},{"id":"a20-1","title":"段落结构、主题句与论证衔接","goal":"你会识别一段话的论证任务，安排主张、证据、解释和限定，并修复段落之间的逻辑断裂。","scope":"适用于论文、研究计划和研究经历叙述；不同学科允许不同段落顺序，但需要清楚的推理联系。","prerequisites":["a02-2","a19-3"],"minutes":65,"tags":["写作","通用"],"terms":[{"zh":"主题句","en":"topic sentence","definition":"提示本段主要判断或任务的句子，位置可变，但功能需清楚。"},{"zh":"衔接","en":"cohesion","definition":"用词、指代和句子组织帮助读者跟踪信息，不能代替内容上的逻辑联系。"},{"zh":"连贯","en":"coherence","definition":"各句和各段围绕明确问题形成可理解的推理关系。"}],"sections":[{"id":"concepts","title":"一段话承担一个清楚的论证任务","paragraphs":["一个学术段落通常不只是同一主题的句子集合，还需要完成一项论证任务。例如解释为什么采用配对设计、说明一个结果的意义，或回应一个竞争解释。主张告诉读者本段要建立什么，证据提供依据，解释连接证据与主张，限定说明关系能走多远。它们可以按不同顺序出现，不必机械套四句格式。","“此外”“因此”“然而”只提示关系，不会自动创造关系。前一句讲测量误差，后一句讲申请院校排名，即使加上“因此”也不构成推理。指代同样需要清楚：在同时出现A、B、误差和差值后写“它更小”，读者可能不知道指什么。精确重复关键术语，往往比为了避免重复而频繁换同义词更清晰。"]},{"id":"reasoning","title":"为什么这样修改","paragraphs":["初学者常按想到什么写什么，导致一段里同时介绍方法、评价结果和提出未来计划。读者必须自己拆分任务。修改时先问“读完本段应接受哪一个判断”，再删去或移走不服务它的句子。段落统一并不是禁止复杂思想，而是让复杂思想有可追踪的顺序。","证据不会自己说话。引出一个数字或引语后，还需解释它与当前判断的关系。但解释也不能超过证据：三个反向对象支持“并非人人改善”，不支持“某类对象必然失败”，除非已有足够分类与验证。段落质量取决于推理强度是否匹配证据，而不是语气是否坚定。"]},{"id":"workflow","title":"逐步修改工作流","paragraphs":["准备自己的一段两百字左右草稿；若暂时没有，使用这篇课原稿。第一轮只改逻辑，第二轮才改语言。"],"steps":[{"title":"给每句标角色","body":"标为主张、证据、解释、限定或过渡；无法归类的句子检查是否离题。不要把所有句子都标成背景来逃避判断。"},{"title":"写一句段落任务","body":"用“本段说明……”概括。若需要用三个并列目标才能概括，考虑拆段；若只是复述主题，补一个具体判断。"},{"title":"检查证据连接","body":"对每项主张问依据在哪里，对每项数据问支持什么。补上必要解释，删除没有依据的效果、机制或普遍性词语。"},{"title":"调整信息顺序","body":"让已知信息帮助引入新信息。先定义B−A，再解释负值；先介绍材料身份，再引用教学数值；不要让读者先猜后懂。"},{"title":"处理段间关系","body":"写下相邻段各自的任务，选择确实存在的递进、转折或因果关系。关系不存在时调整内容而不是只换连接词。"}]},{"id":"worked","title":"完整修订示范","paragraphs":["原稿：“B更好。p值很小。我们用了配对方法。三个对象变差。将来可以推广到实验室。”修订段：“配对分析显示，在构造的二十个对象中，B的平均绝对误差比A小0.750g。不过，三个对象呈现相反方向，说明总体均值不能代表每个对象都改善。所以，结果呈现应同时保留平均差与对象级分布。由于这些读数是教学构造，现实实验室中的性能仍需真实数据验证。”","修订先明确对象、指标和主要发现，再用反向对象限定平均解释，随后提出由此支持的报告建议，最后守住材料边界。软件细节移回方法，p值在需要报告的结果段准确呈现，不在这里充当“更好”的全部理由。"],"annotations":[{"text":"三个对象呈现相反方向，说明总体均值不能代表每个对象都改善。","role":"证据与解释连接","note":"由对象计数得出有限结论，没有推断未知失效机制。"},{"text":"结果呈现应同时保留平均差与对象级分布。","role":"由证据推出的建议","note":"建议针对报告方式，强度与当前例子相称。"},{"text":"现实实验室中的性能仍需真实数据验证。","role":"范围限定","note":"防止把教学数据的逻辑示范扩展成应用效果。"}]},{"id":"repair","title":"错误与修正","paragraphs":["错误衔接：“样本量有限，因此B一定无效。”样本量限制可能降低精度或检出能力，并不直接证明无效。修订为“当前估计不够精确，无法排除某些有实际意义的差异”，前提是区间确实支持这种表述。连接词必须符合实际逻辑。","错误段落还包括连续引用三位作者后不说明它们之间的关系。可改为先给共同问题，再比较对象、设计或解释差异，最后说明当前研究选择。资料堆叠要经过综合才能成为论证。"]},{"id":"tips","title":"写作技巧和边界","paragraphs":["读每段第一句，看看能否形成一条清楚的全文路线；再读每段最后一句，检查是否出现没铺垫的新主张。这是快速诊断方法，不意味着主题句必须永远放第一句。叙事式或人文论文可以有更灵活的组织，但仍需要让读者知道段落为何在这里。","朗读可以发现指代不清和句子过长。一个句子包含多层转折、方法和结果时，先拆成两三句再重组。不要把所有复杂性都删掉；目标是保留必要逻辑并让每一步明确。"]}],"exercise":{"materials":"原句：“A和B不同，因为有三个对象没有改善，所以B可以应用。”","task":"将原句改成一段合理解释，并说明删去了哪项未经支持的推断。","template":"本段任务：\n直接证据：\n能够推出：\n不能推出：\n修改后的段落：","answer":"示范：二十个构造对象中，B平均绝对误差较小，但三个对象较大。这说明平均差异与个体差异需要同时呈现；它不能证明B适用于现实场景。删去“可以应用”，因为没有真实应用验证。","rubric":["段落有一个清楚任务","每个判断有对应依据","连接词表达真实关系","没有把教学结果外推为应用成效"]},"quiz":{"question":"发现两句之间没有逻辑关系时，最有效的修改是什么？","options":["增加因此或此外","调整内容与顺序，必要时拆段","把句子写得更长"],"correct":1,"explanation":"连接词只能标示已有关系，不能修复内容层面的断裂。"},"references":[{"id":"harvard-paragraph","locator":"Anatomy of a Body Paragraph：Topic sentence、Evidence、Analysis三项与示范段落；这里把它用于组织主张与材料，不将其当作细读或史料研究的完整方法。"}],"next":"段落明确之后，下一篇检查外部材料如何被准确转述和引用。","core":true,"chapterId":"c20","stageId":"s6","chineseCount":1777},{"id":"a20-2","title":"转述、综合、引文与参考文献核验","goal":"准确转述与综合来源，核查引文是否支持句子，建立正文引用与参考文献的双向对应。","scope":"适用于所有学科；引用格式、直接引文长度、页码及工具使用要求按机构和渠道核对。","prerequisites":["a06-1","a18-4"],"minutes":65,"tags":["写作","通用"],"terms":[{"zh":"转述","en":"paraphrase","definition":"理解来源后用自己的结构表达其意思，同时保留原意、范围与出处。"},{"zh":"直接引语","en":"quotation","definition":"准确保留来源原文的表达，按规范标明引号、出处及可定位位置。"},{"zh":"综合引用","en":"synthesis citation","definition":"将多个来源围绕同一问题整合，同时准确说明哪些来源支持哪些判断。"}],"sections":[{"id":"concepts","title":"引用要保存原意，也要让读者找到依据","paragraphs":["转述并非替换几个近义词。真正转述需要先理解来源在说什么、用了什么对象和证据，再用自己的句法表达。即使没有照抄原句，思想和事实来自他人也通常需要引用。直接引语适合原措辞本身具有分析价值或不能无损改写时；为了显得有根据而大段贴原文，会挤走自己的分析。","引用的基本单位是被支持的判断。一个长段落末尾放一条来源，不一定能让读者知道它支持哪几句。对具体数值、方法、争议观点和关键事实，应让引用位置清晰。二手来源概括原研究时，最好回到原文核实；无法获得原文，则准确说明自己依据的阅读范围，而不装作亲读。","综合多篇来源时，先明确你自己的比较判断，再给各来源在此判断中的位置。例如两研究方向不同，先检查对象、指标和条件是否可比；不能把两个摘要拼在一起就称为综合。"]},{"id":"reasoning","title":"为什么这样修改","paragraphs":["来源真实并不代表引用正确。一篇论文确实存在，但可能没有支持你写的结论，可能对象不同、结论更弱，或已经有更正。文献管理软件擅长格式化，不负责判断句子是否歪曲原意。AI生成的参考文献同样需要逐项核对作者、题名、渠道、年份、标识和实际内容。","引用还涉及证据层级。研究结果、作者解释、评论者解读和新闻报道不是同一层。写“实验发现”时应找到实际实验；如果依据综述，只能准确表达综述如何概括证据。将作者的猜测写成实验已证实的机制，会在无意中提高结论强度。"]},{"id":"workflow","title":"逐步修改工作流","paragraphs":["准备一段来源原文、其书目信息与自己拟写的句子。使用这篇课原创英文教学句先练原意保持，再应用到真实来源。"],"steps":[{"title":"先记录来源身份","body":"核对题名、作者、版本、年份、链接或DOI，并查看更正状态。记录自己读到的是全文、摘要还是二手转述。"},{"title":"提取原意和范围","body":"用短语记对象、做法、结果和限制。把推测性动词和否定句单独标出，因为它们最容易在转述中消失。"},{"title":"离开原句重写","body":"不盯着词序逐词换同义词，用自己的问题组织一句或一段。完成后回看原文，检查是否增加了不存在的结论。"},{"title":"放置引用与定位","body":"按目标格式标注来源；直接引语保留准确措辞并提供页段等定位。没有页码的网页可用章节或段落信息，不能编造页码。"},{"title":"进行双向核验","body":"正文每条引用都能在参考文献表找到，表中每项都确实使用；重点判断每条来源是否支持所在句，而不仅格式是否统一。"}]},{"id":"worked","title":"完整修订示范","paragraphs":["原创教学原句为：“The checklist reduced omissions in a simulated task; effects in field settings were not assessed.”准确转述：“在这项教学模拟任务中，清单与较少漏记相联系；材料没有评价真实现场中的效果。”如果研究设计确实是受控因果比较，可以按原证据采用更明确的效果动词；若只拿到这一孤立句，保守保留信息边界。错误转述则是“清单已经被证明可以提高所有现场工作的可靠性”，它把未研究的场景和普遍性加了进去。","综合示范使用两张明确虚构的教学卡：甲考察模拟任务，乙报告现场使用困难。可写“教学卡甲关注受控模拟中的漏记，教学卡乙则提示现场条件可能增加执行难度。两者的对象与设计不同，不能简单判为互相推翻。”正式论文必须替换为真实来源，不能把教学卡甲乙放入参考文献表。"],"annotations":[{"text":"材料没有评价真实现场中的效果。","role":"保留原文限制","note":"否定信息也是来源的一部分，转述时不能删除。"},{"text":"两者的对象与设计不同，不能简单判为互相推翻。","role":"综合判断","note":"比较依据是设计差异，不是偏好某一结论。"}]},{"id":"repair","title":"错误与修正","paragraphs":["错误操作是将原文句子译成中文，删掉引号与引用，认为语言变了就成为自己的思想。翻译仍然承接来源，需按实际使用方式引用；逐句近似翻译可能需要直接引语或明确翻译说明。引用格式不能掩盖未经允许复制大量内容的问题。","另一个错误是为没有看过的来源填写精确页码。应重新找到原文位置；如果无法核实，则降低表述或引用确实读过的材料。宁可诚实写明阅读限制，也不要用看似完整的书目制造核实假象。"]},{"id":"tips","title":"写作技巧和边界","paragraphs":["建立“句子—来源—位置—支持程度”四列表，优先检查摘要、引言核心缺口和讨论中最强的几项判断。不是每句都需要外部引用，但来自本研究数据的句子也应能追到结果，属于作者解释的句子应有清楚依据。","参考文献整理不要拖到最后。阅读时保存版本和定位，写作时插入引用，提交前再统一格式。格式修正可以交给工具，内容核查必须由理解材料的人完成；发现来源不支持原句时，应改句子而不是换一条看起来更权威的引用。"]}],"exercise":{"materials":"这篇课英文教学句，以及错误转述“清单已经证明在任何现场都有效”。","task":"写一条准确转述，列出原句没有支持的两项主张。","template":"原意：\n范围：\n准确转述：\n未支持主张一：\n未支持主张二：\n正式引用前要核实：","answer":"示范：教学模拟任务中使用清单后漏记减少，但现场效果没有被评价。原句不支持“任何现场都有效”，也不支持“长期可靠性已经确定”。正式引用前需找到真实来源、设计和定位；本句是原创教学材料，不可伪装为发表研究。","rubric":["保留对象与限制","没有靠替词复制结构","引用身份与阅读范围真实","正文与书目能够双向核查"]},"quiz":{"question":"文献管理软件生成了格式正确的引用，接下来仍需做什么？","options":["无需检查，格式正确就可靠","核实来源存在且实际支持所写判断","只检查作者是否知名"],"correct":1,"explanation":"格式工具不判断原意、版本和证据支持；这些是作者的核查责任。"},"references":[{"id":"paraphrasing","locator":"阅读转述步骤和可接受示例，注意原意与引用。"},{"id":"zotero","locator":"查阅收集、修正元数据和插入引用的操作。"}],"next":"来源准确后，下一篇检查图表、补充材料和声明是否与正文构成完整证据包。第六章第四篇提供额外综合论述练习，可按需回看。","core":true,"chapterId":"c20","stageId":"s6","chineseCount":1890},{"id":"a20-3","title":"图表、图注、附录、补充材料及声明","goal":"制作能独立理解的图表与图注，把补充材料和声明组织成可追溯、符合实际情况的研究说明。","scope":"适用于各类研究报告；图形、文件格式、数据共享与声明细则以所属机构及渠道要求为准。","prerequisites":["a19-2","a20-2"],"minutes":65,"tags":["写作","通用"],"terms":[{"zh":"图注","en":"figure caption","definition":"解释图中对象、变量、单位、编码、分析和必要条件的文字，使读者能独立阅读图。"},{"zh":"补充材料","en":"supplementary material","definition":"支持正文但因篇幅或技术细节另行提供的内容，需要正文引用与稳定标识。"},{"zh":"数据可用性声明","en":"data availability statement","definition":"说明研究材料能否获得、在哪里获得及访问限制，不等同承诺所有数据都公开。"}],"sections":[{"id":"concepts","title":"图表和附件也是论证正文的一部分","paragraphs":["图表应有一个明确任务：展示分布、配对变化、关系、流程或精确数值。选图由问题决定，不能为了看起来专业而加入不必要的三维效果。坐标轴、单位、图例、对象数和误差条含义必须清楚。标准差、标准误和置信区间表达不同信息，不能统称误差条后让读者猜。","表格适合查数与比较，正文应指出读者应关注的模式而非重述每一格。附录和补充材料可放完整检索式、参数、问卷、推导、材料片段或代码说明。关键是能从正文结论找到对应附件，也能从附件知道服务于哪一项结果。只有一堆命名模糊的文件，不算可追溯交付。"]},{"id":"reasoning","title":"为什么这样修改","paragraphs":["图形可以用轴范围、选择性展示和视觉面积夸大差异。柱状图表示量值时，截断基线常使比较失真；某些散点或线图可以采用非零轴以显示细节，但必须清楚标注并避免误导。研究者应解释视觉选择是否适合问题，而不是机械套一种规则给所有图。","声明负责让读者了解利益、材料、贡献和审批等可能影响判断的信息。没有涉及真实参与者的教学构造数据，不应填写虚构伦理批准编号；尚未公开的材料不能写全部可用；使用AI的披露要根据实际用途和当前机构、期刊政策处理。格式齐全而事实虚假，比缺一个标题更严重。"]},{"id":"workflow","title":"逐步修改工作流","paragraphs":["选统一案例的对象差值点图作为主图，并建立“正文图号—源数据—脚本—输出文件”索引。随后整理附件和声明。"],"steps":[{"title":"明确图的一个问题","body":"这张图回答是否每个对象都改善，因此用对象编号与B−A差值点图，保留零线和所有二十个对象，不只画均值。"},{"title":"补齐视觉语义","body":"横轴写对象编号，纵轴写绝对误差差/g，图例说明负值代表B较小。颜色之外使用位置或形状，保证灰度阅读也可理解。"},{"title":"写可独立阅读的图注","body":"交代n是对象数、数据为构造、比较方向和图中参考线意义；若有区间说明计算方法和水平。"},{"title":"组织附件与交叉引用","body":"为原表、数据字典、脚本和补充分析各取稳定名称，正文首次提到时给入口。检查缺失附件和旧版本图。"},{"title":"按事实完成声明","body":"分别核对数据可用性、代码、利益冲突、资金、作者贡献、伦理及AI使用；不适用与未完成不能混写成已批准。"}]},{"id":"worked","title":"完整修订示范","paragraphs":["完成图注：“图1．二十个教学构造对象的流程绝对误差差。每个点代表一个对象，纵轴为|B−参考值|−|A−参考值|，单位g；负值表示B的绝对误差较小。水平零线表示两流程相同。所有对象均显示，数据不来自真实实验。”完成材料声明：“原始构造表格、变量说明和分析脚本随本教学报告提供，用于复现计算过程；它们不包含真实参与者或实验记录。”","附件索引可以写：原表用于计算图1；变量字典解释每列；分析脚本从原表生成摘要与图；分析结果文件保存数值。若实际发表平台不同，应把这些名称与真实访问地址对应，不使用尚不存在的仓库链接。"],"annotations":[{"text":"每个点代表一个对象。","role":"图形单位","note":"防止将点数或读数数目误认为独立样本量。"},{"text":"所有对象均显示。","role":"展示范围","note":"与未删去三个反向对象的事实一致。"},{"text":"它们不包含真实参与者或实验记录。","role":"材料声明","note":"准确说明教学构造，不虚构伦理或数据来源。"}]},{"id":"repair","title":"错误与修正","paragraphs":["错误图注：“A和B的结果，误差线表示误差。”它没有变量、单位、n或误差线定义。修订应准确写出绘制的是均值及哪一种区间，或对象级差值；图形没有误差线时不应套通用图注。","错误声明：“数据应要求可得”，但作者没有取得分享权限，也没有实际联系人流程。修订为说明哪些材料可公开、哪些受限制、限制来源和允许的申请方式；如果暂未获得权限，就如实报告当前状态。不能用一句通用声明代替治理安排。"]},{"id":"tips","title":"写作技巧和边界","paragraphs":["将图从正文中单独取出，请同学解释轴、点、单位和主要比较。解释失败时优先改图注与标签。再把图缩到实际印刷或手机宽度，检查文字是否可读；不要依靠放大后才能看清的细小标记。","提交前做一次附件演练：从正文点击或按文件名找到材料，再重生成一项结果。图文件名与图号不一致、附件仍保留旧分析、声明与真实访问不符，都是常见且可以提前发现的问题。"]}],"exercise":{"materials":"二十对象差值点图、原始CSV、变量字典与脚本。","task":"写一条完整图注和一条诚实的数据可用性声明。","template":"图号与任务：\n单位与编码：\nn与参考线：\n材料性质：\n可获得材料与位置：\n限制：","answer":"示范：图1展示二十个构造对象的B−A绝对误差差，单位g，每点一对象，零线表示相同，负值表示B较小；全部对象均纳入。原始构造数据、字典和脚本随教学材料提供，仅用于学习复现，不代表真实实验数据。","rubric":["图注可独立理解","误差或区间含义准确","正文与附件可相互追溯","所有声明均符合真实材料状态"]},"quiz":{"question":"图中误差条是标准误，正文却写95%置信区间，应如何处理？","options":["两者都表示误差，可以不改","核对生成方法，统一图注与正文的实际定义","只删去图注中的说明"],"correct":1,"explanation":"标准误与置信区间不同，错误标签会改变读者对不确定性的理解。"},"references":[{"id":"fair","locator":"理解材料可复用需要标识、元数据和访问条件。"},{"id":"icmje","locator":"查阅图表、补充材料与利益及其他声明的相关要求。"},{"id":"credit","locator":"核对贡献角色的含义，不以角色分类自动决定署名资格。"}],"next":"下一篇会结构、句子和英语表达安排成有顺序的全文修订流程。","core":true,"chapterId":"c20","stageId":"s6","chineseCount":1749},{"id":"a20-4","title":"学术英语、删减、反向提纲与全文修改","goal":"按论证、结构、事实和语言的顺序修改全文，使用反向提纲与英语核查清单而不依赖盲目润色。","scope":"适用于中文与英文科研写作；语言修改不替代研究方法、结果与来源核查。","prerequisites":["a20-1","a20-2","a20-3"],"minutes":65,"tags":["写作","通用"],"terms":[{"zh":"反向提纲","en":"reverse outline","definition":"在已有草稿旁为每段写一句任务摘要，用来检查实际结构而非原先计划。"},{"zh":"论断强度","en":"claim strength","definition":"语句承诺的确定性、因果性和适用范围，应与证据相匹配。"},{"zh":"术语一致性","en":"terminological consistency","definition":"同一概念采用稳定表达，不为语言变化而引入未经定义的不同含义。"}],"sections":[{"id":"concepts","title":"先修论证，再修句子","paragraphs":["全文修改可以分四层：研究问题与证据是否匹配；段落和章节是否组成完整论证；数字、来源、术语和声明是否一致；句子是否清楚、简洁和符合语言习惯。顺序很重要。一个结论本来没有证据，再漂亮的英语也只会让错误更流畅。","反向提纲是从实际草稿出发的诊断。为每段写十几个字概括它做什么，再只读这些摘要。如果出现重复背景、跳跃推理或未兑现目标，就调整结构。与最初提纲不同，它反映你真正写出来的文章，能发现边写边偏离的部分。"]},{"id":"reasoning","title":"为什么这样修改","paragraphs":["学术英语并不等于复杂词和长句。清楚的主体、准确动词、稳定术语和明确限定通常更重要。主动与被动语态都有用途：需要说明谁作出决定时可用主动，关注过程或对象时可用被动；不必机械把全文改成某一种。时态也依句子功能和学科惯例变化，方法常描述已做工作，普遍定义与图表内容可用现在时。","语言工具可能把谨慎措辞改成强结论，或把技术术语换成看似优美但不等价的词。作者应保存修改前后版本，重点检查数字、否定、条件、因果动词与专有名词。上传未公开资料前需确认数据与工具使用权限；这项判断不由润色质量决定。"]},{"id":"workflow","title":"逐步修改工作流","paragraphs":["准备一份完整草稿和版本副本。安排四轮，每轮只处理一类问题，记录重大修改原因。"],"steps":[{"title":"写全文反向提纲","body":"为每段标任务与支持的研究问题，合并重复段，移动放错章节的内容。某个主要结果没有讨论时补上，某个目标未回答时调整承诺。"},{"title":"检查证据和结论","body":"把标题、摘要、主要图、讨论和结论放一起，核查单位、方向、对象和强度一致。先修事实错误，再处理措辞。"},{"title":"精简句子","body":"删除空泛开头与重复修饰，把一个句子的多个任务拆开。保留影响解释的限定，不把模拟、观察或不确定性删掉。"},{"title":"处理英文术语与语法","body":"建术语表，逐一核对absolute error、paired difference等含义。检查指代、冠词、单复数和时态，但不为追求复杂句牺牲清晰。"},{"title":"进行独立阅读与冻结","body":"请读者只根据成稿复述问题、方法与结论；记录误解并修改。最后统一引用与格式，保存提交版本，避免临时改一个数字而漏掉摘要。"}]},{"id":"worked","title":"完整修订示范","paragraphs":["原英文：“It is obvious that our amazing method dramatically improves all measurement tasks.”修订为：“In this constructed teaching dataset, the mean absolute error was 0.750 g lower for B than for A. This comparison illustrates paired analysis and does not establish real-world effectiveness.”第一句增加材料身份、指标、单位和比较方向，第二句说明用途与边界。","反向提纲示范：草稿三段原先分别为“测量很重要”“更多测量背景”“B结果很好”；修改后为“为何需要保留对象内对应关系”“怎样计算并呈现配对误差”“构造数据说明什么且不能说明什么”。结构从背景堆积转为问题—方法—解释，随后才值得细修英文。"],"annotations":[{"text":"In this constructed teaching dataset, the mean absolute error was 0.750 g lower for B than for A.","role":"精确结果句","note":"材料性质、指标、大小与参照都在句中；没有用dramatically代替数值。"},{"text":"This comparison illustrates paired analysis and does not establish real-world effectiveness.","role":"贡献与范围","note":"否定部分不能在润色时删去，否则会改变事实。"}]},{"id":"repair","title":"错误与修正","paragraphs":["错误做法是要求工具“让文章更有说服力”，然后接受所有修改，包括把may改成proves。应改为要求保持事实、条件和论断强度，并逐项检查。工具提出的新引用、数值或机制解释不得未经核实直接加入。","另一错误是只修语法而不检查引用和图表。一个摘要数字与结果表不一致，即使英语完全正确也会误导。修订清单应明确事实核对、结构核对和语言核对分别由谁完成，不能把所有问题归为润色。"]},{"id":"tips","title":"写作技巧和边界","paragraphs":["给每轮修改设一个清楚产出，例如“消除三个重复背景段”“核对所有B−A符号”“统一绝对误差术语”。泛泛地通读一遍容易反复改喜欢的句子而漏掉关键问题。时间有限时优先检查摘要和结论中最强的主张。","保留修改日志有助于学习：写下原句、问题类型、修改理由和最终句。几轮之后，你会发现自己常见的错误是范围夸大、指代不明还是证据断裂。这个个人错误表比收藏大量漂亮句型更能改善真实写作。"]}],"exercise":{"materials":"这篇课错误英文句和统一测量案例。","task":"写两句准确英文，并为你的草稿做三项反向提纲检查。","template":"英文结果句：\n范围句：\n段落任务一：\n段落任务二：\n段落任务三：\n最重要修改：","answer":"示范：In the constructed dataset, the mean paired difference in absolute error (B minus A) was −0.750 g. The result illustrates the calculation and is not evidence of real-world effectiveness. 三项检查为问题是否具体、方法是否说明配对单位、结论是否保留教学范围；最重要修改是删除all measurement tasks。","rubric":["英文保留准确指标和材料身份","没有用夸张词提高论断强度","反向提纲能揭示结构问题","事实核查先于语言润色"]},"quiz":{"question":"语言工具把“可能与……有关”改为“证明……导致”，应怎样处理？","options":["接受，句子更有力量","核对设计与证据，通常应恢复原来的限定","只检查语法是否正确"],"correct":1,"explanation":"这不是单纯润色，而是改变因果和确定性承诺；必须由证据决定。"},"references":[{"id":"harvard-organizing","locator":"Tips for Organizing Your Essay：Strategy 1把论点拆成段落，Strategy 3从成稿建立反向提纲；用于检查这篇课结构与修改。"},{"id":"cope-ai","locator":"查阅AI工具使用的作者责任与披露原则，实际按目标渠道核对。"}],"next":"完成可读稿件后，进入沟通与评审训练，让外部反馈帮助研究继续改进。","core":true,"chapterId":"c20","stageId":"s6","chineseCount":1563},{"id":"a21-1","title":"导师沟通、周报与具体求助","goal":"写出导师可以迅速判断进展和问题的周报，并把笼统求助改成有上下文和选项的研究讨论。","scope":"适用于已建立指导关系的研究沟通；频率、渠道和回复预期应双方协商，不把教学建议当成导师义务。","prerequisites":["a03-1","a09-2"],"minutes":60,"tags":["通用","写作"],"terms":[{"zh":"进展证据","en":"progress evidence","definition":"可以检查的文献表、方案、图表、代码或修改稿，而不只是投入时长。"},{"zh":"阻塞项","en":"blocker","definition":"使某项明确任务暂时无法推进的条件，应说明影响和解除方式。"},{"zh":"决策请求","en":"decision request","definition":"清楚指出需要对方判断的具体选择，并提供依据、选项与自己的建议。"}],"sections":[{"id":"concepts","title":"周报要帮助作出下一项决定","paragraphs":["研究沟通的关键是减少对方理解你当前状态的成本。导师通常需要知道问题是什么、你做了什么、得到了什么、哪里不确定、下一步准备怎样做。周报不必很长，但要让重要判断有证据入口。只写读了五篇论文、写了很多代码，无法说明理解或结果发生了什么变化。","求助不是把整个问题交给对方。有效请求包含你已尝试的方法、观察到的具体困难、可能解释和需要帮助的最小判断。例如“统计不会”过于宽泛；“同一对象有A/B读数，我认为应按配对差分析，但批次可能相关，想确认应怎样处理层级结构”就能展开研究讨论。","首次沟通可以先附一页项目说明：对象与问题、最接近工作、拟用材料和设计、当前资源、主要风险以及本次需要判断的事项。正文讲结论，附件提供核查入口；尚未完成的部分明确标为计划。"]},{"id":"reasoning","title":"沟通背后的研究判断","paragraphs":["把事实、解释和请求分开，有助于避免双方误会。事实是输出文件显示了什么，解释是你认为它意味着什么，请求是希望导师作什么判断。早期研究者常把推测写成已证实进展，也可能因为怕显得无能而隐瞒失败。实际上，及时报告失败的条件和已排查内容，往往更有利于降低项目风险。","沟通也涉及时间安排。约定一个适合双方的节奏，并在紧急问题中说明具体影响和最晚需要决定的日期，不应把自己临时安排的期限当作对方已承诺。没有回复时先检查请求是否明确、材料是否可访问，再按约定跟进，不自动解读为拒绝或不重视。"]},{"id":"workflow","title":"可执行的操作过程","paragraphs":["准备一份最近产物、研究日志和下周任务。先写五行摘要，再把必要材料链接放在对应位置。"],"steps":[{"title":"写当前目标","body":"开头说明这周围绕哪个问题推进，例如确认配对误差分析是否与数据结构一致。不要把整个博士愿景放在邮件第一段。"},{"title":"列可核查产物","body":"用一到三项写完成了什么、文件在哪里、哪一处值得看。若只是草稿，标为草稿；没有真实实验就不称实验已完成。"},{"title":"描述发现与疑问","body":"先写结果或观察，再写自己的解释和不确定之处。对异常说明已经排查哪些原因，避免只给结论或情绪。"},{"title":"提出一项决策请求","body":"给可比较选项与建议，说明为什么需要导师判断。问题多时按优先级排列，不把十个不同任务塞进一句话。"},{"title":"约定下一步与记录","body":"写自己计划做的任务和需对方确认的部分。会后记录决定、负责人和日期，发出的文字必须区分建议与已达成承诺。"}]},{"id":"worked","title":"完整例子","paragraphs":["教学周报成稿：“本周目标：检查配对误差分析的报告是否准确。已完成：整理二十对象的教学数据字典，重跑脚本，并更新结果段；原表和输出位于本项目材料目录。发现：B−A均值为−0.750g，但三个对象方向相反，因此图中保留了所有对象。当前疑问：若后续真实数据来自多个批次，简单对象独立假设可能不合适。我建议先记录批次并画分层图，再讨论模型。希望本次讨论确认：真实试验应把批次设为设计层面的控制因素，还是先作小规模可行性记录？下周我将先完成流程顺序和校准记录模板。”","这封示范未声称导师已经认可方案，也没有把教学分析写成真实研究成果。它同时交代事实、判断和具体问题，让对方知道该看什么和回答什么。"],"annotations":[{"text":"B−A均值为−0.750g，但三个对象方向相反。","role":"可核查发现","note":"同时保留主要方向与例外，不只报最有利结果。"},{"text":"我建议先记录批次并画分层图，再讨论模型。","role":"自己的方案","note":"体现已思考下一步，同时保留请教空间。"},{"text":"希望本次讨论确认……","role":"聚焦请求","note":"明确需要的判断，而非泛泛要求指导全部研究。"}]},{"id":"repair","title":"常见失误与改写","paragraphs":["低效请求：“老师，我遇到很多困难，您看怎么做？”对方不知道困难在哪，也不知道你已经做了什么。修订为“脚本在读取某列后得到缺失值；我检查了列
