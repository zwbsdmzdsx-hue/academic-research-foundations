icles":["a01-1","a01-2","a03-2"],"practice":"把熟悉项目改写成一个研究问题，写主张—证据—范围，列出权限与伦理待确认项。","application":"建立目标项目表，逐项查官方截止、所需材料与资格；确认推荐人准备周期。","deliverable":"一页问题地图、申请要求来源与日期。"},{"week":2,"title":"概念、论证与工作台","articles":["a02-1","a02-2","a03-1"],"practice":"定义一个概念并给出操作化；建立原始材料、分析、写作与日志目录。","application":"列成绩、语言、研究经历、作品等已有证据与缺口，避免自评替代证明。","deliverable":"概念定义表、第一条日志和证据清单。"},{"week":3,"title":"可重复检索","articles":["a04-1","a04-2","a04-3"],"practice":"围绕一个问题运行检索，记录平台、日期、检索式、筛选理由，追踪最接近研究。","application":"初步梳理潜在研究群体与代表性论文，不把名气直接当适配。","deliverable":"可重跑的检索日志、若干候选全文。"},{"week":4,"title":"精读与结构识别","articles":["a05-1","a05-2","a05-3"],"practice":"精读一篇适合自己的论文，逐图核对对象、单位、方法、结论，标注不懂之处。","application":"写100–150字研究兴趣说明，明确当前探索而非确定结论。","deliverable":"一篇带问题与证据位置的批注论文。"},{"week":5,"title":"形成文献比较","articles":["a06-1","a06-2","a06-3"],"practice":"整理引用与文献矩阵，比较至少两项结论不同的研究，区分设计、情境和精度差异。","application":"从矩阵写一段领域理解，准备在交流中讨论一个具体问题。","deliverable":"你会追溯原文的比较矩阵和综合段落。"},{"week":6,"title":"问题收缩","articles":["a07-1","a07-2","a07-3"],"practice":"给3个候选问题列对象、证据、价值与限制，选一个可执行问题做下一步判断。","application":"核对近期申请窗口；需要提前提交的材料先推进，不等研究全部完成。","deliverable":"研究问题、目标与空白证据。"},{"week":7,"title":"贡献对照","articles":["a08-1","a08-2","a08-3"],"practice":"制作最接近工作对照表，写暂定贡献、可能反例以及什么证据会让自己放弃新颖性主张。","application":"为研究兴趣说明补上文献依据和可讨论的贡献方向。","deliverable":"贡献对照表，不含未经查证的首次宣称。"},{"week":8,"title":"最小可行项目","articles":["a09-1","a09-2"],"practice":"写时间、材料、权限、设备、指导与能力的资源表；限定一个主要结果，确定停止标准。","application":"确定申请材料工作清单与反馈对象，核实目标项目自己的要求。","deliverable":"一页选题说明和可执行范围。"},{"week":9,"title":"方法选择","articles":["a10-1","a10-2"],"practice":"将问题、设计、收集和分析分层填写，比较两条方法路线为什么适合或不适合。","application":"把方法选择理由加入研究计划初稿。","deliverable":"有理由的设计草案。"},{"week":10,"title":"对照与因果","articles":["a11-1","a11-2"],"practice":"识别混杂、顺序、漂移和条件差异；拟定随机化、匹配或观察解释的边界。","application":"请有经验的人审读设计；把反馈和决策记录到日志。","deliverable":"实验或观察协议及竞争解释表。"},{"week":11,"title":"单位与质量","articles":["a11-4","a14-1"],"practice":"明确独立单位、重复结构和样本规划；创建数据字典、校准和异常记录。","application":"整理一段本人预期贡献与所需支持，避免把团队资源说成已获得。","deliverable":"样本与测量方案、数据字典。"},{"week":12,"title":"先导与采集","articles":["a16-1"],"practice":"在条件与许可具备后做小规模先导；检查流程是否可运行，再决定正式采集。","application":"更新研究计划的可行性、主要风险与备用方案。","deliverable":"先导记录、修改理由和继续/停止决定。"},{"week":13,"title":"清理与描述","articles":["a15-1"],"practice":"先用教学CSV完整走通清理、单位检查、描述统计和图形；再处理自己的材料。","application":"保留一个可展示的分析片段，写清自己完成了什么。","deliverable":"原始文件、处理文件、质量检查和图。"},{"week":14,"title":"效果与不确定性","articles":["a15-2"],"practice":"手工与表格计算配对差、标准误和区间，核对Python输出；用自己的话解释p值。","application":"练习两分钟解释一个结果及其不能说明什么。","deliverable":"可复算的统计表和谨慎结果段。"},{"week":15,"title":"方法假设与比较","articles":["a15-3"],"practice":"依据真实设计确定比较或模型，检查依赖结构、残差与外推范围，必要时寻求统计反馈。","application":"更新研究计划中分析方法的理由，删除套用的方法名。","deliverable":"方法选择说明与诊断记录。"},{"week":16,"title":"敏感性与复核","articles":["a15-4","a16-4"],"practice":"检查缺失、异常、排除和多重比较；从原始文件重新生成输出，记录变化。","application":"准备作品集目录，标清模拟练习与实际研究。","deliverable":"完整分析包及一份复核日志。"},{"week":17,"title":"集中补做与外部反馈","articles":[],"practice":"补齐采集、分析、反例检查与复现中的缺口；让一位读者按说明寻找或重做结果。","application":"根据真实进度修改经历陈述，更新申请材料，不夸大完成状态。","deliverable":"外部反馈清单及已解决证据。"},{"week":18,"title":"成稿结构与标题","articles":["a17-1","a18-1"],"practice":"把现有材料按完整论文结构放入提纲；每节写一个要回答的问题，确定标题和关键词。","application":"准备研究作品简介，说明成果状态和本人角色。","deliverable":"有证据指向的全文骨架。"},{"week":19,"title":"引言与相关工作","articles":["a18-3","a18-4"],"practice":"从文献矩阵写问题背景、研究缺口与定位；每个关键判断核对原文。","application":"把研究兴趣和拟申请团队的关系写具体，核实是否确有匹配研究。","deliverable":"引言与相关工作初稿。"},{"week":20,"title":"方法与结果","articles":["a19-1","a19-2"],"practice":"写出可检查的对象、过程、分析与结果；图表数值逐个与输出对照。","application":"选一幅最能解释工作的图作为汇报材料。","deliverable":"方法与结果完整初稿、图注。"},{"week":21,"title":"讨论与结论","articles":["a19-3","a19-4"],"practice":"解释结果、比较文献、列竞争解释、研究局限与下一步，限制结论强度。","application":"准备面试中关于失败、局限和下一步的回答。","deliverable":"讨论与结论初稿。"},{"week":22,"title":"摘要与论证修改","articles":["a18-2","a20-1","a20-2"],"practice":"根据全文写摘要，做反向提纲，逐段检查主张、证据、引文和连接。","application":"据真实成果修订研究经历陈述，邀请针对性反馈。","deliverable":"摘要、段落任务表与引用核验表。"},{"week":23,"title":"图文与语言定稿","articles":["a20-3","a20-4"],"practice":"核对图表、附录、数据代码说明，修订语言和表达，保留修改版本。","application":"根据各项目要求准备可分享、去敏的写作样本。","deliverable":"一份完整研究报告与支持材料。"},{"week":24,"title":"汇报与导师沟通","articles":["a21-1","a21-2"],"practice":"制作三分钟介绍和更完整报告，练习解释问题、设计、结果、局限与本人贡献。","application":"整理沟通材料和具体问题；只有本人决定后才实际联系。","deliverable":"汇报稿、问题清单和反馈记录。"},{"week":25,"title":"评审与修订","articles":["a22-1","a22-3"],"practice":"模拟评审后按意见逐条修改或有据说明，检查报告与回复是否一致。","application":"评估发表渠道与时间，申请不以期刊及时接收为前提。","deliverable":"评审回复表及修订报告。"},{"week":26,"title":"作品集定稿","articles":["a23-1","a23-2","a23-3","a23-4"],"practice":"用验收标准整理自己的研究包、复现说明与贡献证据；四篇本周以短读和已有产物整理为主。","application":"确认推荐材料、CV研究条目和可展示文件相互一致。","deliverable":"可审阅的真实作品集。"},{"week":27,"title":"研究计划与匹配","articles":["a24-1","a24-2"],"practice":"完成拟研究问题、文献依据、方法、可行性与资源说明，区分已完成和拟开展。","application":"逐项目核对是否要求proposal、字数、格式、截止与导师安排。","deliverable":"按目标要求调整的研究计划。"},{"week":28,"title":"材料提交与面试","articles":["a24-3","a24-4"],"practice":"模拟研究讲解和方法追问，练习明确回答不知道什么、如何核查。","application":"核验CV、陈述、推荐、成绩和语言材料，按实际截止提交并记录状态。","deliverable":"材料一致性清单与面试问答记录。"}],"cases":[{"id":"quantitative","title":"两种流程的绝对测量误差：一份完整的配对分析教学报告","method":"实证定量 · 配对比较 · 表格与 Python","summary":"从20行构造数据出发，完整展示研究问题、指标、配对分析、结果、讨论、局限及材料公开说明。逐句批注解释每句话为何这样写。","status":"全部数据由教材构造，流程A、B是教学标签；没有真实招募、实验、随机分配、伦理批准或已验证设备效果。下面是完整教学报告，不是可作为本人科研成果提交的实证论文。","sections":[{"id":"abstract","title":"摘要","annotations":[{"text":"在比较测量流程时，同一对象的两次读数构成配对，比较对象内差异有助于明确分析单位。","role":"问题背景","note":"交代为什么关注配对结构，不夸大为尚无人研究的空白。"},{"text":"本教学报告用20个构造对象说明如何比较流程A与B的绝对测量误差，并报告效果大小及模型下的不确定性。","role":"目标与材料身份","note":"第一时间声明构造数据，目标是展示方法，不能改写成验证新流程有效。"},{"text":"每个对象具有50 g参考值和A、B两种读数，定义绝对误差为读数与参考值之差的绝对值，配对差为B误差减A误差。","role":"设计与指标","note":"明确对象、单位和差值方向；读者因此知道负数表示B误差较小。"},{"text":"A、B的平均绝对误差分别为3.750 g和3.000 g；平均配对差为−0.750 g，配对t模型下95%置信区间为[−1.060, −0.440] g。","role":"主要结果","note":"报告可解释的单位与区间，所有数值从同一CSV重算并四舍五入。"},{"text":"这些数值说明了估计和报告流程；由于数据是人工构造的，它们不能证明现实中流程B有效，也不能支持关于具体设备的因果结论。","role":"结论与边界","note":"区分形式计算和真实研究证据。不能把小p值当数据真实性的证明。"}]},{"id":"introduction","title":"1. 引言","paragraphs":[],"annotations":[{"text":"比较两种测量流程时，研究者常把读数是否接近参考值作为性能指标。","role":"背景与指标","note":"本句提出测量比较的背景，不声称所有领域都必须用这一指标；依据是随后定义的误差概念。","paragraph":1},{"text":"若只分别报告两组均值，可能忽略同一个对象同时接受两种流程的事实。","role":"方法问题","note":"同一对象有两条读数这一事实来自CSV逐行结构；“可能”保留对不同报告方式的区别。","paragraph":1},{"text":"对象本身的特征、测试批次和参考值都会影响误差，因此分析首先需要回答：什么是独立单位，哪些观察来自同一单位，以及两种流程在哪个指标上被比较。","role":"分析前提","note":"这里列需要核对的设计因素，不声称本例已经测出批次效应；对应材料方法中的单位与参考值。","paragraph":1},{"text":"绝对误差回答的是偏离参考值的幅度，不保留偏离方向。","role":"定义指标","note":"对应公式e=|读数−参考值|，取绝对值会丢掉方向，这是定义产生的数学结果。","paragraph":2},{"text":"带符号误差则可以揭示系统性高估或低估，两者不能互相替代。","role":"区分相邻概念","note":"有符号误差与绝对误差回答不同问题；高估/低估需要结合带符号误差和多次测量判断。","paragraph":2},{"text":"本例仅以绝对误差为主要结果；如果真实项目还关心方向性偏差，应事先增加相应评价，而不是在看过结果后挑选最有利指标。","role":"限定评价范围","note":"对应预定主要比较量；后半句是研究设计建议，不把事后挑选最佳指标当作确认性结果。","paragraph":2},{"text":"本报告的研究问题是：如何从配对读数形成一个可追溯的流程差异估计，并明确其解释边界？","role":"明确研究问题","note":"问的是可复核分析流程，后文数据、代码与报告必须共同回答它；没有承诺真实设备性能提升。","paragraph":3},{"text":"它不主张新的测量技术，也不把教学案例视作领域查新。","role":"贡献定位","note":"依据材料身份，本例没有真实查新或新技术，不能使用“首次发现”等措辞。","paragraph":3},{"text":"统计报告原则参照NIST方法手册与ASA关于p值的解释，报告结构参考ICMJE对原始研究的说明；这些来源用于解释方法，不是证明流程B具有优势的先前实验证据。","role":"交代方法来源","note":"来源见页末NIST、ASA及ICMJE；区分方法参考与支持某项设备效果的原始研究证据。","paragraph":3}]},{"id":"methods","title":"2. 材料与方法","annotations":[{"text":"教学数据文件teaching-measurements.csv包含20行，每行代表一个不同的模拟对象，列为对象ID、参考质量、A读数、B读数和数据身份。","role":"材料来源与单位","note":"20行=20个教学对象；同一行两个读数不增加独立样本量。"},{"text":"所有参考质量均设为50 g；这是构造条件，不代表现实标准器没有不确定性。","role":"测量假设","note":"防止把教学简化误认为真实测量保证。"},{"text":"对第i个对象，计算eAi=|Ai−50|、eBi=|Bi−50|和di=eBi−eAi。","role":"指标定义","note":"符号、单位和方向完整，别人能从原始列复算。"},{"text":"以d的均值为主要比较量，计算样本标准差、标准误以及自由度19的双侧配对t检验和95%置信区间。","role":"分析方法","note":"配对分析等价于对20个差值作单样本t分析；不把A、B当两组独立对象。"},{"text":"该计算以对象间差值独立、差值分布适于t近似且不存在支配性异常为工作假设；构造数据本身没有真实抽样机制。","role":"适用条件","note":"明确推断条件。真实研究需要检查条件，而不是先计算再默认成立。"},{"text":"没有排除任何对象，也没有把B误差增大的记录删除；所有数据与分析脚本一同提供。","role":"完整报告与可复算","note":"完整保留不支持预期的记录，处理规则可检查。"},{"text":"下表展示前5行用于理解计算；完整20行从本页材料区下载。","role":"表格范围","note":"下表O01–O05只是CSV前五行，n=20的计算来自完整文件，避免让读者误认只分析五个对象。","paragraph":1},{"text":"原始列不覆盖，在新列计算指标，使任何最终数字都能追溯到原始输入。","role":"可追溯处理","note":"对应原CSV及表格新增F/G/H列；这是实际提供的教学处理流程，可以检查。","paragraph":1}],"table":{"headers":["对象","参考值g","A读数g","B读数g","A绝对误差g","B绝对误差g","差B−A g"],"rows":[["O01","50","52","51","2","1","−1"],["O02","50","54","52","4","2","−2"],["O03","50","53","52.5","3","2.5","−0.5"],["O04","50","55","53.5","5","3.5","−1.5"],["O05","50","52.5","52.7","2.5","2.7","0.2"]]},"paragraphs":[]},{"id":"results","title":"3. 结果","annotations":[{"text":"20个对象均具有完整的A、B和参考值记录，因此20个对象全部进入配对分析。","role":"分析对象流向","note":"报告完整性和进入分析的单位数，不只呈现最终显著结果。"},{"text":"流程A的平均绝对误差为3.750 g，流程B为3.000 g；20个配对差的均值为−0.750 g，样本标准差为0.662 g，标准误为0.148 g。","role":"描述与估计","note":"SD描述差值离散程度，SE描述模型下均值估计精度，不混称误差条。"},{"text":"在指定配对t模型下，t(19)=−5.066，双侧p≈0.0000687，平均差的95%置信区间为[−1.060, −0.440] g。","role":"推断计算","note":"统计量、自由度、双侧选择和区间齐全；p不是零假设为真的概率。"},{"text":"其中16个对象在B流程下的绝对误差较小，1个相同，3个较大。","role":"个体差异与反例","note":"防止平均改善掩盖部分对象表现变差。"},{"text":"这些输出只描述构造数据及其模型计算，不对应真实设备的总体效应。","role":"结果解释限制","note":"不把统计形式推广到并不存在的真实总体。"},{"text":"作为描述性敏感性检查，逐次暂时留出一个对象、重算剩余19个对象的均值差，得到−0.811至−0.684 g；20次计算的方向均为负。","role":"敏感性复算","note":"对应analyze.py中的leave_one_out_mean_min_g和max_g，表格Q列可重算；20次重算不是20个新实验。","paragraph":1},{"text":"差值中位数为−0.750 g。","role":"补充描述","note":"对应analysis-results.json的median_difference_g或MEDIAN(H2:H21)；不将中位数和平均差当成同一估计目标。","paragraph":1},{"text":"这说明本构造样本的平均方向不由某一个对象单独决定；它不检验未测混杂、不增加样本量，也不能把模拟材料变成真实证据。","role":"限定稳健性解释","note":"只检查单个对象对平均方向的影响；不能把这项检查推广成全部偏差均已排除。","paragraph":1},{"text":"原始对象没有从主分析中删除。","role":"说明数据处理","note":"主分析仍为20对，临时留出是辅助计算，避免读者误解样本量与排除流程。","paragraph":1}],"table":{"headers":["量","结果","含义"],"rows":[["对象数","20","对象内配对，非40独立读数"],["平均差B−A","−0.750 g","构造样本中B绝对误差更低"],["95%模型区间","[−1.060, −0.440] g","模型条件下区间计算演示"],["双侧p","0.0000687","零均值差模型下相容性指标"],["改善/相同/变差","16 / 1 / 3","样本层面的差异分布"],["逐一留出对象的均值范围","[−0.811, −0.684] g","20次描述性复算，主分析仍保留全部对象"]]},"figure":{"id":"paired","alt":"教学构造的20个对象绝对误差配对差，16个为负、1个为零、3个为正；均值负0.750克，95%模型区间负1.060至负0.440克。","caption":"图1｜人工构造的教学数据。左：每个对象的绝对误差差值 d=|B−参考值|−|A−参考值|，负数表示B的绝对误差较小；右：20个差值的均值及配对t模型下95%置信区间。区间描述均值估计，不是20个对象的分布范围；本图不证明真实设备性能。图中英文标签与这些定义对应，数值由同一CSV重算。"},"paragraphs":[]},{"id":"discussion","title":"4. 讨论","paragraphs":[],"annotations":[{"text":"本案例最重要的教学结果是分析单位和结果定义能够在整份报告中保持一致。","role":"提炼教学意义","note":"这是对本教材分析流程的评价，依据材料、公式和结果的一致性；“教学”明确贡献层次。","paragraph":1},{"text":"原始材料的单位是对象，分析使用对象内差值，最终结论也只针对这组构造对象及给定模型。","role":"回扣证据链","note":"CSV一行一个对象、H列对象内差及限定性结果共同支撑这句话；不扩展到真实设备总体。","paragraph":1},{"text":"若把40个读数当作独立样本，或只比较两组均值而不说明配对关系，读者就无法判断不确定性计算是否正确。","role":"解释设计错误的影响","note":"对照20个对象与40条读数的区别；这里指出潜在错误，不声称实际犯过该错误。","paragraph":1},{"text":"平均差为负不能说明每个对象都改善，3个正差值直接显示了这种边界。","role":"解释平均与个体","note":"对应结果表的16/1/3计数，三个正差构成“每个都改善”的直接反例。","paragraph":2},{"text":"真实研究还应考虑多大误差改善才有实际价值：0.75 g对某些任务可能重要，对另一些任务可能不足或远超容许范围。","role":"讨论实际意义","note":"0.75 g来自均值差；不同任务的容差未提供，因此只说“可能”，不编造行业标准。","paragraph":2},{"text":"这种判断需要任务容差、成本和风险依据，不能由p值代为决定。","role":"区分统计与决策","note":"依据ASA关于p值不衡量重要性的原则；实际阈值需要额外使用场景依据。","paragraph":2},{"text":"如果未来开展真实比较，需要处理本例没有模拟的过程因素。","role":"转向未来真实设计","note":"“如果未来”把建议与已完成教学工作区分，避免把计划写成实施事实。","paragraph":3},{"text":"例如A总在B之前测试，设备漂移或操作者熟练可能造成差异；参考值有校准误差时，两流程的绝对误差也受其影响。","role":"列竞争解释","note":"顺序、漂移、熟练和校准是可能误差来源；没有真实过程数据，不能宣称其中哪项已经发生。","paragraph":3},{"text":"可以预先随机或平衡顺序、记录批次与时间、设置独立参考并评估重复性。","role":"提出针对性改进","note":"随机顺序针对顺序因素，参考校准针对测量问题；是可选择措施，需视实际任务落实。","paragraph":3},{"text":"这些是设计选择，要在采集前根据场景与资源落实，而不是在讨论段补一句后就视作已经控制。","role":"限制建议效力","note":"一句文字不能代替设计执行与日志证据；“已控制”只有在落实并核查后才可使用。","paragraph":3},{"text":"本报告没有将构造差异解释为领域贡献。","role":"防止贡献夸大","note":"人工构造数据只能说明计算示范，不能因统计显著就推出领域创新。","paragraph":4},{"text":"真实贡献可能来自测量问题的识别、某类条件下的可靠改进或已有结论的边界澄清，但都需要与最接近工作比较并取得相应证据。","role":"提出后续贡献路径","note":"与第8章贡献对照表一致；“可能”承认尚未查新和取证，不能列为已完成成果。","paragraph":4},{"text":"这个教学材料完成的是分析与写作流程训练。","role":"总结学习产物","note":"现有材料支持完成分析与写作流程训练；不把它表述成原创研究发表。","paragraph":4}]},{"id":"conclusion","title":"5. 结论与材料说明","paragraphs":[],"annotations":[{"text":"通过公开20行构造数据、明确绝对误差和差值方向、保留全部对象并提供脚本，本报告展示了一条从输入到结果表再到限定性结论的可复核流程。","role":"回答研究问题","note":"对应公开CSV、analyze.py、结果表和本报告；结论回收已展示材料，没有引入新结果。","paragraph":1},{"text":"下一步学习者应在确认材料来源、可行性和权限后，用自己的研究问题设计采集与分析，而不是把本例数值改名后当作真实结果。","role":"明确迁移步骤","note":"下一步属于学习者计划；实际资料、权限与问题必须另行建立，不能改名套用教学数值。","paragraph":1},{"text":"数据身份：人工构造、仅用于教学。","role":"声明材料身份","note":"与CSV的synthetic_teaching字段一致，是明确事实声明。","paragraph":2},{"text":"作者贡献：教材编写与示范计算；未报告任何用户已完成研究。","role":"声明成果归属","note":"本教材没有提供用户已做研究的证据，因此仅陈述教材编写与示范。","paragraph":2},{"text":"伦理与参与者：本例无真实参与者数据，不能据此推断后续真实项目无需伦理审查。","role":"声明伦理边界","note":"本例无真人资料；后续真实项目是否需要审查由其对象、活动和机构规则决定。","paragraph":2},{"text":"分析可用性：本页下载材料包含CSV、无第三方依赖的Python脚本、数据字典及表格操作说明。","role":"说明可用材料","note":"对应页末嵌入下载文件列表；analyze.py使用Python标准库，绘图脚本另有可选依赖。","paragraph":2},{"text":"计算结果经独立SciPy实现核对。","role":"说明核验方法","note":"独立SciPy计算核对p值和区间；核验的是算术结果，不是真实数据产生过程。","paragraph":2},{"text":"真实论文的资助、利益冲突、伦理批准、注册、数据和代码可用性等声明必须按实际情况和目标渠道填写。","role":"提醒真实声明依据","note":"属于写作程序建议，不能照抄教学页以代替真实的资助、伦理或注册信息。","paragraph":3},{"text":"本教学报告没有虚构批准号、注册号、资助项目或参考文献。","role":"说明未虚构记录","note":"本例未设真实参与者/机构批准；不填写不存在的批准号或资助号。","paragraph":3}]}],"references":[{"id":"nist-statistics","locator":"用于查阅配对比较与统计方法；本例脚本和公式在下载材料中完整公开。"},{"id":"asa-p","locator":"六项原则：p值不表示假设正确概率、效应大小或结果的重要性。"},{"id":"icmje","locator":"Manuscript Sections：用于理解实证报告各部分职责，规则来自医学出版语境。"}]},{"id":"qualitative","title":"新人为什么不敢问：一个透明的定性主题分析教学样稿","method":"定性与案例 · 反思主题分析","summary":"把六段原创虚构访谈材料、初始编码、主题形成、反例与研究者反思放在一起，演示从摘录到解释的完整过程。","status":"六段摘录均为教材作者原创的虚构情境，不是实际访谈。没有真实参与者、招募、伦理批准或经验性饱和结论。此样稿用于练习分析和写作，不能作为关于现实新人的研究发现。","sections":[{"id":"abstract","title":"摘要","annotations":[{"text":"本教学分析考察虚构情境中的新人如何解释自己在团队中提出问题的时机。","role":"问题与范围","note":"关注经验如何被解释，不把目的设成估计总体比例。"},{"text":"材料由六段原创情境摘录组成，采用反思主题分析演示熟悉材料、编码、建构主题和检查反例的过程。","role":"材料与方法身份","note":"明确人工材料，不能称访谈资料或实际调查结果。"},{"text":"分析将“先独自解决”“换到私下提问”和“判断问题是否值得占用时间”等片段组织为两个解释性主题：证明自己值得被帮助，以及寻找安全的提问场合。","role":"主题性发现","note":"主题表达一种共享意义，不只是把问题清单复述成标题。"},{"text":"一段主动公开提问的反例提醒我们，场合风险依赖新人对团队规范的理解。","role":"反例与精细化","note":"反例不是要删除的异常，帮助限定主题。"},{"text":"这些主题是对构造材料的一种有依据的解读，不能外推真实团队或声称达到数据饱和。","role":"解释边界","note":"保留解释的情境性和人工材料身份。"}]},{"id":"question","title":"1. 问题与分析立场","paragraphs":["如果只问“多少新人不提问”，需要的是可定义的提问行为、样本和统计描述。这里的问题不同：当新人选择先查资料、私下询问或公开发问时，他们怎样理解这些选择？因此分析重心是意义、规范与情境，而不是计算哪种态度占多数。","本例采用语境取向的反思主题分析。研究者承认自己参与了主题建构，不能把主题说成材料自动产生的客观分类。材料可支持不止一种解释；分析质量来自解释与问题、摘录、整体材料之间的连贯关系，以及对替代解读的说明。这里不以编码者一致性系数作为反思主题分析的强制质量指标。"]},{"id":"materials","title":"2. 全部教学材料","table":{"headers":["ID","原创虚构摘录"],"rows":[["Q1","我先找半小时，找不到才问。总得让别人知道我自己努力过。"],["Q2","会议上我没说，结束后私下问同事，就不怕打断大家。"],["Q3","组长说基础问题也欢迎，我才发现原来可以直接问。"],["Q4","我不是不想问，是不知道这个问题值不值得占用别人时间。"],["Q5","我在群里直接问，因为同样的问题可能其他新人也有。"],["Q6","如果每次被问以前有没有看文档，我下次就会多查一会儿。"]]},"paragraphs":["六段完整材料都呈现在这里，避免只展示支持某个主题的引文。ID只是教学索引，不代表匿名受访者编号。若用于真实项目，还需说明招募、关系、访谈提纲、同意、录音转写和隐私保护，而不能从这个练习直接推断这些环节已完成。"]},{"id":"analysis","title":"3. 从编码到主题","steps":[{"title":"先写整体印象，再逐句编码","body":"第一遍注意到提问前的准备、场合选择与对团队规则的判断。第二遍将Q1编码为“展示努力”、Q2为“降低打扰风险”、Q3为“明确许可”、Q4为“衡量提问正当性”、Q5为“提问帮助集体”、Q6为“预期被评价”。这些代码是分析动作，不是固定标签答案。"},{"title":"比较代码背后的共同意义","body":"Q1、Q4、Q6都围绕提问者是否已经尽到责任，初步合并为“证明自己值得被帮助”。Q2、Q3与Q5涉及场合与公开性，将它们组织成“寻找安全的提问场合”。同一摘录可以与多个主题有关，不强迫互斥。"},{"title":"用反例重新检查主题边界","body":"Q5公开提问，表面上挑战“不敢公开问”的说法。它不否定所有风险判断，却表明受访者把公开问题理解成对集体有用。于是将第二主题限定为“根据团队规范判断场合安全”，而不是“所有新人都害怕公开提问”。"},{"title":"回到全部摘录检查解释","body":"逐项写出主题与Q1–Q6的联系，发现Q3更直接体现可见许可。保留这一差别，不为了主题整齐而改写原句。最终主题名称和定义记录版本，允许后续材料促使修订。"}],"paragraphs":["分析备忘：编写者自身习惯先查资料，最初容易把Q1理解为个人自律。对照Q6后，另一种理解出现：先查也可能是为了避免负面评价。因此最终写法保留两种可能，讨论情境压力，而不将行为归结为单一人格特征。"]},{"id":"findings","title":"4. 主题与证据","annotations":[{"text":"主题一：证明自己值得被帮助。Q1的“让别人知道我自己努力过”把检索行为与他人评价联系起来。","role":"主题及证据","note":"具体词句支持解释，读者能回到材料检验。"},{"text":"Q4对“值不值得”的犹豫，以及Q6对再次被检查是否读文档的预期，使这种努力呈现为提问资格的判断。","role":"跨摘录综合","note":"不按Q1、Q4、Q6逐条复述，而提出连接它们的解释。"},{"text":"然而，材料没有直接排除单纯追求效率的解释，因此主题不应被写成所有查资料行为都源于恐惧。","role":"替代解释","note":"用材料能支持的程度限定结论。"},{"text":"主题二：寻找安全的提问场合。Q2以私下询问降低打断风险，Q3则通过组长的明确许可重新理解提问的可接受性。","role":"机制性描述","note":"呈现场合与规范如何进入判断，不宣称已证明因果机制。"},{"text":"Q5把公开提问描述为帮助其他新人，提示公开性本身并非必然危险；重要的是个体如何理解该场合的共同规范。","role":"反例修订主题","note":"将不一致材料用于提高解释分辨率，而非排除。"}]},{"id":"discussion","title":"5. 讨论、反思与边界","paragraphs":["这份样稿展示了定性分析如何从具体表达走向有组织的解释。主题必须说明材料的某种意义模式，不等于把“时间”“会议”“文档”等高频词列成分类。引文是证据的一部分，仍需要研究者解释它怎样支持主题，并说明其他合理读法。","若将问题转成真实研究，可设计开放式访谈：请描述最近一次犹豫是否提问的经历；当时有哪些人；怎样决定场合；后来怎样理解这次经历。避免直接问“是不是因为害怕评价”，因为那会把当前教学解释强加给参与者。抽样应服务于问题，例如比较不同团队规范的情境，而不是提前规定访谈几个人就必然饱和。","本材料的首要限制是全部摘录均为构造，写作者知道情境目标，主题容易显得比真实材料更整齐。即使真实研究出现相似表达，也需要重新分析，不能把这里的编码表当作发现事实的机器。研究者的角色、关系和预设需持续记录；参与者反馈可以是某些研究设计中的资源，但不自动成为唯一真值认证。","结论：本例形成两个可追溯到材料的解释性主题，并用Q5修正第二主题的范围。它训练的是透明分析和有边界的写作，而不是关于现实新人的经验性定论。完整材料、编码过程和反思备忘均已给出，便于读者提出不同解释并比较其依据。"]}],"references":[{"id":"thematic-analysis","locator":"Doing Reflexive TA 的六阶段及其递归、反思性质。"},{"id":"srqr","locator":"SRQR题录及PubMed入口，本次正文未取得；可在获得原文后补查报告透明度，本例不声称逐条满足该清单。"}]},{"id":"humanities","title":"“清晨第一声铃”是谁的时间：一篇文本细读教学论文","method":"人文解释 · 文本细读 · 竞争解释","summary":"对一段原创短文提出解释问题，以词语、视角、重复与叙事转折为证据，完整展示论点、反驳和边界。","status":"分析对象是教材原创的六句微型文本，没有虚构历史作者、文学出处、创作年代或社会背景。这是一篇文本分析教学样稿，不代表对某位真实作家或时代的研究。","sections":[{"id":"material","title":"原始文本与问题","paragraphs":["《第一声铃》（教材原创）\n① 每天清晨，厂门的铃先于太阳响。\n② 老陈把表拨慢五分钟，说这样能多留一点自己的时间。\n③ 可他总在第二声铃前站到门口。\n④ 门卫笑他：表慢了，人倒更早。\n⑤ 那天铃坏了，老陈却不敢先走进门。\n⑥ 他第一次觉得，手腕上的时间没有声音。","这段文字可以被概括为一个人拨慢手表却仍受铃声约束。但概括没有回答一个值得解释的问题：为什么文本到铃声消失时，才让人物发现自己的时间“没有声音”？下面的论文围绕这个转折论证，不推测作者生平，也不凭“厂门”一词编造历史时期。"]},{"id":"opening","title":"1. 论题与中心主张","annotations":[{"text":"《第一声铃》把“自己的时间”写成一种可以在手表上调整、却无法独自决定行动的东西。","role":"解释性中心论点","note":"提出可争论的理解，超越情节摘要；读者可以反驳。"},{"text":"这篇文章认为，铃声的重复与最终缺席，使私人计时和集体行动规范之间的张力逐渐显现。","role":"解释路径","note":"指出将分析的形式证据：重复、缺席和行动，而不是只给抽象主题。"},{"text":"这一论点限于给定六句文本；它不等同于对某种真实工厂制度或作者政治立场的判断。","role":"证据边界","note":"文本解释需要证据，历史解释还需要独立史料，不能越级。"}]},{"id":"argument1","title":"2. 从太阳到铃声：谁先规定一天","paragraphs":["第一句“先于太阳”把铃声置于自然晨光之前。这里的先后不必被当作精确日出记录；它的叙事作用是让一天首先被某种外在声响标记。文本没有直接说铃声具有强制力，但紧接着人物试图“多留一点自己的时间”，说明时间已经被感受为可争取的东西。","第二句的“拨慢”是一个具体、微小且可执行的动作。“五分钟”使抵抗具有日常尺度，而“一点”又弱化了行动的雄心。由此可以提出一种解释：人物并未宣布摆脱共同时间，而是在既有节奏内争取私人余地。这比笼统说“老陈反抗所有权威”更贴近词语提供的证据。","这一解释有一个需保留的区别：人物说自己想多留时间，并不证明他实际上得到更多可自由支配时间。第三句的“可”正把说法与行为拉开距离。论证必须同时处理这两层，不能只引用愿望句而忽视后面的行动。"]},{"id":"argument2","title":"3. “可”与笑声：行动怎样反驳手表","annotations":[{"text":"“可他总在第二声铃前站到门口”以转折词连接愿望和行为，削弱了拨表动作的实际效果。","role":"词语到论证","note":"不是列出转折词就完成分析，而要说明它改变了前一句的意义。"},{"text":"“总”暗示这种提前到达并非一次偶然，门卫的“人倒更早”又把时间的差异转化为可被他人观察的行为。","role":"重复与视角","note":"两处文字互证，但不量化未给出的频次。"},{"text":"门卫的笑声也可能只是善意玩笑，因此不能直接把他解释成压迫者；更稳妥的判断是，他的发言让私人调整与公共行为的矛盾显形。","role":"控制解释强度","note":"提出另一合理读法并保留能成立的核心论点。"}]},{"id":"counter","title":"4. 铃坏之后：自由，还是失去行动凭据","paragraphs":["第五句改变了前面不断存在的条件：铃坏了。若全文只是关于铃声如何限制行动，声响消失似乎应该带来自由。但“却不敢先走进门”产生相反结果，迫使读者重新理解限制。人物不只是被声音催促，也依靠它判断什么时候可以行动。","结尾“手腕上的时间没有声音”把计时器官重新放回身体附近，同时指出其缺乏某种可公开确认的信号。“没有声音”既可以指手表安静，也可以被读作私人时间缺少决定行动的权威。后者不是由词语字典直接得出，而是由拨表、提前到达、铃坏和迟疑这组叙事关系支持。","一种竞争解释是：老陈只是习惯了铃声，所以在故障时短暂困惑。这一解释能说明第五句的迟疑，也比宏大的制度批判少用额外假设。然而它较难单独解释第二句“自己的时间”的所有权措辞与结尾的对照。所以，这篇文章会习惯理解为私人行动受共同规范组织的一种具体方式，而不把两种解释简单判为一真一假。"]},{"id":"conclusion","title":"5. 结论与方法回看","paragraphs":["通过对先后、转折、重复、他人发言和缺席的细读，这篇文章论证了一个有限判断：文本呈现私人计时与公共行动许可之间的张力。拨表并没有直接转化成自主行动，而铃声消失暴露了这种自主性的不足。这个结论覆盖六句文本内部的组织方式，不自动外推真实工人的经验。","若开展文学史或思想史研究，下一步需要真实作品的版本、发表情境、相关文本与历史材料。若研究工作制度对行为的因果影响，则需要另一种经验设计。不同问题可以相互启发，但不能互相代替证据。","教学修改示范：原句“作者猛烈批判工业资本主义对所有工人的剥削”引入了未提供的作者意图、制度性质和总体范围。修改为“铃声的最终缺席使人物对共同时间的依赖变得可见”后，判断落在文本实际提供的情节和语言证据上。准确缩小主张并不会降低分析价值，反而让读者知道如何检验。"]}],"references":[{"id":"harvard-writing","locator":"Introductions：问题、论点与what is at stake；只用于样稿入口的组织。"},{"id":"history-source","locator":"Document Analysis：核对作者、来源、情境与材料能支持的范围；本例没有真实历史出处。"},{"id":"philosophy-writing","locator":"学科写作指南目录入口，供进一步寻找相应PDF；本次只核对入口，未把链接PDF当作已读全文。"},{"id":"harvard-paragraph","locator":"Topic sentence、Evidence、Analysis：将原文词句与解释连接的写作原则。"},{"id":"harvard-counterargument","locator":"How to address counterarguments：公平处理习惯解释等竞争读法。"}]},{"id":"theory","title":"两次测量取平均一定更准确吗：一个模型、证明与反例","method":"理论与计算 · 定义、推导、反例、模型边界","summary":"从测量模型出发推导平均值方差，说明独立性、相关性与偏差怎样改变“平均更好”的结论，附可运行计算。","status":"原创教学推导与模型计算。数学结论是标准期望和方差运算的练习，不宣称新定理或真实设备性能；计算示例不替代假设验证。","sections":[{"id":"question","title":"1. 问题与定义","paragraphs":["常见建议是多测几次再平均，因为平均会更准确。这句话混合了多个概念：准确指系统偏差小、方差小，还是均方误差小？若两次测量都偏高，或噪声高度相关，平均并不一定带来想象中的改善。这篇文章会口号拆成明确命题，分别说明哪些结论能够证明，哪些需要额外假设。","设固定真值为θ，测量X1=θ+b1+ε1、X2=θ+b2+ε2。b1和b2是系统偏差；随机误差满足E(ε1)=E(ε2)=0，Var(ε1)=Var(ε2)=σ²，Cov(ε1,ε2)=ρσ²。要求方差有限，ρ在−1到1之间。定义平均估计M=(X1+X2)/2，均方误差MSE(M)=E[(M−θ)²]。"]},{"id":"proof","title":"2. 命题与证明","annotations":[{"text":"命题：在上述假设下，E(M)−θ=(b1+b2)/2，Var(M)=σ²(1+ρ)/2。","role":"精确定义结论","note":"列出究竟证明偏差还是方差，不能只说更准。"},{"text":"由期望的线性性，E(M)=[E(X1)+E(X2)]/2=θ+(b1+b2)/2，因此平均值的偏差是两次测量偏差的平均。","role":"第一步推导","note":"期望线性性不要求独立。这里不能用独立性作为不必要理由。"},{"text":"由和的方差公式，Var(M)=[Var(X1)+Var(X2)+2Cov(X1,X2)]/4=σ²(1+ρ)/2。","role":"第二步推导","note":"协方差项决定相关误差是否被平均抵消，不能漏掉。"},{"text":"再由均方误差分解，MSE(M)=σ²(1+ρ)/2+[(b1+b2)/2]²。","role":"连接评价指标","note":"MSE包含方差和偏差平方，所以方差下降不等于所有意义上的准确度提高。"},{"text":"当两次无偏且不相关时，MSE(M)=σ²/2，不大于任意一次测量的σ²；若σ²>0，则严格小于。","role":"带条件推论","note":"独立可推出不相关（存在二阶矩时），但这一步只需要协方差为0。"}]},{"id":"counterexamples","title":"3. 反例与适用边界","paragraphs":["反例一：两次误差完全相同，即ε2=ε1且b1=b2=0，则ρ=1，M=θ+ε1，方差仍为σ²。反复抄写同一个读数不会创造独立信息。这也解释了为什么同一对象内的高度相关读数不能被当作大量独立样本。","反例二：X1无偏且方差为1，X2具有偏差4、方差为1，二者随机误差不相关。X1的MSE为1，而平均值M的MSE为1/2+2²=4.5。平均值的方差虽然只有0.5，但平方偏差使总误差变大。这个例子严格反驳“两次测量取平均总是比第一次准确”。","例外条件并不是证明失败的补丁，它们决定命题本来能说多强。若两个估计的方差不同，可以研究加权平均；最优权重依赖方差、协方差和目标损失，并不总是二分之一。真实数据中这些量还需要估计，不能直接把理论公式变成未经验证的操作方案。"]},{"id":"computation","title":"4. 可运行的计算核验","paragraphs":["下面只计算理论公式，输入为明确指定的模型参数；它核验算术与极端条件，并不能验证真实误差确实符合这些参数。将代码复制到Python 3即可运行，无需第三方库。"],"code":{"language":"python","text":"def mse_average(variance, correlation, bias_a, bias_b):\n    if variance \u003c 0 or not -1 \u003c= correlation \u003c= 1:\n        raise ValueError('Invalid variance or correlation')\n    var_mean = variance * (1 + correlation) / 2\n    bias_mean = (bias_a + bias_b) / 2\n    return var_mean + bias_mean ** 2\n\nassert mse_average(1, 0, 0, 0) == 0.5\nassert mse_average(1, 1, 0, 0) == 1.0\nassert mse_average(1, 0, 0, 4) == 4.5\nprint('Independent unbiased:', mse_average(1, 0, 0, 0))\nprint('Identical random errors:', mse_average(1, 1, 0, 0))\nprint('One biased measurement:', mse_average(1, 0, 0, 4))"},"table":{"headers":["情境","单次A的MSE","平均值MSE","你会说明什么"],"rows":[["无偏、不相关、方差1","1","0.5","在这些条件下平均减少均方误差"],["无偏、误差完全相同","1","1","复制相关信息不减少方差"],["A偏差0，B偏差4，不相关","1","4.5","加入有偏测量可能损害结果"]]}},{"id":"discussion","title":"5. 从数学结论到研究论证","paragraphs":["本推导有两种不同的有效性。代数推导是否正确，是形式检查问题；某个现实设备的读数是否满足模型，是经验问题。即使每一步推导都无误，也不能由此断定真实两次读数独立、无偏或等方差。理论研究可以澄清条件并提出可检验预期，但应用时仍需要测量和情境判断。","如果目标是形成真实研究贡献，需要查明已有工作已经知道什么。这篇文章使用的方差恒等式和均方误差分解是标准知识，不能把重新推导它们包装成新理论。可能的新问题在于某种特定过程中的误差相关结构、带约束的加权方法或测量成本与精度的权衡，但每一项都需要文献比较、明确假设和独立验证。","写作上的关键是让定义先于命题、假设先于结论、反例紧随过强口号。计算结果应回指公式，并解释它究竟是证明、数值检查还是仿真证据。有限次模拟吻合不能证明普遍命题；一个满足前提却违反结论的反例则足以推翻该普遍命题。"]},{"id":"conclusion","title":"6. 结论与练习延伸","paragraphs":["两次测量平均是否改善结果，取决于评价指标、偏差和相关性。在等方差且无偏不相关的条件下，平均将方差减半；相关误差或不同偏差可能削弱甚至逆转收益。这篇文章给出完整定义、推导、两个反例和可运行计算，展示理论论文如何用条件化命题替代模糊口号。","可继续练习：把M改成wX1+(1−w)X2，分别写出偏差和方差，再在b1=b2=0、方差不等且协方差已知时讨论权重。不要跳过可行范围与方差非负条件。若将其扩展为研究项目，先查最接近的估计与测量文献，再说明新增条件或结果究竟是什么。"]}],"references":[{"id":"proof-book","locator":"证明、命题与反例的基本组织；概率与期望章节用于理解形式推导。"},{"id":"nist-statistics","locator":"测量与统计方法：区分偏差、变异和实际数据模型检查。"}]}],"legacyTitles":{"m1-l1":"从做成一个东西，到回答一个问题","m1-l2":"论文、证据与学术共同体怎样运转","m1-l3":"建立最小研究工作台与能力地图","m2-l1":"拆关键词，做一次可重复检索","m2-l2":"筛选文献、追溯引用与辨别来源","m2-l3":"文献卡、引用与转述的基本功","m3-l1":"三遍阅读：先地图，再方法，后细节","m3-l2":"看懂图表，检查证据有没有撑住结论","m3-l3":"从单篇摘要，走向文献比较与研究空白","m4-l1":"把宽泛兴趣缩成研究问题","m4-l2":"选择方法：变量、定性研究与工程评估","m4-l3":"抽样、混杂因素与因果边界","m5-l1":"单位、比例和量纲检查","m5-l2":"均值、中位数、标准差和分布","m5-l3":"独立单位、伪重复与条件概率","m6-l1":"效果量、置信区间与p值","m6-l2":"根据设计做比较：配对、独立与样本规划","m6-l3":"多重比较、分析前计划与透明报告","m7-l1":"把项目资料放进可理解的文件结构","m7-l2":"用表格管理整洁数据与变量字典","m7-l3":"备份、版本与图表追溯","m8-l1":"一段话只承担一个论证任务","m8-l2":"转述、综合与引文卫生","m8-l3":"摘要与引言：从研究缺口到问题","m9-l1":"识别抄袭、伪造与篡改","m9-l2":"作者身份、贡献与协作记录","m9-l3":"研究伦理与生成式 AI 的边界","m10-l1":"三分钟讲清一项小研究","m10-l2":"写一封导师看得懂的周报","m10-l3":"把反馈变成下一轮修改","m11-l1":"预印本、同行评审与DOI各代表什么","m11-l2":"期刊与会议：先看学科，再看目标","m11-l3":"核实出版渠道并回应审稿意见","m12-l1":"把纸直升机问题变成可执行方案","m12-l2":"诚实收数、检查与展示","m12-l3":"写出可复核的微型研究报告"},"materials":[{"name":"teaching-measurements.csv","label":"教学数据 CSV","mime":"text/csv;charset=utf-8","text":"object_id,reference_g,measurement_a_g,measurement_b_g,data_status\nO01,50,52,51,synthetic_teaching\nO02,50,54,52,synthetic_teaching\nO03,50,53,52.5,synthetic_teaching\nO04,50,55,53.5,synthetic_teaching\nO05,50,52.5,52.7,synthetic_teaching\nO06,50,54.5,54.5,synthetic_teaching\nO07,50,53.5,52.7,synthetic_teaching\nO08,50,52,50.8,synthetic_teaching\nO09,50,56,56.4,synthetic_teaching\nO10,50,53,52.4,synthetic_teaching\nO11,50,54,52.6,synthetic_teaching\nO12,50,55,54.8,synthetic_teaching\nO13,50,52.5,51.4,synthetic_teaching\nO14,50,53.5,53.2,synthetic_teaching\nO15,50,54.5,53.6,synthetic_teaching\nO16,50,52,50.3,synthetic_teaching\nO17,50,56,56.1,synthetic_teaching\nO18,50,53,52.3,synthetic_teaching\nO19,50,55,53.7,synthetic_teaching\nO20,50,54,53.5,synthetic_teaching\n"},{"name":"analyze.py","label":"Python 分析脚本","mime":"text/plain;charset=utf-8","text":"\"\"\"Teaching-only paired measurements. Python 3, standard library only.\nRun: python analyze.py  (from any directory). No real experimental data.\n\"\"\"\nfrom pathlib import Path\nimport csv\nimport json\nimport math\nimport statistics as stats\n\nROOT = Path(__file__).resolve().parent\n\ndef beta_fraction(a, b, x):\n    \"\"\"Continued fraction for the regularized incomplete beta function.\"\"\"\n    tiny = 1e-300\n    qab, qap, qam = a + b, a + 1, a - 1\n    c = 1.0\n    d = 1 - qab * x / qap\n    d = 1 / (d if abs(d) > tiny else tiny)\n    h = d\n    for m in range(1, 300):\n        aa = m * (b-m) * x / ((qam+2*m)*(a+2*m))\n        d = 1 + aa*d\n        d = d if abs(d)>tiny else tiny\n        c = 1 + aa/c\n        c = c if abs(c)>tiny else tiny\n        d = 1/d\n        h *= d*c\n        aa = -(a+m)*(qab+m)*x/((a+2*m)*(qap+2*m))\n        d = 1+aa*d\n        d = d if abs(d)>tiny else tiny\n        c = 1+aa/c\n        c = c if abs(c)>tiny else tiny\n        d = 1/d\n        change = d*c\n        h *= change\n        if abs(change-1)\u003c3e-14:\n            return h\n    raise ArithmeticError('Incomplete beta did not converge')\n\ndef regularized_beta(x,a,b):\n    if x \u003c= 0: return 0.0\n    if x >= 1: return 1.0\n    front = math.exp(math.lgamma(a+b)-math.lgamma(a)-math.lgamma(b)+a*math.log(x)+b*math.log1p(-x))\n    if x \u003c (a+1)/(a+b+2):\n        return front*beta_fraction(a,b,x)/a\n    return 1-front*beta_fraction(b,a,1-x)/b\n\ndef two_sided_t_p(t,df):\n    return regularized_beta(df/(df+t*t),df/2,0.5)\n\ndef t_critical_975(df):\n    low, high=0.0,100.0\n    for _ in range(90):\n        mid=(low+high)/2\n        if two_sided_t_p(mid,df)>0.05: low=mid\n        else: high=mid\n    return (low+high)/2\n\ndef analyze(path=ROOT/'teaching-measurements.csv'):\n    with open(path,encoding='utf-8-sig',newline='') as stream:\n        rows=list(csv.DictReader(stream))\n    if len(rows)!=20 or len({r['object_id'] for r in rows})!=20:\n        raise ValueError('This teaching case requires 20 distinct paired objects.')\n    a=[abs(float(r['measurement_a_g'])-float(r['reference_g'])) for r in rows]\n    b=[abs(float(r['measurement_b_g'])-float(r['reference_g'])) for r in rows]\n    if not all(math.isfinite(x) for x in a+b):\n        raise ValueError('Measurements and reference values must be finite numbers.')\n    d=[y-x for x,y in zip(a,b)]\n    n=len(d); mean=stats.mean(d); sd=stats.stdev(d); se=sd/math.sqrt(n)\n    if se == 0:\n        raise ValueError('All paired differences are identical; the demonstrated t statistic is undefined.')\n    t=mean/se; critical=t_critical_975(n-1)\n    leave_one_out=[stats.mean(d[:i]+d[i+1:]) for i in range(n)]\n    results={'case':'teaching-only-synthetic-paired-measurements','n':n,'df':n-1,\n        'mean_abs_error_a_g':stats.mean(a),'mean_abs_error_b_g':stats.mean(b),\n        'mean_difference_b_minus_a_g':mean,'sd_difference_g':sd,'se_difference_g':se,\n        'ci95_low_g':mean-critical*se,'ci95_high_g':mean+critical*se,\n        't':t,'p_two_sided':two_sided_t_p(t,n-1),'t_critical':critical,\n        'b_lower_count':sum(x\u003c0 for x in d),'equal_count':sum(x==0 for x in d),\n        'b_higher_count':sum(x>0 for x in d),'differences_g':d,\n        'median_difference_g':stats.median(d),\n        'leave_one_out_mean_min_g':min(leave_one_out),\n        'leave_one_out_mean_max_g':max(leave_one_out),\n        'warning':'构造的教学模拟数据；统计值仅演示模型计算，不是现实研究结果。'}\n    return results\n\nif __name__=='__main__':\n    result=analyze()\n    (ROOT/'analysis-results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')\n    print(json.dumps(result,ensure_ascii=False,indent=2))\n"},{"name":"analysis-results.json","label":"核对结果 JSON","mime":"application/json","text":"{\r\n  \"case\": \"teaching-only-synthetic-paired-measurements\",\r\n  \"n\": 20,\r\n  \"df\": 19,\r\n  \"mean_abs_error_a_g\": 3.75,\r\n  \"mean_abs_error_b_g\": 3.0,\r\n  \"mean_difference_b_minus_a_g\": -0.75,\r\n  \"sd_difference_g\": 0.6621337120488424,\r\n  \"se_difference_g\": 0.14805759903354831,\r\n  \"ci95_low_g\": -1.059888116215156,\r\n  \"ci95_high_g\": -0.4401118837848438,\r\n  \"t\": -5.065596125397507,\r\n  \"p_two_sided\": 6.868132554853296e-05,\r\n  \"t_critical\": 2.0930240544083034,\r\n  \"b_lower_count\": 16,\r\n  \"equal_count\": 1,\r\n  \"b_higher_count\": 3,\r\n  \"differences_g\": [\r\n    -1.0,\r\n    -2.0,\r\n    -0.5,\r\n    -1.5,\r\n    0.20000000000000284,\r\n    0.0,\r\n    -0.7999999999999972,\r\n    -1.2000000000000028,\r\n    0.3999999999999986,\r\n    -0.6000000000000014,\r\n    -1.3999999999999986,\r\n    -0.20000000000000284,\r\n    -1.1000000000000014,\r\n    -0.29999999999999716,\r\n    -0.8999999999999986,\r\n    -1.7000000000000028,\r\n    0.10000000000000142,\r\n    -0.7000000000000028,\r\n    -1.2999999999999972,\r\n    -0.5\r\n  ],\r\n  \"median_difference_g\": -0.75,\r\n  \"leave_one_out_mean_min_g\": -0.8105263157894737,\r\n  \"leave_one_out_mean_max_g\": -0.6842105263157895,\r\n  \"warning\": \"构造的教学模拟数据；统计值仅演示模型计算，不是现实研究结果。\"\r\n}"},{"name":"data-dictionary.csv","label":"数据字典 CSV","mime":"text/csv;charset=utf-8","text":"variable,type,unit,definition,validity\nobject_id,text,none,Distinct synthetic object identifier,O01 to O20 unique\nreference_g,number,g,Assumed reference mass in teaching construction,50 in every row; not a claim of zero reference uncertainty\nmeasurement_a_g,number,g,Synthetic reading under teaching label A,finite numeric\nmeasurement_b_g,number,g,Synthetic reading under teaching label B,finite numeric\ndata_status,text,none,Provenance of every row,synthetic_teaching\nabs_error_a_g,derived,g,ABS(measurement_a_g-reference_g),nonnegative\nabs_error_b_g,derived,g,ABS(measurement_b_g-reference_g),nonnegative\ndifference_g,derived,g,abs_error_b_g-abs_error_a_g,negative means lower error under B\n"},{"name":"spreadsheet-guide.md","label":"表格逐步教程","mime":"text/markdown;charset=utf-8","text":"# 用表格完成配对分析\r\n\r\n## 1. 导入并检查\r\n\r\n在Excel用“数据 → 从文本/CSV”导入 teaching-measurements.csv，分隔符为逗号。保留原始A:E列，确保第1行为列名，第2到21行为20个对象。检查ID没有重复，每行两种流程对应同一对象。若数字变成文本或全部挤在一列，先修正导入设置再计算。\r\n\r\n## 2. 添加计算列\r\n\r\nF1填abs_error_a_g，G1填abs_error_b_g，H1填difference_g。\r\n\r\n- F2：`=ABS(C2-B2)`\r\n- G2：`=ABS(D2-B2)`\r\n- H2：`=G2-F2`\r\n\r\n选F2:H2向下填充到21行。第一行应得到2、1、-1；第五个对象应得到2.5、2.7、0.2。正差不是错误数据，它表示这个对象B的绝对误差更大，不能为了平均表现更好而删除。\r\n\r\n## 3. 写汇总区\r\n\r\nJ列填写指标名，K列输入下列公式。\r\n\r\n| 单元格 | 指标 | 公式 |\r\n| --- | --- | --- |\r\n| K2 | 对象数 | `=COUNT(H2:H21)` |\r\n| K3 | A平均绝对误差 | `=AVERAGE(F2:F21)` |\r\n| K4 | B平均绝对误差 | `=AVERAGE(G2:G21)` |\r\n| K5 | 平均配对差 | `=AVERAGE(H2:H21)` |\r\n| K6 | 差值样本标准差 | `=STDEV.S(H2:H21)` |\r\n| K7 | 标准误 | `=K6/SQRT(K2)` |\r\n| K8 | 自由度 | `=K2-1` |\r\n| K9 | 95%双侧t临界值 | `=T.INV.2T(0.05,K8)` |\r\n| K10 | 区间下限 | `=K5-K9*K7` |\r\n| K11 | 区间上限 | `=K5+K9*K7` |\r\n| K12 | t统计量 | `=K5/K7` |\r\n| K13 | 双侧p | `=T.DIST.2T(ABS(K12),K8)` |\r\n| K14 | 配对检验交叉核对 | `=T.TEST(F2:F21,G2:G21,2,1)` |\r\n\r\n部分地区Excel使用分号分隔参数，按本机设置替换逗号。K14的最后参数1代表配对检验；双侧p不受差值符号方向影响，但结果解释和t符号受方向影响。\r\n\r\n核对：n=20；A均值3.75g；B均值3g；平均差-0.75g；SD约0.662134g；SE约0.148058g；t约-5.065596；95%CI约[-1.059888,-0.440112]g；双侧p约0.0000686813。显示三位小数不代表测量具有千分之一克精度。\r\n\r\n## 4. 画出与Python相同的两部分图\r\n\r\n第一张图显示所有对象的配对差。I1填object_number，I2:I21填1到20；选择H2:I21，插入“散点图（仅标记）”。在“选择数据→编辑系列”中确认X值是H2:H21，Y值是I2:I21，不能把序号误当成差值。横轴标题写“绝对误差差 B−A（g）”，纵轴写“模拟对象序号”。将纵轴最小值设为0.5、最大值20.5、主单位1；需要与Python图方向一致时勾选“逆序刻度值”，使对象1在上方。序号只代表ID顺序，不是时间。\r\n\r\n另建一列两行辅助数据：X都为0，Y分别为0.5和20.5。把它添加为新系列，设置为带直线的散点图并去掉标记，得到零差参考线。横轴可固定−2.25至0.75，与Python图范围相同。核对16个点在零线左侧、1个在零线上、3个在右侧。Python图额外从零点连到每个对象差值，便于读方向；线段不代表观测之间的趋势。\r\n\r\n第二张图显示均值及其95%模型区间。M1:P1依次填mean_g、display_y、negative_error、positive_error；M2填`=K5`，N2填0，O2填`=K5-K10`，P2填`=K11-K5`。以M2为X、N2为Y插入单点散点图。通过“图表元素→误差线→其他选项”选择水平X误差线，误差量选“自定义”：正误差值引用P2，负误差值引用O2。若软件自动增加垂直Y误差线，将它删除。\r\n\r\n均值点应在−0.750 g；左右端点应为−1.060和−0.440 g。不要把区间上下端点本身直接填作误差长度：误差长度是“均值到端点的距离”，这里两边约0.309888 g。第二图同样添加x=0的参考线，横轴范围设为−2.25至0.75；纵轴仅用来摆放单点，没有研究含义。图题写“均值与配对t模型95%置信区间”，图注注明数据人工构造、20个配对对象。\r\n\r\n可额外画H列的直方图，帮助观察分布是否被极少数值支配；它不属于上述两部分成品图。小样本图形不能证明正态，也不应机械根据一个正态检验p值选择全部后续方法。均值区间不是SD、SE或20个原始差值的范围。\r\n\r\n## 5. 做一个可核对的敏感性检查\r\n\r\n在新的空列Q1写leave_one_out_mean，Q2输入`=(SUM($H$2:$H$21)-H2)/(COUNT($H$2:$H$21)-1)`，向下填充到Q21。每行只是暂时留出对应对象后的均值计算；不要删除原始数据。`=MIN(Q2:Q21)`应约为−0.810526，`=MAX(Q2:Q21)`约为−0.684211。`=MEDIAN(H2:H21)`为−0.75。20次重算方向相同，说明这个构造样本的平均方向不完全由单个对象决定；不能据此排除系统偏差、混杂或证明推广有效。\r\n\r\n## 6. 写结果与限制\r\n\r\n可写：“在20个构造对象中，B−A的平均绝对误差差为-0.750g，配对t模型下95%区间为[-1.060,-0.440]g。16个对象B误差更低，3个更高，1个相同。”紧接着写“数据是人工构造，仅展示方法，不证明真实流程B有效”。\r\n\r\n保留原CSV、带公式的工作簿、图表和结果文字。给图注写输入文件、差值定义、样本单位及模拟身份。不要只保存截图，以免别人无法检查公式或重新计算。\r\n"},{"name":"README.md","label":"Python 运行说明","mime":"text/markdown;charset=utf-8","text":"# 实证定量教学材料\r\n\r\n所有20行数据均为人工构造，仅用于学习；不是实际实验结果，也不是用户完成的科研成果。\r\n\r\n## 文件\r\n\r\n- teaching-measurements.csv：20个对象，每个有A、B配对读数。\r\n- analyze.py：Python 3标准库分析，无需安装第三方依赖。\r\n- analysis-results.json：分析脚本输出。\r\n- case-facts.json：全教材共同采用的定义、结果与解释边界。\r\n- spreadsheet-guide.md：表格软件从导入到计算与图表的步骤。\r\n- data-dictionary.csv：每列的定义和有效条件。\r\n\r\n## 从零运行 Python\r\n\r\n1. 安装Python 3。在Windows安装时选择将Python加入PATH。若已安装，在终端输入 `python --version` 检查；某些设备用 `python3 --version`。\r\n2. 将 `analyze.py` 和 `teaching-measurements.csv` 保存到同一文件夹。脚本以自身位置找CSV，文件名不要改。\r\n3. 在该文件夹打开终端，输入 `python analyze.py`，macOS/Linux若命令为python3则用 `python3 analyze.py`。\r\n4. 终端会显示结果，并在同一文件夹生成 `analysis-results.json`。最先核对n=20、mean_difference_b_minus_a_g=-0.75。\r\n5. 若提示找不到CSV，检查文件是否被保存成 `.csv.txt`，以及是否与脚本在同一目录。若提示PermissionError，将材料放到可写目录后运行。\r\n6. 不要把运行成功等同方法适用。请返回教材核对独立单位、配对关系、测量过程与模型假设。\r\n\r\n## 计算边界\r\n\r\n这份无依赖脚本用不完全Beta函数计算t分布尾概率，用二分法求临界值；它便于离线教学，不是替代经过长期验证的统计软件。结果已由独立SciPy的配对差t分析和置信区间核对。真实研究可用R或SciPy等工具，并保留版本、输入和诊断。\r\n\r\n原始数据没有缺失，没有真实抽样或随机化；不得从构造数据宣称某现实流程有效。真实参考值还可能有校准不确定性。\r\n\r\n## 可选：重新绘图\r\n\r\n统计分析脚本不需要第三方库。图形已随HTML嵌入，可直接下载SVG。若要重绘，在CSV、analyze.py、make_figure.py同一文件夹中，先运行 `python -m pip install matplotlib`，再运行 `python make_figure.py`。脚本从CSV重算数据，生成SVG和PNG。左图为20个对象的差值，右图的误差条是均值的95%模型区间，不是标准差或原始值范围。\r\n"},{"name":"make_figure.py","label":"Python 绘图脚本（需 matplotlib）","mime":"text/plain;charset=utf-8","text":"\"\"\"Plot the synthetic teaching case. Optional dependency: matplotlib.\nRun after: python -m pip install matplotlib\nAll plotted values are recomputed from teaching-measurements.csv.\n\"\"\"\nfrom pathlib import Path\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\nfrom analyze import analyze\n\nroot = Path(__file__).resolve().parent\nresult = analyze()\ndifferences = result['differences_g']\nfig, (ax, summary) = plt.subplots(1, 2, figsize=(9.2, 5.8),\n    gridspec_kw={'width_ratios': [3, 2]}, constrained_layout=True)\ncolors = ['#235b44' if d \u003c 0 else '#9a3241' if d > 0 else '#526159' for d in differences]\nax.hlines(range(1, 21), 0, differences, color=colors, linewidth=1.4, alpha=.7)\nax.scatter(differences, range(1, 21), c=colors, s=32, zorder=3)\nax.set_yticks(range(1, 21), [f'O{i:02d}' for i in range(1, 21)])\nax.invert_yaxis()\nax.set_title('Every paired object', loc='left', fontsize=12)\nax.set_xlabel('Absolute error difference, B - A (g)')\nmean = result['mean_difference_b_minus_a_g']\nlo, hi = result['ci95_low_g'], result['ci95_high_g']\nsummary.errorbar(mean, 0, xerr=[[mean-lo], [hi-mean]], fmt='o',\n    capsize=7, color='#235b44', markersize=8, linewidth=2)\nsummary.set_yticks([])\nsummary.set_ylim(-.8, .8)\nsummary.set_title('Mean and model-based 95% CI', loc='left', fontsize=12)\nsummary.set_xlabel('Mean difference (g)')\nsummary.text(.5, .24, f'Mean = {mean:.3f} g\\n95% CI [{lo:.3f}, {hi:.3f}] g\\nn = 20 paired objects',\n    transform=summary.transAxes, ha='center', va='top', fontsize=10, linespacing=1.8)\nfor axis in (ax, summary):\n    axis.axvline(0, color='#526159', linestyle='--', linewidth=1)\n    axis.set_xlim(-2.25, .75)\n    axis.grid(axis='x', color='#d3dcd3', linewidth=.6)\n    axis.set_axisbelow(True)\n    axis.spines[['top','right']].set_visible(False)\nfig.suptitle('Synthetic teaching data: not experimental evidence', fontsize=14, color='#24352e')\nfig.savefig(root/'paired-differences.svg', format='svg', metadata={'Date':None})\nfig.savefig(root/'paired-differences.png', dpi=160)\nprint('Wrote paired-differences.svg and paired-differences.png')\n"},{"name":"paired-differences.svg","label":"配对差图 SVG","mime":"image/svg+xml","text":"\u003c?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"no\"?>\r\n\u003c!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\r\n  \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\r\n\u003csvg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"662.4pt\" height=\"417.6pt\" viewBox=\"0 0 662.4 417.6\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\r\n \u003cmetadata>\r\n  \u003crdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\r\n   \u003ccc:Work>\r\n   function methodAdvice() {
    const m=state.tools.method||{}, purpose=m.purpose||'describe', evidence=m.evidence||'numeric', access=m.access||'existing';
    let advice;
    if(evidence==='formal') advice='优先考虑形式证明、建模或规范性论证。先列定义与假设，区分形式成立、模型适用与价值前提；用反例、推导检查和竞争论证检验。参考第13章。';
    else if(evidence==='text') advice='优先考虑文本细读、史料分析或文件研究。说明材料的来源、版本、语境与选择理由，比较替代解释；不能仅靠关键词频次完成解释。参考第12章第4篇、第14章第3篇。';
    else if(evidence==='experience') advice='优先考虑访谈、观察或案例研究。先确定理解对象和情境，选择与问题及认识论相符的分析方式；主题分析不自动要求编码一致性分数。参考第12章。';
    else if(purpose==='causal') advice='若能合法且可行地分配条件，可考虑随机实验；否则需评估准实验或观察设计的识别假设。单靠相关、回归或前后差异不能确立因果。参考第11章第1、2篇。';
    else if(purpose==='predict') advice='考虑预测模型与独立评价。先确定预测时间点、基线和评价指标，再按对象、时间或批次划分数据；处理步骤只能在训练数据拟合。参考第13章第6篇。';
    else if(purpose==='synthesize') advice='考虑证据综合：先区分范围综述、系统综述和叙述综述。只有研究问题与效应可比时才考虑元分析；报告规范不替代方法设计。参考第13章第4、5篇。';
    else advice='考虑描述性观察、测量比较或调查。先明确对象、抽样、指标定义与误差来源；描述样本不能自动推广到总体。参考第11章与第14、15章。';
    return advice+' '+(access==='missing'?'当前资料尚未落实：先做可行性与权限确认，再确定最终设计。':access==='collect'?'计划新收集资料：先确认伦理、许可、测量或提问流程，并做小规模试运行。':'使用已有资料：核对来源、许可、取得机制与是否能回答你的问题。')+' 这是一条咨询路径，不是自动选出的最终方案。';
  }
