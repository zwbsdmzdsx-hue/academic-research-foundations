或操作变化与条件重合的机会。","example":"每个模型的三次投放次序写在纸条上抽取。"}],"tutorial":[{"title":"写出窄问题和两种条件","body":"问题限定为同一种纸、同一折法、翼长A与翼长B的纸直升机下落时间是否不同。先选定两种翼长并记下毫米数；除翼长外尽量保持尺寸、材料和制作步骤一致。"},{"title":"制作多个独立模型","body":"每种翼长都制作多个新模型并编号。可先计划每组至少数个模型，再按可用时间决定具体数量并说明理由；不要把同一个模型的多次投放伪装成许多个独立模型。"},{"title":"确定重复投放与顺序","body":"为每个模型计划相同次数的重复投放，用来观察该模型自身的波动。将各条件或模型的测试顺序随机打乱，并在记录表保存实际顺序。"},{"title":"固定环境和计时定义","body":"选安全的室内低矮释放位置，标记相同高度；避开风扇和人员走动。用固定机位录像，预先定义从手部释放帧到模型首次接触地面的时间点，并说明如何读取。"},{"title":"预先规定处理规则","body":"写明模型损坏、碰撞、录像失败的记录方式；不能只因为时间不符合预期就重做或删除。预设主要比较方式和数据排除规则，正式测试后不随意改动。"}],"worked":{"title":"教学示范：预注册式一页方案","body":"教学示范方案：问题为两种翼长（数值由操作者在制作前填写）是否影响低矮室内释放时的落地时间。每组预制若干独立编号模型，每个模型重复投放固定次数；主要指标为视频逐帧测得的秒数。环境、释放高度、纸张、折法、摄像机位置尽量一致；测试顺序随机；模型编号为分析分组单位；损坏和碰撞照实记录并按预写规则处理。现在不填结果，也不宣称哪种翼长更慢。"},"exercise":{"prompt":"在第一次投放前完成一页实验预案，并请同学检查能否照做。","template":"问题：\n翼长A/B（毫米）：\n独立模型数量与编号：\n每个模型重复次数：\n随机顺序方法：\n释放高度/机位/计时定义：\n主要指标与单位：\n损坏/碰撞/失败处理：\n停止规则：\n不能推广到：","hint":"如果别人拿到方案仍不知道如何判定落地时刻，就继续补定义，不要先收数据。","exampleAnswer":"教学示范：两组翼长先填写实际测量值；每种条件制作多个新模型，模型为独立单位，每个模型固定重复投放；顺序抽签；用录像帧数换算秒；碰撞记录为无效事件但保留记录，不以结果方向决定排除。此示范未提供任何实测值。"},"quiz":{"question":"同一纸模型重复投放10次，最准确的描述是什么？","options":["获得10个独立纸模型","获得同一模型的10次重复测量","一定比制作多个模型更有代表性"],"correct":1,"explanation":"重复投放可以描述该模型的测量波动，但共享模型特征，不能直接当作10个独立实验单位。"},"rubric":["在收数前规定条件、主要指标、单位和计时定义","独立模型与同一模型重复投放明确分开","随机顺序、异常记录和排除规则可由他人复现"],"pitfalls":["只用一个模型并把重复投放数当成独立样本数","观察到趋势后再改条件、主要指标或删除规则"],"resourceIds":[]},{"id":"m12-l2","title":"诚实收数、检查与展示","minutes":90,"level":"必修","goal":"保存未经覆盖的原始记录，执行预定检查，并用同时显示模型间与模型内变异的图表总结观测。","prereq":["完成 m12-l1 方案；在真实练习中先确认场地安全并获得所需许可"],"concepts":[{"term":"原始数据","plain":"第一次记录的观测和异常信息，应保留原样并以副本做整理。","example":"逐次投放的帧数、转换秒数和碰撞标记分列保存。"},{"term":"数据字典","plain":"解释每个字段的名称、单位、允许值和缺失原因。","example":"condition=A/B；drop_time_s=秒；event=正常/碰撞/损坏。"},{"term":"模型内与模型间变异","plain":"同一模型重复投放的波动和不同模型之间的差异是不同层次。","example":"可先画每个模型的点，再叠加组别分布，而非只报全部投放的平均值。"}],"tutorial":[{"title":"建立不会覆盖原始值的表","body":"每行对应一次投放；记录模型编号、条件、顺序、原始帧数、换算秒数、事件代码和备注。保留原文件，只复制后再清理。"},{"title":"边收集边记录异常","body":"模型碰墙、释放失败、录像遮挡都用预先设定代码标记，写下发生时间和理由；不要事后静默删除。"},{"title":"做基础质量检查","body":"检查字段是否缺失、单位是否一致、条件标签是否正确、秒数是否非负；抽几行从视频重新换算，核对录入过程。发现错误时保留原值、在修订列说明。"},{"title":"按独立模型汇总","body":"先计算每个模型的重复投放摘要，再呈现模型间比较。可以用表格或电子表格公式；样本少时逐点展示，避免只给一个均值掩盖波动。"},{"title":"画标注完整的图","body":"横轴为翼长条件，纵轴为下落时间（秒），显示每个模型的点和重复测量信息，图注明确模型数、投放次数及异常处理。图旁写实际数据版本和生成步骤。"}],"worked":{"title":"教学示范：从单次记录到数据表","body":"一行示例（格式演示，数值不代表实验结果）：model_id=M01；condition=A；run_order=1；frame_count=NA；drop_time_s=留空；event=录像遮挡；note=起始帧不可判定。该条保留在原始表中，再按预案判断是否不进入时间比较；不能为了图表整齐把它从记录中消失。"},"exercise":{"prompt":"为一次小型实际练习建立空数据表与数据字典，完成后对照视频抽查至少两次。","template":"字段 | 含义 | 单位/允许值 | 缺失如何表示\nmodel_id |\ncondition |\nrun_order |\nframe_count |\ndrop_time_s |\nevent |\nnote |","hint":"不要在JSON教材里预填看似真实的组均值；只把教学示例标作格式演示。真实数据须由学习者亲自记录。","exampleAnswer":"教学示范：model_id为独立纸模型编号（M01…）；condition为预先定义的A或B；run_order为实际顺序整数；frame_count为录像帧差；drop_time_s按事先确定的帧率换算，单位秒；event为正常/碰撞/损坏/录像失败；缺失用空值并解释原因。"},"quiz":{"question":"发现一条投放记录可能录错，最可追溯的做法是什么？","options":["覆盖原值，不留下痕迹","保留原始文件，在处理副本标出修订值与依据","删掉整行，因为数据不完美"],"correct":1,"explanation":"保留原始数据并记录修订原因，才能重查与复现处理过程。"},"rubric":["原始记录未被处理值覆盖，异常事件有记录","数据字典定义字段、单位和缺失方式","图表显示模型层级、单位、样本与重复结构"],"pitfalls":["把同一模型的重复投放当独立模型合并统计","只呈现均值或删除不合预期记录而不留理由"],"resourceIds":[]},{"id":"m12-l3","title":"写出可复核的微型研究报告","minutes":90,"level":"必修","goal":"按问题、方法、结果和讨论组织实际报告，给出不确定性、限制、可复现材料和下一步。","prereq":["完成实验并检查数据；若尚无真实观测，完成计划书版本并将结果部分明确标注为未收集"],"concepts":[{"term":"结果与解释","plain":"结果描述观察到什么，讨论解释可能原因；两者不能混写成因果证明。","example":"记录两组观察值后，再讨论翼长与时间的关系及其他可能原因。"},{"term":"限制","plain":"可能影响测量、推断或推广范围的具体条件。","example":"手工折叠带来模型差异，低矮室内实验不能代表不同尺寸旋翼。"},{"term":"可复现交付包","plain":"让他人能理解版本、数据结构、步骤和分析的材料集合。","example":"方案、空白/原始数据、数据字典、分析文件、图表和说明。"}],"tutorial":[{"title":"写标题和摘要骨架","body":"标题描述对象与比较，不宣称超出证据的发现。摘要依次写问题、设计、真实观测状态、主要结果或“尚未收集”、限制和结论。"},{"title":"写方法到可复现程度","body":"给出材料、翼长、模型数量、每模型重复次数、随机顺序、释放高度、计时规则、异常处理和分析单位。任何实际偏离预案都如实列出。"},{"title":"只在结果节报告观察","body":"给出实际样本数量、单位、描述性统计和逐点图；不要因为两个组看起来不同就写因果结论。若未收数，改交研究计划，结果节写明尚无观测。"},{"title":"讨论证据强弱与边界","body":"先回答研究问题，再谈变异、替代解释、制作差异、计时误差和外部适用范围。结论采用与设计匹配的表述，例如“在本次条件下观察到……”，不写成普遍定律。"},{"title":"打包并让同学复现","body":"整理方案、原始数据、数据字典、处理记录、图表和简短README；检查文件名、单位和版本。请同学仅凭包复述分析步骤，修补不清楚处，并写一个下一步验证计划。"}],"worked":{"title":"教学虚构报告结构","body":"标题：两种纸直升机翼长条件下的室内下落计时练习。摘要：本研究计划比较……；样本与方法……；实际数据为学习者收集后填写（此示范不含虚构结果）；可能限制为……。结果图应从实际记录生成，不能引用本教材编造的均值。讨论解释需与观察分开，明确模型数量和重复投放层级。"},"exercise":{"prompt":"完成一个短报告或计划报告，并交给同学按README尝试复核。","template":"题目：\n摘要（问题/方法/证据/限制）：\n1 问题与动机：\n2 方法：\n3 结果（真实观测；若尚无则注明）：\n4 讨论与局限：\n5 结论边界与下一步：\n文件清单/版本：","hint":"空数据也能形成合格的计划报告；不能用虚构结果填补尚未完成的实验。","exampleAnswer":"教学示范（计划版）：提出翼长比较问题；说明拟制作独立模型、固定释放与录像计时、随机顺序；结果栏写“尚未进行实验，无观测数据”；局限包括手工制作差异与有限室内条件；下一步先确认计时可重复性。"},"quiz":{"question":"若两组的样本平均值不同，报告中最稳妥的做法是什么？","options":["直接声称翼长导致了差异","呈现设计、模型层级、实际变异，并用与证据相称的措辞解释","只展示支持预期的几次投放"],"correct":1,"explanation":"组均值差异本身不能排除模型差异、顺序或测量误差；需要完整设计信息和谨慎解释。"},"rubric":["报告清楚区分方法、观测结果与解释","局限和结论范围由真实设计及记录支撑","交付包足以定位原始数据、版本和分析步骤"],"pitfalls":["用虚构或预期数字填进结果部分","把一次低风险练习的结论推广到其他装置、尺度或环境"],"resourceIds":[]}]}],"resources":[{"id":"read-paper","title":"Ten simple rules for reading a scientific paper","organization":"NIH / PLOS Computational Biology","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7392212/","language":"英语","free":true,"why":"一篇开放获取的阅读策略论文，帮助建立先看全貌、再深入方法与证据的顺序。","readingTask":"先浏览摘要和图表，再选一条建议应用到最近读的论文。","modules":["m1","m3"],"checked":"2026-11-05"},{"id":"scholarly-articles","title":"Reading Scholarly Articles","organization":"Purdue University Libraries","url":"https://guides.lib.purdue.edu/research_approaches/scholarlyarticles","language":"英语","free":true,"why":"大学图书馆整理的学术文章结构与阅读方法入门。","readingTask":"选一篇论文，按页面提供的框架写出研究问题、方法和结论。","modules":["m2","m3","m8"],"checked":"2026-11-05"},{"id":"zotero","title":"The Basics: Zotero Quick Start Guide","organization":"Zotero","url":"https://www.zotero.org/support/quick_start_guide","language":"英语","free":true,"why":"Zotero 官方快速入门，覆盖收集、整理、引用与同步的基本流程。","readingTask":"装好 Zotero 后建立一个练习资料夹，导入三条可公开访问的文献。","modules":["m2","m7"],"checked":"2026-11-05"},{"id":"paraphrasing","title":"Paraphrase: Write It in Your Own Words","organization":"Purdue Online Writing Lab","url":"https://owl.purdue.edu/owl/research_and_citation/using_research/quoting_paraphrasing_and_summarizing/paraphrasing.html","language":"英语","free":true,"why":"练习准确转述、保持来源可追溯，避免把替换几个词误当成自己的表达。","readingTask":"将一段文献先脱离原文改述，再对照原意与引用完整性。","modules":["m2","m8"],"checked":"2026-11-05"},{"id":"ai-in-research","title":"AI Tools for Research","organization":"Purdue University Libraries","url":"https://guides.lib.purdue.edu/c.php?g=1371380&p=10592801","language":"英语","free":true,"why":"图书馆整理的研究场景 AI 工具入口，仅供了解方法；不取代个人所在机构或期刊的规则。","readingTask":"记录一项可用法和一项核验/隐私风险，再回自己机构页面核实适用规则。","modules":["m9"],"checked":"2026-11-05"},{"id":"nist-statistics","title":"NIST/SEMATECH e-Handbook of Statistical Methods","organization":"National Institute of Standards and Technology","url":"https://www.itl.nist.gov/div898/handbook/","language":"英语","free":true,"why":"公开的统计方法手册，供按主题查阅试验设计、测量、建模和统计方法。","readingTask":"找一个与你当前问题有关的小节；把假设和适用条件写下来，方法选择再与导师核对。","modules":["m4","m5","m6","m12"],"checked":"2026-11-05"},{"id":"ori-misconduct","title":"Definition of Research Misconduct","organization":"U.S. Office of Research Integrity","url":"https://ori.hhs.gov/definition-research-misconduct","language":"英语","free":true,"why":"美国 ORI 对其适用范围内科研不端术语的说明，可作为概念入口；各地制度和适用边界需另核实。","readingTask":"区分 fabrication、falsification 与 plagiarism 的含义；不要把一地法规当成所有学校的规则。","modules":["m9","m11"],"checked":"2026-11-05"},{"id":"osf-preregistration","title":"Welcome to Registrations & Preregistrations","organization":"Open Science Framework","url":"https://help.osf.io/article/330-welcome-to-registrations","language":"英语","free":true,"why":"OSF 官方注册与预注册帮助文档，说明如何记录带时间戳的研究计划。","readingTask":"先用纸面模板写出主要问题、结果指标和偏离规则，再查看此页如何保存。","modules":["m6","m12"],"checked":"2026-11-05"},{"id":"cope-ai","title":"Authorship and AI tools","organization":"Committee on Publication Ethics (COPE)","url":"https://publicationethics.org/guidance/cope-position/authorship-and-ai-tools","language":"英语","free":true,"why":"出版伦理委员会关于 AI 工具与作者身份的立场；属于伦理组织建议，具体投稿规则仍以目标期刊为准。","readingTask":"对照所在机构和目标期刊的最新指南，记录 AI 使用、披露与保密要求的差异。","modules":["m9","m11"],"checked":"2026-11-05"}]}</script>
  <script>
    (function () {
      "use strict";
      var payload = JSON.parse(document.getElementById("course-data").textContent);
      var modules = payload.modules;
      var resources = payload.resources;
      var stages = [
        { id: "起步", label: "理解研究" },
        { id: "取证", label: "判断证据" },
        { id: "实作", label: "落实与保护" },
        { id: "表达", label: "交流合作" },
        { id: "走完闭环", label: "完成研究" }
      ];
      var key = "academic-starter-progress-v1";
      var state = readState();
      var selectedStage = "全部";
      var searchTerm = "";
      var activeModule = null;

      function freshState() {
        return { completed: [], drafts: {}, rubrics: {}, answers: {}, lastLesson: "" };
      }

      function readState() {
        try {
          var parsed = JSON.parse(localStorage.getItem(key) || "null");
          if (!parsed || typeof parsed !== "object") return freshState();
          return {
            completed: Array.isArray(parsed.completed) ? parsed.completed : [],
            drafts: parsed.drafts && typeof parsed.drafts === "object" ? parsed.drafts : {},
            rubrics: parsed.rubrics && typeof parsed.rubrics === "object" ? parsed.rubrics : {},
            answers: parsed.answers && typeof parsed.answers === "object" ? parsed.answers : {},
            lastLesson: typeof parsed.lastLesson === "string" ? parsed.lastLesson : ""
          };
        } catch (error) {
          return freshState();
        }
      }

      function persist() {
        try {
          localStorage.setItem(key, JSON.stringify(state));
          document.getElementById("storageNote").hidden = true;
          return true;
        } catch (error) {
          var note = document.getElementById("storageNote");
          note.hidden = false;
          note.textContent = "浏览器拒绝本机存储。当前页面仍可使用；关闭页面后，学习进度和草稿可能不会保留。";
          return false;
        }
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function say(message) {
        document.getElementById("liveMessage").textContent = message;
        var visible = document.getElementById("actionFeedback");
        if (visible) {
          visible.hidden = !message;
          visible.textContent = message;
        }
      }

      function getModule(id) {
        return modules.find(function (item) { return item.id === id; }) || null;
      }

      function getLesson(id) {
        for (var i = 0; i < modules.length; i += 1) {
          var found = modules[i].lessons.find(function (lesson) { return lesson.id === id; });
          if (found) return { module: modules[i], lesson: found, index: i };
        }
        return null;
      }

      function completedCount() {
        return state.completed.filter(function (id) { return !!getLesson(id); }).length;
      }

      function moduleCompleteCount(module) {
        return module.lessons.filter(function (lesson) { return state.completed.indexOf(lesson.id) !== -1; }).length;
      }

      function routeProgress() {
        return Math.round((completedCount() / 36) * 100);
      }

      function safeHash(id) {
        var next = id ? "#" + id : "#home";
        if (window.location.hash !== next) window.location.hash = next;
        else renderRoute();
      }

      function navGroups() {
        return stages.map(function (stage) {
          var peers = modules.filter(function (item) { return item.stage === stage.id; });
          if (!peers.length) return "";
          return '<section class="navigation-group"><p class="navigation-label">' +
            escapeHtml(stage.label) + '</p><ol class="navigation-list">' +
            peers.map(function (module) {
              var active = activeModule === module.id;
              return '<li><button class="module-nav-link" type="button" data-module="' +
                escapeHtml(module.id) + '"' + (active ? ' aria-current="page"' : "") + '>' +
                '<span class="module-index">' + escapeHtml(module.id.slice(1)) + '</span>' +
                '<span class="nav-title">' + escapeHtml(module.title) + '</span>' +
                '<span class="nav-progress">' + moduleCompleteCount(module) + '/' + module.lessons.length + '</span>' +
                '</button></li>';
            }).join("") + "</ol></section>";
        }).join("");
      }

      function updateNavigation() {
        var html = navGroups();
        document.getElementById("desktopNavigation").innerHTML = html;
        document.getElementById("mobileNavigationContent").innerHTML = html;
      }

      function completedMinutes() {
        return modules.reduce(function (total, module) {
          return total + module.lessons.reduce(function (sum, lesson) {
            return sum + (state.completed.indexOf(lesson.id) !== -1 ? lesson.minutes : 0);
          }, 0);
        }, 0);
      }

      function formatMinutes(value) {
        var hours = Math.floor(value / 60);
        var minutes = value % 60;
        if (!value) return "0 分钟";
        if (!minutes) return hours + " 小时";
        if (!hours) return minutes + " 分钟";
        return hours + " 小时 " + minutes + " 分钟";
      }

      function updateProgress() {
        var amount = completedCount();
        var bar = document.getElementById("globalProgress");
        if (bar) {
          bar.style.width = ((amount / 36) * 100) + "%";
          bar.setAttribute("aria-valuenow", String(amount));
        }
        var copy = document.getElementById("progressCount");
        if (copy) copy.textContent = amount + " / 36 课完成";
        var time = document.getElementById("progressTime");
        if (time) time.textContent = "已完成约 " + formatMinutes(completedMinutes());
      }

      function moduleSearchText(module) {
        var text = [module.title, module.summary, module.deliverable];
        module.lessons.forEach(function (lesson) {
          text.push(lesson.title, lesson.goal, lesson.level);
          (lesson.concepts || []).forEach(function (concept) {
            text.push(concept.term, concept.plain, concept.example);
          });
          (lesson.tutorial || []).forEach(function (step) { text.push(step.title, step.body); });
        });
        return text.join(" ").toLocaleLowerCase();
      }

      function matches(module) {
        if (selectedStage !== "全部" && module.stage !== selectedStage) return false;
        if (searchTerm && moduleSearchText(module).indexOf(searchTerm) === -1) return false;
        return true;
      }

      function progressHeader() {
        return '<div class="progress-line" role="progressbar" aria-label="课程完成进度" aria-valuemin="0" aria-valuemax="36" aria-valuenow="' +
          completedCount() + '"><div class="progress-fill" id="globalProgress" style="width:' +
          ((completedCount() / 36) * 100) + '%"></div></div>' +
          '<div class="progress-copy"><span id="progressCount">' + completedCount() + ' / 36 课完成</span>' +
          '<span id="progressTime">已完成约 ' + formatMinutes(completedMinutes()) + '</span>' +
          '<span>自定进度 · 每课约 45–90 分钟</span></div>';
      }

      function renderRouteDiagram() {
        return '<section class="route-section" aria-labelledby="routeTitle">' +
          '<p class="route-heading" id="routeTitle">从问题到可复核的成果</p>' +
          '<ol class="route-list">' + stages.map(function (stage) {
            var phaseModules = modules.filter(function (item) { return item.stage === stage.id; });
            var count = phaseModules.reduce(function (sum, item) { return sum + moduleCompleteCount(item); }, 0);
            var max = phaseModules.reduce(function (sum, item) { return sum + item.lessons.length; }, 0);
            return '<li class="route-step' + (max > 0 && count === max ? ' is-done' : '') +
              '" data-stage="' + escapeHtml(stage.id) + '"><strong>' + escapeHtml(stage.label) +
              '</strong><span>' + escapeHtml(phaseModules.map(function (item) { return item.id.slice(1); }).join(" · ")) +
              ' · ' + count + '/' + max + ' 课</span></li>';
          }).join("") + '</ol></section>';
      }

      function moduleRow(module) {
        var done = moduleCompleteCount(module);
        return '<article class="module-row"><span class="module-row-index">' +
          escapeHtml(module.id.slice(1).padStart(2, "0")) + '</span><div><h3 class="module-row-title">' +
          '<button type="button" data-module="' + escapeHtml(module.id) + '">' + escapeHtml(module.title) +
          '</button></h3><p class="module-row-copy">' + escapeHtml(module.summary) +
          '</p><p class="module-row-outcome">完成时带走：' + escapeHtml(module.deliverable) +
          '</p></div><div class="module-row-action"><span>' + done + ' / ' + module.lessons.length +
          ' 课完成</span><button class="text-link-button" type="button" data-module="' +
          escapeHtml(module.id) + '">打开模块</button></div></article>';
      }

      function renderHome() {
        activeModule = null;
        var groups = stages.map(function (stage) {
          var peers = modules.filter(function (item) { return item.stage === stage.id && matches(item); });
          if (!peers.length) return "";
          return '<section class="module-group"><div class="group-heading"><h2>' +
            escapeHtml(stage.label) + '</h2><span>' + peers.length + ' 个模块</span></div>' +
            peers.map(moduleRow).join("") + '</section>';
        }).join("");
        var found = modules.filter(matches).length;
        var filters = [{ id: "全部", text: "全部" }].concat(stages.map(function (stage) {
          return { id: stage.id, text: stage.label };
        }));
        var actionText = completedCount() === 0 ? "开始第一课" : "继续上一课";
        var last = getLesson(state.lastLesson);
        var actionId = completedCount() === 0 ? "m1-l1" : last ? last.lesson.id : "m1-l1";
        var home = '<section class="intro"><p class="overline">研究训练工作台 · 自定进度</p>' +
          '<h1>学术不是论文格式，是一套可复核的判断方法。</h1>' +
          '<p class="intro-copy">从问题、文献、研究设计和数据开始，逐步练到写作、伦理、交流，再用一个低风险微型研究走完整个闭环。</p>' +
          '<p class="profile-note">机械毕业设计已经训练了项目执行和工程设计经验。接下来补上的，是怎样把问题变得可研究、证据变得可追溯，以及结论的边界说得准确。</p>' +
          progressHeader() + '</section>' + renderRouteDiagram() +
          '<section aria-label="模块目录"><div class="overview-tools"><div class="filter-list" role="group" aria-label="按学习阶段筛选">' +
          filters.map(function (filter) {
            return '<button class="filter-button" type="button" data-stage-filter="' +
              escapeHtml(filter.id) + '" aria-pressed="' + (selectedStage === filter.id ? "true" : "false") +
              '">' + escapeHtml(filter.text) + '</button>';
          }).join("") + '</div><span class="overview-meta" id="searchCount">显示 ' + found + ' / 12 个模块</span></div>' +
          '<div id="moduleGroups">' + (groups || '<p class="empty-state">没有找到匹配内容。试试更短的关键词，或清除阶段筛选。</p>') + '</div></section>' +
          '<section class="notice"><strong>毕业设计经验可以迁移。</strong> 本路线不预设你的英语、数学或编程水平；已熟悉的部分可快速复习，真正薄弱的能力再按需补齐。</section>' +
          '<div class="lesson-actions"><button type="button" class="action-button primary" data-lesson="' +
          escapeHtml(actionId) + '">' + actionText + '</button><button type="button" class="action-button danger" data-action="reset">清空本机进度</button></div>' +
          '<p class="quiet-copy">内容从通用研究能力出发。不同学科的具体做法、伦理审查和投稿规则仍需按项目与机构核对。</p>';
        document.getElementById("main").innerHTML = home;
        updateNavigation();
        updateProgress();
      }

      function renderModule(module) {
        activeModule = module.id;
        var lessons = module.lessons.map(function (lesson, index) {
          var done = state.completed.indexOf(lesson.id) !== -1;
          var resume = state.lastLesson === lesson.id;
          return '<li class="lesson-row"><span class="lesson-number">' + String(index + 1).padStart(2, "0") +
            '</span><div><h3><button type="button" class="module-row-title" data-lesson="' +
            escapeHtml(lesson.id) + '">' + escapeHtml(lesson.title) + '</button></h3><p>' +
            escapeHtml(lesson.goal) + '</p><div class="lesson-meta"><span>' + escapeHtml(String(lesson.minutes)) +
            ' 分钟</span><span>' + escapeHtml(lesson.level) + '</span></div></div><span class="lesson-state">' +
            (done ? "已完成" : resume ? "上次学习" : "未开始") + '</span></li>';
        }).join("");
        document.getElementById("main").innerHTML =
          '<nav class="breadcrumb" aria-label="当前位置"><button type="button" data-home>学习路径</button><span aria-hidden="true">/</span><span>' +
          escapeHtml(module.title) + '</span></nav><section class="page-head"><p class="overline">' +
          escapeHtml(module.stage) + ' · ' + escapeHtml(module.id.slice(1).padStart(2, "0")) +
          '</p><h1>' + escapeHtml(module.title) + '</h1><p>' + escapeHtml(module.summary) +
          '</p><p class="outcome-line"><strong>模块交付物：</strong>' + escapeHtml(module.deliverable) +
          '</p>' + progressHeader() + '</section><ol class="lesson-list" aria-label="本模块课程">' +
          lessons + '</ol><div class="lesson-actions"><button class="action-button primary" type="button" data-lesson="' +
          escapeHtml(module.lessons.find(function (lesson) { return state.completed.indexOf(lesson.id) === -1; })?.id || module.lessons[0].id) +
          '">' + (moduleCompleteCount(module) ? "继续本模块" : "开始本模块") + '</button><button type="button" class="action-button" data-home>返回全部模块</button></div>';
        updateNavigation();
        updateProgress();
      }

      function relatedResources(module) {
        var ids = {
          m1: ["read-paper"], m2: ["zotero", "scholarly-articles"], m3: ["read-paper", "scholarly-articles"],
          m4: ["nist-statistics"], m5: ["nist-statistics"], m6: ["nist-statistics", "osf-preregistration"],
          m7: ["zotero"], m8: ["paraphrasing", "scholarly-articles"], m9: ["ori-misconduct", "ai-in-research", "cope-ai"],
          m10: ["paraphrasing"], m11: ["ori-misconduct", "cope-ai"], m12: ["osf-preregistration", "nist-statistics"]
        };
        return (ids[module.id] || []).map(function (id) {
          return resources.find(function (resource) { return resource.id === id; });
        }).filter(Boolean);
      }

      function resourceMarkup(module) {
        var items = relatedResources(module);
        if (!items.length) return "";
        return '<section aria-labelledby="resourceTitle"><h2 id="resourceTitle">延伸资料</h2><ul class="resource-list">' +
          items.map(function (resource) {
            return '<li class="resource-row"><div><a href="' + escapeHtml(resource.url) +
              '" target="_blank" rel="noopener noreferrer">' + escapeHtml(resource.title) +
              '</a><div class="resource-meta">' + escapeHtml(resource.organization) + ' · ' +
              escapeHtml(resource.language) + ' · 免费 · 核对于 ' + escapeHtml(resource.checked) +
              '</div></div><span class="resource-meta">外部来源</span><p class="resource-why">' +
              escapeHtml(resource.why) + '</p><p class="resource-task"><strong>建议任务：</strong>' +
              escapeHtml(resource.readingTask) + '</p></li>';
          }).join("") + '</ul><p class="quiet-copy">外部页面可能更新。教材只选用入门路径；引用、统计或政策的最终解释以原文和所属机构要求为准。</p></section>';
      }

      function renderLesson(module, lesson) {
        activeModule = module.id;
        state.lastLesson = lesson.id;
        var saved = persist();
        var location = getLesson(lesson.id);
        var flat = modules.reduce(function (all, item) {
          return all.concat(item.lessons.map(function (entry) { return { module: item, lesson: entry }; }));
        }, []);
        var index = flat.findIndex(function (item) { return item.lesson.id === lesson.id; });
        var previous = index > 0 ? flat[index - 1].lesson : null;
        var next = index < flat.length - 1 ? flat[index + 1].lesson : null;
        var completed = state.completed.indexOf(lesson.id) !== -1;
        var concepts = (lesson.concepts || []).map(function (concept) {
          return '<div class="concept-row"><dt>' + escapeHtml(concept.term) +
            '</dt><dd>' + escapeHtml(concept.plain) +
            (concept.example ? '<div class="concept-example"><strong>例：</strong>' + escapeHtml(concept.example) + '</div>' : "") +
            '</dd></div>';
        }).join("");
        var tutorial = (lesson.tutorial || []).map(function (step, stepIndex) {
          return '<li class="tutorial-step"><span class="step-index" aria-hidden="true">' +
            String(stepIndex + 1).padStart(2, "0") + '</span><div><h3>' + escapeHtml(step.title) +
            '</h3><p>' + escapeHtml(step.body) + '</p></div></li>';
        }).join("");
        var options = lesson.quiz.options.map(function (option, optionIndex) {
          return '<label class="quiz-option"><input type="radio" name="quizAnswer" value="' +
            optionIndex + '"' + (state.answers[lesson.id + ":choice"] === optionIndex ? " checked" : "") +
            '><span>' + escapeHtml(option) + '</span></label>';
        }).join("");
        var rubrics = lesson.rubric.map(function (item, rubricIndex) {
          var checked = Array.isArray(state.rubrics[lesson.id]) && state.rubrics[lesson.id].indexOf(rubricIndex) !== -1;
          return '<li><label class="rubric-check"><input type="checkbox" data-rubric="' +
            rubricIndex + '"' + (checked ? " checked" : "") + '><span>' +
            escapeHtml(item) + '</span></label></li>';
        }).join("");
        document.getElementById("main").innerHTML =
          '<nav class="breadcrumb" aria-label="当前位置"><button type="button" data-home>学习路径</button><span aria-hidden="true">/</span><button type="button" data-module="' +
          escapeHtml(module.id) + '">' + escapeHtml(module.title) + '</button><span aria-hidden="true">/</span><span>' +
          escapeHtml(lesson.title) + '</span></nav><section class="page-head"><p class="overline">' +
          escapeHtml(module.stage) + ' · ' + escapeHtml(module.id.slice(1).padStart(2, "0")) +
          '</p><h1>' + escapeHtml(lesson.title) + '</h1><p>' + escapeHtml(lesson.goal) +
          '</p><div class="lesson-meta"><span>' + escapeHtml(String(lesson.minutes)) +
          ' 分钟</span><span>' + escapeHtml(lesson.level) + '</span><span>第 ' + String(index + 1) +
          ' / 36 课</span></div>' + progressHeader() + '</section>' +
          '<div class="lesson-body"><p class="lesson-goal"><strong>本课目标：</strong>' +
          escapeHtml(lesson.goal) + '</p>' +
          (lesson.prereq && lesson.prereq.length ? '<p class="prerequisite"><strong>先修：</strong>' +
            escapeHtml(lesson.prereq.join("；")) + '</p>' : "") +
          '<section aria-labelledby="conceptTitle"><h2 id="conceptTitle">先掌握这些概念</h2><dl class="concept-list">' +
          concepts + '</dl></section><section aria-labelledby="tutorialTitle"><h2 id="tutorialTitle">跟着做</h2>' +
          '<ol class="tutorial-list">' + tutorial + '</ol></section>' +
          '<section aria-labelledby="workedTitle"><h2 id="workedTitle">示范一次</h2><div class="example-panel"><p class="example-label">教学示范 · 不是你的真实结果</p><h3>' +
          escapeHtml(lesson.worked.title) + '</h3><p>' + escapeHtml(lesson.worked.body) +
          '</p></div></section><section aria-labelledby="exerciseTitle"><h2 id="exerciseTitle">动手练习</h2><p class="prompt">' +
          escapeHtml(lesson.exercise.prompt) + '</p><div class="template-box" aria-label="练习模板">' +
          escapeHtml(lesson.exercise.template) + '</div><p><strong>提示：</strong>' +
          escapeHtml(lesson.exercise.hint) + '</p><form class="exercise-form" id="exerciseForm"><label class="form-label" for="lessonDraft">写下你的做法、证据或问题</label>' +
          '<textarea id="lessonDraft" name="draft" placeholder="这是个人学习草稿，会保存在本机浏览器。不要在此输入敏感或未公开的研究资料。">' +
          escapeHtml(state.drafts[lesson.id] || "") + '</textarea><p class="draft-status" id="draftStatus" aria-live="polite">' +
          (saved ? "草稿自动保存到本机浏览器。" : "本机保存不可用，请导出进度备份草稿。") + '</p></form>' +
          '<details class="disclosure"><summary>查看示范答案</summary><p>' +
          escapeHtml(lesson.exercise.exampleAnswer) + '</p></details></section>' +
          '<section aria-labelledby="quizTitle"><h2 id="quizTitle">检查理解</h2><form class="quiz-form" id="quizForm"><fieldset><legend>' +
          escapeHtml(lesson.quiz.question) + '</legend>' + options + '</fieldset><p class="quiz-feedback" id="quizFeedback" aria-live="polite"></p>' +
          '<button class="action-button" type="submit">提交选择</button></form></section>' +
          '<section aria-labelledby="rubricTitle"><h2 id="rubricTitle">完成前自检</h2><ul class="rubric-list">' + rubrics +
          '</ul><ul class="pitfall-list">' + lesson.pitfalls.map(function (pitfall) { return '<li>' + escapeHtml(pitfall) + '</li>'; }).join("") +
          '</ul></section>' + resourceMarkup(module) +
          '<p class="quiet-copy">可直接标记本课完成；练习、自测与自检可以稍后补做。</p>' +
          '<div class="lesson-actions"><button type="button" class="action-button primary" data-action="complete"' +
          (completed ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' +
          (completed ? "取消本课完成" : "标记本课完成") + '</button>' +
          '<button type="button" class="action-button" data-module="' + escapeHtml(module.id) + '">查看本模块</button>' +
          (previous ? '<button type="button" class="action-button" data-lesson="' + escapeHtml(previous.id) + '">上一课</button>' : "") +
          (next ? '<button type="button" class="action-button push-right" data-lesson="' + escapeHtml(next.id) + '">下一课</button>' :
            '<button type="button" class="action-button push-right" data-home>完成</button>') +
          '</div><p class="action-feedback quiet-copy" id="actionFeedback" role="status" aria-live="polite" hidden></p>' +
          '<p class="quiet-copy">不必一次完成全部练习。每课草稿会按课程分别保存在本机；如需换设备，可从顶部导出再导入进度。</p></div>';
        var feedback = document.getElementById("quizFeedback");
        if (state.answers[lesson.id + ":result"] === true) {
          feedback.className = "quiz-feedback is-correct";
          feedback.textContent = "回答正确。 " + lesson.quiz.explanation;
        } else if (state.answers[lesson.id + ":result"] === false) {
          feedback.className = "quiz-feedback is-wrong";
          feedback.textContent = "再读一次题目后重试。 " + lesson.quiz.explanation;
        }
        updateNavigation();
        updateProgress();
        if (location) document.title = lesson.title + " | 学术起步";
        return saved;
      }

      function renderRoute() {
        var route = window.location.hash.replace(/^#/, "");
        if (route && route !== "home") {
          var lessonLocation = getLesson(route);
          if (lessonLocation) {
            renderLesson(lessonLocation.module, lessonLocation.lesson);
            window.scrollTo({ top: 0, left: 0, behavior: "instant" });
            return;
          }
          var module = getModule(route);
          if (module) {
            renderModule(module);
            return;
          }
        }
        document.title = "学术起步 | 研究训练工作台";
        renderHome();
      }

      function setRubricState(lessonId, input) {
        var itemIndex = Number(input.getAttribute("data-rubric"));
        var marks = Array.isArray(state.rubrics[lessonId]) ? state.rubrics[lessonId].slice() : [];
        var position = marks.indexOf(itemIndex);
        if (input.checked && position === -1) marks.push(itemIndex);
        if (!input.checked && position !== -1) marks.splice(position, 1);
        state.rubrics[lessonId] = marks.sort(function (a, b) { return a - b; });
        persist();
      }

      function closeMobileNavigation() {
        var navigation = document.querySelector(".mobile-navigation");
        if (navigation && window.matchMedia("(max-width: 900px)").matches) navigation.open = false;
      }

      function handleQuiz(form) {
        var location = getLesson(window.location.hash.replace(/^#/, ""));
        if (!location) return;
        var picked = form.querySelector('input[name="quizAnswer"]:checked');
        var feedback = document.getElementById("quizFeedback");
        if (!picked) {
          feedback.className = "quiz-feedback is-wrong";
          feedback.textContent = "先选择一项，再提交。";
          return;
        }
        var choice = Number(picked.value);
        var right = choice === Number(location.lesson.quiz.correct);
        state.answers[location.lesson.id + ":choice"] = choice;
        state.answers[location.lesson.id + ":result"] = right;
        persist();
        feedback.className = right ? "quiz-feedback is-correct" : "quiz-feedback is-wrong";
        feedback.textContent = (right ? "回答正确。 " : "这次没有通过。 ") + location.lesson.quiz.explanation;
        say(right ? "自测通过。" : "请根据解释再试一次。");
      }

      function completeCurrentLesson() {
        var location = getLesson(window.location.hash.replace(/^#/, ""));
        if (!location) return;
        var id = location.lesson.id;
        var at = state.completed.indexOf(id);
        if (at === -1) state.completed.push(id);
        else state.completed.splice(at, 1);
        var saved = renderLesson(location.module, location.lesson);
        say((at === -1 ? "本课已标记完成。" : "已取消本课完成。") +
          (saved ? "进度已保存到本机浏览器。" : "本机保存不可用；更改仅在当前页面有效，请导出进度备份。"));
      }

      function serializeProgress() {
        return JSON.stringify({
          format: "academic-starter-progress-v1",
          exportedAt: new Date().toISOString(),
          completed: state.completed,
          drafts: state.drafts,
          rubrics: state.rubrics,
          answers: state.answers,
          lastLesson: state.lastLesson
        }, null, 2);
      }

      function importProgress(file) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(String(reader.result));
            if (!data || data.format !== "academic-starter-progress-v1" ||
                !Array.isArray(data.completed) || typeof data.drafts !== "object") {
              throw new Error("format");
            }
            var validIds = new Set(modules.reduce(function (all, module) {
              return all.concat(module.lessons.map(function (lesson) { return lesson.id; }));
            }, []));
            state = {
              completed: data.completed.filter(function (id) { return validIds.has(id); }),
              drafts: data.drafts || {},
              rubrics: data.rubrics || {},
              answers: data.answers || {},
              lastLesson: validIds.has(data.lastLesson) ? data.lastLesson : ""
            };
            persist();
            renderRoute();
            say("进度与草稿已导入。");
          } catch (error) {
            window.alert("无法读取此进度备份。请使用本页面导出的 JSON 文件。");
          }
        };
        reader.onerror = function () { window.alert("文件读取失败。请重试。"); };
        reader.readAsText(file, "utf-8");
      }

      document.getElementById("courseSearch").addEventListener("input", function (event) {
        searchTerm = event.target.value.trim().toLocaleLowerCase();
        if (window.location.hash && window.location.hash !== "#home") window.location.hash = "home";
        else renderHome();
      });

      document.addEventListener("click", function (event) {
        var button = event.target.closest("button");
        if (!button) return;
        if (button.hasAttribute("data-home")) { closeMobileNavigation(); safeHash("home"); return; }
        if (button.hasAttribute("data-module")) { closeMobileNavigation(); safeHash(button.getAttribute("data-module")); return; }
        if (button.hasAttribute("data-lesson")) {
          var lesson = getLesson(button.getAttribute("data-lesson"));
          if (lesson) {
            closeMobileNavigation();
            state.lastLesson = lesson.lesson.id;
            persist();
            safeHash(lesson.lesson.id);
          }
          return;
        }
        if (button.hasAttribute("data-stage-filter")) {
          selectedStage = button.getAttribute("data-stage-filter");
          if (window.location.hash && window.location.hash !== "#home") window.location.hash = "home";
          else renderHome();
          return;
        }
        var action = button.getAttribute("data-action");
        if (action === "complete") { completeCurrentLesson(); return; }
        if (action === "export") {
          var blob = new Blob([serializeProgress()], { type: "application/json;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "academic-learning-progress.json";
          link.click();
          URL.revokeObjectURL(url);
          say("进度备份已导出。");
          return;
        }
        if (action === "import") { document.getElementById("importFile").click(); return; }
        if (action === "reset") {
          if (window.confirm("这会清除本浏览器保存的课程打卡、练习草稿和测验答案。无法撤销。要继续吗？")) {
            state = freshState();
            persist();
            selectedStage = "全部";
            searchTerm = "";
            document.getElementById("courseSearch").value = "";
            safeHash("home");
            say("本机学习进度已清除。");
          }
        }
      });

      document.addEventListener("input", function (event) {
        if (event.target.id !== "lessonDraft") return;
        var id = window.location.hash.replace(/^#/, "");
        if (!getLesson(id)) return;
        state.drafts[id] = event.target.value;
        var saved = persist();
        var status = document.getElementById("draftStatus");
        if (status) status.textContent = saved ? "草稿已保存到本机浏览器。" :
          "本机保存不可用；草稿仅在当前页面有效，请导出进度备份。";
      });

      document.addEventListener("change", function (event) {
        var lessonId = window.location.hash.replace(/^#/, "");
        if (event.target.matches("[data-rubric]")) setRubricState(lessonId, event.target);
        if (event.target.id === "importFile" && event.target.files && event.target.files[0]) {
          importProgress(event.target.files[0]);
          event.target.value = "";
        }
      });

      document.addEventListener("submit", function (event) {
        if (event.target.id !== "quizForm") return;
        event.preventDefault();
        handleQuiz(event.target);
      });

      window.addEventListener("hashchange", renderRoute);
      renderRoute();
      persist();
    }());
  </script>
</body>
</html>
